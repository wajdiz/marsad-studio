<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARSAD Studio</title>
<!-- No web fonts: the page loads nothing from the internet, so your posts, your address and the fact that you opened
     it stay on your machine, and the page works offline. Arabic uses the fonts your system already has. -->
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script>
(function () {
  try {
    var v = localStorage.getItem("marsad_theme") || "system";
    var dark = v === "dark" || (v === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
})();
</script>

:root{--navy:var(--k-blu-20-60);--navy2:var(--k-blu-25-40);--teal:var(--k-tea-25-100);--teal-dark:var(--k-tea-20-100);--teal-light:var(--k-tea-95-40);--bg:var(--k-blu-95-20);--white:var(--k-n-100);--ink:var(--k-blu-20-40);--muted:var(--k-blu-40-20);--border:var(--k-blu-90-20);--shadow:0 2px 9px rgba(19,45,62,.05);--focus:var(--k-amb-60-80);--amber:var(--k-amb-30-100);--amber-bg:var(--k-amb-95-100);--amber-line:var(--k-amb-80-80);--grey-bg:var(--k-blu-95-20);--ok-bg:var(--k-grn-95-40);--ok:var(--k-grn-25-60)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,"Noto Naskh Arabic",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45}
[dir=rtl],.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--teal-dark)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin-top:0}
/* The app bar is wider than a phone: its content measures 429px at 390px wide. It scrolls its own
   controls rather than dragging the whole page sideways with it. */
.appbar{overflow-x:hidden}
.appbar{height:72px;background:var(--navy);color:var(--k-n-100);display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:16px;position:sticky;top:0;z-index:50}
.branding{display:flex;align-items:center;gap:11px}
.brand-mark{width:34px;height:34px;border-radius:50%;flex:none;display:block;
  box-shadow:0 0 0 2px var(--k-tea-55-40)}
.brand{font-size:22px;font-weight:800}.brand-sub{color:var(--k-blu-85-40);font-size:13px;margin-top:2px}
.top-right{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--k-blu-90-40)}
.pill{border:1px solid rgba(255,255,255,.35);background:var(--navy);color:var(--k-tea-95-60);padding:7px 12px;border-radius:18px;white-space:nowrap}
#engine{max-width:40vw;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){#engine{max-width:none}}
#engine.err{background:var(--k-red-35-60);border-color:var(--k-red-35-60);color:var(--k-n-100)}
.shell{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:calc(100vh - var(--barh,72px))}
.sidebar{background:var(--k-n-100);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:var(--barh,72px);height:calc(100vh - var(--barh,72px));overflow:auto}
.nav-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:var(--k-blu-45-20);margin:16px 12px 8px}
.nav-button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;color:var(--k-blu-30-20);padding:10px 12px;border-radius:10px;min-height:50px;font-weight:700;margin-bottom:3px}
.nav-button .ico{width:26px;height:26px;flex:none;color:var(--k-blu-45-20)}
.nav-button.active{color:var(--k-tea-20-80);background:var(--teal-light);box-shadow:inset 4px 0 0 var(--teal)}
.nav-button.active .ico{color:var(--teal)}
.nav-button:hover:not(.active){background:var(--k-tea-95-20)}
.nav-desc{font-size:12.5px;color:var(--k-blu-40-20);display:block;margin-top:2px;font-weight:400}
.nav-count{margin-left:auto;font-size:12px;color:var(--k-blu-40-20);font-weight:700}
.side-footer{margin:18px 8px 0;padding:14px 6px;border-top:1px solid var(--border);font-size:13px;color:var(--k-blu-45-20);line-height:1.6}
.side-footer b{color:var(--ink)}
.content{padding:24px 34px 60px;max-width:1500px;width:100%;margin:0 auto;min-width:0}
.eyebrow{font-size:13.5px;color:var(--k-blu-50-20);font-weight:700;margin-bottom:8px}
.eyebrow a{color:var(--k-blu-50-20);text-decoration:none}.eyebrow a:hover{text-decoration:underline}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-title{font-size:32px;line-height:1.15;letter-spacing:-.6px;color:var(--k-blu-20-40);margin:0 0 8px}
.page-lead{font-size:18px;color:var(--muted);margin-bottom:0;max-width:820px}
.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--k-blu-70-20);background:var(--k-n-100);border-radius:9px;min-height:44px;padding:9px 16px;font-weight:700;color:var(--k-blu-30-40);display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--k-tea-95-40)}.btn.primary{background:var(--teal);color:var(--k-n-100);border-color:var(--teal)}.btn.primary:hover{background:var(--teal-dark)}
.btn:disabled{opacity:.5;cursor:default}.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.info-line{margin:20px 0 16px;padding:12px 16px;border:1px solid var(--k-tea-85-40);background:var(--k-tea-95-40);color:var(--k-tea-25-40);border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:15px;flex-wrap:wrap}
.section-heading{font-size:22px;color:var(--k-blu-20-40);margin:30px 0 6px}
.section-description{font-size:15.5px;color:var(--k-blu-45-20);margin:0 0 16px}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.metric{padding:18px 20px;background:var(--k-n-100);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);min-height:108px}
.metric-label{font-size:15px;color:var(--k-blu-40-20);margin-bottom:8px}.metric-value{font-size:30px;font-weight:800;color:var(--k-blu-20-40);line-height:1.1}
.metric-small{font-size:13.5px;margin-top:6px;color:var(--k-blu-40-20)}.metric .date-value{font-size:20px}
.cards-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:var(--k-n-100);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px;min-width:0;margin-bottom:18px}
.cards-2 .panel{margin-bottom:0}
.panel-title{font-size:19px;font-weight:700;color:var(--k-blu-25-40);margin:0 0 4px}
.panel-description{color:var(--k-blu-45-20);font-size:14.5px;margin:0 0 12px}
.panel-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--k-blu-95-20);flex-wrap:wrap}
.text-button{padding:6px 0;border:0;background:none;color:var(--k-tea-25-100);font-weight:700;font-size:15px;min-height:36px}
.text-button:hover{text-decoration:underline}
.save-button{min-height:38px;padding:6px 12px;border:1px solid var(--k-tea-85-20);border-radius:8px;color:var(--k-tea-30-40);background:var(--k-n-100);font-size:14px;font-weight:700}
.save-button.saved{color:var(--k-tea-25-100);background:var(--k-grn-95-40);border-color:var(--k-tea-75-40)}
.summary-list{padding:0;margin:0;list-style:none}
.summary-list li{padding:12px 0;border-bottom:1px solid var(--k-blu-95-20);display:flex;align-items:flex-start;gap:12px;font-size:16px}
.summary-list li:last-child{border-bottom:0}
.dot{width:9px;height:9px;flex:0 0 9px;background:var(--teal);border-radius:50%;margin-top:8px}
.progress-row{display:grid;grid-template-columns:minmax(90px,1.2fr) minmax(100px,2fr) 50px;align-items:center;gap:12px;font-size:15px;margin:9px 0;cursor:pointer;border-radius:6px;padding:3px 4px}
.progress-row:hover{background:var(--k-tea-95-40)}
.bar-track{height:13px;border-radius:7px;background:var(--k-tea-95-20);overflow:hidden}.bar-fill{height:100%;background:var(--k-tea-30-80);border-radius:7px}
.explore-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.explore-card{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--k-n-100);min-height:100px;box-shadow:var(--shadow);width:100%}
.explore-card:hover{background:var(--k-tea-95-40);border-color:var(--k-tea-75-20)}
a.explore-card{text-decoration:none;color:inherit;box-sizing:border-box}
.srcrow a.btn.small{text-decoration:none}
.explore-icon{flex:0 0 48px;height:48px;border-radius:10px;background:var(--k-tea-95-40);color:var(--k-tea-30-80);display:grid;place-items:center}
.explore-icon svg{width:26px;height:26px}
.explore-label{font-size:17px;font-weight:700;color:var(--k-blu-25-40);margin-bottom:3px}
.explore-detail{font-size:14px;color:var(--k-blu-40-20)}
.srcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.srccard{display:block;text-align:left;border:1px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--k-n-100);box-shadow:var(--shadow);width:100%;box-sizing:border-box;text-decoration:none;color:inherit}
.srccard:hover{background:var(--k-tea-100-40);border-color:var(--k-tea-75-20)}
.srccard.soon{background:var(--k-tea-100-20);border-style:dashed;border-color:var(--k-tea-80-20)}
.srccard.soon:hover{background:var(--k-tea-100-40)}
.srchead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.srchead .explore-icon{flex:0 0 40px;height:40px}
.srchead .explore-icon svg{width:22px;height:22px}

function act(name, el) {
  if (name === "changefile") go({page: "files"});
  if (name === "trycompare") loadComparison();
  if (name === "pickfilesel") { fileSel[el.dataset.id] = el.dataset.file; results[el.dataset.id] = null; cardPage(el.dataset.id); }
  if (name === "splitoff") { params[el.dataset.id] = Object.assign({}, params[el.dataset.id], {[splitKey(el.dataset.id)]: "none"}); results[el.dataset.id] = null; cardPage(el.dataset.id); }
  if (name === "spliton") { params[el.dataset.id] = Object.assign({}, params[el.dataset.id], {[splitKey(el.dataset.id)]: "dataset"}); results[el.dataset.id] = null; cardPage(el.dataset.id); }
  if (name === "pickfile") $("#file").click();
  if (name === "load") loadData();
  if (name === "sample") loadSample(el.dataset.file, el.dataset.name);

  if (name === "save") toggleSave(el.dataset.id);
  if (name === "unsave") { saved.delete(el.dataset.id); render(); }
  if (name === "explain") explain(el.dataset.id);
  if (name === "about") about();
  if (name === "prepare") preparePage();
  if (name === "pin") togglePin(el.dataset.id);
  if (name === "settings") settingsPage(el.dataset.settab || "");
  if (name === "customize") settingsPage("menu");
  if (name === "filters") filtersPage();
  if (name === "resetfilters") { const n = prepOpts(); FKEYS.forEach(k => delete n[k]); applyPrepare(n); }
  if (name === "resetall") {
    setBig(false); setTheme("system"); setMode("simple");
    ARSEG = true; ARSTOP = true; TZSRC = "UTC"; TZOUT = "UTC"; WEEKEND = "sat-sun";
    try { ["marsad_arseg", "marsad_arstop", "marsad_tzsrc", "marsad_tzout", "marsad_weekend"].forEach(k => localStorage.removeItem(k)); } catch (e) {}
    if (W) W.set_arabic_stopwords(true);
    CUSTOM.preset = "all"; CUSTOM.off = []; saveCustom(); renderSidebar(); render();
    closeModal(); toast(trUI("Settings reset."));
    return;
  }
  if (name === "moreanalyses") { COREONLY = false; renderSidebar(); render(); return; }
  if (name === "viewmode") { VIEWMODE = VIEWMODE === "simple" ? "full" : "simple"; try { localStorage.setItem("marsad_view", VIEWMODE); } catch (e) {} render(); }
  if (name === "saveproject") saveProject();
  if (name === "studyreport") { const q = PL.studies.find(x => x.id === el.dataset.id); for (const c of q.cards) if (status({...plainOf(c), id: c}).ok && !saved.has(c)) toggleSave(c); render(); }
  if (name === "studydraft") { const q = PL.studies.find(x => x.id === el.dataset.id); draftReport(q.cards.filter(c => status({...plainOf(c), id: c}).ok)); }
  if (name === "openproject") $("#projfile").click();

  if (name === "dldata") dlDataset();

  if (name === "bigtake") bigTake();
  if (name === "bigsave") bigSave();
  if (name === "bigannot") bigAnnot();
  if (name === "bigsplit") bigSplit();
  if (name === "bigsize") { BIGPLAN.size = +el.dataset.n; render(); }
  if (name === "bigdrop") { BIGFILE = null; render(); }
}

  if (!PL || !SCAN && view.page === "overview" || view.page === "files") { m.innerHTML = startPage(); bindStart(); return; }
  if (view.page === "overview") { m.innerHTML = overviewPage(); bindOverview(); }
  else if (view.page === "section") { m.innerHTML = sectionPage(view.section); }
  else if (view.page === "all") { m.innerHTML = allPage(); bindSearch(); }
  else if (view.page === "report") { m.innerHTML = reportPage(); }

function compareBar(id) {

  const plats = new Set(ds.map(d => d.platform).filter(Boolean));
  const platNote = plats.size > 1 ? ` <span>${iMark("The files come from different platforms. Likes, shares and reach are counted differently on each, so compare shares (%) rather than engagement numbers.")}</span>` : "";
  if (!id) return `<div class="cmpbar"><span>Comparing ${ds.length} files: ${names}${platNote}</span></div>`;
  const k = splitKey(id), cur = params[id] && params[id][k];
  if (k) return `<div class="cmpbar"><span>${cur === "dataset" ? "Results are split by file" : "Results show all files together"}${platNote}</span><button class="btn small" data-act="${cur === "dataset" ? "splitoff" : "spliton"}" data-id="${id}">${cur === "dataset" ? "Show all files together" : "Split by file"}</button></div>`;
  const sel = fileSel[id] || "";
  return `<div class="cmpbar"><span>This analysis looks at one set of posts at a time. Show:${iMark("Choose a file to see its result. The table below the buttons gives the key numbers of every file side by side.")}</span><div class="filechips">${[["", "All files"], ...ds.map(d => [d.name, d.name])].map(([v, l]) => `<button class="${sel === v ? "on" : ""}" data-act="pickfilesel" data-id="${id}" data-file="${esc(v)}">${esc(l)}</button>`).join("")}</div>${platNote}</div><div id="cmptable"></div>`;

// ==================================================================================================
// Files too big for the browser
// --------------------------------------------------------------------------------------------------
// The analyses run inside this page, so the whole file has to fit in the browser's memory. A gigabyte
// of CSV does not: reading it into a table takes several times its own size, and the tab stops before
// any analysis starts. None of that means the file is unusable. The browser can read a file in slices
// without holding it, so the page scans it once, says what is in it, and then either takes a sample
// the analyses can work on or cuts the file into parts.
//
// Everything here reads; nothing is uploaded. The slices are read from the file on the computer.
const BIG_BYTES = 40e6;          // above this a file goes through the scan rather than straight in
const BIG_ROWS = 50000;          // what the analyses are comfortable with in a browser
const SCAN_CHUNK = 4 << 20;      // 4 MB a slice: large enough to be fast, small enough to stay smooth
const GROUP_CAP = 4000;          // a column with more distinct values than this is no use to stratify by
const DEDUP_CAP = 3e6;           // hashes kept while dropping repeats, before it would cost more memory
let BIGFILE = null;              // {file, scan, busy} for the file being worked on

// ---------------------------------------------------------------- reading
// A CSV field may hold a comma, a quote or a newline, so the file cannot be cut on newlines alone.
// This walks the text once, keeping the state across slice boundaries.
function csvParser(delim) {
  let field = "", row = [], inQ = false, wasQ = false;
  return {
    push(text, out) {
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) {
          if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQ = false; } }
          else field += c;
        } else if (c === '"' && field === "") { inQ = true; wasQ = true; }
        else if (c === delim) { row.push(field); field = ""; wasQ = false; }
        else if (c === "\n") { row.push(field); out.push(row); row = []; field = ""; wasQ = false; }
        else if (c === "\r") { /* \r\n and lone \r both end the line on the \n or the next field */ }
        else field += c;
      }
    },
    end(out) {
      if (field !== "" || row.length || wasQ) { row.push(field); out.push(row); row = []; field = ""; }
    },
    get open() { return inQ; }
  };
}

const DELIMS = [",", "\t", ";", "|"];
function sniffDelim(sample) {
  const line = sample.split("\n")[0] || "";
  let best = ",", n = -1;
  for (const d of DELIMS) {
    const c = (line.match(new RegExp("\\" + d, "g")) || []).length;
    if (c > n) { n = c; best = d; }
  }
  return n > 0 ? best : ",";
}

// Walks the file, handing each record to onRow. Returns when the file is done or onRow returns false.
async function readRecords(file, onRow, onProgress, opts) {
  const o = opts || {};
  const dec = new TextDecoder("utf-8");
  const head = dec.decode(await file.slice(0, 64 << 10).arrayBuffer());
  const json = o.json !== undefined ? o.json : /^\s*[{[]/.test(head);
  const delim = o.delim || sniffDelim(head);
  const parser = json ? null : csvParser(delim);
  let at = 0, n = 0, tail = "", stop = false;
  while (at < file.size && !stop) {
    const end = Math.min(at + SCAN_CHUNK, file.size);
    const text = dec.decode(await file.slice(at, end).arrayBuffer(), {stream: end < file.size});
    at = end;
    if (json) {
      const lines = (tail + text).split("\n");
      tail = lines.pop();
      for (const l of lines) {
        const t = l.trim();
        if (!t || t === "[" || t === "]") continue;
        let v; try { v = JSON.parse(t.replace(/,$/, "")); } catch (e) { continue; }
        if (onRow(v, n++) === false) { stop = true; break; }
      }
    } else {
      const out = [];
      parser.push(text, out);
      for (const r of out) { if (onRow(r, n++) === false) { stop = true; break; } }
    }
    if (onProgress) await onProgress(at / file.size, n);
  }
  if (!stop) {
    if (json) {
      const t = tail.trim();
      if (t && t !== "]") { try { onRow(JSON.parse(t.replace(/,$/, "")), n++); } catch (e) {} }
    } else {
      const out = [];
      parser.end(out);
      for (const r of out) onRow(r, n++);
    }
  }
  return {rows: n, delim, json};
}

// ---------------------------------------------------------------- what is in the file
const ENG_NAMES = ["total interactions", "interactions", "engagement", "engagement total", "likes",
                   "reactions", "comments", "shares", "retweets", "score", "upvotes", "favorites",
                   "likes at posting", "total views", "views", "post views", "play count"];
const TEXT_NAMES = ["message", "text", "body", "content", "post", "title", "headline", "description",
                    "caption", "full_text", "selftext", "summary", "abstract"];
const DATE_NAMES = ["post created", "created_at", "created", "date", "published", "published_at",
                    "timestamp", "time", "post created date", "datetime", "pubdate"];

const lower = (x) => String(x == null ? "" : x).trim().toLowerCase();
const pickCol = (header, names) => {
  const lows = header.map(lower);
  for (const n of names) { const i = lows.indexOf(n); if (i >= 0) return i; }
  for (let i = 0; i < lows.length; i++) if (names.some(n => lows[i].includes(n))) return i;
  return -1;
};
const numOf = (v) => {
  const n = Number(String(v == null ? "" : v).replace(/[,\s]/g, ""));
  return isFinite(n) ? n : null;
};
const wordsIn = (v) => { const t = String(v == null ? "" : v).trim(); return t ? t.split(/\s+/).length : 0; };
const dayOf = (v) => { const t = String(v == null ? "" : v).trim(); const m = t.match(/\d{4}-\d{2}-\d{2}/); return m ? m[0] : (t.slice(0, 10) || ""); };

async function scanBig(file, onProgress) {
  let header = null, rows = 0, json = false;
  const counts = new Map();          // column -> Map(value -> n), capped
  const dropped = new Set();         // columns with too many distinct values to stratify by
  let dateMin = "", dateMax = "", dateCol = -1, textCol = -1;
  const engCols = [];
  const sample = [];
  const res = await readRecords(file, (r, i) => {
    if (header === null && !Array.isArray(r)) {
      json = true;
      header = Object.keys(r);
      textCol = pickCol(header, TEXT_NAMES);
      dateCol = pickCol(header, DATE_NAMES);
      header.forEach((h, k) => { if (ENG_NAMES.includes(lower(h))) engCols.push(k); });
    }
    if (header === null) {
      header = r.map(x => String(x));
      textCol = pickCol(header, TEXT_NAMES);
      dateCol = pickCol(header, DATE_NAMES);
      header.forEach((h, k) => { if (ENG_NAMES.includes(lower(h))) engCols.push(k); });
      return;
    }
    const vals = json ? header.map(h => r[h]) : r;
    rows++;
    if (sample.length < 5) sample.push(vals);
    if (dateCol >= 0) {
      const d = dayOf(vals[dateCol]);
      if (/^\d{4}-\d{2}-\d{2}$/.test(d)) {
        if (!dateMin || d < dateMin) dateMin = d;
        if (!dateMax || d > dateMax) dateMax = d;
      }
    }
    if (rows <= 200000) {            // enough to know which columns group usefully
      header.forEach((h, k) => {
        if (dropped.has(k) || k === textCol) return;
        let m = counts.get(k); if (!m) { m = new Map(); counts.set(k, m); }
        const v = String(vals[k] == null ? "" : vals[k]).slice(0, 80);
        m.set(v, (m.get(v) || 0) + 1);
        if (m.size > GROUP_CAP) { dropped.add(k); counts.delete(k); }
      });
    }
  }, onProgress);
  const groupCols = [...counts.keys()].filter(k => counts.get(k).size >= 2 && counts.get(k).size <= 60)
    .sort((a, b) => counts.get(a).size - counts.get(b).size);
  return {rows, header, json, delim: res.delim, textCol, dateCol, engCols, groupCols,
          groups: Object.fromEntries(groupCols.map(k => [k, [...counts.get(k).entries()]
            .sort((a, b) => b[1] - a[1]).slice(0, 60)])),
          dateMin, dateMax, sample, bytes: file.size};
}

// ---------------------------------------------------------------- choosing rows
// A seeded generator, so the same settings give the same posts and a reviewer can check.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash32(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// A heap of the N largest, so the top of a file of any size costs only N rows of memory.
function topHeap(n) {
  const a = [];
  const up = (i) => { while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; } };
  const down = (i) => {
    for (;;) {
      const l = 2 * i + 1, r = l + 1; let m = i;
      if (l < a.length && a[l][0] < a[m][0]) m = l;
      if (r < a.length && a[r][0] < a[m][0]) m = r;
      if (m === i) break;
      [a[m], a[i]] = [a[i], a[m]]; i = m;
    }
  };
  return {
    offer(score, row) {
      if (a.length < n) { a.push([score, row]); up(a.length - 1); }
      else if (score > a[0][0]) { a[0] = [score, row]; down(0); }
    },
    get rows() { return a.slice().sort((x, y) => y[0] - x[0]).map(x => x[1]); },
    get size() { return a.length; }
  };
}

function groupKey(plan, scan, vals) {
  if (plan.mode === "stratified" && plan.groupCol >= 0) return String(vals[plan.groupCol] == null ? "" : vals[plan.groupCol]).slice(0, 80);
  if (plan.mode === "time") {
    const d = dayOf(vals[scan.dateCol]);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return "";
    if (plan.timeUnit === "month") return d.slice(0, 7);
    if (plan.timeUnit === "year") return d.slice(0, 4);
    const dt = new Date(d + "T00:00:00Z");
    dt.setUTCDate(dt.getUTCDate() - ((dt.getUTCDay() + 6) % 7));     // the Monday of that week
    return dt.toISOString().slice(0, 10);
  }
  return "_all";
}

// Rows the settings allow: the length filter and the date range decide what the sample is drawn from,
// so asking for 1,000 posts of 10 to 100 words gives 1,000 of them, not 1,000 minus the ones cut.
function admits(plan, scan, vals, seen) {
  if (plan.from || plan.to) {
    const d = dayOf(vals[scan.dateCol]);
    if (plan.from && d < plan.from) return "date";
    if (plan.to && d > plan.to) return "date";
  }
  if (plan.minWords || plan.maxWords) {
    const w = wordsIn(scan.textCol >= 0 ? vals[scan.textCol] : "");
    if (plan.minWords && w < plan.minWords) return "short";
    if (plan.maxWords && w > plan.maxWords) return "long";
  }
  if (plan.dedup && scan.textCol >= 0 && seen) {
    const t = String(vals[scan.textCol] == null ? "" : vals[scan.textCol]).trim().replace(/\s+/g, " ").toLowerCase();
    if (t) {
      if (seen.size < DEDUP_CAP) {
        const h = hash32(t);
        if (seen.has(h)) return "repeat";
        seen.add(h);
      }
    }
  }
  return "";
}

async function sampleBig(file, scan, plan, onProgress) {
  const out = {kept: [], seen: 0, cut: {date: 0, short: 0, long: 0, repeat: 0}, groups: 0,
               capped: false};
  const seen = plan.dedup ? new Set() : null;
  const rnd = mulberry32(plan.seed >>> 0);
  const want = Math.max(1, plan.size | 0);
  let first = true;

  if (plan.mode === "top") {
    const heap = topHeap(want);
    await readRecords(file, (r, i) => {
      if (first && !scan.json) { first = false; return; }
      const vals = scan.json ? scan.header.map(h => r[h]) : r;
      const why = admits(plan, scan, vals, seen);
      if (why) { out.cut[why]++; return; }
      out.seen++;
      const v = numOf(vals[plan.by]);
      heap.offer(v == null ? -Infinity : v, vals);
    }, onProgress, {json: scan.json, delim: scan.delim});
    out.kept = heap.rows;
    out.groups = 1;
    return out;
  }

  // Everything else is a reservoir, per group. One group for a plain random sample, one per
  // stratum or per week when the rows are spread across something.
  const res = new Map();            // key -> {seen, rows: []}
  await readRecords(file, (r, i) => {
    if (first && !scan.json) { first = false; return; }
    const vals = scan.json ? scan.header.map(h => r[h]) : r;
    const why = admits(plan, scan, vals, seen);
    if (why) { out.cut[why]++; return; }
    out.seen++;
    const k = groupKey(plan, scan, vals);
    if (plan.mode !== "random" && k === "") return;
    let g = res.get(k);
    if (!g) { g = {seen: 0, rows: []}; res.set(k, g); }
    g.seen++;
    const cap = plan.mode === "random" ? want : Math.max(1, Math.ceil(want / Math.max(1, res.size)) * 3);
    if (g.rows.length < cap) g.rows.push(vals);
    else { const j = Math.floor(rnd() * g.seen); if (j < cap) g.rows[j] = vals; }
  }, onProgress, {json: scan.json, delim: scan.delim});

  out.groups = res.size;
  if (plan.mode === "random") {
    out.kept = (res.get("_all") || {rows: []}).rows.slice(0, want);
    return out;
  }
  // Shares: proportional keeps each group's weight in the file, equal gives every group the same room.
  const keys = [...res.keys()];
  const total = keys.reduce((a, k) => a + res.get(k).seen, 0) || 1;
  let quota = {};
  if (plan.equal) {
    const each = Math.floor(want / keys.length);
    keys.forEach(k => quota[k] = each);
  } else {
    keys.forEach(k => quota[k] = Math.floor(want * res.get(k).seen / total));
  }
  let have = keys.reduce((a, k) => a + Math.min(quota[k], res.get(k).rows.length), 0);
  // whatever rounding and small groups leave over goes to the groups that still have rows
  for (const k of keys.sort((a, b) => res.get(b).seen - res.get(a).seen)) {
    if (have >= want) break;
    const room = res.get(k).rows.length - Math.min(quota[k], res.get(k).rows.length);
    const add = Math.min(room, want - have);
    quota[k] += add; have += add;
  }
  for (const k of keys) {
    const g = res.get(k);
    const n = Math.min(quota[k] || 0, g.rows.length);
    for (let i = 0; i < n; i++) out.kept.push(g.rows[i]);
  }
  out.kept = out.kept.slice(0, want);
  return out;
}

// ---------------------------------------------------------------- writing it back out
const csvField = (v) => {
  const t = v == null ? "" : String(v);
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
};
const csvText = (header, rows) => "﻿" + [header.map(csvField).join(",")]
  .concat(rows.map(r => r.map(csvField).join(","))).join("\n") + "\n";

// A zip with no compression: four short files in one download, written here rather than pulled in.
function zipStore(entries) {
  const enc = new TextEncoder();
  const table = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ c >>> 1 : c >>> 1; t[i] = c >>> 0; } return t; })();
  const crc32 = (b) => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = table[(c ^ b[i]) & 255] ^ c >>> 8; return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], dir = [];
  let at = 0;
  for (const [name, text] of entries) {
    const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0, true);
    h.setUint16(8, 0, true); h.setUint16(10, 0, true); h.setUint16(12, 0, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true);
    c.setUint16(8, 0, true); c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 0, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, nb.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true);
    c.setUint16(34, 0, true); c.setUint16(36, 0, true); c.setUint32(38, 0, true); c.setUint32(42, at, true);
    dir.push(new Uint8Array(c.buffer), nb);
    at += 30 + nb.length + data.length;
  }
  const dirBytes = dir.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true);
  e.setUint16(8, entries.length, true); e.setUint16(10, entries.length, true);
  e.setUint32(12, dirBytes, true); e.setUint32(16, at, true); e.setUint16(20, 0, true);
  return new Blob([...parts, ...dir, new Uint8Array(e.buffer)], {type: "application/zip"});
}

// ---------------------------------------------------------------- splitting
async function splitBig(file, scan, perPart, onProgress, onPart) {
  let part = [], n = 0, made = 0, first = true;
  const flush = async () => {
    if (!part.length) return;
    made++;
    await onPart(made, csvText(scan.header, part), part.length);
    part = [];
  };
  await readRecords(file, (r, i) => {
    if (first && !scan.json) { first = false; return; }
    part.push(scan.json ? scan.header.map(h => r[h]) : r);
    n++;
    if (part.length >= perPart) { const p = part; part = []; made++; onPart(made, csvText(scan.header, p), p.length); }
  }, onProgress, {json: scan.json, delim: scan.delim});
  await flush();
  return {parts: made, rows: n};
}

// ---------------------------------------------------------------- a sample ready to be annotated
// Two annotators label the same posts independently, so agreement can be measured afterwards, and
// both start with the same small calibration set to settle the guidelines before the main round.
function annotationPack(scan, rows, plan, labels, calibN) {
  const enc = [];
  const idCol = pickCol(scan.header, ["id", "post_id", "url", "link", "permalink", "post id"]);
  const head = ["row_id", "calibration"]
    .concat(scan.header)
    .concat(labels.length ? labels : ["label"], ["notes"]);
  const body = rows.map((r, i) => [String(i + 1), ""].concat(r).concat((labels.length ? labels : ["label"]).map(() => ""), [""]));
  const cal = Math.max(0, Math.min(calibN | 0, body.length));
  const rnd = mulberry32((plan.seed >>> 0) ^ 0x9e3779b9);
  const order = body.map((_, i) => i).sort(() => rnd() - 0.5);
  const calIdx = new Set(order.slice(0, cal));
  body.forEach((b, i) => { b[1] = calIdx.has(i) ? "yes" : ""; });
  const calRows = body.filter((_, i) => calIdx.has(i));
  const shuffled = (seed) => {
    const g = mulberry32(seed), a = body.map((b, i) => [g(), b]);
    a.sort((x, y) => x[0] - y[0]);
    return a.map(x => x[1]);
  };
  enc.push(["annotator_a.csv", csvText(head, shuffled((plan.seed >>> 0) + 1))]);
  enc.push(["annotator_b.csv", csvText(head, shuffled((plan.seed >>> 0) + 2))]);
  if (cal) enc.push(["calibration.csv", csvText(head, calRows)]);
  enc.push(["sample.csv", csvText(head, body)]);
  enc.push(["how_this_sample_was_made.json", JSON.stringify({
    made_at: new Date().toISOString(),
    source_file: scan.name || "", source_rows: scan.rows, source_bytes: scan.bytes,
    method: plan.mode, size_asked: plan.size, size_given: rows.length,
    ranked_by: plan.mode === "top" ? scan.header[plan.by] : null,
    stratified_by: plan.mode === "stratified" ? scan.header[plan.groupCol] : null,
    equal_groups: plan.mode === "stratified" ? !!plan.equal : null,
    time_unit: plan.mode === "time" ? plan.timeUnit : null,
    date_from: plan.from || null, date_to: plan.to || null,
    min_words: plan.minWords || null, max_words: plan.maxWords || null,
    duplicates_dropped: !!plan.dedup, random_seed: plan.seed,
    calibration_rows: cal, label_columns: labels.length ? labels : ["label"],
    note: "Re-running MARSAD with these settings on the same file returns the same rows."
  }, null, 2)]);
  enc.push(["README.txt",
    "This pack holds one sample of " + rows.length + " posts, drawn from " + (scan.rows || 0) +
    ".\n\nannotator_a.csv and annotator_b.csv hold the same posts in a different order, one per\n" +
    "annotator, so the two of you label independently. Fill the label column in your own file\n" +
    "and leave row_id alone: it is what matches the two files back together.\n\n" +
    (cal ? "calibration.csv holds the " + cal + " posts marked calibration=yes in both files. Label\n" +
           "those first and compare, before working through the rest.\n\n" : "") +
    "sample.csv is the sample as drawn, in file order.\n\n" +
    "how_this_sample_was_made.json records the settings and the random seed. Keep it: it is what\n" +
    "lets anyone draw the same sample again, which reviewers ask about.\n"]);
  return zipStore(enc);
}

function readBigPlan() {
  const v = (id) => { const e = $(id); return e ? e.value : ""; };
  const pick = document.querySelector('input[name="bigmode"]:checked');
  if (pick) BIGPLAN.mode = pick.value;
  BIGPLAN.size = Math.max(100, Math.min(500000, +v("#big-size") || BIGPLAN.size));
  if ($("#big-by")) BIGPLAN.by = +v("#big-by");
  if ($("#big-grp")) BIGPLAN.groupCol = +v("#big-grp");
  if ($("#big-unit")) BIGPLAN.timeUnit = v("#big-unit") || "week";
  if ($("#big-equal")) BIGPLAN.equal = $("#big-equal").checked;
  BIGPLAN.minWords = Math.max(0, +v("#big-min") || 0);
  BIGPLAN.maxWords = Math.max(0, +v("#big-max") || 0);
  BIGPLAN.from = v("#big-from") || "";
  BIGPLAN.to = v("#big-to") || "";
  if ($("#big-dedup")) BIGPLAN.dedup = $("#big-dedup").checked;
  BIGPLAN.seed = Math.max(0, +v("#big-seed") || 0);
  BIGPLAN.perPart = Math.max(1000, +v("#big-part") || BIGPLAN.perPart);
  if ($("#big-labels")) BIGPLAN.labels = v("#big-labels") || "label";
  if ($("#big-calib")) BIGPLAN.calib = Math.max(0, Math.min(500, +v("#big-calib") || 0));
  const sc = BIGFILE && BIGFILE.scan;
  if (sc) {
    if (BIGPLAN.mode === "top" && BIGPLAN.by < 0) BIGPLAN.by = sc.engCols[0];
    if (BIGPLAN.mode === "stratified" && BIGPLAN.groupCol < 0) BIGPLAN.groupCol = sc.groupCols[0];
  }
  return BIGPLAN;
}

const bigBusy = (what) => { BIGFILE.busy = true; BIGFILE.what = what; BIGFILE.pct = 0; BIGFILE.msg = ""; render(); };
const bigDone = (msg, kind) => { BIGFILE.busy = false; BIGFILE.msg = msg || ""; BIGFILE.msgKind = kind || ""; render(); };
let bigTick = 0;
async function bigProgress(p, n) {
  BIGFILE.pct = p; BIGFILE.seen = n;
  const now = Date.now();
  if (now - bigTick > 400) {            // repainting on every slice would be slower than the reading
    bigTick = now;
    const bar = document.querySelector(".bigprog progress");
    if (bar) { bar.value = Math.round(p * 100); bar.nextElementSibling.textContent = `${BIGFILE.what || "Reading"} ${Math.round(p * 100)}%`; }
    else render();
    await new Promise(r => setTimeout(r, 0));
  }
}

async function bigScan() {
  bigBusy(trUI("Reading"));
  try {
    const sc = await scanBig(BIGFILE.file, bigProgress);
    sc.name = BIGFILE.file.name;
    BIGFILE.scan = sc;
    if (sc.rows <= BIG_ROWS) {
      bigDone(esc(trUI("This file turned out to be small enough to analyse whole.")), "ok");
    } else {
      BIGPLAN.size = Math.min(BIG_ROWS, BIGPLAN.size);
      bigDone("");
    }
  } catch (e) { bigDone(esc(trUI("Could not read the file") + ": " + (e.message || e)), "err"); }
}

async function bigSample(then) {
  const plan = readBigPlan(), sc = BIGFILE.scan;
  bigBusy(trUI("Choosing rows"));
  try {
    const out = await sampleBig(BIGFILE.file, sc, plan, bigProgress);
    const cut = out.cut;
    const bits = [];
    if (cut.short) bits.push(`${fmt(cut.short)} ${trUI("too short")}`);
    if (cut.long) bits.push(`${fmt(cut.long)} ${trUI("too long")}`);
    if (cut.date) bits.push(`${fmt(cut.date)} ${trUI("outside the dates")}`);
    if (cut.repeat) bits.push(`${fmt(cut.repeat)} ${trUI("repeated text")}`);
    const note = `${fmt(out.kept.length)} ${trUI("rows kept from")} ${fmt(out.seen)} ${trUI("the filters allowed")}` +
      (bits.length ? ` · ${trUI("left out")}: ${bits.join(", ")}` : "") +
      (plan.mode !== "random" && plan.mode !== "top" ? ` · ${out.groups} ${trUI("groups")}` : "");
    await then(out, plan, note);
  } catch (e) { bigDone(esc(trUI("Could not take the sample") + ": " + (e.message || e)), "err"); }
}

// ---------------------------------------------------------------- the four things you can do with it
async function bigTake() {
  await bigSample(async (out, plan, note) => {
    if (!out.kept.length) { bigDone(esc(trUI("Nothing was left after the filters.")), "err"); return; }
    const sc = BIGFILE.scan;
    const text = csvText(sc.header, out.kept);
    const name = fileStem(BIGFILE.file.name) + "_sample_" + out.kept.length + ".csv";
    files.length = 0;
    files.push({name, label: stem(BIGFILE.file.name), data: new TextEncoder().encode(text),
                sampled: {...plan, from_rows: sc.rows, kept: out.kept.length, note}});
    BIGFILE = null;
    showFiles();
    render();
    toast(note);
    if (W) loadData();
  });
}

async function bigSave() {
  await bigSample(async (out, plan, note) => {
    const sc = BIGFILE.scan;
    const name = fileStem(BIGFILE.file.name) + "_sample_" + out.kept.length + ".csv";
    await save(name, new TextEncoder().encode(csvText(sc.header, out.kept)), null);
    bigDone(esc(note), "ok");
  });
}

async function bigAnnot() {
  await bigSample(async (out, plan, note) => {
    const sc = BIGFILE.scan;
    const labels = String(BIGPLAN.labels || "label").split(",").map(x => x.trim()).filter(Boolean);
    const blob = annotationPack(sc, out.kept, plan, labels, BIGPLAN.calib);
    const buf = new Uint8Array(await blob.arrayBuffer());
    await save(fileStem(BIGFILE.file.name) + "_to_annotate.zip", buf, null);
    bigDone(esc(note + " · " + trUI("two annotator files, a calibration set and the settings that made them")), "ok");
  });
}

async function bigSplit() {
  const plan = readBigPlan(), sc = BIGFILE.scan;
  const per = plan.perPart;
  const expect = Math.ceil(sc.rows / per);
  if (expect > 40 && !confirm(trUI("This would make") + " " + expect + " " + trUI("files. Continue?"))) return;
  bigBusy(trUI("Splitting"));
  try {
    const base = fileStem(BIGFILE.file.name);
    let saved = 0;
    await splitBig(BIGFILE.file, sc, per, bigProgress, async (n, text, rows) => {
      await save(`${base}_part${String(n).padStart(2, "0")}.csv`, new TextEncoder().encode(text), null);
      saved++;
      await new Promise(r => setTimeout(r, 120));     // a browser refuses a burst of downloads
    });
    bigDone(esc(`${saved} ${trUI("parts saved, in file order. Analyse one at a time.")}`), "ok");
  } catch (e) { bigDone(esc(trUI("Could not split the file") + ": " + (e.message || e)), "err"); }
}

function addFiles(list) {
  for (const f of list) {
    // Reading a file this size into memory is what would stop the tab, so it is not read: the
    // panel works from the file itself, a slice at a time.
    if (f.size > BIG_BYTES) {
      if (/\.(xlsx|xls)$/i.test(f.name)) {
        alertMsg(trUI("An Excel file this large cannot be read in slices. Save it as CSV and add that instead."));
        continue;
      }
      BIGFILE = {file: f, scan: null, busy: false};
      files.length = 0;
      showFiles(); render();
      continue;
    }
    const r = new FileReader();
    r.onload = () => { files.push({name: f.name, label: stem(f.name), data: new Uint8Array(r.result)}); showFiles(); };
    r.readAsArrayBuffer(f);
  }
}
function showFiles() {
  const el = $("#filelist"); if (!el) return;
  const groups = new Set(files.map(f => (f.label || stem(f.name)).trim().toLowerCase())).size;
  const multi = files.length > 1;
  el.innerHTML = files.map((f, i) => `<div class="frow"><span>${esc(f.name)} <span class="small-print">${(f.data.length / 1e6).toFixed(1)} MB</span></span>
      ${multi ? `<label><span class="fl">Name in charts</span><input type="text" data-lab="${i}" value="${esc(f.label || stem(f.name))}" aria-label="Name of ${esc(f.name)} in charts"></label>` : "<span></span>"}
      <button class="text-button" data-rm="${i}">Remove</button></div>`).join("") +
    (multi ? `<div class="modes" role="radiogroup" aria-label="How to use these files">
      <label class="mode ${loadMode === "combine" ? "on" : ""}"><input type="radio" name="mode" value="combine" ${loadMode === "combine" ? "checked" : ""}><span><b>Combine into one dataset</b><span>All posts are analysed together. A post found in more than one file is counted once. You can still split any result by file.</span></span></label>
      <label class="mode ${loadMode === "compare" ? "on" : ""}"><input type="radio" name="mode" value="compare" ${loadMode === "compare" ? "checked" : ""}><span><b>Compare the files</b><span>Every result is shown for each file. Each file keeps all its posts.</span></span></label></div>
      <p class="small-print">Files with the same name are treated as one group, for example three monthly files all named "2025".${groups > 6 ? ` <b>${groups} groups: charts are hard to read with more than 6. Give some files the same name to group them.</b>` : ""}</p>` : "");
  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { files.splice(+b.dataset.rm, 1); showFiles(); });
  el.querySelectorAll("[data-lab]").forEach(inp => inp.oninput = () => { files[+inp.dataset.lab].label = inp.value; });
  el.querySelectorAll('input[name="mode"]').forEach(r => r.onchange = () => { loadMode = r.value; showFiles(); });
  const lb = $("#loadbtn"); if (lb) lb.disabled = !(files.length && W);
  const dr = $("#drop b"); if (dr) dr.textContent = files.length ? "Add another file" : "Drop files here or click to choose";
}
async function loadSample(file, name) {
  try { files.length = 0; loadMode = "combine"; files.push({name: "practice_" + (name || file), label: stem(name || file), data: await bytes("samples/" + file)}); showFiles(); if (W) loadData(); }
  catch (e) { alertMsg("Could not open the practice file: " + e.message); }
}
async function loadComparison() {
  try {
    files.length = 0; loadMode = "compare";
    files.push({name: "practice_crowdtangle.csv", label: "CrowdTangle sample", data: await bytes("samples/crowdtangle.csv")});

function alertMsg(m) { $("#main").insertAdjacentHTML("afterbegin", `<div class="msg err">${esc(m)}</div>`); }

async function loadData(settings, stay) {
  if (!W || !files.length) return;
  // Abir's findings I-23: changing a setting that re-reads the file (Arabic word splitting, times) used to end on Overview
  // and drop every analysis's settings. With stay, the page that was open stays open, and each analysis keeps its settings,
  // its file choice and its place in My report; only the results are worked out again. A new file still starts afresh.
  const prevView = stay && view && view.page && view.page !== "overview" ? {...view} : null;
  busy(true, "Reading your file"); await tick();
  try {
    // an uploaded credibility list stays when the same file is re-read, because the settings that point to it stay too
    try { py.FS.readdir("/data").filter(n => !n.startsWith(".") && !(stay && n.startsWith("credibility_"))).forEach(n => py.FS.unlink("/data/" + n)); } catch (e) {}
    const paths = files.map((f, i) => { const p = "/data/" + i + "_" + f.name.replace(/[\\/]/g, "_"); py.FS.writeFile(p, f.data); return p; });
    const labels = files.map(f => (f.label || stem(f.name)).trim() || stem(f.name));
    const st = settings && settings.analysis_tz
      ? {analysis_tz: settings.analysis_tz, source_tz: settings.source_tz || "UTC",
         weekend: settings.weekend || "auto",
         arabic_segmentation: settings.arabic_segmentation !== false, arabic_stopwords: ARSTOP}
      // No control sets these any more: dates are read and shown in UTC, and the weekend is the
      // international Saturday and Sunday. A file whose times carry a zone is still read as written.
      : {analysis_tz: "UTC", source_tz: "UTC", weekend: "sat-sun",
         arabic_segmentation: ARSEG, arabic_stopwords: ARSTOP};
    if (!(settings && settings.analysis_tz)) Object.assign(st, {source_tz: TZSRC, analysis_tz: TZOUT, weekend: WEEKEND});
    SCAN = JSON.parse(W.load_files(py.toPy(paths), py.toPy(st), $("#platform")?.value || "auto", py.toPy(labels), files.length > 1 ? loadMode : "combine"));
    REG = dropGone(JSON.parse(W.registry_json())); PL = REG.plain; LEX = JSON.parse(W.lexicon_names());
    MarsadStats.event(`file-loaded/${MarsadStats.sizeBand(SCAN.posts || 0)}/${SCAN.platform || "other"}`);
    for (const k of Object.keys(results)) delete results[k];
    if (!stay) {
      for (const k of Object.keys(params)) delete params[k];
      saved.clear();
      for (const k of Object.keys(fileSel)) delete fileSel[k];
    }
    busy(true, "Preparing your overview"); await tick();
    for (const id of ["TIME-1", "TIME-2", "WORDS-1", "WHO-2", "DATA-4"]) if (regCard(id)?.available)
      runQuiet(id, params[id] || (COMPARE() && id === "TIME-1" ? (params[id] = {split: "dataset"}) : undefined));
    busy(false); go(prevView || {page: "overview"});
  } catch (e) { busy(false); console.error(e); alertMsg("Could not read the file: " + pyErr(e)); }
}
function runQuiet(id, p, file) {
  try { results[id] = JSON.parse(W.run_card(id, py.toPy(p || {}), file || null)); } catch (e) { results[id] = {card_id: id, status: "error", message: pyErr(e), tables: {}, extra_figures: {}, explain: {}, table_drill: {}, summary: {}, caveats: []}; }

}

// ------------------------------------------------------------------ one analysis
// ------------------------------------------------------------------ language models run in this page (nlp/)
// Posts never leave the browser: the model is downloaded once (nlp/models.js says from where), runs in a Web Worker,
// and its output is handed to the Python engine. Results are kept in IndexedDB so a file opened again is not redone.
const NLP = {embeddingsByFile: {}};
const tU = t => esc(trUI(t));
const mb = b => (b / 1048576).toFixed(0);
function nlpSpecKey(label) { const E = MARSAD_MODELS.embeddings; return Object.keys(E).find(k => E[k].label === label) || null; }
function nlpEligible(arabicOnly, file) { return JSON.parse(W.browser_texts(arabicOnly, 1, file || null)).eligible; }
function nlpProgressBox(title) {
  return `<article class="panel nlp-panel"><h3 class="panel-title">${tU(title)}</h3>
    <div class="bar-track" style="height:16px;margin:12px 0"><div class="bar-fill" id="nlpbar" style="width:0%"></div></div>
    <p class="small-print" id="nlptxt">${tU("Starting")}</p>
    <button class="btn small" id="nlpstop">${tU("Stop")}</button></article>`;
}
function nlpReporter(noun) {
  const dl = {};
  let t0 = null;
  $("#nlpstop") && ($("#nlpstop").onclick = () => MarsadNLP.cancel());
  return m => {
    const bar = $("#nlpbar"), txt = $("#nlptxt"); if (!bar || !txt) return;
    if (m.type === "download") {
      dl[m.file] = [m.loaded, m.total];
      const got = Object.values(dl).reduce((a, x) => a + x[0], 0), all = Object.values(dl).reduce((a, x) => a + x[1], 0);
      if (all > 1048576) { bar.style.width = (got / all * 100).toFixed(1) + "%"; txt.textContent = `${trUI("Downloading the model (once; your browser keeps it)")}: ${mb(got)} / ${mb(all)} MB`; }
    } else if (m.type === "progress") {
      t0 = t0 || m.ms;
      bar.style.width = (m.done / m.total * 100).toFixed(1) + "%";
      const left = m.done > 0 ? (m.ms / m.done) * (m.total - m.done) / 1000 : 0;
      const eta = m.done < Math.min(m.total, 48) ? "" : left > 90 ? ` · ${trUI("about")} ${Math.round(left / 60)} ${trUI("min left")}` : ` · ${trUI("about")} ${Math.max(1, Math.round(left))} ${trUI("s left")}`;
      txt.textContent = `${fmt(m.done)} / ${fmt(m.total)} ${trUI(noun)}${eta}`;
    }
  };
}
function nlpChoice(html) {
  return new Promise(resolve => {
    const box = $("#cardbody"); if (!box) return resolve(null);
    box.innerHTML = html;
    $("#nlpgo").onclick = () => resolve({key: (box.querySelector("input[name=nlpmodel]:checked") || {}).value,
                                         all: (box.querySelector("input[name=nlpn]:checked") || {}).value === "all"});
  });
}
function nlpFail(e) {
  const box = $("#cardbody"); if (!box) return false;
  const stopped = /cancelled/.test(String(e && e.message));
  box.innerHTML = `<div class="msg ${stopped ? "grey" : "err"}"><b>${tU(stopped ? "Stopped." : "The language model could not run in this browser.")}</b> ${stopped ? "" : esc(String(e && e.message || e))}</div>`;
  console.error(e);
  return false;
}
// Sentence embeddings for the posts: from memory, from this browser's store, or computed now after the reader agrees.
async function nlpEmbeddings(file) {
  if (JSON.parse(W.embedding_status(file || null))) return true;
  const E = MARSAD_MODELS.embeddings, cap = MARSAD_MODELS.sample || 5000;
  const first = nlpArabicFirst() ? "ar" : "multi";
  const take = async (key, all) => {
    const spec = E[key], t = JSON.parse(W.browser_texts(key === "ar", all ? 0 : cap, file || null));
    const ck = ["emb", spec.id, spec.keep_dim || spec.dim, MarsadNLP.hash(t.texts)].join("|");
    return {spec, t, ck, hit: await MarsadNLP.cacheGet(ck)};
  };
  const store = (x, data, dim) => {
    W.set_embeddings(data, JSON.stringify(x.t.pos), dim, x.spec.label, x.t.eligible, file || null);
    ["TOPIC-1"].concat(EMB_CARDS).forEach(k => { results[k] = null; });   // they were read from other vectors
  };
  for (const all of [false, true]) {          // done before in this browser? then no question and no wait
    const x = await take(first, all);
    if (x.hit) { store(x, x.hit.data, x.hit.dim); return true; }
    if (x.t.eligible <= cap) break;
  }
  const nAr = nlpEligible(true, file), nAll = nlpEligible(false, file);
  const opt = (k, n) => `<label class="cb"><input type="radio" name="nlpmodel" value="${k}" ${k === first ? "checked" : ""}> <b>${esc(E[k].label)}</b>: ${esc(trUI(E[k].languages))}, ${E[k].mb} MB · ${fmt(n)} ${tU("posts")}</label>`;
  const n0 = first === "ar" ? nAr : nAll;
  const sizes = n0 > cap
    ? `<label class="cb"><input type="radio" name="nlpn" value="sample" checked> ${tU("A random sample of")} ${fmt(cap)} ${tU("posts (a few minutes on a laptop)")}</label>
       <label class="cb"><input type="radio" name="nlpn" value="all"> ${tU("All posts (can take much longer; the time left is shown as it runs)")}</label>` : "";
  const c = await nlpChoice(`<article class="panel nlp-panel"><h3 class="panel-title">${tU("This analysis uses a language model that runs in your browser")}</h3>
    <p>${tU("Your posts stay on this computer. The model is downloaded once and your browser keeps it for next time.")} ${tU("Each post is read up to its first 600 characters.")}</p>
    <div class="nlp-opts">${opt("ar", nAr)}${opt("multi", nAll)}</div>${sizes ? `<div class="nlp-opts">${sizes}</div>` : ""}
    <button class="btn primary" id="nlpgo">${tU("Download the model and run")}</button></article>`);
  if (!c) return false;
  MarsadStats.event(`model/${c.key}/${c.all ? "all" : "sample"}`);
  let x;
  try {
    x = await take(c.key, c.all);
    if (x.hit) { store(x, x.hit.data, x.hit.dim); return true; }
    $("#cardbody").innerHTML = nlpProgressBox("Reading the posts with the language model");
    const r = await MarsadNLP.run("embed", x.spec, x.t.texts, nlpReporter("posts"));
    await MarsadNLP.cachePut(x.ck, {data: r.data, dim: r.dim, model: x.spec.id, n: x.t.pos.length, when: Date.now()});
    store(x, r.data, r.dim);
    return true;
  } catch (e) { return nlpFail(e); }
}
function nlpArabicFirst() { const ar = (SCAN?.languages || []).find(l => l.code === "ar"); return !!ar && ar.share >= 0.6; }
// TOPIC-3: the posts' embeddings, then the concepts embedded with the same model
async function nlpConcepts(file) {
  if (!(await nlpEmbeddings(file))) return false;
  const st = JSON.parse(W.embedding_status(file || null)), key = nlpSpecKey(st.model), spec = MARSAD_MODELS.embeddings[key];
  const seeds = JSON.parse(W.concept_seeds((params["TOPIC-3"] || {}).phrases || "", key === "ar"));
  const names = Object.keys(seeds), flat = names.flatMap(n => seeds[n]);
  try {
    busy(true, trUI("Reading the concepts with the language model")); await tick();
    const r = await MarsadNLP.run("embed", spec, flat);
    const V = new Float32Array(names.length * r.dim);

function shownItems(list) {

  // Simple and Easy Read open on the core set. Nothing is removed: "More analyses" shows the rest, and
  // Expert never applies this filter.
  if (!COREONLY || !SCAN) return runnable;
  const core = runnable.filter(i => isCore(i.id));
  return core.length ? core : runnable;
}
function coreHiddenCount(list) {
  if (!COREONLY || !SCAN) return 0;
  const runnable = list.filter(i => isShown(i.id)).filter(i => VIEWMODE === "full" || status(i).ok);
  const core = runnable.filter(i => isCore(i.id));

}
function viewToggle(list) {

  // a selection is an editorial choice, so it is stated rather than left for the user to notice

          : (VIEWMODE === "full" ? "Showing every analysis, including those that cannot run on this file." : "");

  const m = more ? `<button class="lnk" data-act="moreanalyses">${trUI("More analyses")}</button> ` : "";
  return `<p class="small-print viewnote">${c}${a}${b} ${m}<button class="lnk" data-act="viewmode">${VIEWMODE === "simple" ? "Show all" : "Show only those that can run"}</button></p>`;
}

// ------------------------------------------------------------------ Arabic interface
// #chatlog is skipped so that the user's own words and the posts quoted back to them are never rewritten.
// The note and the preset questions sit outside the log and do translate.
const TR_SKIP = ".post .t, .post .m, #chatlog, .tbl tbody, .js-plotly-plot, .hc-en-details, pre.code, textarea, [data-notr]";
const TR_DONE = [];
function trText(t) {
  if (!PL || !PL.ar) return null;
  const k = t.trim(); if (!k) return null;
  const U = PL.ar.ui; if (U[k]) return t.replace(k, U[k]);
  for (const [re, out] of PL.ar.patterns) { const m = k.match(new RegExp(re)); if (m) { const g = m.slice(1).map(x => U[x] || x); return t.replace(k, out.replace(/\{(\d)\}/g, (_, i) => g[+i])); } }
  return null;
}
function trNode(root) {
  if (LANG !== "ar" || !PL) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n = root;
  while (n) {
    if (n.nodeType === 1) {
      if (n.matches && n.matches(TR_SKIP)) { n = skipSub(w, n); continue; }
      for (const a of ["title", "placeholder", "aria-label", "data-tip"]) { const v = n.getAttribute && n.getAttribute(a); if (v) { const t = trText(v); if (t && t !== v) { TR_DONE.push([n, a, v]); n.setAttribute(a, t); } } }
    } else if (n.nodeType === 3) { const t = trText(n.nodeValue); if (t && t !== n.nodeValue) { TR_DONE.push([n, null, n.nodeValue]); n.nodeValue = t; } }
    n = w.nextNode();
  }
}
function skipSub(w, el) { let x = el; while (x && !x.nextSibling && x !== document.body) x = x.parentNode; if (!x || x === document.body) return null; w.currentNode = x.nextSibling; return x.nextSibling; }
const TR_OBS = new MutationObserver(ms => { if (LANG !== "ar") return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1 || n.nodeType === 3) { if (n.nodeType === 1 && n.closest && n.closest(TR_SKIP)) continue; if (n.nodeType === 3 && n.parentElement && n.parentElement.closest(TR_SKIP)) continue; trNode(n); } });
function setLang(l) {
  LANG = l; try { localStorage.setItem("marsad_lang", l); } catch (e) {}
  document.documentElement.lang = l === "ar" ? "ar" : "en"; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  const b = $("#langbtn"); b.textContent = l === "ar" ? "English" : "العربية"; b.lang = l === "ar" ? "en" : "ar"; b.title = l === "ar" ? "Show the menus in English" : "Show the menus in Arabic";
  renderModeSel();
  if (l === "ar") { TR_OBS.observe(document.body, {childList: true, subtree: true}); }
  else { TR_OBS.disconnect(); for (const [n, a, v] of TR_DONE.splice(0)) { if (a) n.setAttribute(a, v); else n.nodeValue = v; } }
  if (PL) { renderSidebar(); render(); } if (l === "ar") trNode(document.body);
}
$("#langbtn").onclick = () => setLang(LANG === "ar" ? "en" : "ar");

// One row per post is right for social media. An article or a paper is one row of many thousands of

function splitDocsField(p) {
  const d = SCAN.long_documents || {};

    `tone cards one unit to work on instead of many, so their results say very little. Splitting gives each ` +
    `section or paragraph its own row, and every part keeps a link back to the document it came from. ` +
    `Engagement stays on the first part, so totals do not change.`;
  const opt = (v, label) => `<option value="${v}"${now === v ? " selected" : ""}>${esc(label)}</option>`;
  return `<div><label for="pp-u">${esc(trUI("Split long documents into parts"))}${iMark(help)}</label>

}

function testDiff(id, a, b) {
  let o; busy(true, "Testing the difference");
  try { o = JSON.parse(W.compare_test(id, py.toPy(params[id] || {}), a || "", b || "")); } catch (e) { o = {error: pyErr(e)}; } finally { busy(false); }
  if (o.error) { modal("Test the difference", `<div class="msg grey">${esc(o.error)}</div>`); return; }
  const pick = (v, nm) => `<select id="td-${nm}">${o.files.map(f => `<option ${f === v ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>`;
  const rows = o.rows.map(x => `<tr class="${x.clear_difference ? "hit" : ""}"><td dir="auto">${esc(x.part)}</td><td>${fmt(x["share_" + o.a + "_%"])}%</td><td>${fmt(x["share_" + o.b + "_%"])}%</td><td>${x.difference_points > 0 ? "+" : ""}${fmt(x.difference_points)} (${fmt(x.low)} to ${fmt(x.high)})</td><td>${x.p_holm < 0.001 ? "< 0.001" : fmt(x.p_holm)}</td><td>${esc(x.effect_size)} (${fmt(x.effect_h)})</td><td>${x.clear_difference ? "Yes" : "No"}</td></tr>`).join("");
  const clear = o.rows.filter(x => x.clear_difference).length;
  modal("Test the difference", `${o.files.length > 2 ? `<p>Compare ${pick(o.a, "a")} with ${pick(o.b, "b")} <button class="btn small" id="td-go">Compare</button></p>` : ""}
    <p><b>${clear ? clear + " of " + o.rows.length + " parts show a clear difference" : "No part shows a clear difference"}</b> between ${esc(o.a)} (${fmt(o.posts_a)} posts) and ${esc(o.b)} (${fmt(o.posts_b)} posts).</p>
    <div class="tbl"><table class="g"><thead><tr><th>Part</th><th>${esc(o.a)}</th><th>${esc(o.b)}</th><th>Difference, points (range)</th><th>p (corrected)</th><th>Effect size</th><th>Clear difference</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small-print">${esc(o.note)}</p>

async function save(filename, data, msgEl) {

    catch (e) { if (msgEl) msgEl.textContent = e && e.code === "declined" ? "Download cancelled." : "Could not save: " + (e.message || e.code || e); }
    return;
  }
  // outside Claude (GitHub Pages, a MARSAD server): a normal browser download
  try {
    const type = /\.html?$/i.test(filename) ? "text/html" : /\.svg$/i.test(filename) ? "image/svg+xml" : /\.csv$/i.test(filename) ? "text/csv" : "application/octet-stream";

function shownOrder(id, r, figs) {

      const cats = h ? one.y : one.x;
      if (Array.isArray(cats) && sortOn(id)) {
        const vals = numArr(h ? one.x : one.y) || [];
        return cats.map((c, i) => [c, vals[i] || 0]).sort((a, b) => b[1] - a[1]).map(x => String(x[0]));

      if (Array.isArray(cats)) { const o = catOrder(cats.map(String)); if (o) return o; }
    }
    const names = (g || f || {}).data ? ((g || f).data || []).map(t2 => t2.name).filter(Boolean) : [];

  const msg = $("#dlmsg"); msg.textContent = "";
  try {
    if (kind === "png" || kind === "svg") {
      // exports are light-themed so they print and paste into papers correctly
      const live = $("#cardfig");
      const v = document.querySelector("[data-view].on");
      const f = (figs[v && v.dataset.view !== "table" ? +v.dataset.view.slice(1) : 0] || figs[0] || [])[2];
      const off = document.createElement("div");
      off.style.cssText = "position:absolute;left:-10000px;top:0;width:1200px;background:#fff";
      document.body.appendChild(off);
      let el = live;
      if (f) { await plot(off, shownFig(f, r), {forLight: true}); el = off; }
      const url = await Plotly.toImage(el, {format: kind, width: 1200, height: Math.max(500, live.clientHeight || 500), scale: kind === "png" ? 2 : 1});
      off.remove();
      const name = `${(plainOf(id)?.title || id).replace(/[^\w\- ]+/g, "").trim().replace(/ +/g, "_")}${figIdx ? "_" + figs[figIdx][0].replace("figure:", "") : ""}.${kind}`;
      await save(name, kind === "png" ? b64(url.split(",")[1]) : decodeURIComponent(url.split(",")[1]), msg); return;
    }
    busy(true, "Preparing the file"); await tick();
    const ord = shownOrder(id, r, figs);
    const d = JSON.parse(W.download(id, kind, null, ord ? JSON.stringify(ord) : null, LANG)); busy(false);
    await save(d.filename, b64(d.data), msg);
  } catch (e) { busy(false); msg.textContent = "Could not prepare the file: " + pyErr(e); }
}

// The dataset itself: the table the analyses are reading, so a reader can check any number by hand.
async function dlDataset() {
  if (!SCAN) return;
  try {
    busy(true, trUI("Preparing the file")); await tick();
    const d = JSON.parse(W.dataset()); busy(false);
    await save(d.filename, b64(d.data), null);
    toast(`${trUI("Saved")} ${d.filename} \u00b7 ${fmt(d.rows)} ${trUI("rows")}, ${d.cols} ${trUI("columns")}`);
  } catch (e) { busy(false); toast(trUI("Could not prepare the file") + ": " + pyErr(e)); }
}

$("#helpbtn").onclick = () => go({page: "help", route: {view: "home"}});

view = fromHash();
render();

// ------------------------------------------------------------------ Ask MARSAD (chat)
const CHAT = {history: [], busy: false, abort: null, mode: "local"};
const CHAT_SUGG = ["What are the main findings?", "Who are the most active accounts?", "Why was there a spike?",
                   "Is the sentiment positive or negative?", "Which news frames dominate?", "ما أكثر الكلمات استخداما؟"];
function chatOpen(on) {
  const c = $("#chat"); c.classList.toggle("open", on); c.setAttribute("aria-hidden", on ? "false" : "true"); c.inert = !on; if (!on) $("#chatfab").focus();
  if (on) { chatNote(); if (!CHAT.history.length) chatWelcome(); setTimeout(() => $("#chatin").focus(), 50); }
}
async function chatReady() {
  try { SAMPLE = await window.claude?.use?.("sample"); } catch (e) { SAMPLE = null; }
  CHAT.mode = SAMPLE ? "claude" : "local"; chatNote();
}
function chatNote() {
  const n = $("#chatnote"); if (!n) return;
  n.innerHTML = CHAT.mode === "claude"
    ? "Answers are written by Claude from MARSAD's results for your file. Your question, the results it looks up and up to 8 quoted posts are sent to Claude; your file itself is not uploaded. Check important numbers in the analysis it names."
    : "Simple answers: Ask MARSAD points you to the analyses that answer your question and shows their key numbers. Full written answers are available when MARSAD is opened in Claude.";
}
function chatWelcome() {
  const log = $("#chatlog");
  if (log && !log.querySelector(".ch-hello")) {
    const hello = document.createElement("div");
    hello.className = "ch-hello";
    hello.innerHTML = `<img src="assets/marsad-bot-320.png" alt="" width="96" height="98" decoding="async">`;
    log.appendChild(hello);
  }
  chatAdd("a", SCAN ? `Your file has ${fmt(SCAN.posts)} posts. Ask me what you want to know about them.`
                    : "Load a file on the Overview page first, then ask me about it. I can also explain how any analysis works.");
  $("#chatsugg").innerHTML = CHAT_SUGG.map(q => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("");
}
function chatLinkify(html) {
  const ids = new Set((REG?.cards || []).map(c => c.id));
  return html.replace(/\b([A-Z]{3,7}-\d{1,2})\b/g, (m, id) => ids.has(id) ? `<button class="cid" data-go="c-${id}">${id}</button>` : m);
}
function chatMd(t) {
  let h = esc(t || "");
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^\s*[-*] (.+)$/gm, "&bull; $1").replace(/\n/g, "<br>");
  return chatLinkify(h);
}
function chatAdd(role, text, extra) {
  const d = document.createElement("div"); d.className = "m " + (role === "u" ? "u" : "a"); d.dir = "auto";
  d.innerHTML = role === "u" ? esc(text) : chatMd(text) + (extra || "");
  $("#chatlog").appendChild(d); $("#chatlog").scrollTop = 1e9; return d;
}
async function chatSend(q) {
  q = (q || "").trim(); if (!q || CHAT.busy) return;
  $("#chatin").value = ""; $("#chatsugg").innerHTML = "";
  chatAdd("u", q); CHAT.busy = true; $("#chatsend").disabled = true;
  try { if (CHAT.mode === "claude" && SAMPLE) await chatClaude(q); else chatLocal(q); }
  finally { CHAT.busy = false; $("#chatsend").disabled = false; }
}
function chatLocal(q) {
  if (!CH) { chatAdd("a", "The analysis engine is still starting. Try again in a moment."); return; }
  let r; try { r = JSON.parse(CH.local_answer(q)); } catch (e) { r = {analyses: []}; }
  if (!r.analyses.length) { chatAdd("a", "I could not match that to an analysis. Try words such as sentiment, accounts, hashtags, spike, frames, offensive or dialect, or browse All analyses."); return; }
  const parts = r.analyses.map(a => {
    const nums = a.key_numbers ? Object.entries(a.key_numbers).filter(([k, v]) => v !== null && typeof v !== "object").slice(0, 4)
      .map(([k, v]) => `${esc(k.replace(/_/g, " "))}: <b>${typeof v === "number" ? fmt(Math.round(v * 10) / 10) : esc(String(v))}</b>`).join(", ") : "";
    return `<div style="margin-top:8px"><button class="cid" data-go="c-${a.id}">${esc(a.title)}</button> (${a.id}): ${esc(a.what)}${nums ? "<br>" + nums : "<br><i>Open it to see the result.</i>"}</div>`;
  }).join("");
  chatAdd("a", "These analyses answer your question:", parts);
}
async function chatClaude(q) {
  const specs = JSON.parse(CH.tool_specs());
  const used = [];
  const tools = specs.map(t => ({name: t.name, description: t.description, inputSchema: t.inputSchema,
    execute: async (input) => { used.push(t.name === "run_analysis" ? (input?.card_id || "") : t.name.replace(/_/g, " "));
      busy(true, "Looking up results"); await tick(); try { return CH.call(t.name, JSON.stringify(input || {})); } finally { busy(false); } }}));
  CHAT.history.push({role: "user", content: q});
  const msgs = CHAT.history.map((m, i) => i === 0 ? {role: "user", content: CH.SYSTEM + "\n\nUser question:\n" + m.content} : m);
  const box = chatAdd("a", "Thinking…");
  CHAT.abort = new AbortController();
  try {
    const res = await SAMPLE(msgs, {tools, cache: false, modelTier: "default", signal: CHAT.abort.signal,
      onText: ({text}) => { box.innerHTML = chatMd(text); $("#chatlog").scrollTop = 1e9; }});
    const text = res?.text || "";
    box.innerHTML = chatMd(text) + (used.length ? `<div class="tools">Looked up: ${chatLinkify(esc([...new Set(used)].join(", ")))}</div>` : "");
    CHAT.history.push({role: "assistant", content: text});
  } catch (e) {
    CHAT.history.pop();
    if (e?.code === "not_granted") { CHAT.mode = "local"; chatNote(); box.remove(); chatLocal(q); return; }
    box.innerHTML = e?.code === "rate_limited" ? "Too many questions in a short time. Please wait a minute and ask again."
      : "Sorry, I could not answer that (" + esc(e?.message || "error") + ").";
  }
}
$("#chatfab").onclick = () => chatOpen(!$("#chat").classList.contains("open"));
$("#chatclose").onclick = () => chatOpen(false);
$("#chatnew").onclick = () => { CHAT.history = []; $("#chatlog").innerHTML = ""; chatWelcome(); };
$("#chatform").onsubmit = e => { e.preventDefault(); chatSend($("#chatin").value); };
$("#chatin").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend($("#chatin").value); } });
$("#chatsugg").addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (b) chatSend(b.dataset.q); });
</script>
