how_this_sample_was_made.json<\/code>: the method, the size, every filter, the seed and the counts.<\/li><li><code>README.txt<\/code>: the same in plain words, for whoever opens the zip.<\/li><\/ul>\n<p>Every row carries a <code>row_id<\/code> that is the same in both annotator files, which is what matches the two sets of labels back together when you compute agreement.<\/p>\n<h2>What is not covered<\/h2>\n<p>Excel files cannot be read in slices, because the format has to be unpacked whole. Save the sheet as CSV first. Near-duplicate detection is not done during the scan either: dropping repeats here means exactly repeated text. Near-duplicates are found later, by the copied-posts analysis, on the sample you keep.<\/p>"}, {"cat": "data-management", "slug": "saved-datasets", "title": "Saved datasets and folders", "status": "placeholder", "summary": "Saving a dataset to your MARSAD account", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>Saving a dataset to your MARSAD account<\/li><li>Folders for projects<\/li><li>How long datasets are kept<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "data-management", "slug": "sharing-datasets", "title": "Sharing datasets with your team", "status": "placeholder", "summary": "Sharing a dataset or a report with collaborators", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>Sharing a dataset or a report with collaborators<\/li><li>Read and edit rights<\/li><li>Sharing rules for licensed data<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "results", "slug": "posts-behind-results", "title": "Seeing the posts behind a result", "status": "ready", "summary": "Click anything to read the posts behind it.", "html": "<p>Every bar, point, word, bubble and table row can be clicked. A window lists the posts behind it, most engaging first, with the matched words highlighted. Arabic posts are shown right to left.<\/p>\n<ul><li>The title of the window gives the number of matching posts.<\/li><li><b>open<\/b> beside a post opens it on the platform when the file has its link.<\/li><li>Reading the posts is the best check of any result, above all for word-list and model results.<\/li><\/ul>"}, {"cat": "results", "slug": "options-and-splitting", "title": "Options and splitting results", "status": "ready", "summary": "Change settings and split results by time or group.", "html": "<p><b>Options<\/b> on an analysis page changes its settings. Click <b>Update<\/b> to run it again.<\/p>\n<ul><li><b>Split the results by<\/b> shows the result over time or for each group: account, source, country, page type,<\/li><\/ul>\n<p>language, file (dataset), script, post type, dialect or topic, when the file has them.<\/p>\n<ul><li>Some analyses need input, for example the words to track or the date of an event. Their options are open when the<\/li><\/ul>\n<p>page loads.<\/p>\n<ul><li>The i beside each option explains it.<\/li><\/ul>"}, {"cat": "results", "slug": "downloads", "title": "Downloads", "status": "ready", "summary": "Excel, CSV, PNG, SVG, network files, and the analysed dataset itself.", "html": "<p><b>Download<\/b> on an analysis page offers:<\/p>\n<div class='tw'><table><thead><tr><th>Format<\/th><th>Contains<\/th><\/tr><\/thead><tbody><tr><td>Excel<\/td><td>All tables of the result, one sheet each<\/td><\/tr><tr><td>CSV (zip)<\/td><td>All tables as CSV files<\/td><\/tr><tr><td>Chart as PNG / SVG<\/td><td>The chart on screen, for slides (PNG) or papers (SVG)<\/td><\/tr><tr><td>Network for Gephi<\/td><td>Who talks to whom as a GraphML file<\/td><\/tr><tr><td>Network explorer page<\/td><td>An interactive network that opens in any browser<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Arabic text opens correctly in Excel from the Excel download. CSV files are saved as UTF-8.<\/p>\n<h2>The dataset itself<\/h2>\n<p><b>Download data (CSV)<\/b> on the Overview, and on Your files, saves the table the analyses are reading: your posts after cleaning, with the columns MARSAD derived from them (language, hour, weekday, hashtags, mentions, links, domains and the rest). It follows whatever filter is in play, so the file you get is the file the numbers on screen came from. Use it to check a figure by hand, or to carry the cleaned data into another tool.<\/p>\n<p>What that file does not change is what you may do with the rows. A collected dataset keeps the licence its provider attached, in the rights column, and collecting text is not permission to republish it.<\/p>"}, {"cat": "results", "slug": "my-report", "title": "My report", "status": "ready", "summary": "Keep results and download them as one page.", "html": "<ol><li>On any analysis, click <b>+ Report<\/b>. The button changes to <b>In report<\/b>.<\/li><li>Open <b>My report<\/b> from the menu to see the list. Remove anything you do not need.<\/li><li>Click <b>Download report<\/b>. You get one web page with every kept result: charts that stay interactive, key numbers, tables and notes. It opens offline in any browser and can be shared by email.<\/li><\/ol>\n<p>The report uses the options each analysis had when you added it.<\/p>"}, {"cat": "results", "slug": "colab-notebook", "title": "Using the Colab notebook", "status": "ready", "summary": "Larger files, language models, PDF and LaTeX exports.", "html": "<p>The notebook runs the same analyses in Google Colab, for larger files and the language models.<\/p>\n<ol><li>Open MARSAD_Analytics.ipynb in Google Colab.<\/li><li>Run <b>1. Install<\/b> (once per session).<\/li><li>Run <b>2. Upload files<\/b> and choose your files, or connect Google Drive.<\/li><li>Run <b>3. Open the dashboard<\/b>. The dashboard in the notebook has the same analyses, plus model enrichment (sentiment, emotion, toxicity, dialect) and exports as PDF and LaTeX.<\/li><li>Optional: <b>4. Scripted use<\/b> runs analyses from code; <b>5. Validate a lexicon<\/b> checks a word list.<\/li><\/ol>"}, {"cat": "word-lists", "slug": "how-word-lists-work", "title": "How word-list analyses work", "status": "ready", "summary": "Whole-word matching, Arabic forms, negation and opposite phrases.", "html": "<p>Many analyses count posts that use words from a list, for example a list of trust words or of economic worries.<\/p>\n<ul><li><b>Whole words only.<\/b> A word inside a longer word does not count.<\/li><li><b>Arabic forms.<\/b> Spelling variants are matched (أ إ آ ا, ة ه, ى ي), and common prefixes (و، ف، ب، ل، ال) and<\/li><\/ul>\n<p>endings (ها، هم، ات، ون...) are allowed on words of four letters or more.<\/p>\n<ul><li><b>Negation.<\/b> For some lists a word right after a negation does not count: مش مبسوط is not counted as happy,<\/li><\/ul>\n<p>not fair is not counted as fair.<\/p>\n<ul><li><b>Opposite phrases win.<\/b> فقدنا الثقة (we lost trust) counts as distrust only, not also as trust.<\/li><li><b>Shares.<\/b> Results give the share of posts with at least one match and the matches per 1,000 words.<\/li><\/ul>\n<p>Word lists find words, not meaning. Sarcasm, quotes and reported speech are counted like any other use. Always read some posts behind a result: see <a href=\"#\" data-doc=\"checking-word-lists\">Checking a word list<\/a>.<\/p>"}, {"cat": "word-lists", "slug": "own-word-list", "title": "Using your own words or word list", "status": "ready", "summary": "Type your own words now; upload full lists in the notebook.", "html": "<ul><li><b>Track a few words:<\/b> in <a href=\"#\" data-app=\"FRAME-6\">My own word list<\/a> (Ways of speaking), type your words or phrases separated by commas.<\/li><li><b>A whole word list:<\/b> in the Colab notebook, load a CSV with columns term, category, lang. Each category becomes<\/li><\/ul>\n<p>a list available to every word-list analysis. An edited copy of a MARSAD list keeps its negation and opposite-phrase rules.<\/p>\n<ul><li>Uploading a word list in the web dashboard: coming later.<\/li><\/ul>"}, {"cat": "word-lists", "slug": "checking-word-lists", "title": "Checking a word list", "status": "ready", "summary": "Read 20 posts, compute precision, fix the words that misfire.", "html": "<p>Before reporting a word-list result, check its precision on your own data:<\/p>\n<ol><li>Open the analysis and click the bar of the list you want to check.<\/li><li>Read 20 posts and count how many really express the idea of the list.<\/li><li>Precision = correct posts / 20. Below 14 of 20, look at the words behind the wrong posts (Table view, top terms) and remove or replace them.<\/li><\/ol>\n<p>In the Colab notebook, <b>5. Validate a lexicon<\/b> samples matched posts for two annotators and computes precision with a confidence interval.<\/p>"}, {"cat": "models", "slug": "cohesion-formula", "title": "MARSAD social cohesion formula", "status": "placeholder", "summary": "The official MARSAD formula for Social cohesion.", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>The parts of the MARSAD social cohesion index and their weights<\/li><li>How it differs from the default (the average of the parts)<\/li><li>Validation and references<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "account", "slug": "sign-in", "title": "Creating an account and signing in", "status": "placeholder", "summary": "Who can create an account", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>Who can create an account<\/li><li>Signing in with your institution<\/li><li>Resetting your password<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "account", "slug": "teams", "title": "Teams and roles", "status": "placeholder", "summary": "Creating a team", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>Creating a team<\/li><li>Roles and rights<\/li><li>Shared folders and reports<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "account", "slug": "api-keys", "title": "API keys", "status": "placeholder", "summary": "Creating and revoking keys", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>Creating and revoking keys<\/li><li>What the MARSAD API offers<\/li><li>Limits per key<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "account", "slug": "plans", "title": "Plans and usage limits", "status": "placeholder", "summary": "Free and research plans", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>Free and research plans<\/li><li>Corpus search limits<\/li><li>Storage limits<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "account", "slug": "two-factor", "title": "Two-factor authentication", "status": "placeholder", "summary": "Turning it on", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>Turning it on<\/li><li>Recovery codes<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "about", "slug": "how-to-cite", "title": "How to cite MARSAD", "status": "placeholder", "summary": "The reference to use in papers.", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>The reference to cite for the tool<\/li><li>Citing a dataset from the MARSAD corpus<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "about", "slug": "contact", "title": "Contact and support", "status": "placeholder", "summary": "How to report a problem", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>How to report a problem<\/li><li>How to request an analysis or a word list<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "about", "slug": "terms", "title": "Terms of use and privacy policy", "status": "placeholder", "summary": "Terms of use", "html": "<p>This page is a placeholder. The feature is not part of MARSAD Analytics v1.5 yet.<\/p>\n<h2>What this page will cover<\/h2>\n<ul><li>Terms of use<\/li><li>Privacy policy<\/li><li>Data provider terms<\/li><\/ul>\n<div class='note'>Written by the MARSAD team when the feature is released.<\/div>"}, {"cat": "about", "slug": "whats-new", "title": "What is new in v1.5", "status": "ready", "summary": "Wider and cleaner word lists (v1.5); Society analyses, file comparison and navigation (v1.4).", "html": "<h2>v1.5, later November additions<\/h2>\n<div class='tw'><table><thead><tr><th>Area<\/th><th>Change<\/th><\/tr><\/thead><tbody><tr><td>Arabic<\/td><td>The Arabic interface now covers every analysis: title, a one-sentence method and a one-sentence caution, plus Arabic labels for metrics, options and required fields, Arabic chart tabs, axis titles and table headers, and an Arabic Help center with the English technical guide kept under each page. From an Arabic and RTL review of v1.5, checked against the English methods before merging<\/td><\/tr><tr><td>Customize<\/td><td>Choose which analyses appear (a set such as Basic or Investigation, or your own choice), pin the ones you use to the menu, and reopen where you left off. Section lists on All analyses fold away<\/td><\/tr><tr><td>Filters<\/td><td>Two more filters: a minimum engagement, and posts with a link<\/td><\/tr><tr><td>Charts<\/td><td>Copy the chart as an image; split any label result (sentiment, emotions, offensive language, hate, propaganda) by topic, dialect, country, script, type or hashtag, with the split shown as a table and a stacked bar<\/td><\/tr><tr><td>Fixed<\/td><td>The split option on the label cards did nothing: it now produces the cross-tab it promised (an audit of 6 November found this)<\/td><\/tr><tr><td>Investigation<\/td><td>A set for campaigns, trolls, bots and misinformation work: propaganda techniques from word lists (FRAME-20), who spread it first (SPREAD-10), link and source checks (SPREAD-11), and a rebuilt Account checks (WHO-5) with nine named checks. Four more came out of the November reviews: timing and similarity between accounts (SPREAD-12), how far a message travelled (SPREAD-13), where the series changed (TIME-6), and where posts say they are from (WHO-9). Two study types start from the question: \"Who is pushing this, and is it organic?\" and \"Is a false or unverified claim spreading?\". See <a href=\"#\" data-doc=\"investigations\">Investigating campaigns, bots and misinformation<\/a><\/td><\/tr><tr><td>Word lists<\/td><td>Eleven new seed lists for propaganda techniques (name calling, exaggeration, doubt, fear, flag waving, whataboutism, appeal to authority, black and white framing, one simple cause, slogans, cliches). New and unvalidated: read the posts before reporting<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>v1.5<\/h2>\n<div class='tw'><table><thead><tr><th>Area<\/th><th>Change<\/th><\/tr><\/thead><tbody><tr><td>Word lists<\/td><td>The 63 older lists (framing, emotion, victims, blame, hope, corruption, protest, dialects and others) were reviewed: about 1,800 Arabic and English terms added, including Gulf, Egyptian, Levantine, Iraqi, Maghrebi, Sudanese and Yemeni forms, and about 120 terms removed because they matched other meanings<\/td><\/tr><tr><td>Matching<\/td><td>A list can mark words to match only whole (لازم but not للازمات). Hope, resilience and collective efficacy skip words right after a negation, and despair phrases (فقدنا الأمل) win over hope<\/td><\/tr><tr><td>Results<\/td><td>Counts on word-list analyses change from v1.4: usually lower where common words were removed, higher where dialect words were added. Do not mix v1.4 and v1.5 results in one comparison<\/td><\/tr><\/tbody><\/table><\/div>\n<div class='tw'><table><thead><tr><th>Dialects<\/th><th>The Yemeni, Sudanese and general dialect word lists were checked against labelled NADI tweets; words that mostly appear in other regions or in standard Arabic were removed. See <a href=\"#\" data-doc=\"dialect-lists-nadi\">Dialect word lists checked against NADI<\/a><\/th><\/tr><\/thead><tbody><tr><td>Word models<\/td><td>Sentiment, emotions and offensive language for Arabic posts in the browser, and named people, organizations and places; each tested on held-out data. See <a href=\"#\" data-doc=\"word-models\">Arabic word models and named entities<\/a><\/td><\/tr><tr><td>Stopwords<\/td><td>About 5,360 Arabic stopword forms (was 818), so word counts and keywords show content words<\/td><\/tr><tr><td>Ask MARSAD<\/td><td>A chat panel that answers questions about your results; written answers by Claude from MARSAD's own results when opened in Claude. See <a href=\"#\" data-doc=\"ask-marsad\">Ask MARSAD<\/a><\/td><\/tr><tr><td>New analyses<\/td><td>Who offensive posts name (FRAME-18), news frames (FRAME-19, indicators), sentiment about named entities (WORDS-11), what drove a spike (TIME-5)<\/td><\/tr><tr><td>Accuracy<\/td><td>Fixes from an independent audit (6 November 2026): post ids, repeats and merging, engagement filled per row, and five calculations. See <a href=\"#\" data-doc=\"accuracy-fixes-v15\">Accuracy fixes in v1.5<\/a><\/td><\/tr><tr><td>Check on my data<\/td><td>Mark a random sample of posts as right or wrong on any result: MARSAD gives the share right with a 95% range and, for labels, the corrected share of each label. See <a href=\"#\" data-doc=\"check-on-my-data\">Check a result on your own data<\/a><\/td><\/tr><tr><td>Ranges<\/td><td>Label tables show a 95% range for each share, and for the quick Arabic models a share adjusted for the model's known errors<\/td><\/tr><tr><td>Prepare posts<\/td><td>Work on a random sample of a large file, count each account at most N times, or split the posts at a date into two periods. See <a href=\"#\" data-doc=\"prepare-posts\">Prepare posts<\/a><\/td><\/tr><tr><td>Test the difference<\/td><td>For two files or periods: difference in share with a range, a corrected p value and an effect size for every part of a result. See <a href=\"#\" data-doc=\"test-difference\">Test a difference<\/a><\/td><\/tr><tr><td>Projects and drafts<\/td><td>Save a project and open it later; write a draft report from your results in one click. See <a href=\"#\" data-doc=\"projects-drafts\">Projects and draft reports<\/a><\/td><\/tr><tr><td>Start from a question<\/td><td>Ten study types (an event, who leads, coordination, feelings, framing, before and after, concerns, attention, dialects, a paper), each an ordered set of analyses with what to report<\/td><\/tr><tr><td>Arabic menus<\/td><td>The menus, buttons and the titles and short descriptions of all analyses in Arabic (العربية button at the top). Longer explanations and this Help center are still in English<\/td><\/tr><tr><td>Filters<\/td><td>A filter bar on every page: dates, platform, language, dialect and file. Every analysis, download, chat answer and draft uses the filtered posts. See <a href=\"#\" data-doc=\"filters-and-views\">Filters, views and chart tools<\/a><\/td><\/tr><tr><td>Chart tools<\/td><td>Based on N of M posts under every result; show bars as % of those posts; top 5 to 100; sort by value; full screen; copy key numbers; report a problem<\/td><\/tr><tr><td>Posts<\/td><td>Post lists in random, newest, oldest or engagement order; download every matching post as CSV; copy a post; search the posts from the Overview<\/td><\/tr><tr><td>Simple view<\/td><td>Analyses that cannot run on your file are hidden until you choose Show all. Nothing is removed<\/td><\/tr><tr><td>File details<\/td><td>How complete each field is (text, date, account, engagement and others)<\/td><\/tr><tr><td>Accessibility<\/td><td>Checked with axe-core against WCAG 2.2 AA on nine views: no violations. Keyboard focus stays inside open windows and returns after closing; skip link; charts labelled with a pointer to the table view; text contrast raised; works at 320 px wide. See <a href=\"#\" data-doc=\"accessibility\">Accessibility<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p>See <a href=\"#\" data-doc=\"word-lists-v15\">Changes to the word lists in v1.5<\/a>.<\/p>\n<h2>v1.4<\/h2>\n<div class='tw'><table><thead><tr><th>Area<\/th><th>Change<\/th><\/tr><\/thead><tbody><tr><td>Society<\/td><td>Ten new analyses: trust in institutions, moral values, wellbeing, stress and coping, certainty and self-focus, economic mood, boycotts and buying calls, health talk, misinformation signals, issue attention<\/td><\/tr><tr><td>Word lists<\/td><td>46 new Arabic and English lists (about 3,700 terms, Arabic including Gulf, Egyptian, Levantine, Iraqi and Maghrebi forms), with negation and opposite-phrase rules<\/td><\/tr><tr><td>Files<\/td><td>Combine or compare several files; a name per file; repeated posts across files counted once when combining<\/td><\/tr><tr><td>Navigation<\/td><td>You are here trail, section colours, Previous and Next, larger text, an amber file button<\/td><\/tr><tr><td>Help<\/td><td>i help with examples on every analysis, number and column; this Help center<\/td><\/tr><\/tbody><\/table><\/div>"}, {"cat": "word-lists", "slug": "dialect-lists-nadi", "title": "Dialect word lists checked against NADI", "status": "ready", "summary": "How the regional lists were measured and what was removed.", "html": "<p>The Yemeni and Sudanese marker lists, and the general list that tells dialect from standard Arabic, were checked on tweets labelled by country in the NADI shared tasks (2020, 2021 and 2023; 58,768 tweets) and on sentences scored for level of dialectness (ALDi, 0 = standard Arabic, 1 = strongly dialectal).<\/p>\n<p>A regional word was removed when, in 10 or more labelled tweets, fewer than half came from its region. A general dialect word was removed when the sentences it occurs in were, on average, close to standard Arabic (ALDi below 0.35). Words were chosen on the 2020 and 2021 tweets; the numbers below are on the 2023 tweets, which were not used to choose.<\/p>\n<div class='tw'><table><thead><tr><th>List<\/th><th>Precision before<\/th><th>Precision after<\/th><th>Recall before<\/th><th>Recall after<\/th><\/tr><\/thead><tbody><tr><td>Yemeni markers<\/td><td>0.08<\/td><td>0.81<\/td><td>0.18<\/td><td>0.05<\/td><\/tr><tr><td>Sudanese markers<\/td><td>0.63<\/td><td>0.93<\/td><td>0.23<\/td><td>0.19<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Removed from the Yemeni list: words used across the Gulf and elsewhere, such as بس, شي, حق, عاد, ماشي, مدري and ياسر (also a name). Removed from the Sudanese list: ياخي, شديد, ود, بت, دايرين. Removed from the general list: كيف, عاد, نحب, اختي, هادي, ياسر, درك, متين, بالحق, برك. وايد and هواي stay, but only as whole words, because with a suffix they become standard words (وأيده, هواية).<\/p>\n<p>Precision here is how often a matched tweet really comes from that region; recall is how many tweets of the region the list finds. Word lists find few tweets of a region. They show which dialect words occur; they do not identify a post's dialect. The NADI data is used under its research licence and is not part of the public dashboard.<\/p>"}, {"cat": "getting-started", "slug": "check-on-my-data", "title": "Check a result on your own data", "status": "ready", "summary": "Measure how accurate a result is on your posts, and correct label shares.", "html": "<p>Every word list and model makes mistakes, and how many depends on the posts. <b>Check on my data<\/b> (on any result whose chart opens posts) measures this on your file.<\/p>\n<ol><li>Choose what to check: one bar, word or label, or for model labels, all labels at once (equal numbers of each, so rare labels are checked too).<\/li><li>Choose how many posts. 30 posts give a range of about plus or minus 15 points; 100 posts about plus or minus 9.<\/li><li>Read each post and answer Yes, No or Unsure (for labels, pick the right label). Unsure answers are left out.<\/li><\/ol>\n<p>MARSAD then gives the <b>share right<\/b> (precision) with a 95% range (Wilson interval). For labels, it also estimates the <b>corrected share<\/b> of each label in the whole file: the share MARSAD found for each label, redistributed by what your checked posts really were, with a 95% bootstrap range. The corrected shares appear in the result's table as *corrected by your check* until you load another file. Download your answers as CSV to report them or to let a second person check the same posts.<\/p>\n<p>A share right below about 70% means the result should be reported with care, or not at all, for these posts. Report the number of posts checked and the range with the result. See also <a href=\"#\" data-doc=\"paper-2\">Pick posts to label by hand<\/a> for a full annotation round with agreement between annotators.<\/p>\n<p><b>Ranges in label tables.<\/b> Each label share also has a 95% range (low and high) for sampling error. For the quick Arabic models (sentiment and offensive language), the column *adjusted* corrects the share for the model's known precision and recall on test data. This assumes your posts are like the test data; your own check is better.<\/p>"}, {"cat": "getting-started", "slug": "prepare-posts", "title": "Prepare posts: samples, account limits and periods", "status": "ready", "summary": "Work on a sample, limit very active accounts, or compare two periods.", "html": "<p><b>Prepare posts<\/b> on the Overview page changes which posts every analysis uses. It always starts from all loaded posts, so you can change or clear the options at any time (Use all posts).<\/p>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>What it does<\/th><th>When to use it<\/th><\/tr><\/thead><tbody><tr><td>Random sample<\/td><td>Keeps this many posts, chosen at random with the seed<\/td><td>Files over about 100,000 posts, which are slow in a browser. Shares and rankings stay close to the whole file; counts do not, so report shares<\/td><\/tr><tr><td>At most N posts per account<\/td><td>Keeps at most N posts of each account, chosen at random<\/td><td>To see whether a result is driven by a few very active accounts. If a share changes a lot with N = 5, report both<\/td><\/tr><tr><td>Split at a date<\/td><td>Posts before the day and from the day on become two groups, compared like two files<\/td><td>Before and after an event. Then use Test the difference on any result<\/td><\/tr><tr><td>Seed<\/td><td>The same seed gives the same sample again<\/td><td>So others can repeat your work. Report it<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The notes at the top of the Overview say which options are on. They are also saved in a project and listed in a draft report.<\/p>"}, {"cat": "getting-started", "slug": "test-difference", "title": "Test a difference between files or periods", "status": "ready", "summary": "Is a difference real, and is it large enough to matter?", "html": "<p>When two files are compared, or the posts are split at a date, results that open posts have a <b>Test the difference<\/b> button. For every part of the result (each label, word, account or topic) it gives:<\/p>\n<div class='tw'><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Share in each group<\/td><td>The share of the group's posts in that part. Shares, not counts, so groups of different sizes stay comparable<\/td><\/tr><tr><td>Difference<\/td><td>Second group minus first, in percentage points, with a 95% range<\/td><\/tr><tr><td>p (corrected)<\/td><td>Two-proportion test, corrected for testing many parts at once (Holm). Below 0.05: unlikely to be chance alone<\/td><\/tr><tr><td>Effect size<\/td><td>Cohen's h: under 0.2 very small, 0.2 small, 0.5 medium, 0.8 large<\/td><\/tr><tr><td>Clear difference<\/td><td>Yes when the corrected p is below 0.05 and h is at least 0.2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>With large files almost any difference has a tiny p, which is why the effect size is needed too. The test treats posts as independent; many posts from a few accounts make p look smaller than it should, so repeat the test with *at most N posts per account* (Prepare posts). Engagement numbers are not tested here, since platforms count them differently.<\/p>"}, {"cat": "getting-started", "slug": "projects-drafts", "title": "Projects and draft reports", "status": "ready", "summary": "Continue later, and get a written draft from your results.", "html": "<p><b>Save project<\/b> (Overview or My report) saves one .marsad.json file with your settings, Prepare posts options, analysis options, My report list, your checks on your data and your notes. Small files (up to 25 MB) can be saved inside the project; anyone you send it to can then read every post. <b>Open a saved project<\/b> on the Your files page restores everything; a project saved without data asks you to add the same files first.<\/p>\n<p><b>Write a draft report<\/b> (My report, or a study page) writes a document from your results: the data (posts, accounts, dates, platforms, languages, options used and the notes to read first), then for each analysis its key numbers, top table rows, its limits and your check if you made one, then the method of each analysis and the sources named in the methods. It uses the analyses in My report, or a core set when the report is empty. Download it as a web page or as Markdown.<\/p>\n<p>When MARSAD is opened in Claude, <b>Add paragraphs by Claude<\/b> writes a short paragraph for each finding from the same numbers. Claude is told to use only those numbers; a paragraph that contains any number not in that finding's results is left out. Read every paragraph against the numbers below it before using it. The draft is a starting point: the interpretation is yours.<\/p>"}, {"cat": "getting-started", "slug": "filters-and-views", "title": "Filters, views and chart tools", "status": "ready", "summary": "Filter every result, read its base, and use the chart and post tools.", "html": "<p><b>Filters.<\/b> The bar at the top of every page filters the posts by dates, platform, language, dialect (when the file has dialect labels), file, a minimum engagement, and whether the post carries a link. Choose *More filters* or any chip to change them, and *Reset* to bring all posts back. While filters are on, the bar says how many posts are used, and every analysis, chart, table, download, chat answer and draft report uses only those posts. Filters work together with Prepare posts (sample, limit per account, split by date): filters are applied first.<\/p>\n<p><b>Based on N of M posts.<\/b> Under each result. M is the number of posts in use; N is the number this result could use, for example posts with a date for activity over time, posts with an account for account analyses, or Arabic posts with text for the quick Arabic models. Report N with the result.<\/p>\n<p><b>Show %.<\/b> For charts that count posts, shows each bar as a share of the N posts the result is based on.<\/p>\n<p><b>Show top.<\/b> For analyses that list words, accounts, names or topics: how many to show.<\/p>\n<p><b>More.<\/b> Full screen chart; sort bars by value (and back); copy key numbers (title, N of M, key numbers and the main notes, ready to paste); report a problem (a prefilled message with the analysis, options and data size, never your posts; on GitHub Pages it opens an issue).<\/p>\n<p><b>Post lists.<\/b> Posts behind a bar, point or row can be ordered by engagement, at random, newest or oldest. The most engaged posts are not typical: use Random to see typical ones. *Download all* saves every matching post as CSV.<\/p>\n<p><b>Search the posts<\/b> on the Overview finds posts with a word or phrase. Spelling variants of Arabic letters count as the same word.<\/p>\n<p><b>Simple view.<\/b> Section pages show only analyses that can run on your file. *Show all* lists every analysis, with the reason the others cannot run.<\/p>"}, {"cat": "getting-started", "slug": "investigations", "title": "Investigating campaigns, bots and misinformation", "status": "ready", "summary": "How to use the checks for campaigns, bots and misinformation, and what they cannot show.", "html": "<p>MARSAD has no button that says \"this is a bot\" or \"this is fake\", and it will not get one. What it has is a set of checks that narrow thousands of posts down to the handful you should read yourself.<\/p>\n<p><b>Where to start.<\/b> On the Overview, pick the study *Who is pushing this, and is it organic?* or *Is a false or unverified claim spreading?*. Each one is an ordered set of analyses with a note on what to report.<\/p>\n<div class='tw'><table><thead><tr><th>Question<\/th><th>Analysis<\/th><\/tr><\/thead><tbody><tr><td>Where did it start and who carried it?<\/td><td><a href=\"#\" data-doc=\"spread-10\">Who spread it first<\/a><\/td><\/tr><tr><td>Is the same wording being copied?<\/td><td><a href=\"#\" data-doc=\"data-4\">Duplicates<\/a>, then <a href=\"#\" data-doc=\"spread-1\">Repeated claims<\/a><\/td><\/tr><tr><td>Do accounts post the same thing at the same moment?<\/td><td><a href=\"#\" data-doc=\"spread-3\">Accounts posting together<\/a>, then <a href=\"#\" data-doc=\"spread-12\">Timing and similarity between accounts<\/a> for the gaps pair by pair<\/td><\/tr><tr><td>How far did one message actually travel?<\/td><td><a href=\"#\" data-doc=\"spread-13\">How far a message travelled<\/a><\/td><\/tr><tr><td>When did the conversation change, if nobody tells me when to look?<\/td><td><a href=\"#\" data-doc=\"time-6\">Where the series changed<\/a><\/td><\/tr><tr><td>What locations does this file carry, and can I trust them?<\/td><td><a href=\"#\" data-doc=\"who-9\">Where posts say they are from<\/a><\/td><\/tr><tr><td>Which accounts behave oddly?<\/td><td><a href=\"#\" data-doc=\"who-5\">Account checks<\/a><\/td><\/tr><tr><td>What is behind the links?<\/td><td><a href=\"#\" data-doc=\"spread-11\">Link and source checks<\/a> and <a href=\"#\" data-doc=\"spread-2\">Websites people linked to<\/a><\/td><\/tr><tr><td>What kind of persuasion is in the wording?<\/td><td><a href=\"#\" data-doc=\"frame-20\">Propaganda techniques<\/a><\/td><\/tr><tr><td>Who talks to whom?<\/td><td><a href=\"#\" data-doc=\"who-4\">Who talks to whom?<\/a><\/td><\/tr><tr><td>Is the conversation a few voices?<\/td><td><a href=\"#\" data-doc=\"who-2\">Few voices or many?<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Account checks (WHO-5)<\/b> runs nine checks on every account: posts very often; near-constant gaps between posts; posts around the clock; posts in bursts (5+ in one minute); repeats its own wording; posts wording other accounts also post; almost only links; a name ending in four or more digits; active only in a short window. Every threshold is listed in the card's checks table. Accounts that trip three or more are the shortlist to read, not a list of bots.<\/p>\n<p><b>What MARSAD cannot see.<\/b> Exports almost never carry the account's creation date, its followers, its profile text or its location, and MARSAD never opens a link or visits a profile. So the features real bot research uses are missing, and published bot scores are in any case unstable across languages and over time. Treat every number here as a pointer to posts you then read.<\/p>\n<p><b>Propaganda techniques (FRAME-20)<\/b> counts the wording of eleven techniques from the SemEval and WANLP taxonomies, using word lists and two shape rules. It runs in the browser, unlike FRAME-13, which needs a connected model. The lists are new MARSAD seed lists, not checked against posts coded by people, and a post that criticises propaganda uses the same words as a post that spreads it.<\/p>\n<p><b>Before you publish.<\/b><\/p>\n<ol><li>Read the posts behind every number you intend to use. Each chart opens them.<\/li><li>Check a sample by hand with *Check on my data* and report the share right with its range.<\/li><li>Say what the collection covers. \"First\" means first in your file; a search-based collection misses posts that used other words, and an account's other posts are not in it.<\/li><li>Keep signals and conclusions apart in the text. Coordination signals are not proof of a paid campaign, repetition is not proof of automation, and a lookalike domain is not proof of deception.<\/li><li>Name an account in print only on evidence you have read yourself, and think about the risk to the person behind it. An ordinary person wrongly named as a bot or a troll can be harmed by the story.<\/li><\/ol>"}, {"cat": "getting-started", "slug": "customize", "title": "Customize: what you see, and where you were", "status": "ready", "summary": "Pick the analyses you want to see, pin the ones you use, and pick up where you left off.", "html": "<p><b>Customize<\/b> (Overview, or the link under any section list) decides which analyses appear. It changes what is shown, not what is calculated: nothing runs until you open an analysis.<\/p>\n<div class='tw'><table><thead><tr><th>Control<\/th><th>What it does<\/th><\/tr><\/thead><tbody><tr><td>Start from a set<\/td><td>Basic, Narrative, Audience, Advanced, Investigation, Society and the other sets, or All analyses<\/td><\/tr><tr><td>The tick list<\/td><td>Switch single analyses off or on inside that set<\/td><\/tr><tr><td>Show everything<\/td><td>Back to all analyses, with nothing hidden<\/td><\/tr><tr><td>☆ on a card<\/td><td>Pins it to the menu under *Pinned*, up to eight<\/td><\/tr><tr><td>Simple or full view<\/td><td>Separate from Customize: simple view hides the analyses that cannot run on the file you loaded<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Your choice is kept on this device and saved inside a project file, so a colleague who opens your project sees the same set. *Where you were* on the Overview lists the analyses you opened last, and MARSAD reopens the page you left (not an analysis page: the file is gone after a reload).<\/p>\n<p><b>Why there is no \"run only these analyses\" setting.<\/b> MARSAD already works that way: an analysis runs when you open it, and the Overview runs five quick ones to fill the first page. There is nothing to switch off to save time.<\/p>"}, {"cat": "getting-started", "slug": "accessibility", "title": "Accessibility", "status": "ready", "summary": "Keyboard, screen reader, contrast, small screens: what works and how it was checked.", "html": "<p>MARSAD Analytics is built to work with a keyboard, a screen reader, larger text and small screens.<\/p>\n<div class='tw'><table><thead><tr><th>What<\/th><th>How<\/th><\/tr><\/thead><tbody><tr><td>Keyboard<\/td><td>Every button, tile, chip and table row can be reached with Tab and used with Enter. *Skip to content* is the first stop. Open windows keep focus inside until closed (Esc closes them) and return focus to the button that opened them<\/td><\/tr><tr><td>Screen readers<\/td><td>Buttons and fields have names; tabs say which view is selected; the busy message is announced; the chat panel is hidden from screen readers when closed<\/td><\/tr><tr><td>Charts<\/td><td>Each chart is labelled with its title. The *Table* view gives the same numbers as a table, and each row opens its posts, so nothing depends on seeing or clicking the chart<\/td><\/tr><tr><td>Colour<\/td><td>Text meets the WCAG AA contrast ratio. Labels are always written, never shown by colour alone<\/td><\/tr><tr><td>Text size and small screens<\/td><td>*A+ Larger text* at the top; the layout works from 320 px wide and at 200% zoom<\/td><\/tr><tr><td>Motion<\/td><td>Spinners and transitions stop when the system asks for reduced motion<\/td><\/tr><tr><td>Arabic<\/td><td>The العربية button sets the page language and right-to-left layout for screen readers<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>How it was checked.<\/b> axe-core 4 (rules for WCAG 2.0, 2.1 and 2.2 A and AA, and best practice) on nine views: the start page, Overview, an analysis page with its chart and its table, the check window, the filter window, the chat, the Help center and an Arabic section page: no violations. Keyboard order, the focus trap in windows and the 320 px layout were checked in Chrome.<\/p>\n<p><b>Known limits.<\/b> Automatic checks find about a third to a half of accessibility problems; MARSAD has not yet been tested by screen reader users. Points inside charts (Plotly) cannot be reached one by one with the keyboard: use the Table view. Posts in the files keep whatever language and direction they were written in. Report problems with *More, Report a problem* on any result.<\/p>"}, {"cat": "getting-started", "slug": "ask-marsad", "title": "Ask MARSAD: questions in plain words", "status": "ready", "summary": "Ask questions about your results in plain words.", "html": "<p><b>Ask MARSAD<\/b> (the orange button at the top) answers questions about your file in Arabic or English, such as \"Who are the most active accounts?\", \"Why was there a spike on 15 February?\" or \"ما هي المشاعر تجاه ترامب؟\".<\/p>\n<p>There are two modes.<\/p>\n<p><b>Written answers (when MARSAD is opened in Claude).<\/b> Claude reads MARSAD's own results: it looks up the file summary, picks and runs the analyses that answer the question, reads their key numbers, tables and caveats, quotes up to 8 posts when useful, and checks the Help center. Each answer names the analyses it used, so you can open them and check. Claude is told to use only numbers from these results and to give the main caveat. Your question, the results it looks up and the quoted posts are sent to Claude; your file itself is not uploaded. Analyses that need a GPU model are not run from the chat.<\/p>\n<p><b>Simple answers (everywhere else, for example on GitHub Pages).<\/b> Ask MARSAD matches your question to the analyses that answer it and shows their key numbers when they have been run, with a link to open each.<\/p>\n<p>Chat answers can be wrong. Before you quote a number, open the analysis it came from.<\/p>"}, {"cat": "word-lists", "slug": "word-models", "title": "Arabic word models and named entities", "status": "ready", "summary": "Sentiment, emotions, offensive language and names: training, tests and limits.", "html": "<p>Seven analyses run in the browser on Arabic posts without a large language model. Each was trained on public labelled Arabic data and tested on data it did not see. Use them for trends and comparisons; check a sample of posts before reporting a number.<\/p>\n<div class='tw'><table><thead><tr><th>Analysis<\/th><th>Trained on<\/th><th>Tested on<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#\" data-doc=\"frame-15\">Sentiment (quick, Arabic)<\/a><\/td><td>ArSarcasm-v2 and Mawqif v2 tweets, with AraSenti, NileULex and NRC word lists<\/td><td>ArSarcasm-v2 test (3,000) and Mawqif dev<\/td><td>Macro F1 0.54 and 0.63; always answering negative gives 0.24<\/td><\/tr><tr><td><a href=\"#\" data-doc=\"frame-16\">Emotions (quick, Arabic)<\/a><\/td><td>70% of ExaAEC (ten labels)<\/td><td>the other 30%<\/td><td>Macro F1 0.45; best for acceptance, neutral and fear, weakest for anger and joy<\/td><\/tr><tr><td><a href=\"#\" data-doc=\"frame-17\">Offensive language (quick, Arabic)<\/a><\/td><td>80% of 14 offensive-language datasets<\/td><td>the other 20%; each dataset held out in turn<\/td><td>Macro F1 0.75; 0.70 on average for a dataset it did not see (0.43 to 0.90)<\/td><\/tr><tr><td><a href=\"#\" data-doc=\"frame-21\">Sarcasm (quick, Arabic)<\/a><\/td><td>ArSarcasm-v2 train (12,548 tweets)<\/td><td>ArSarcasm-v2 test (3,000)<\/td><td>Macro F1 0.64; always answering not sarcastic gives 0.42. Experimental<\/td><\/tr><tr><td><a href=\"#\" data-doc=\"frame-22\">Hate speech (quick, Arabic)<\/a><\/td><td>80% of L-HSAB, T-HSAB and MLMA Arabic<\/td><td>the other 20%; each dataset held out in turn<\/td><td>Macro F1 0.68; 0.56 to 0.62 on a dataset it did not see. Experimental<\/td><\/tr><tr><td><a href=\"#\" data-doc=\"data-3\">Languages and dialects<\/a><\/td><td>ArSarcasm-v2 dialect labels and 70% of the QADI test set<\/td><td>ArSarcasm-v2 test and the other 30% of QADI<\/td><td>Macro F1 0.61 on the 31% of posts it is sure of, 0.41 on all. Experimental<\/td><\/tr><tr><td><a href=\"#\" data-doc=\"words-10\">Named people and places<\/a><\/td><td>Names in WojoodFine (70% split)<\/td><td>the 20% split<\/td><td>Precision 0.71, recall 0.79; organizations and events best, places and buildings weakest<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Where each model goes wrong<\/h2>\n<p>Each table counts test posts the model did not see during training. Rows are the label people gave, columns the label the model gave, so the diagonal is where they agree. <code>research_tools/evaluate_word_models.py<\/code> rebuilds these tables from the published test sets; the same numbers are stored in each model's file.<\/p>\n<p><b>Sentiment<\/b>, on the ArSarcasm-v2 test set (3,000 tweets). Most mistakes are between negative and neutral. Neutral is the weak label: of 748 neutral tweets, 291 were called neutral.<\/p>\n<div class='tw'><table><thead><tr><th>True label<\/th><th>negative<\/th><th>neutral<\/th><th>positive<\/th><\/tr><\/thead><tbody><tr><td>negative<\/td><td>1,124<\/td><td>304<\/td><td>249<\/td><\/tr><tr><td>neutral<\/td><td>291<\/td><td>291<\/td><td>166<\/td><\/tr><tr><td>positive<\/td><td>121<\/td><td>120<\/td><td>334<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Sarcasm<\/b>, on the same 3,000 tweets. It misses most sarcasm: 487 of the 821 sarcastic tweets were called not sarcastic.<\/p>\n<div class='tw'><table><thead><tr><th>True label<\/th><th>not sarcastic<\/th><th>sarcastic<\/th><\/tr><\/thead><tbody><tr><td>not sarcastic<\/td><td>1,872<\/td><td>307<\/td><\/tr><tr><td>sarcastic<\/td><td>487<\/td><td>334<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Hate speech<\/b>, on a random 20% of L-HSAB, T-HSAB and MLMA Arabic (3,014 posts). Of the 604 posts it called hate, 354 were not hate. Hate is 15% of this test set; in a file where hate is rarer, the share of wrong flags will be higher.<\/p>\n<div class='tw'><table><thead><tr><th>True label<\/th><th>not hate<\/th><th>hate<\/th><\/tr><\/thead><tbody><tr><td>not hate<\/td><td>2,202<\/td><td>354<\/td><\/tr><tr><td>hate<\/td><td>208<\/td><td>250<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Dialect region<\/b>, on the ArSarcasm-v2 test dialect labels (3,000 tweets) and 30% of the QADI test set (1,051 tweets). Most mistakes are tweets labelled standard Arabic that the model gave a dialect, Egypt-Sudan or Gulf above all. ArSarcasm-v2 labels a whole tweet standard Arabic even when it has a few dialect words, so part of this is the test labels. The second table keeps only the posts Studio counts, those with a score of at least 0.4 (1,242 of 4,051).<\/p>\n<div class='tw'><table><thead><tr><th>True label<\/th><th>Egypt-Sudan<\/th><th>Gulf<\/th><th>Iraq<\/th><th>Levant<\/th><th>MSA<\/th><th>Maghreb<\/th><th>Yemen<\/th><\/tr><\/thead><tbody><tr><td>Egypt-Sudan<\/td><td>283<\/td><td>26<\/td><td>6<\/td><td>23<\/td><td>45<\/td><td>28<\/td><td>12<\/td><\/tr><tr><td>Gulf<\/td><td>45<\/td><td>304<\/td><td>21<\/td><td>78<\/td><td>100<\/td><td>65<\/td><td>49<\/td><\/tr><tr><td>Iraq<\/td><td>0<\/td><td>19<\/td><td>16<\/td><td>7<\/td><td>1<\/td><td>9<\/td><td>1<\/td><\/tr><tr><td>Levant<\/td><td>19<\/td><td>28<\/td><td>8<\/td><td>152<\/td><td>12<\/td><td>32<\/td><td>18<\/td><\/tr><tr><td>MSA<\/td><td>488<\/td><td>311<\/td><td>15<\/td><td>193<\/td><td>1,295<\/td><td>65<\/td><td>16<\/td><\/tr><tr><td>Maghreb<\/td><td>21<\/td><td>22<\/td><td>3<\/td><td>11<\/td><td>22<\/td><td>120<\/td><td>4<\/td><\/tr><tr><td>Yemen<\/td><td>8<\/td><td>17<\/td><td>0<\/td><td>6<\/td><td>3<\/td><td>9<\/td><td>15<\/td><\/tr><\/tbody><\/table><\/div>\n<div class='tw'><table><thead><tr><th>True label<\/th><th>Egypt-Sudan<\/th><th>Gulf<\/th><th>Iraq<\/th><th>Levant<\/th><th>MSA<\/th><th>Maghreb<\/th><th>Yemen<\/th><\/tr><\/thead><tbody><tr><td>Egypt-Sudan<\/td><td>158<\/td><td>2<\/td><td>0<\/td><td>4<\/td><td>15<\/td><td>5<\/td><td>2<\/td><\/tr><tr><td>Gulf<\/td><td>2<\/td><td>66<\/td><td>3<\/td><td>4<\/td><td>9<\/td><td>15<\/td><td>12<\/td><\/tr><tr><td>Iraq<\/td><td>0<\/td><td>2<\/td><td>9<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>Levant<\/td><td>1<\/td><td>0<\/td><td>2<\/td><td>72<\/td><td>0<\/td><td>9<\/td><td>5<\/td><\/tr><tr><td>MSA<\/td><td>180<\/td><td>36<\/td><td>5<\/td><td>35<\/td><td>493<\/td><td>5<\/td><td>2<\/td><\/tr><tr><td>Maghreb<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>72<\/td><td>1<\/td><\/tr><tr><td>Yemen<\/td><td>1<\/td><td>4<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>2<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Emotions<\/b>, on the 30% of ExaAEC left out of training (6,015 tweets). A tweet can carry two emotions, so each emotion is counted on its own, at a probability of 0.5. Studio shows only each post's most likely emotion, and that is one of the tweet's own emotions 51% of the time.<\/p>\n<div class='tw'><table><thead><tr><th>Emotion<\/th><th>Given and right<\/th><th>Given but wrong<\/th><th>Missed<\/th><\/tr><\/thead><tbody><tr><td>anger<\/td><td>158<\/td><td>556<\/td><td>303<\/td><\/tr><tr><td>anticipation<\/td><td>328<\/td><td>700<\/td><td>309<\/td><\/tr><tr><td>disgust<\/td><td>637<\/td><td>918<\/td><td>615<\/td><\/tr><tr><td>fear<\/td><td>101<\/td><td>94<\/td><td>71<\/td><\/tr><tr><td>joy<\/td><td>119<\/td><td>359<\/td><td>201<\/td><\/tr><tr><td>love<\/td><td>245<\/td><td>366<\/td><td>143<\/td><\/tr><tr><td>sadness<\/td><td>612<\/td><td>851<\/td><td>489<\/td><\/tr><tr><td>surprise<\/td><td>277<\/td><td>565<\/td><td>277<\/td><\/tr><tr><td>acceptance<\/td><td>1,135<\/td><td>921<\/td><td>768<\/td><\/tr><tr><td>neutral<\/td><td>772<\/td><td>823<\/td><td>371<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Offensive language<\/b> has no table yet: its 14 source datasets were not at hand when these tables were made.<\/p>\n<p><b>What was tried and left out.<\/b> The NRC Emotion Lexicon's Arabic words, used alone, found emotions barely above chance on ExaAEC (for joy, 10% of matched tweets had joy, against 12% of all tweets), so NRC is used only as positive and negative features inside the sentiment model. AraSenti used alone scored macro F1 0.38. A sarcasm model trained on ArSarcasm-v2 did not carry over to Mawqif (macro F1 0.49), so MARSAD keeps its sarcasm word list instead; on ArSarcasm-v2, 62% of posts it matches are sarcastic, against 27% of all test tweets.<\/p>\n<p><b>Offensive language and group names.<\/b> The first offensive model flagged neutral news that named a country or a group, because one large training set is mostly offensive political comments. The model now weights every dataset equally and does not use names or religious, ethnic and national group words. Neutral news about elections now gets a low score (Trump 0.05, Iran 0.31), but a neutral sentence naming a group can still score high (0.75 for a sentence about Jews celebrating a holiday). Read flagged posts before reporting.<\/p>\n<p><b>Names are not features.<\/b> The sentiment and offensive models ignore single-word names (people, places, organizations) and group words. Otherwise a name common in negative training tweets would make any post naming it negative (\"ترامب رئيس رائع\" was labelled negative before this change, positive after), and the analyses of sentiment and offensive language by name (WORDS-11, FRAME-18) would only repeat the training data.<\/p>\n<p><b>Stopwords.<\/b> The Arabic stopword list grew from 818 to about 5,360 forms with the function words of Arabic Stopwords 0.9 (Zerrouki) and their attached forms. Forms that collide with content words after hamza normalization (أمن, ألم, أهم) and words such as ابن, فهم and عين were left out.<\/p>\n<p>Sources: ArSarcasm-v2 (Abu Farha, Zaghouani and Magdy, 2021); Mawqif v2 / StanceEval; AraSenti (Al-Twairesh, Al-Khalifa and Al-Salman, 2016); NileULex (El-Beltagy, 2016); NRC Emotion Lexicon (Mohammad and Turney, 2013); ExaAEC (Sarbazi-Azad, Akbari and Khazeni, 2021); Arabic offensive language taxonomy and data (Liebeskind, Afawi, Litvak and Vanetik, 2024) and its 14 source datasets; Wojood and WojoodFine (Jarrar et al.; SinaLab, Birzeit University); Arabic Stopwords (Zerrouki). Used with authorization for research.<\/p>"}, {"cat": "word-lists", "slug": "dialect-resources", "title": "Dialect research resources", "status": "ready", "summary": "MADAR, NileULex and NADI: what is used, how well it works, licences.", "html": "<p>Three analyses use published Arabic dialect resources. They are used with the authors' authorization for research.<\/p>\n<div class='tw'><table><thead><tr><th>Resource<\/th><th>What MARSAD uses<\/th><th>Analyses<\/th><\/tr><\/thead><tbody><tr><td>MADAR Lexicon (Bouamor et al., 2018; CMU and NYU Abu Dhabi)<\/td><td>Seven regional word lists built from its 25 city dialects<\/td><td><a href=\"#\" data-doc=\"dialect-1\">Regional dialect words<\/a><\/td><\/tr><tr><td>NileULex v0.27 (El-Beltagy, 2016)<\/td><td>Egyptian and standard Arabic positive and negative words<\/td><td><a href=\"#\" data-doc=\"dialect-2\">Positive and negative words<\/a>, <a href=\"#\" data-doc=\"dialect-3\">Word lists by dialect<\/a><\/td><\/tr><tr><td>NADI 2024 (Abdul-Mageed et al., 2024)<\/td><td>Labelled tweets and dialectness scores, used to check and clean the regional lists<\/td><td><a href=\"#\" data-doc=\"dialect-lists-nadi\">Dialect word lists checked against NADI<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p>How well the MADAR lists work, on labelled NADI tweets not used to build them (precision = how often a matched tweet comes from that region): Levantine and Maghrebi 0.86, Sudanese 0.80, Gulf 0.61, Iraqi 0.49, Egyptian 0.47, Yemeni 0.19. The lists find only a small share of each region's tweets. Read the results as which dialect words occur, not as the dialect of the posts.<\/p>\n<p>Two more checks. In the Shami corpus (66,000 Levantine sentences), the Levantine lists match 7.5% (MADAR) and 19% (MARSAD seed list) of sentences, and every other region's list matches 1.8% or less. On ArSarcasm-v2 (15,500 tweets labelled MSA, Egyptian, Gulf, Levantine or Maghrebi), precision is lower because 70% of tweets are labelled standard Arabic as a whole even when they contain a dialect word.<\/p>\n<p>Licence notices: MADAR Corpus and Lexicon, Copyright (c) 2018-2022 Carnegie Mellon University and New York University Abu Dhabi, all rights reserved; licensed for research and evaluation. NileULex can be used freely for research; for commercial use, written approval from Samhaa R. El-Beltagy is required. NADI data: CC BY-NC-ND 4.0.<\/p>"}, {"cat": "about", "slug": "accuracy-fixes-v15", "title": "Accuracy fixes in v1.5", "status": "ready", "summary": "What an independent audit found and what changed.", "html": "<p>An independent audit on 6 November 2026 tested MARSAD with small inputs whose answers are known. It confirmed the main totals on the practice files (posts, interactions, reaction shares, Gini, HHI) and found the errors below. All are fixed in v1.5, and each audit case is now an automatic test with the exact expected value.<\/p>\n<h2>Post ids, repeats and merging<\/h2>\n<div class='tw'><table><thead><tr><th>Problem<\/th><th>Now<\/th><\/tr><\/thead><tbody><tr><td>Two posts from different platforms with the same id (an X post 123 and a Reddit post 123) were merged into one when files were combined<\/td><td>A post is a repeat only on the same platform with the same id. X and Twitter count as one platform<\/td><\/tr><tr><td>In Meltwater files, an empty Tweet Id column replaced the Document ID, so many posts shared the id \"None\"<\/td><td>Tweet Id is used where present, else Document ID. A missing id stays missing<\/td><\/tr><tr><td>Posts without an id got an id that included the row number, so the same post in two files, or twice in one file, was counted twice<\/td><td>Such posts get an id from the post's own link when it has one, else from platform, account, time and text<\/td><\/tr><tr><td>No record of what combining removed<\/td><td>The overview shows rows in, repeats removed and posts kept; the list of removed posts is kept with the data<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Engagement<\/h2>\n<div class='tw'><table><thead><tr><th>Problem<\/th><th>Now<\/th><\/tr><\/thead><tbody><tr><td>Meta: when reaction_count was empty on some rows, those rows lost their likes and reactions (15 instead of 135)<\/td><td>On each row, reaction_count is used where given, else the sum of the reaction types on that row<\/td><\/tr><tr><td>Meltwater and CrowdTangle: an empty Engagement or Total Interactions cell left the post with no interactions<\/td><td>On each row, the sum of likes, replies and reposts is used where the total is missing<\/td><\/tr><tr><td>Reach used as engagement was flagged only on each card<\/td><td>The overview now shows a warning panel: reach is not engagement, Reddit score is not likes<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Calculations<\/h2>\n<div class='tw'><table><thead><tr><th>Analysis<\/th><th>Problem<\/th><th>Now<\/th><\/tr><\/thead><tbody><tr><td>Event window<\/td><td>Days without posts were left out, so 10 posts on one day of 7 gave 10 a day instead of 1.43<\/td><td>Every calendar day counts, 0 if it had no posts<\/td><\/tr><tr><td>Spikes<\/td><td>On a flat baseline (most days equal) no day could be a spike<\/td><td>A fallback scale is used; 30 posts against 1 is a spike, 2 against 1 is not<\/td><\/tr><tr><td>Views<\/td><td>Interactions from posts with no views were divided by views of other posts<\/td><td>Both sums use the same posts<\/td><\/tr><tr><td>Engagement rate<\/td><td>One empty followers cell made the rate use page likes for nobody<\/td><td>Followers where given, else page likes, per post<\/td><\/tr><tr><td>Crosspost amplification<\/td><td>Posts with total views but no crosspost views were dropped<\/td><td>Crosspost views where given, else total views, per post<\/td><\/tr><tr><td>Reaction sentiment<\/td><td>The sensitivity check scored posts from before reactions existed (2016)<\/td><td>It uses the same posts as the main score<\/td><\/tr><tr><td>Video performance<\/td><td>A file whose videos were all in one length group gave an error<\/td><td>It shows the length distribution instead<\/td><\/tr><tr><td>Posting rhythm<\/td><td>Hours without posts showed as blank<\/td><td>They show 0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Follow-up audit (same day)<\/h2>\n<p>A second check of v1.5 found three more problems, now fixed and tested:<\/p>\n<div class='tw'><table><thead><tr><th>Problem<\/th><th>Now<\/th><\/tr><\/thead><tbody><tr><td>Two files with no platform column and the same post id were merged even when the posts were different<\/td><td>Without a known platform, the same id counts as the same post only if the account and text also match<\/td><\/tr><tr><td>A Meta file with comments and shares but no reaction columns got no interactions<\/td><td>Interactions are comments plus shares, and the overview says reactions were missing<\/td><\/tr><tr><td>The same post id twice in one file (the post collected twice, with different counts) counted as two posts<\/td><td>One row per post is kept: the newest collection time if the file has one, else the highest engagement. The overview says how many rows were merged<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Third check (same day)<\/h2>\n<p>Two more cases were found where files with no platform column could lose a post. Both are fixed:<\/p>\n<div class='tw'><table><thead><tr><th>Problem<\/th><th>Now<\/th><\/tr><\/thead><tbody><tr><td>In one file with no platform column, two different posts (different accounts and text) with the same id were merged<\/td><td>Without a platform, rows merge only when id, account, text and time all agree; only the counts may differ<\/td><\/tr><tr><td>Across files with no platform, the same id, account and text on different dates were merged<\/td><td>The publication time is now part of the match<\/td><\/tr><\/tbody><\/table><\/div>\n<p>When posts share an id but are kept apart this way, the overview says how many, so you can add a platform column if they are in fact copies.<\/p>\n<h2>What the audit did not cover<\/h2>\n<p>The audit, like these fixes, checks that numbers are computed correctly. It does not show that a word list, a reaction score or a model measures what its name says. That needs a labelled sample: see <a href=\"#\" data-doc=\"checking-word-lists\">Checking a word list<\/a>. The model-based analyses (sentiment, emotion, toxicity, hate speech, dialect) were not tested against labelled data.<\/p>"}, {"cat": "word-lists", "slug": "society-word-lists", "title": "The Society word lists", "status": "ready", "summary": "Every list, its size and its rules.", "html": "<p>The Society analyses use these lists. Lists written for v1.4 are version 0.2 and not yet validated, so their results are exploratory. The full list of terms is in marsad_lexicons_society_v0.2.csv.<\/p>\n<div class='tw'><table><thead><tr><th>Analysis<\/th><th>List<\/th><th>Arabic terms<\/th><th>English terms<\/th><th>Negation rule<\/th><\/tr><\/thead><tbody><tr><td>Distress and resilience<\/td><td>Trauma and fear<\/td><td>50<\/td><td>27<\/td><td><\/td><\/tr><tr><td>Distress and resilience<\/td><td>Exhaustion<\/td><td>53<\/td><td>22<\/td><td><\/td><\/tr><tr><td>Distress and resilience<\/td><td>Shared grief<\/td><td>23<\/td><td>14<\/td><td><\/td><\/tr><tr><td>Distress and resilience<\/td><td>Steadfastness<\/td><td>26<\/td><td>10<\/td><td>yes<\/td><\/tr><tr><td>Distress and resilience<\/td><td>Hope and resilience<\/td><td>30<\/td><td>23<\/td><td>yes<\/td><\/tr><tr><td>Economic concern<\/td><td>Economic worries<\/td><td>54<\/td><td>25<\/td><td><\/td><\/tr><tr><td>Economic concern<\/td><td>Economic justice<\/td><td>26<\/td><td>19<\/td><td><\/td><\/tr><tr><td>Economic concern<\/td><td>Corruption<\/td><td>45<\/td><td>19<\/td><td><\/td><\/tr><tr><td>Calls to action<\/td><td>We can do it<\/td><td>38<\/td><td>17<\/td><td>yes<\/td><\/tr><tr><td>Calls to action<\/td><td>Solutions<\/td><td>50<\/td><td>30<\/td><td><\/td><\/tr><tr><td>Calls to action<\/td><td>Share, join, act<\/td><td>55<\/td><td>24<\/td><td><\/td><\/tr><tr><td>Calls to action<\/td><td>Protest<\/td><td>36<\/td><td>15<\/td><td><\/td><\/tr><tr><td>Blame and accountability<\/td><td>Blame<\/td><td>59<\/td><td>25<\/td><td><\/td><\/tr><tr><td>Blame and accountability<\/td><td>Injustice<\/td><td>48<\/td><td>18<\/td><td><\/td><\/tr><tr><td>Blame and accountability<\/td><td>Accountability<\/td><td>26<\/td><td>22<\/td><td><\/td><\/tr><tr><td>Identity and belonging<\/td><td>Nation and homeland<\/td><td>71<\/td><td>20<\/td><td><\/td><\/tr><tr><td>Identity and belonging<\/td><td>Our people<\/td><td>46<\/td><td>22<\/td><td><\/td><\/tr><tr><td>Identity and belonging<\/td><td>We, us, our<\/td><td>30<\/td><td>9<\/td><td><\/td><\/tr><tr><td>Identity and belonging<\/td><td>Gender<\/td><td>38<\/td><td>22<\/td><td><\/td><\/tr><tr><td>Trust in institutions<\/td><td>Trust<\/td><td>70<\/td><td>40<\/td><td>yes<\/td><\/tr><tr><td>Trust in institutions<\/td><td>Distrust<\/td><td>101<\/td><td>55<\/td><td><\/td><\/tr><tr><td>Trust in institutions<\/td><td>Names an institution<\/td><td>88<\/td><td>65<\/td><td><\/td><\/tr><tr><td>Moral values<\/td><td>Care<\/td><td>67<\/td><td>41<\/td><td>yes<\/td><\/tr><tr><td>Moral values<\/td><td>Harm<\/td><td>65<\/td><td>48<\/td><td><\/td><\/tr><tr><td>Moral values<\/td><td>Fairness<\/td><td>40<\/td><td>27<\/td><td>yes<\/td><\/tr><tr><td>Moral values<\/td><td>Cheating or injustice<\/td><td>66<\/td><td>42<\/td><td><\/td><\/tr><tr><td>Moral values<\/td><td>Loyalty<\/td><td>55<\/td><td>33<\/td><td>yes<\/td><\/tr><tr><td>Moral values<\/td><td>Betrayal<\/td><td>46<\/td><td>30<\/td><td><\/td><\/tr><tr><td>Moral values<\/td><td>Respect for authority<\/td><td>56<\/td><td>32<\/td><td><\/td><\/tr><tr><td>Moral values<\/td><td>Chaos or disrespect<\/td><td>55<\/td><td>36<\/td><td><\/td><\/tr><tr><td>Moral values<\/td><td>Sanctity<\/td><td>38<\/td><td>27<\/td><td><\/td><\/tr><tr><td>Moral values<\/td><td>Disgust or degradation<\/td><td>49<\/td><td>31<\/td><td><\/td><\/tr><tr><td>Wellbeing<\/td><td>Positive feelings<\/td><td>73<\/td><td>38<\/td><td>yes<\/td><\/tr><tr><td>Wellbeing<\/td><td>Engagement<\/td><td>47<\/td><td>31<\/td><td><\/td><\/tr><tr><td>Wellbeing<\/td><td>Relationships<\/td><td>61<\/td><td>39<\/td><td><\/td><\/tr><tr><td>Wellbeing<\/td><td>Meaning<\/td><td>43<\/td><td>31<\/td><td><\/td><\/tr><tr><td>Wellbeing<\/td><td>Accomplishment<\/td><td>49<\/td><td>30<\/td><td><\/td><\/tr><tr><td>Stress and coping<\/td><td>Stress<\/td><td>94<\/td><td>39<\/td><td>yes<\/td><\/tr><tr><td>Stress and coping<\/td><td>Coping<\/td><td>73<\/td><td>42<\/td><td><\/td><\/tr><tr><td>Stress and coping<\/td><td>Exhaustion<\/td><td>53<\/td><td>22<\/td><td><\/td><\/tr><tr><td>Certainty and self-focus<\/td><td>Certainty<\/td><td>51<\/td><td>36<\/td><td>yes<\/td><\/tr><tr><td>Certainty and self-focus<\/td><td>Doubt<\/td><td>51<\/td><td>38<\/td><td><\/td><\/tr><tr><td>Certainty and self-focus<\/td><td>I, me, my<\/td><td>27<\/td><td>10<\/td><td><\/td><\/tr><tr><td>Certainty and self-focus<\/td><td>We, us, our<\/td><td>30<\/td><td>9<\/td><td><\/td><\/tr><tr><td>Economic mood<\/td><td>Economic worries<\/td><td>54<\/td><td>25<\/td><td><\/td><\/tr><tr><td>Economic mood<\/td><td>Shortages<\/td><td>56<\/td><td>31<\/td><td><\/td><\/tr><tr><td>Economic mood<\/td><td>Good economic news<\/td><td>49<\/td><td>33<\/td><td>yes<\/td><\/tr><tr><td>Boycotts and buying calls<\/td><td>Boycott calls<\/td><td>37<\/td><td>22<\/td><td><\/td><\/tr><tr><td>Boycotts and buying calls<\/td><td>Buy local calls<\/td><td>41<\/td><td>21<\/td><td><\/td><\/tr><tr><td>Health talk<\/td><td>Asking for help<\/td><td>67<\/td><td>31<\/td><td><\/td><\/tr><tr><td>Health talk<\/td><td>Vaccines mentioned<\/td><td>32<\/td><td>27<\/td><td><\/td><\/tr><tr><td>Health talk<\/td><td>Pro-vaccine<\/td><td>29<\/td><td>21<\/td><td>yes<\/td><\/tr><tr><td>Health talk<\/td><td>Anti-vaccine<\/td><td>38<\/td><td>30<\/td><td><\/td><\/tr><tr><td>Misinformation signals<\/td><td>Conspiracy talk<\/td><td>56<\/td><td>35<\/td><td><\/td><\/tr><tr><td>Misinformation signals<\/td><td>Miracle cures<\/td><td>40<\/td><td>26<\/td><td><\/td><\/tr><tr><td>Misinformation signals<\/td><td>Propaganda accusations<\/td><td>27<\/td><td>19<\/td><td><\/td><\/tr><tr><td>Misinformation signals<\/td><td>Debunking<\/td><td>30<\/td><td>22<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Economy<\/td><td>40<\/td><td>31<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Health<\/td><td>38<\/td><td>30<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Education<\/td><td>38<\/td><td>21<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Security and war<\/td><td>43<\/td><td>33<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Environment<\/td><td>33<\/td><td>26<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Migration<\/td><td>41<\/td><td>29<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Housing<\/td><td>31<\/td><td>21<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Energy<\/td><td>26<\/td><td>19<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Rights and freedoms<\/td><td>31<\/td><td>24<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Foreign affairs<\/td><td>36<\/td><td>26<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Technology<\/td><td>37<\/td><td>27<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Food and water<\/td><td>34<\/td><td>23<\/td><td><\/td><\/tr><tr><td>Issue attention<\/td><td>Transport<\/td><td>31<\/td><td>22<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>"}, {"cat": "word-lists", "slug": "word-lists-v15", "title": "Changes to the word lists in v1.5", "status": "ready", "summary": "What was added and removed, and why.", "html": "<p>In v1.5 the older lists were reviewed for two things.<\/p>\n<p><b>Recall<\/b> (finding more of the posts that should match). Standard Arabic forms and dialect forms were added: Gulf, Egyptian, Levantine, Iraqi, Maghrebi, Sudanese and Yemeni. For example, Despair gained ما في فايدة, مفيش فايدة, ماكو فايدة and ما كاين والو; Corruption gained واسطة, كوسة, حرامية and لهفوا; Burnout gained هلكان, مهدود and عييت.<\/p>\n<p><b>Precision<\/b> (fewer posts matched by mistake). Words were removed when they mostly mean something else in real posts: نور is a common name, سلام opens greetings, تاريخ also means date, حكم is also a referee, will and march are common English words, and us matches U.S. Where the idea still matters, a phrase replaced the word: حكم المحكمة instead of حكم, سلام عادل instead of سلام, i'm done instead of done.<\/p>\n<p>Every change, with its reason, is in lexicon_expansion_v1.5.csv in the package. The lists are still not validated: check a sample of matched posts with <a href=\"#\" data-doc=\"checking-word-lists\">Checking a word list<\/a> before using counts in a paper.<\/p>\n<div class='tw'><table><thead><tr><th>List<\/th><th>Arabic terms<\/th><th>English terms<\/th><th>Added<\/th><th>Removed<\/th><\/tr><\/thead><tbody><tr><td>Arabizi<\/td><td>0<\/td><td>61<\/td><td>29<\/td><td>1<\/td><\/tr><tr><td>Archive<\/td><td>25<\/td><td>19<\/td><td>24<\/td><td>5<\/td><\/tr><tr><td>Betrayal<\/td><td>37<\/td><td>19<\/td><td>25<\/td><td>1<\/td><\/tr><tr><td>Blame<\/td><td>59<\/td><td>25<\/td><td>24<\ <tr><td>Solution<\/td><td>50<\/td><td>30<\/td><td>49<\/td><td>8<\/td><\/tr><tr><td>Strong modal<\/td><td>26<\/td><td>17<\/td><td>21<\/td><td><\/td><\/tr><tr><td>Sudanese markers<\/td><td>31<\/td><td>0<\/td><td>21<\/td><td><\/td><\/tr><tr><td>Third person<\/td><td>21<\/td><td>13<\/td><td>10<\/td><td>1<\/td><\/tr><tr><td>Threat defiance<\/td><td>39<\/td><td>16<\/td><td>29<\/td><td><\/td><\/tr><tr><td>Trauma<\/td><td>50<\/td><td>27<\/td><td>31<\/td><td><\/td><\/tr><tr><td>Trust institutions<\/td><td>70<\/td><td>40<\/td><td><\/td><td>2<\/td><\/tr><tr><td>Victim<\/td><td>75<\/td><td>33<\/td><td>48<\/td><td><\/td><\/tr><tr><td>Wb positive emotion<\/td><td>73<\/td><td>38<\/td><td><\/td><td>2<\/td><\/tr><tr><td>Weak modal<\/td><td>23<\/td><td>14<\/td><td>15<\/td><td><\/td><\/tr><tr><td>Yemeni markers<\/td><td>20<\/td><td>0<\/td><td>21<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>"}, {"cat": "an-data", "slug": "data-1", "title": "About this file", "status": "ready", "summary": "How many posts, accounts and dates the file has", "html": "<p>A summary of your file: how many posts, how many accounts, the first and last date, the platforms, and which information each post has. It also lists which analyses can run on this file.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The file is read and cleaned first: empty, deleted or withheld posts are removed and repeated rows are dropped. Then the posts, accounts and dates are counted. Each column is matched to a known type (text, date, account, likes ...).<\/p>\n<h2>Example<\/h2>\n<p>A Meltwater export of 30,000 rows becomes 28,400 posts after removing deleted and empty ones.<\/p>\n<h2>Good to know<\/h2>\n<p>If an analysis is greyed out, this card tells you which information is missing from the file.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts<\/td><td>Number of posts.<\/td><\/tr><tr><td>Packs suggested<\/td><td>Topic packs whose trigger terms appear in enough posts to be worth switching on.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Method in detail<\/h2>\n<p>Counts of posts, dates, authors and platforms after cleaning. The capability table lists which canonical fields were found; cards that need a missing field are shown as unavailable with the field named. Cleaning removes deleted, removed or withheld content, exact duplicate rows, and rows with neither text nor date.<\/p>\n<p><a href=\"#\" data-app=\"DATA-1\">Open this analysis in the dashboard<\/a><\/p>", "card": "DATA-1"}, {"cat": "an-data", "slug": "data-2", "title": "How long are the posts?", "status": "ready", "summary": "Words per post, links, hashtags and emoji", "html": "<p>How long the posts are, how many have links, hashtags, mentions or emoji, and how many words are used only once.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is split into words. Arabic spelling is made uniform first (for example all forms of alef count as one), links and @mentions are left out, and words split on purpose with dots or long dashes are joined again. Then the words in each post are counted.<\/p>\n<h2>Example<\/h2>\n<p>Posts have 18 words on average; 40 % contain a hashtag and 12 % a link.<\/p>\n<h2>Good to know<\/h2>\n<p>Very short posts (one or two words) are hard to analyse; this card shows how many there are.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Word counts need spaces between words; character counts work for any language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>mattr window<\/td><td>500<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts<\/td><td>Number of posts.<\/td><\/tr><tr><td>Words<\/td><td>Total number of words in all posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Number of posts by length in words (log scale on the count axis).<\/p>\n<h2>Method in detail<\/h2>\n<p>Tokens are letter and digit sequences after Arabic orthographic normalization (alef variants, taa marbuta, alef maqsura, hamza carriers, diacritics, tatweel, character elongation), with links and mentions removed and hashtag underscores split. Lexical diversity is the moving-average type-token ratio (MATTR) over a 500-token window, which, unlike the plain type-token ratio, does not fall as the corpus grows.<\/p>\n<p><a href=\"#\" data-app=\"DATA-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "DATA-2"}, {"cat": "an-data", "slug": "data-3", "title": "Languages and dialects", "status": "ready", "summary": "Arabic, English, other languages and Arabic dialects", "html": "<p>Which languages and scripts the posts are written in, how many are written in Arabizi (Arabic in Latin letters), and, with the dialect model, which Arabic dialect region each post comes from.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post's letters are counted: mostly Arabic letters, mostly Latin letters, or a mix. Common small words (the, le, de ...) tell Latin-script languages apart. The dialect step uses a language model trained on 25 Arab cities and Modern Standard Arabic, grouped into regions (Gulf, Levant, Egypt-Sudan, Maghreb, Iraq, Yemen). In your browser a smaller model does this step: it weighs words and the letter sequences inside them, and was trained on Arabic tweets labelled by region (ArSarcasm-v2 and QADI).<\/p>\n<h2>Example<\/h2>\n<p>78 % of posts are in Arabic, 22 % in English; 5 % are Arabizi such as 'ana mesh 3aref'.<\/p>\n<h2>Good to know<\/h2>\n<p>The browser model is unsure about most posts: about 7 in 10 are marked uncertain, and the rest are right about 6 times in 10 (macro F1 0.61). Iraq and Yemen are the least reliable. Very short posts are marked 'undetermined'.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Script and language mix: any language. Dialect labels and Arabizi markers: Arabic only.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><tr><td>Only labels the model is at least this sure of (0 to 1)<\/td><td>0.4<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Arabic script (%)<\/td><td>Share of posts written mostly in Arabic letters.<\/td><\/tr><tr><td>Latin script (%)<\/td><td>Share of posts written mostly in Latin letters (English, French, Arabizi).<\/td><\/tr><tr><td>Mixed script (%)<\/td><td>Share of posts mixing Arabic and Latin letters.<\/td><\/tr><tr><td>Arabizi (%)<\/td><td>Share of posts with Arabic written in Latin letters and numbers, such as '3arabi'.<\/td><\/tr><tr><td>Language tag wrong (%)<\/td><td>Share of posts whose language tag in the file does not match their letters.<\/td><\/tr><tr><td>Posts<\/td><td>Number of posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts by script, or by dialect region when dialect labels exist.<\/p>\n<h2>Method in detail<\/h2>\n<p>Script share per post (Arabic, Latin, mixed), Arabizi markers (whole-word lexicon), the export's language column, and dialect labels. In the browser these come from a MARSAD word model (words and the letter sequences inside them, logistic regression) trained on the ArSarcasm-v2 dialect labels and 70% of the QADI test set, with seven labels: MSA, Gulf, Levant, Egypt-Sudan, Maghreb, Iraq and Yemen. A post whose most likely label has a probability under 0.4 is marked uncertain. On held-out tweets (the ArSarcasm-v2 test set and the other 30% of QADI) that labels about 31% of posts at macro F1 0.61; labelling every post gives 0.41. Iraq and Yemen are the weakest labels. On the MARSAD server and in Colab, CAMeLBERT-Mix fine-tuned on MADAR-26 (25 cities and MSA) is used instead.<\/p>\n<p><a href=\"#\" data-app=\"DATA-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "DATA-3"}, {"cat": "an-data", "slug": "data-4", "title": "Copied and repeated posts", "status": "ready", "summary": "How much of the file is the same text posted again", "html": "<p>How many posts are exact copies or almost the same as another post, and which texts are repeated most.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is cut into short overlapping pieces of three words. Two posts that share most of their pieces (at least 80 %) are counted as near copies. A fast method (MinHash) finds the pairs without comparing every post with every other.<\/p>\n<h2>Example<\/h2>\n<p>The same text posted by 40 accounts counts as one group of 40 copies.<\/p>\n<h2>Good to know<\/h2>\n<p>Many copies can mean a campaign, spam or simply retweets. Other analyses can count each repeated text once.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>A
