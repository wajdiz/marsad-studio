><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Different emoji<\/td><td>Number of different emoji.<\/td><\/tr><tr><td>Posts with emoji (%)<\/td><td>Share of posts with at least one emoji.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Emoji cloud: each emoji sized by how often it is used; click an emoji for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Counts of emoji code points per post, share of posts with emoji, and top emoji per group.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-9\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-9"}, {"cat": "an-words", "slug": "words-10", "title": "Named people and places", "status": "ready", "summary": "Which people, organizations and places are named", "html": "<p>The people, organizations, places, buildings and events named in the posts, and how many posts name each.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against about 6,000 names collected from the Wojood corpus of Arabic news and social media.<\/p>\n<h2>Example<\/h2>\n<p>قطر is named in 340 posts, الأمم المتحدة in 85 and محمد بن سلمان in 40.<\/p>\n<h2>Good to know<\/h2>\n<p>Only names in the list are found. Recent or local names may be missing, and a name that is also a word can be counted by mistake.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. Arabic names from the Wojood corpus.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>How many to show<\/td><td>30<\/td><\/tr><tr><td>Kinds of names<\/td><td>all, people, organizations, places, buildings, events<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with entity<\/td><td>Posts naming at least one entity.<\/td><\/tr><tr><td>Posts with entity (%)<\/td><td>Those posts as a share of all posts.<\/td><\/tr><tr><td>Entities<\/td><td>Different names found.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>The names mentioned in the most posts, coloured by type; click a bar for the posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Names collected from the Wojood corpus (WojoodFine flat annotations; Jarrar et al.) for people, organizations, places, buildings and facilities, and events (nationalities and groups are left out: WojoodFine also tags generic groups such as الأطفال). A name is kept when, in the training split, it was that type at least half the times it occurred. On the held-out split, entity-level precision is 0.71, recall 0.79, F1 0.75.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-10\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-10"}, {"cat": "an-words", "slug": "words-11", "title": "Sentiment about named people and places", "status": "ready", "summary": "Positive or negative posts about each name", "html": "<p>For each person, country, organization or group named in five or more posts, how many of those posts are positive, neutral or negative.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Names come from the named-entity list; sentiment comes from the quick Arabic sentiment model.<\/p>\n<h2>Example<\/h2>\n<p>Of 64 posts naming a candidate, 13 % are positive and 58 % negative; for the other candidate 30 % and 40 %.<\/p>\n<h2>Good to know<\/h2>\n<p>The sentiment is that of the whole post: a post that praises one leader and attacks another counts for both. Compare names with each other, and read the posts behind a striking result.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. Arabic posts; names from the Wojood list.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Only domains in at least this many posts<\/td><td>5<\/td><\/tr><tr><td>How many to show<\/td><td>25<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Names<\/td><td>Names and groups mentioned often enough to include.<\/td><\/tr><tr><td>Overall positive (%)<\/td><td>Positive share for all analysed posts.<\/td><\/tr><tr><td>Overall negative (%)<\/td><td>Negative share for all analysed posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>For each name, the share of posts naming it that are negative (left), neutral and positive (right); click a segment for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>For every name in the Wojood list (Named people and places) and every group word found in five or more analysed Arabic posts: the share of those posts the sentiment word model (Sentiment (quick, Arabic)) labels positive, neutral or negative, and the net share (positive minus negative). The sentiment is that of the whole post, not of what it says about the name.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-11\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-11"}, {"cat": "an-words", "slug": "words-12", "title": "Names mentioned together", "status": "ready", "summary": "People, places and groups named in the same posts", "html": "<p>A network of the people, organizations, places and groups that are named in the same posts, and a table of the pairs named together most often.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against the name list of 'Named people and places' and the group words (religions, nationalities and others). Two names are linked when they appear in one post; the more posts, the thicker the line.<\/p>\n<h2>Example<\/h2>\n<p>قطر and الأمم المتحدة are named together in 40 posts, three times what chance would give.<\/p>\n<h2>Good to know<\/h2>\n<p>A line only means two names were mentioned in the same post. It does not mean they are allies, rivals or connected at all. Click a line or a name to read the posts.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list). Names from the Wojood list (Arabic) and the Arabic and English group words.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Only names in at least this many posts<\/td><td>3<\/td><\/tr><tr><td>How many to show<\/td><td>40<\/td><\/tr><tr><td>Kinds of names<\/td><td>all, people, organizations, places, buildings, events, groups<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Method in detail<\/h2>\n<p>Names from the Wojood list (Named people and places) and the group words of Who offensive posts name found in at least min_mentions posts. Two names are linked when they appear in the same post; the link counts those posts. Lift is the number of posts naming both divided by the number expected if the names were independent (posts naming A times posts naming B divided by all posts). The network shows the top pairs (force-directed layout; line width = posts together, node size = posts naming it). It is a co-occurrence network: it does not extract relations.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-12\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-12"}, {"cat": "an-words", "slug": "words-13", "title": "Named entities (language model)", "status": "server", "summary": "People, places and organizations, including names no list has", "html": "<p>The people, places, organizations and other names in Arabic posts, found by a language model that reads each sentence, so it also finds names that are on no list (new politicians, local places, small groups).<\/p>\n<h2>How it is calculated<\/h2>\n<p>An Arabic model (CAMeLBERT Mix NER) runs in your browser: it is downloaded once (about 110 MB) and your posts never leave your computer. It marks each word as part of a name or not; the card counts each name once per post and says whether the name list already knew it.<\/p>\n<h2>Example<\/h2>\n<p>A town council member named in 60 posts, whom no name list had.<\/p>\n<h2>Good to know<\/h2>\n<p>The model learned from news in Modern Standard Arabic, so it finds fewer names in dialect posts, and it sometimes marks an ordinary word as a name. Read the posts behind a new name before reporting it. On a large file it reads a random sample of 5,000 posts unless you choose all of them.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, has_arabic<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. CAMeLBERT Mix NER, trained on Modern Standard Arabic news.<\/td><\/tr><tr><td>Works with<\/td><td>Language model (downloads once)<\/td><\/tr><tr><td>Where it runs<\/td><td>Colab notebook or MARSAD server (or files that already have the labels)<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>How many to show<\/td><td>30<\/td><\/tr><tr><td>Kinds of names<\/td><td>all, people, places, organizations, other<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Method in detail<\/h2>\n<p>In the browser: CAMeLBERT Mix NER (Inoue et al. 2021; fine-tuned on ANERcorp, Modern Standard Arabic news; people, places, organizations and other names; Apache-2.0), converted to ONNX with 8-bit dynamic quantization and run in the page (Transformers.js) on the first 600 characters of Arabic posts. Each word takes the label of its first word piece, and consecutive words tagged B- then I- of one type form one name. Names are counted once per post, merged after Arabic spelling normalization with a leading ال ignored, and compared with the Wojood name list of Named people and places. No score was measured on MARSAD data.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-13\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-13"}, {"cat": "an-topics", "slug": "topic-1", "title": "Main topics", "status": "ready", "summary": "Groups of posts that talk about the same thing", "html": "<p>Puts posts that talk about the same thing into groups (topics) and names each group by its most typical words. Shows the biggest topics, how they change over time and a map where similar posts sit close together.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is turned into a list of numbers that describes its meaning (a 'sentence embedding'). Posts with similar meaning get similar numbers. A grouping method (HDBSCAN) then finds dense groups of similar posts; posts that fit no group are called outliers. A quality score from -1 to 1 (silhouette) says how well separated the groups are: above 0.5 is good.<\/p>\n<h2>Example<\/h2>\n<p>320 posts about prices and wages form one topic, named 'prices, wages, rising, cost'.<\/p>\n<h2>Good to know<\/h2>\n<p>Topic names are made from words, so read the example posts before you name a topic yourself. Each run is saved so you can compare settings.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). With multilingual embeddings (Colab, sentence-transformers) about 50 languages; offline method: spaced languages.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Method<\/td><td>hdbscan, nmf, bertopic<\/td><\/tr><tr><td>Smallest topic size (posts)<\/td><td>auto<\/td><\/tr><tr><td>How strict the grouping is<\/td><td>10<\/td><\/tr><tr><td>Merge topics that are this close<\/td><td>0.1<\/td><\/tr><tr><td>How many to show<\/td><td>10<\/td><\/tr><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><tr><td>Go back to run number<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Method<\/td><td>Topic method used.<\/td><\/tr><tr><td>Topics<\/td><td>Number of topics.<\/td><\/tr><tr><td>Posts<\/td><td>Number of posts.<\/td><\/tr><tr><td>Reconstruction error<\/td><td>NMF fit error (lower = topics describe the texts better).<\/td><\/tr><tr><td>Embeddings<\/td><td>Embedding model used (sentence-transformers, or LSA offline).<\/td><\/tr><tr><td>Posts grouped<\/td><td>Posts given to the topic grouping.<\/td><\/tr><tr><td>Groups of copies<\/td><td>Number of different texts that were copied.<\/td><\/tr><tr><td>Posts in no topic<\/td><td>Posts that did not fit any topic.<\/td><\/tr><tr><td>Topic quality<\/td><td>How clearly the topics are separated, from -1 to 1. Above 0.5 = good, 0.25 to 0.5 = fair, below = weak.<\/td><\/tr><tr><td>Quality<\/td><td>good, fair or weak, from the topic quality score.<\/td><\/tr><tr><td>Smallest topic<\/td><td>Smallest number of posts a topic can have.<\/td><\/tr><tr><td>Strictness<\/td><td>Higher = more posts left outside any topic.<\/td><\/tr><tr><td>Merging<\/td><td>Higher = fewer, bigger topics.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>The largest topic clusters by number of posts; click a bar for the cluster's posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Topic analyzer in the style of Communalytic: sentence embeddings (in the browser, those of the page's language model once it has run, as in Posts about an idea; before that, and when sentence-transformers is not installed, LSA: TF-IDF and SVD), reduced with UMAP and clustered with HDBSCAN (min_cluster_size, min_samples, cluster_selection_epsilon). The silhouette score rates each run and every run is kept in a history table. Clusters are named by their most distinctive words (class-based TF-IDF) or by a labelling function, and shown as bars, by sentiment, over time and on a 3D similarity map. NMF and BERTopic stay available as methods.<\/p>\n<p><a href=\"#\" data-app=\"TOPIC-1\">Open this analysis in the dashboard<\/a><\/p>", "card": "TOPIC-1"}, {"cat": "an-topics", "slug": "topic-2", "title": "Words used in the same way", "status": "ready", "summary": "A map of words that appear in similar sentences", "html": "<p>A map where words that are used in similar sentences sit close together, and groups of such words.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each word is described by the words that appear near it in your own posts (within five words on either side), and these counts are boiled down to 100 numbers per word. Words with similar surroundings get similar numbers and sit close together on the map. Nothing is downloaded: it is learned from your file.<\/p>\n<h2>Example<\/h2>\n<p>'هدنة', 'وقف' and 'تهدئة' sit close together because they are used in the same sentences.<\/p>\n<h2>Good to know<\/h2>\n<p>Needs at least 200 posts. Close words are used in the same way, which can mean the same thing, the opposite (good and bad) or simply the same topic.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Embeddings are trained on your own data, so any spaced language works.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Words (separate with commas)<\/td><td>you choose<\/td><\/tr><tr><td>n keywords<\/td><td>80<\/td><\/tr><tr><td>n clusters<\/td><td>8<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Map of frequent words placed by similarity of their contexts (FastText, t-SNE); click a word for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Word vectors built from this file. In the browser: co-occurrence counts within five words on either side (nearer words weigh more), positive pointwise mutual information with context counts raised to 0.75, and a 100-dimension truncated SVD (Levy, Goldberg and Dagan 2015); where gensim is installed, FastText (100 dimensions, window 5, minimum count 3, 10 epochs). Words used fewer than three times are left out. K-means clusters of the most frequent content words, a t-SNE projection on cosine distance, and the nearest neighbours of each word and of any words you give.<\/p>\n<p><a href=\"#\" data-app=\"TOPIC-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "TOPIC-2"}, {"cat": "an-topics", "slug": "topic-3", "title": "Posts about an idea", "status": "server", "summary": "Find posts close in meaning to an idea you describe", "html": "<p>You describe an idea in a sentence (in any language). The card finds the posts closest to that idea in meaning, even when they use other words.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Your sentence and every post are turned into meaning numbers by a language model that runs in your browser: an Arabic model (ATM-V2) for Arabic files, a multilingual one for other files. The model is downloaded once (about 135 MB) and your posts never leave your computer. The closer two lists of numbers are, the closer the meaning (cosine similarity). Write your ideas as 'name: sentence; name: sentence', or keep the four examples.<\/p>\n<h2>Example<\/h2>\n<p>You describe 'people asking for medical help'; the card finds posts about hospitals and medicine.<\/p>\n<h2>Good to know<\/h2>\n<p>Closeness in meaning is not agreement: a post rejecting an idea sits close to it too. Read the closest posts. On a large file the model reads a random sample of 5,000 posts unless you choose all of them.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Languages of the model (listed on the card). Arabic files: ATM-V2 (Arabic only). Other files: paraphrase-multilingual-MiniLM-L12-v2, about 50 languages, including Arabic.<\/td><\/tr><tr><td>Works with<\/td><td>Language model (downloads once)<\/td><\/tr><tr><td>Where it runs<\/td><td>Colab notebook or MARSAD server (or files that already have the labels)<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Your ideas (name: sentence; name: sentence)<\/td><td>you choose<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts semantically close to each concept (cosine similarity above 0.5).<\/p>\n<h2>Method in detail<\/h2>\n<p>Posts and concept sentences are embedded with the same sentence-embedding model, and each post's cosine similarity to the concept (the mean of its sentences' vectors) is reported, with the closest posts for reading. In the browser the model runs in the page (Transformers.js, ONNX): for Arabic files Arabic Triplet Matryoshka V2 (Nacar et al. 2025; AraBERT base, 768 dimensions kept at the first 256, Apache-2.0), otherwise paraphrase-multilingual-MiniLM-L12-v2 (Reimers and Gurevych 2020; about 50 languages). The first 600 characters of each post are embedded. Write your own concepts as \"name: sentence; name: sentence\", or keep the four defaults (hope, despair, hate, solidarity). In Python, sentence-transformers runs the multilingual model.<\/p>\n<p><a href=\"#\" data-app=\"TOPIC-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "TOPIC-3"}, {"cat": "an-topics", "slug": "topic-4", "title": "Posts like this one", "status": "server", "summary": "The posts closest in meaning to a post you pick", "html": "<p>Pick a post (by its id, or by a word or phrase in it) and see the posts that say the most similar thing, even in other words.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The same language model as 'Posts about an idea' turns every post into a list of numbers that describes its meaning, and the posts whose numbers are closest to the picked post are listed.<\/p>\n<h2>Example<\/h2>\n<p>Starting from a post on fuel prices, the closest posts are about bread prices and salaries.<\/p>\n<h2>Good to know<\/h2>\n<p>Close in meaning is not agreement: a reply that rejects a post can be very close to it. Without a choice, the card starts from the most engaged post.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Languages of the model (listed on the card). Arabic files: ATM-V2 (Arabic only). Other files: paraphrase-multilingual-MiniLM-L12-v2, about 50 languages.<\/td><\/tr><tr><td>Works with<\/td><td>Language model (downloads once)<\/td><\/tr><tr><td>Where it runs<\/td><td>Colab notebook or MARSAD server (or files that already have the labels)<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Start from (a post id, or a word or phrase in the post)<\/td><td>you choose<\/td><\/tr><tr><td>How many to show<\/td><td>15<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Method in detail<\/h2>\n<p>The starting post is the one whose id you give, or the most engaged post containing the word or phrase you give, or by default the most engaged post. Every post the language model read is ranked by the cosine similarity of its sentence embedding to the starting post's (same models as Posts about an idea), and the closest are listed.<\/p>\n<p><a href=\"#\" data-app=\"TOPIC-4\">Open this analysis in the dashboard<\/a><\/p>", "card": "TOPIC-4"}, {"cat": "an-topics", "slug": "topic-5", "title": "How the meaning moves over time", "status": "server", "summary": "Does the conversation drift to other things?", "html": "<p>Whether the posts of each week (or day, or month) still talk about the same things as at the start, and where the conversation changed most.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The language model gives each post a list of numbers for its meaning. The average of a period's posts sums up what that period was about; the chart shows how close each period's average is to the first period and to the period before.<\/p>\n<h2>Example<\/h2>\n<p>The posts stay close to the first week until week 6, when the talk turns from the strike to the court case.<\/p>\n<h2>Good to know<\/h2>\n<p>The average also moves when the mix of topics changes, or when a few accounts post a lot in one period. Open a period to read its posts.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, the date and time of each post<\/td><\/tr><tr><td>Languages<\/td><td>Languages of the model (listed on the card). Arabic files: ATM-V2 (Arabic only). Other files: paraphrase-multilingual-MiniLM-L12-v2, about 50 languages.<\/td><\/tr><tr><td>Works with<\/td><td>Language model (downloads once)<\/td><\/tr><tr><td>Where it runs<\/td><td>Colab notebook or MARSAD server (or files that already have the labels)<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Leave out periods with fewer posts than<\/td><td>20<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Method in detail<\/h2>\n<p>For each time period (the dataset's time unit) with at least min_period_posts posts read by the language model, the mean of the posts' sentence embeddings, scaled to length 1. The chart shows its cosine similarity to the first period and to the period before. Cohesion is the mean similarity of a period's posts to their own mean. The most typical post of a period is the one closest to its mean. Same models as Posts about an idea.<\/p>\n<p><a href=\"#\" data-app=\"TOPIC-5\">Open this analysis in the dashboard<\/a><\/p>", "card": "TOPIC-5"}, {"cat": "an-framing", "slug": "frame-1", "title": "Kinds of language over time", "status": "ready", "summary": "How often words of hope, fear, anger and others appear", "html": "<p>The share of posts that use a kind of language (for example hope, fear, victimhood, religious words), and how it changes over time or between groups.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against expert word lists (for example words of hope, words of fear, 'us' and 'them' words). Words must match as whole words; for Arabic, common attached letters such as و and ال are allowed. The card shows the share of posts with at least one match, and the number of matches per 1,000 words.<\/p>\n<h2>Example<\/h2>\n<p>Hope words appear in 12 % of posts in January and 20 % in March.<\/p>\n<h2>Good to know<\/h2>\n<p>Word lists catch words, not meaning: 'no hope' still counts as a hope word. Check the word lists first.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Word lists<\/td><td>hope, despair<\/td><\/tr><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><tr><td>How similar claims must be to group them (0 to 1)<\/td><td>False<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicon matches are counted on whole tokens after normalization. Arabic terms of three letters accept the prefixes و and ال (and combinations with ال); terms of four or more letters also accept clitic prefixes and pronoun or plural suffixes. Multi-word terms are matched as sequences. Rates are matches per 1,000 tokens, computed as a ratio of totals; prevalence is the share of posts with at least one match.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-1\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-1"}, {"cat": "an-framing", "slug": "frame-2", "title": "Compare two kinds of language", "status": "ready", "summary": "Which of two framings wins, and when?", "html": "<p>Compares two kinds of language (for example hope and despair) and shows which one is used more, and how that balance changes over time.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against expert word lists (for example words of hope, words of fear, 'us' and 'them' words). Words must match as whole words; for Arabic, common attached letters such as و and ال are allowed. For each period, the matches of the first list are divided by the matches of both lists together (above 50 % means the first list wins).<\/p>\n<h2>Example<\/h2>\n<p>Hope words are 60 % and despair words 40 % of all hope and despair matches.<\/p>\n<h2>Good to know<\/h2>\n<p>Both lists should be similar in size, or the bigger list will look stronger.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>First word list<\/td><td>hope<\/td><\/tr><tr><td>Second word list<\/td><td>despair<\/td><\/tr><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>First list per second list<\/td><td>Matches of the first word list divided by matches of the second. Example: 1.5 = 50 % more.<\/td><\/tr><tr><td>First list share (%)<\/td><td>Matches of the first list as a share of both lists. Above 50 = the first list wins.<\/td><\/tr><tr><td>Posts<\/td><td>Number of posts used.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of lexicon A in all A and B matches per period; above 50 means A dominates.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicon matches are counted on whole tokens after normalization. Arabic terms of three letters accept the prefixes و and ال (and combinations with ال); terms of four or more letters also accept clitic prefixes and pronoun or plural suffixes. Multi-word terms are matched as sequences. Rates are matches per 1,000 tokens, computed as a ratio of totals; prevalence is the share of posts with at least one match. The balance is the share of A in all A and B matches, and the ratio of A to B totals.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-2"}, {"cat": "an-framing", "slug": "frame-3", "title": "Kinds of language used together", "status": "ready", "summary": "Which kinds of language appear in the same posts", "html": "<p>Shows how often two or three kinds of language appear in the same post, for example anger together with religion.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against expert word lists (for example words of hope, words of fear, 'us' and 'them' words). Words must match as whole words; for Arabic, common attached letters such as و and ال are allowed. Posts are grouped by which lists they match. 'Lift' says how much more often two lists appear together than chance would give (1 = chance, 2 = twice as often).<\/p>\n<h2>Example<\/h2>\n<p>Anger and religious words appear together 2.5 times more often than chance.<\/p>\n<h2>Good to know<\/h2>\n<p>Rare lists give unstable numbers.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Word lists<\/td><td>hope, despair<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts by which combination of the chosen lexicons they contain; click a bar for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicon matches are counted on whole tokens after normalization. Arabic terms of three letters accept the prefixes و and ال (and combinations with ال); terms of four or more letters also accept clitic prefixes and pronoun or plural suffixes. Multi-word terms are matched as sequences. Rates are matches per 1,000 tokens, computed as a ratio of totals; prevalence is the share of posts with at least one match. For each pair: the share of A posts that also match B, lift (observed over expected joint share) and Jaccard.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-3"}, {"cat": "an-framing", "slug": "frame-4", "title": "We, you and they", "status": "ready", "summary": "Who the posts talk about, and how sure they sound", "html": "<p>How often posts say 'we', 'you' or 'they', and whether they use strong words (must, will) or careful words (may, perhaps).<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against expert word lists (for example words of hope, words of fear, 'us' and 'them' words). Words must match as whole words; for Arabic, common attached letters such as و and ال are allowed. Pronouns and certainty words are counted per 1,000 words.<\/p>\n<h2>Example<\/h2>\n<p>'We' appears 8 times per 1,000 words, 'they' 12 times.<\/p>\n<h2>Good to know<\/h2>\n<p>Arabic often hides pronouns inside the verb, so counts are a lower estimate.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Pronoun profile, or pronouns per 1,000 words over time; click for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicon matches are counted on whole tokens after normalization. Arabic terms of three letters accept the prefixes و and ال (and combinations with ال); terms of four or more letters also accept clitic prefixes and pronoun or plural suffixes. Multi-word terms are matched as sequences. Rates are matches per 1,000 tokens, computed as a ratio of totals; prevalence is the share of posts with at least one match.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-4\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-4"}, {"cat": "an-framing", "slug": "frame-5", "title": "How groups talk differently", "status": "ready", "summary": "Compare the language of accounts, countries or files", "html": "<p>For each group (for example each country or each file), how much it uses each kind of language, and which groups talk most alike.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against expert word lists (for example words of hope, words of fear, 'us' and 'them' words). Words must match as whole words; for Arabic, common attached letters such as و and ال are allowed. Matches are counted per 1,000 words for each group. Groups are compared by how similar their whole profile is (1 = identical mix of language).<\/p>\n<h2>Example<\/h2>\n<p>Accounts from Qatar use more hope words; accounts from Egypt more economic words.<\/p>\n<h2>Good to know<\/h2>\n<p>Groups need enough posts (30 or more by default) to be compared.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Group by<\/td><td>auto, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><tr><td>Word lists<\/td><td>hope, despair, emotional, factual, victim, moral<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Group by<\/td><td>Variable the groups come from.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Lexicon matches per 1,000 words for each group (rows) and lexicon (columns); click a cell for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicon matches are counted on whole tokens after normalization. Arabic terms of three letters accept the prefixes و and ال (and combinations with ال); terms of four or more letters also accept clitic prefixes and pronoun or plural suffixes. Multi-word terms are matched as sequences. Rates are matches per 1,000 tokens, computed as a ratio of totals; prevalence is the share of posts with at least one match. Groups are compared by their vectors of rates (cosine similarity) and by breadth, the number of lexicons used above the median rate.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-5\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-5"}, {"cat": "an-framing", "slug": "frame-6", "title": "My own word list", "status": "ready", "summary": "Count any words you type", "html": "<p>Type your own words (for example names of places or slogans) and see how often they appear, over time or by group.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against expert word lists (for example words of hope, words of fear, 'us' and 'them' words). Words must match as whole words; for Arabic, common attached letters such as و and ال are allowed. Your words are checked the same way as the expert lists.<\/p>\n<h2>Example<\/h2>\n<p>You type 'حماس, Hamas'; the card shows they appear in 9 % of posts.<\/p>\n<h2>Good to know<\/h2>\n<p>Add spelling variants yourself if needed.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Your own word list, in any language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>name<\/td><td>custom<\/td><\/tr><tr><td>Words (separate with commas)<\/td><td>you choose<\/td><\/tr><tr><td>file<\/td><td>you choose<\/td><\/tr><tr><td>Split the results by<\/td><td>time<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching your custom lexicon over time; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicon matches are counted on whole tokens after normalization. Arabic terms of three letters accept the prefixes و and ال (and combinations with ال); terms of four or more letters also accept clitic prefixes and pronoun or plural suffixes. Multi-word terms are matched as sequences. Rates are matches per 1,000 tokens, computed as a ratio of totals; prevalence is the share of posts with at least one match. Custom lists are registered for the session and can be used in every lexicon card.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-6\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-6"}, {"cat": "an-feelings", "slug": "frame-7", "title": "Positive or negative?", "status": "server", "summary": "Is each post positive, negative or neutral?", "html": "<p>How many posts are positive, negative or neutral, how this changes over time, and which kind gets more attention. Click a part of a chart to read those posts.<\/p>\n<h2>How it is calculated<\/h2>\n<p>A language model reads each post and gives it one of three labels with a confidence score. In your browser this is CAMeLBERT Mix, an Arabic model trained on Arabic tweets labelled for sentiment; it reads Arabic posts only, and is downloaded once (about 110 MB). On the MARSAD server a multilingual model (DistilBERT, 12 languages) is used instead.<\/p>\n<h2>Example<\/h2>\n<p>'What a great day for our team' is positive; 'Prices are rising again' is negative.<\/p>\n<h2>Good to know<\/h2>\n<p>In the browser: macro F1 0.61 on 3,000 Arabic test tweets (ArSarcasm-v2), against 0.54 for the quick word model. Some of those tweets may have been in the model's own training data, so the real figure on new posts can be lower. Models make mistakes, especially with sarcasm and dialect: check a sample by hand before reporting numbers.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Languages of the model (listed on the card). In the browser: CAMeLBERT Mix, Arabic only. On the server: 12 languages (Arabic, Chinese, English, French, German, Hindi, Indonesian, Italian, Japanese, Malay, Portuguese, Spanish).<\/td><\/tr><tr><td>Works with<\/td><td>Language model (downloads once)<\/td><\/tr><tr><td>Where it runs<\/td><td>Colab notebook or MARSAD server (or files that already have the labels)<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>task<\/td><td>sentiment, emotion, hate, auto<\/td><\/tr><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic, hashtag<\/td><\/tr><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><tr><td>Only labels the model is at least this sure of (0 to 1)<\/td><td>0.0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Labelled<\/td><td>Posts with a label.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts per sentiment label over time; click a point for the posts with that label in that period.<\/p>\n<h2>Method in detail<\/h2>\n<p>In the browser: CAMeLBERT Mix SA (Inoue et al. 2021; fine-tuned on ASTD, ArSAS and SemEval-2017 Arabic tweets; Apache-2.0), converted to ONNX with 8-bit dynamic quantization and run in the page (Transformers.js) on Arabic posts, first 600 characters; macro F1 0.612 on the 3,000 ArSarcasm-v2 test tweets, which may include tweets from its training sets. On the server and in Python: each post is routed by its detected language to a sentiment model: by default the multilingual DistilBERT student model (lxyuan/distilbert-base-multilingual-cased-sentiments-student; positive, neutral, negative; 12 languages including Arabic), the model Communalytic uses. Posts in other languages are skipped and counted. The card shows the distribution split, counts over time, shares by language, engagement by label and the most confident examples per label. Any Hugging Face classifier can be used instead (task and model id).<\/p>\n<p><a href=\"#\" data-app=\"FRAME-7\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-7"}, {"cat": "an-feelings", "slug": "frame-15", "title": "Sentiment (quick, Arabic)", "status": "ready", "summary": "Positive, negative or neutral, without a big model", "html": "<p>Whether each Arabic post is positive, negative or neutral, using a small model that runs in your browser.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The model weighs the words of the post and counts positive and negative words from three Arabic word lists (AraSenti, NileULex, NRC), turning a word around after a negation such as مش or لا. It was trained on about 15,000 labelled Arabic tweets.<\/p>\n<h2>Example<\/h2>\n<p>A post praising the service is positive; one complaining after a negation such as مش is negative; 34 % of posts are positive.<\/p>\n<h2>Good to know<\/h2>\n<p>Right about half the time on three-way sentiment (macro F1 0.54 to 0.63 on test tweets it had not seen). Use it for trends and comparisons, not for single posts. Sarcasm is often missed.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, has_arabic<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. Arabic only; other posts are skipped.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic, hashtag<\/td><\/tr><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><tr><td>Only labels the model is at least this sure of (0 to 1)<\/td><td>0.0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Labelled<\/td><td>Posts with a label.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts per sentiment label over time; click a point for the posts with that label in that period.<\/p>\n<h2>Method in detail<\/h2>\n<p>MARSAD word model for Arabic posts: TF-IDF word weights and 12 word-list features (AraSenti, NileULex and NRC Arabic positive and negative words, with a sign flip after a negation word; emoji; length), combined by logistic regression trained on ArSarcasm-v2 training tweets and Mawqif v2 Track 1 training tweets; names and group words are not used as word features. Held out: macro F1 0.54 on the ArSarcasm-v2 test set (3,000 tweets) and 0.63 on the Mawqif dev set; always answering negative scores 0.24. Posts in other languages are skipped and counted.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-15\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-15"}, {"cat": "an-feelings", "slug": "frame-16", "title": "Emotions (quick, Arabic)", "status": "ready", "summary": "Anger, joy, sadness, fear and six more", "html": "<p>The main emotion of each Arabic post: anger, fear, sadness, disgust, joy, love, anticipation, surprise, acceptance or neutral.<\/p>\n<h2>How it is calculated<\/h2>\n<p>A small model trained on 14,000 labelled Arabic tweets (ExaAEC) gives each emotion a probability; the post gets the most likely one.<\/p>\n<h2>Example<\/h2>\n<p>A post grieving a loss is sadness; 22 % of posts express anger in the week after a decision.<\/p>\n<h2>Good to know<\/h2>\n<p>Emotion is hard: macro F1 0.45 on tweets the model had not seen, and the label shown is one of the tweet's own labels about half the time (51%). Acceptance, neutral and fear are found best (F1 0.55 to 0.57), anger and joy worst (0.27 and 0.30).<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, has_arabic<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. Arabic only; other posts are skipped.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic, hashtag<\/td><\/tr><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><tr><td>Only labels the model is at least this sure of (0 to 1)<\/td><td>0.0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Labelled<\/td><td>Posts with a label.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts per sentiment label over time; click a point for the posts with that label in that period.<\/p>\n<h2>Method in detail<\/h2>\n<p>MARSAD word model trained on 70% of ExaAEC (20,000 Arabic tweets labelled with up to two of anger, anticipation, disgust, fear, joy, love, sadness, surprise, acceptance and neutral): one logistic regression per label over TF-IDF word weights. The card shows each post's most likely label. On the other 30%, macro F1 is 0.45; per-label precision is 2 to 17 times the label's base rate. Posts in other languages are skipped.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-16\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-16"}, {"cat": "an-feelings", "slug": "frame-17", "title": "Offensive language (quick, Arabic)", "status": "ready", "summary": "Insults, abuse and hate in Arabic posts", "html": "<p>Which Arabic posts use offensive language: insults, abuse, vulgar words or hate.<\/p>\n<h2>How it is calculated<\/h2>\n<p>A small model trained on about 113,000 labelled Arabic posts from 14 research datasets, in standard Arabic and several dialects.<\/p>\n<h2>Example<\/h2>\n<p>6 % of replies to a minister are offensive, against 2 % of all posts.<\/p>\n<h2>Good to know<\/h2>\n<p>Macro F1 0.75 on posts like its training data and 0.70 on average on a new kind of data. Names of religious, ethnic and national groups are not used, but a neutral post about a group can still be flagged: read a sample of flagged posts before reporting a number.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, has_arabic<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. Arabic only; other posts are skipped.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic, hashtag<\/td><\/tr><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><tr><td>Only labels the model is at least this sure of (0 to 1)<\/td><td>0.0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Labelled<\/td><td>Posts with a label.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts per sentiment label over time; click a point for the posts with that label in that period.<\/p>\n<h2>Method in detail<\/h2>\n<p>MARSAD word model (TF-IDF and logistic regression) trained on 80% of 14 Arabic offensive-language datasets re-annotated by Liebeskind, Afawi, Litvak and Vanetik (2024), about 140,000 posts in standard Arabic and Levantine, Gulf, Egyptian, Tunisian and Moroccan dialects. Each dataset is weighted equally (offensive and other posts balanced inside it), so that topic words of one heavily offensive dataset do not count as offense, and names and religious, ethnic and national group words are not used as features. Macro F1 0.75 on the other 20%; trained without a dataset and tested on it, macro F1 averages 0.70 (0.43 to 0.90). A neutral post naming a group can still be flagged.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-17\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-17"}, {"cat": "an-feelings", "slug": "frame-18", "title": "Who offensive posts name", "status": "ready", "summary": "People, places and groups in offensive posts", "html": "<p>Which people, countries, organizations and groups are named more often in offensive posts than in posts in general.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The offensive-language model flags posts; then each name and group word is checked: what share of the posts naming it are flagged, against the share for all posts.<\/p>\n<h2>Example<\/h2>\n<p>5 % of all posts are offensive, but 15 % of posts naming a country are: three times the overall rate.<\/p>\n<h2>Good to know<\/h2>\n<p>A name in an offensive post is not always the target: the insult can be aimed at someone else, or quoted. Read the posts before saying a person or group is targeted.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. Arabic posts; names from the Wojood list.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Only domains in at least this many posts<\/td><td>3<\/td><\/tr><tr><td>How many to show<\/td><td>25<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts labelled<\/td><td>Posts the model labelled.<\/td><\/tr><tr><td>Offensive posts<\/td><td>Posts flagged offensive.<\/td><\/tr><tr><td>Offensive (%)<\/td><td>Share of analysed posts flagged offensive.<\/td><\/tr><tr><td>Names over twice rate<\/td><td>Names and groups at twice the overall offensive rate or more.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>For each name or group, the share of the posts naming it that are flagged offensive; the dashed line is the share for all posts; click a bar for the offensive posts naming it.<\/p>\n<h2>Method in detail<\/h2>\n<p>For every name in the Wojood list (Named people and places) and every group word (religious, ethnic, national and social groups) found in three or more analysed Arabic posts: the share of those posts that the offensive word model (Offensive language (quick, Arabic)) flags, against the share for all posts. Names at twice the overall rate or more are shown in red. A name in an offensive post is not necessarily its target.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-18\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-18"}, {"cat": "an-framing", "slug": "frame-19", "title": "News frames", "status": "ready", "summary": "Conflict, responsibility, human interest, morality, economics", "html": "<p>How often posts use the language of the five classic news frames: conflict, responsibility, human interest, morality and economic consequences, and how this changes over time.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each frame is a set of MARSAD word lists (for conflict: enemies, threats, winners and losers, protest). A post shows a frame when it uses a word from one of its lists; a post can show several.<\/p>\n<h2>Example<\/h2>\n<p>Conflict words appear in 56 % of election posts and economic words in 33 %; conflict rises in the last week.<\/p>\n<h2>Good to know<\/h2>\n<p>These are indicators, not frames coded by people. Before reporting, code a sample by hand (PAPER-2) and check that the indicators agree.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list). Arabic and English word lists.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts<\/td><td>Number of posts.<\/td><\/tr><tr><td>Posts with any frame (%)<\/td><td>Share of posts showing at least one frame.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts with words of each news frame; click a bar for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>The five generic news frames of Semetko and Valkenburg (2000), approximated with MARSAD word lists: responsibility (blame, accountability, solutions), human interest (names and ages, victims, civilians, grief, emotion), conflict (out-group, threats and defiance, winners and losers, protest, dehumanizing language), morality (moral and Moral Foundations words, religious expressions) and economic consequences (economy, prices, shortages, gains). A post shows a frame when it uses a word from one of its lists. Not validated against hand-coded frames.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-19\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-19"}, {"cat": "an-framing", "slug": "frame-20", "title": "Propaganda techniques (word lists)", "status": "ready", "summary": "Name calling, fear, slogans, whataboutism and more", "html": "<p>How often posts use the wording of eleven propaganda techniques: loaded language, name calling, exaggeration, appeal to fear, casting doubt, flag waving, whataboutism, appeal to authority, black and white framing, one simple cause, slogans and repetition. Useful when you are looking into propaganda, trolling or an influence campaign.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each technique has word lists in Arabic and English. A post shows the technique when it uses one of those words. Slogans and repetition also use the shape of the post: very short posts with an exclamation mark or hashtags, and the same phrase repeated inside one post.<\/p>\n<h2>Example<\/h2>\n<p>'So-called experts, 100% proven, wake up before it is too late' shows name calling, exaggeration and fear.<\/p>\n<h2>Good to know<\/h2>\n<p>Word lists find wording, not intent, and a post that criticises propaganda uses the same words. These lists are new and have not been checked against posts labelled by people: read the posts before reporting a number.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list). Arabic and English word lists; the slogan and repetition rules work in any language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><tr><td>Only accounts with at least this many posts<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts<\/td><td>Number of posts.<\/td><\/tr><tr><td>Posts with any technique (%)<\/td><td>Share of posts showing at least one technique.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><tr><td>Median techniques per post<\/td><td>Half the posts show this many techniques or fewer.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts using the wording of each technique; click a bar for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Eleven techniques from the propaganda-technique taxonomies used in SemEval 2020 and 2021 and WANLP 2022, approximated with MARSAD word lists and two wording rules. Lists: name calling, exaggeration or minimisation, doubt, appeal to fear (with threats and defiance), flag waving, whataboutism, appeal to authority, black and white framing, causal oversimplification, slogans; loaded language counts two or more matches across intensifiers, emotion words and moral-emotional words. Rules: a slogan-shaped post is at most eight tokens with an exclamation mark or two or more hashtags; repetition is the same three-word phrase twice or more inside one post. Seed lists of November 2026, not checked against posts labelled by people. The model-based card is Propaganda techniques.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-20\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-20"}, {"cat": "an-feelings", "slug": "frame-21", "title": "Sarcasm (quick, Arabic)", "status": "ready", "summary": "Posts that say the opposite of what they mean", "html": "<p>Which Arabic posts are sarcastic. This also helps read the sentiment results: a sarcastic post that looks positive is usually negative.<\/p>\n<h2>How it is calculated<\/h2>\n<p>A small model that runs in your browser weighs the words of the post and the letter sequences inside them, which catch spellings such as stretched letters and laughter. It was trained on about 12,500 Arabic tweets labelled for sarcasm (ArSarcasm-v2).<\/p>\n<h2>Example<\/h2>\n<p>'Great, another power cut, just what we needed' is sarcastic; 9 % of posts about the decision are.<\/p>\n<h2>Good to know<\/h2>\n<p>Macro F1 0.64 on 3,000 test tweets it had not seen. About half of the posts it calls sarcastic are (precision 0.52), and it finds about four in ten of the sarcastic ones. Use it to compare groups and periods, and read the flagged posts.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, has_arabic<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. Arabic only; other posts are skipped.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic, hashtag<\/td><\/tr><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><tr><td>Only labels the model is at least this sure of (0 to 1)<\/td><td>0.0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Labelled<\/td><td>Posts with a label.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts per sentiment label over time; click a point for the posts with that label in that period.<\/p>\n<h2>Method in detail<\/h2>\n<p>MARSAD word model for Arabic posts: TF-IDF over words and over the 2- to 4-letter sequences inside each word (which catch elongation, laughter and dialect spellings), and logistic regression trained on the 12,548 ArSarcasm-v2 training tweets (Abu Farha, Zaghouani and Magdy 2021), with the cut-off chosen on 15% of them. On the 3,000 test tweets: macro F1 0.64, against 0.42 for always answering not sarcastic; precision 0.52 and recall 0.41 for the sarcastic class. Sarcasm in ArSarcasm-v2 is mostly political and sports tweets from 2018 to 2020. Posts in other languages are skipped.<\/p>\n<p><a href=\"#\" data-app=\"FRAME-21\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-21"}, {"cat": "an-feelings", "slug": "frame-22", "title": "Hate speech (quick, Arabic)", "status": "ready", "summary": "Abuse aimed at people for who they are", "html": "<p>Which Arabic posts are hate speech: abuse aimed at a person or group because of their religion, origin, gender or another part of who they are. Insults with no such target are not counted here; the offensive language analysis counts those.<\/p>\n<h2>How it is calculated<\/h2>\n<p>A small model trained on about 15,000 labelled Arabic posts from three research datasets (Levantine tweets, Tunisian comments and Arabic tweets). Names, places and group words such as religions and nationalities are not used, so a post is not flagged only for naming a group.<\/p>\n<h2>Example<\/h2>\n<p>'You idiot' is offensive but not hate speech; an insult aimed at refugees as refugees is hate speech.<\/p>\n<h2>Good to know<\/h2>\n<p>Hate speech is hard to find from words alone. Macro F1 0.68 on posts like its training data and 0.56 to 0.62 on a new kind of data. Fewer than half of the flagged posts are hate (precision 0.41); most of the rest are abusive. Read the flagged posts before reporting a number, and use Check on my data to correct the share.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, has_arabic<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. Arabic only; other posts are skipped.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic, hashtag<\/td><\/tr><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><tr><td>Only labels the model is at least this sure of (0 to 1)<\/td><td>0.0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Labelled<\/td><td>Posts with a label.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts per sentiment label over time; click a point for the posts with that label in that period.<\/p>\n<h2>Method in detail<\/h2>\n<p>MARSAD word model (TF-IDF and logistic regression) trained on 80% of three Arabic hate speech datasets: L-HSAB (5,846 Levantine tweets; Mulki et al. 2019), T-HSAB (6,024 Tunisian comments; Haddad et al. 2019) and the Arabic part of MLMA (3,353 tweets; Ousidhoum et al. 2019). Hate is abuse aimed at a person or group for their identity, as the three datasets define it; abusive posts without that target count as not hate. Each dataset weighs the same and both labels weigh the same inside it. Names, places and religious, ethnic and national group words (315 word forms) are not used as features, so a post cannot be flagged only for naming a group. Macro F1 0.68 on the other 20% (always answering not hate: 0.46); precision 0.41 and recall 0.55 for hate. Trained without a dataset and tested on it, macro F1 is 0.56 (L-HSAB), 0.56 (T-HSAB) and 0.62 (MLMA).<\/p>\n<p><a href=\"#\" data-app=\"FRAME-22\">Open this analysis in the dashboard<\/a><\/p>", "card": "FRAME-22"}, {"cat": "an-reactions", "slug": "react-1", "title": "Likes, comments and shares", "status": "ready", "summary": "How much attention posts got", "html": "<p>How likes, comments and shares are spread over posts: typical values, the most successful posts and how much of all attention goes to the top 1 % and 10 % of posts.<\/p>\n<h2>How it is calculated<\/h2>\n<p>All attention numbers are put in order. The median is the middle post; percentiles show the values that 90 % or 99 % of posts stay below. A few posts with huge numbers are flagged as outliers.<\/p>\n<h2>Example<\/h2>\n<p>Half the posts get fewer than 25 interactions; the top 1 % of posts get 40 % of all interactions.<\/p>\n<h2>Good to know<\/h2>\n<p>Attention is usually very uneven: a few posts get most of it.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>likes, comments or shares<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Top 1 % of posts (%)<\/td><td>Share of all attention that went to the most successful 1 % of posts.<\/td><\/tr><tr><td>Top 10 % of posts (%)<\/td><td>Share of all attention that went to the most successful 10 % of posts.<\/td><\/tr><tr><td>Posts with no attention (%)<\/td><td>Share of posts with no likes, comments or shares.<\/td><\/tr><tr><td>Very successful posts<\/td><td>Posts with far more attention than the rest.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Distribution of interactions per post (log scale); click a bar for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Percentiles of each engagement metric, the share of total engagement taken by the top 1% and 10% of posts, high outliers by the IQR rule on log(1 + x), virality (engagement over the dataset median) and Spearman correlations.<\/p>\n<p><a href=\"#\" data-app=\"REACT-1\">Open this analysis in the dashboard<\/a><\/p>", "card": "REACT-1"}, {"cat": "an-reactions", "slug": "react-2", "title": "What gets more attention?", "status": "ready", "summary": "Posts with hashtags, links, questions, videos ...", "html": "<p>Compares posts with and without a feature (hashtags, links, questions, length, posting hour ...) to see which get more attention.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Posts are put in groups by the feature. To be fair to small and large pages, each post is also compared with its own account's usual attention. A test says if the difference is bigger than chance.<\/p>\n<h2>Example<\/h2>\n<p>Posts with a video get twice the typical attention of posts with only text.<\/p>\n<h2>Good to know<\/h2>\n<p>A feature that goes with more attention does not always cause it.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>likes, comments or shares<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Post feature<\/td><td>hashtags, length, url, question, exclamation, punctuation, mentions, post type, hour, weekday, weekend, Facebook page category, country, source, video length, url video, file<\/td><\/tr><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><tr><td>normalization<\/td><td>within actor z, median, log mean, mean<\/td><\/tr><tr><td>feature2<\/td><td>you choose<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Test<\/td><td>Statistical test across groups.<\/td><\/tr><tr><td>Chance<\/td><td>How likely the result is just chance (0 to 1). Below 0.05 means probably real.<\/td><\/tr><tr><td>Difference size<\/td><td>How big the difference between the groups is, from -1 to 1. Close to 0 = none; 0.3 or more = clear.<\/td><\/tr><tr><td>Epsilon squared<\/td><td>Effect size for three or more groups, from 0 to 1 (0.01 small, 0.08 medium, 0.26 large).<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Engagement by post feature (normalized as chosen); click a bar for the posts in that group.<\/p>\n<h2>Method in detail<\/h2>\n<p>Posts are grouped by the feature. For each group: n, mean, median, mean of log(1 + x), and the mean within-author z-score of log(1 + x), which compares each post with its own author's typical post and so removes differences in page size. Two groups are compared with a Mann-Whitney test (rank-biserial effect size); more groups with Kruskal-Wallis (epsilon squared). Groups under the minimum size are flagged.<\/p>\n<p><a href=\"#\" data-app=\"REACT-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "REACT-2"}, {"cat": "an-reactions", "slug": "react-3", "title": "Do certain words get more attention?", "status": "ready", "summary": "Attention for posts with a kind of language", "html": "<p>Whether posts that use a kind of language (for example anger words) get more or less attention than other posts.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Posts are split into those with and without matches from the word list, then compared as in 'What gets more attention?'.<\/p>\n<h2>Example<\/h2>\n<p>Posts with anger words get 30 % more shares than other posts.<\/p>\n<h2>Good to know<\/h2>\n<p>Check the word list first; see 'Kinds of language over time'.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, likes, comments or shares<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Word list<\/td><td>moral_emotional<\/td><\/tr><tr><td>Measure of attention<\/td><td>auto, interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><tr><td>levels<\/td><td>False<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Test<\/td><td>Statistical test.<\/td><\/tr><tr><td>Chance<\/td><td>How likely the result is just chance (0 to 1). Below 0.05 means probably real.<\/td><\/tr><tr><td>Difference size<\/td><td>How big the difference between the groups is, from -1 to 1. Close to 0 = none; 0.3 or more = clear.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Engagement of posts with and without the lexicon; click a bar for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicon matches are counted on whole tokens after normalization. Arabic terms of three letters accept the prefixes و and ال (and combinations with ال); terms of four or more letters also accept clitic prefixes and pronoun or plural suffixes. Multi-word terms are matched as sequences. Rates are matches per 1,000 tokens, computed as a ratio of totals; prevalence is the share of posts with at least one match. Posts with and without matches (or with 0, 1, 2+ matches) are compared with the group comparison engine.<\/p>\n<p><a href=\"#\" data-app=\"REACT-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "REACT-3"}, {"cat": "an-reactions", "slug": "react-4", "title": "Mix of reactions", "status": "ready", "summary": "Shares compared with likes and comments", "html": "<p>The balance between kinds of attention, for example how many shares a post gets for every like.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Shares, comments and likes are divided by each other, for all posts together and for the typical post.<\/p>\n<h2>Example<\/h2>\n<p>On average a post gets 1 share for every 8 likes.<\/p>\n<h2>Good to know<\/h2>\n<p>A high share-to-like ratio often means people pass the post on rather than just agree.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>likes, comments or shares<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Ratios between engagement types over all posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Ratios of shares, comments, likes and reactions, as ratio of totals and as median per post.<\/p>\n<p><a href=\"#\" data-app=\"REACT-4\">Open this analysis in the dashboard<\/a><\/p>", "card": "REACT-4"}, {"cat": "an-reactions", "slug": "react-5", "title": "Love, Haha, Angry and other reactions", "status": "ready", "summary": "Facebook reactions over time", "html": "<p>The share of each Facebook reaction (Love, Haha, Wow, Sad, Angry, Care) and how it changes over time.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Reactions are added up, likes are left out, and each reaction's share is calculated per period.<\/p>\n<h2>Example<\/h2>\n<p>Angry is 40 % of all reactions in the week of the attack, 10 % the week before.<\/p>\n<h2>Good to know<\/h2>\n<p>Only files with Facebook reactions (CrowdTangle, Meta Content Library).<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>Facebook reactions (Love, Haha, Wow, Sad, Angry)<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>Facebook reactions (CrowdTangle, Meta)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Strong reactions (typical post)<\/td><td>Share of Love, Haha, Wow, Sad and Angry that are strong feelings (Angry, Love, Wow, Haha) for the typical post.<\/td><\/tr><tr><td>Strong reactions (all)<\/td><td>Share of all reactions that are strong feelings.<\/td><\/tr><tr><td>Sad and Angry per Wow and Haha<\/td><td>Example: 2 means twice as many Sad and Angry as Wow and Haha.<\/td><\/tr><tr><td>Arousal vs overperforming spearman rho<\/td><td>Rank correlation of high-arousal share with the overperforming score.<\/td><\/tr><tr><td>Arousal vs overperforming p value<\/td><td>p-value of that correlation.<\/td><\/tr><tr><td>Arousal vs overperforming n<\/td><td>Posts in that correlation.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of each Facebook reaction, overall or over time; click for posts that received that reaction.<\/p>\n<h2>Method in detail<\/h2>\n<p>Share of each of the six
