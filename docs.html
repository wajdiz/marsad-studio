<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARSAD Analytics: Help center</title>
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Helvetica,"Noto Naskh Arabic",sans-serif;color:#243543;background:#f5f7f9;font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer}a{color:#0b6a70}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #f19d3d;outline-offset:2px}
.appbar{height:68px;background:#18354c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:16px;position:sticky;top:0;z-index:50}
.brand{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:0}
.brand-mark{width:32px;height:32px;border:3px solid #4ec3b9;border-radius:50%;position:relative;flex:none}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff}
.brand-mark:before{top:2px;left:3px}.brand-mark:after{right:2px;bottom:3px}
.top-right{display:flex;gap:10px;align-items:center}
.topbtn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:18px;min-height:38px;padding:5px 14px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center}
.topbtn.app{background:#f6b44b;border-color:#f6b44b;color:#1c2a35}
.topbtn[aria-pressed=true]{background:#fff;color:#18354c}
.content{padding:26px 34px 60px;max-width:1300px;margin:0 auto}
.page-title{font-size:30px;line-height:1.15;color:#203b4f;margin:0 0 10px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.head-actions{display:flex;gap:10px}
.btn{border:1px solid #a7bbc5;background:#fff;border-radius:9px;min-height:44px;padding:9px 16px;font-weight:700;color:#31566a}
.btn:hover{background:#f4f8fa}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 0 14px;font-size:16px}
.crumbs .sep{color:#8aa0ab;font-size:20px;line-height:1}
.crumbs .lnk{border:0;background:none;color:#0b6a70;font-weight:700;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.crumbs .here{font-weight:800;color:#203b4f}
.backbtn{border:1px solid #c6d6db;background:#fff;color:#0b6a70;border-radius:8px;min-height:38px;padding:6px 14px;font-weight:700;font-size:14.5px;margin-right:10px}
.sec-band{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;background:color-mix(in srgb,var(--sec) 9%,#fff);border-left:6px solid var(--sec);margin-bottom:18px}
.sec-band .sec-ico{width:46px;height:46px;border-radius:12px;background:var(--sec);color:#fff;display:grid;place-items:center;flex:none}
.sec-band .sec-ico svg{width:26px;height:26px}.sec-band .page-title{margin:0}.sec-q{color:#4f6673;font-size:15.5px;margin-top:2px}
.sec-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--sec);margin-bottom:2px}
.sec-tag svg{width:18px;height:18px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid #dce4e9;flex-wrap:wrap;max-width:900px}
.pager .btn{max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pager .pos{font-size:14.5px;color:#586a77}
.msg{padding:16px 18px;border-radius:12px;background:#f3f5f7;border:1px solid #dfe5ea}
body.bigtext{font-size:18.5px}body.bigtext .page-title{font-size:34px}body.bigtext .crumbs{font-size:18px}
@media(max-width:700px){.content{padding:16px 12px 40px}.appbar{padding:0 12px}.brand span.t{display:none}}
/* MARSAD Help center (works inside the dashboard and on the standalone docs page) */
.hc-search{margin:6px 0 26px}
.hc-search input{width:100%;max-width:760px;padding:16px 18px;font-size:18px;border:1px solid #b9cbd4;border-radius:12px;background:#fff;box-shadow:0 2px 9px rgba(19,45,62,.05)}
.hc-group{font-size:21px;color:#203d51;margin:26px 0 12px}
.hc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.hc-card{background:#fff;border:1px solid #dce4e9;border-radius:12px;box-shadow:0 2px 9px rgba(19,45,62,.05);padding:16px 18px;border-top:4px solid var(--sec,#2f6db3)}
.hc-card-head{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:0 0 12px;margin-bottom:8px;border-bottom:2px solid color-mix(in srgb,var(--sec,#2f6db3) 35%,#fff);text-align:left}
.hc-ico{width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--sec,#2f6db3) 13%,#fff);color:var(--sec,#2f6db3);display:grid;place-items:center;flex:none}
.hc-ico svg{width:24px;height:24px}
.hc-ct{font-size:19px;font-weight:800;color:var(--sec,#2f6db3);flex:1}
.hc-n{min-width:40px;height:40px;border-radius:50%;background:var(--sec,#2f6db3);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px}
.hc-card ul{list-style:none;margin:0;padding:0}
.hc-card li{padding:6px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hc-link{border:0;background:none;padding:0;color:#2a4a5c;font-size:15.5px;text-align:left}
.hc-link:hover,.hc-more:hover{text-decoration:underline;color:var(--sec,#0b6a70)}
.hc-more{border:0;background:none;padding:6px 0 0;color:var(--sec,#0b6a70);font-weight:700;font-size:14.5px}
.hc-st{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;vertical-align:2px}
.hc-placeholder{background:#eef1f3;color:#5d6b75}.hc-planned,.hc-service{background:#fff4de;color:#9a5b00}.hc-server{background:#eef3f9;color:#2f5f8a}
.hc-list{display:flex;flex-direction:column;gap:8px}
.hc-row{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid #dce4e9;background:#fff;border-radius:10px;padding:12px 16px}
.hc-row:hover{border-color:#a7ceca;background:#fbfefe}
.hc-rt{font-size:16.5px;font-weight:700;color:#21404f}.hc-rs{font-size:14.5px;color:#5f7380}
.hc-count{color:#5f7380;font-size:14.5px}
.hc-banner{padding:12px 16px;border-radius:10px;margin:0 0 16px;font-size:15px;border:1px solid #dfe5ea}
.hc-banner.hc-placeholder{border-color:#dfe5ea}.hc-banner.hc-planned,.hc-banner.hc-service{border-color:#f2dcaf}.hc-banner.hc-server{border-color:#c9d8ef}
.hc-body{background:#fff;border:1px solid #dce4e9;border-radius:12px;padding:22px 26px;font-size:16.5px;line-height:1.6;color:#2b3f4c;max-width:900px}
.hc-body h2{font-size:19px;color:#203d51;margin:22px 0 8px}.hc-body h2:first-child{margin-top:0}
.hc-body h3{font-size:16.5px;margin:16px 0 6px}
.hc-body p{margin:0 0 12px}.hc-body ul,.hc-body ol{margin:0 0 12px;padding-left:24px}.hc-body li{margin:5px 0}
.hc-body a{color:#0b6a70;font-weight:700}
.hc-body code{background:#f1f5f6;padding:1px 5px;border-radius:4px;font-size:.92em}
.hc-body .tw{overflow-x:auto;margin:0 0 14px}
.hc-body table{border-collapse:collapse;width:100%;font-size:15px}
.hc-body th,.hc-body td{border-bottom:1px solid #edf0f2;padding:8px 10px;text-align:left;vertical-align:top}
.hc-body th{background:#f4f7f8;color:#4d6774}
.hc-body .note{background:#f4f8f9;border-left:4px solid #9fb7c0;padding:10px 14px;border-radius:6px;margin:0 0 12px;color:#3f5966}
.hc-faq{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px 26px}
.hc-faq h3{font-size:16px;color:#4b6573;margin:6px 0}
.hc-faq details{background:#fff;border:1px solid #dce4e9;border-radius:10px;margin:0 0 8px;padding:10px 14px}
.hc-faq summary{cursor:pointer;font-weight:700;color:#21404f;font-size:15.5px}
.hc-faq p{margin:8px 0 2px;color:#3f5966;font-size:15px}
.hc-faq a{color:#0b6a70;font-weight:700}
.hc-foot{color:#4f6371;font-size:13px;margin-top:28px}
body.bigtext .hc-body{font-size:19px}body.bigtext .hc-link,body.bigtext .hc-rs{font-size:17px}body.bigtext .hc-rt{font-size:19px}
</style></head>
<body>
<header class="appbar"><button class="brand" id="home"><span class="brand-mark" aria-hidden="true"></span><span class="t">MARSAD Help center</span></button>
<div class="top-right"><button class="topbtn" id="sizebtn" aria-pressed="false">A+ Larger text</button><a class="topbtn app" id="applink" href="index.html">Open the dashboard</a></div></header>
<main class="content" id="main" tabindex="-1"></main>
<script>/* MARSAD Help center: renders docs.json. Used by the dashboard (index.html) and the standalone docs page (docs.html).
   MarsadHelp.init(data, {nav(route), app(cardId), colors, icon(name)})
   routes: {view: "home"} | {view: "cat", id} | {view: "art", slug} | {view: "search", q}
*/
(function () {
  "use strict";
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  let D = null, SOURCE = null, O = {}, TEXT = {};
  const isAr = () => document.documentElement.lang === "ar";
  const tx = (en, ar) => isAr() ? ar : en;
  function useLocale() {
    if (!SOURCE) return;
    if (!isAr() || !SOURCE.ar) { D = SOURCE; }
    else {
      const A = SOURCE.ar;
      D = {...SOURCE,
        groups: SOURCE.groups.map(g => ({...g, title: A.groups[g.id] || g.title})),
        categories: SOURCE.categories.map(c => { const x = A.categories[c.id]; return x ? {...c, title:x[0], intro:x[1]} : c; }),
        articles: SOURCE.articles.map(x => {
          const title = (x.card && A.cards[x.card] && A.cards[x.card][0]) || A.articles[x.slug] || x.title;
          const description = x.card && A.details[x.card];
          const arContent = description ? `<div class="hc-ar-summary"><p>${esc(description.what)}</p><h3>كيف يُحسب التحليل؟</h3><p>${esc(description.how)}</p><h3>تنبيه مهم</h3><p>${esc(description.note)}</p></div>` : '';
          const original = `<details class="hc-en-details"><summary>عرض الدليل التقني الأصلي بالإنجليزية</summary><div lang="en" dir="ltr">${x.html}</div></details>`;
          return {...x,title,summary: description ? description.what : (A.articles[x.slug] || x.summary),
            html: arContent + (description ? original : `<p class="hc-ar-note">تتوفر التفاصيل التقنية لهذه الصفحة بالإنجليزية حاليًا.</p>${original}`)};
        }),
        faq: SOURCE.faq.map(f=>({...f,group:A.faq_groups[f.group] || f.group,q:A.faq[f.q] || f.q,a:esc(A.faq_answers[f.q] || f.a)})),
        status_labels:{...SOURCE.status_labels,...A.status}};
    }
    TEXT = {};
    for(const x of D.articles) TEXT[x.slug] = (x.title + " " + (x.summary || "") + " " + x.html.replace(/<[^>]+>/g, " ")).toLowerCase();
  }
  const SECOF = {"an-data": "data", "an-time": "time", "an-words": "words", "an-topics": "topics", "an-feelings": "feelings",
    "an-framing": "framing", "an-people": "people", "an-reactions": "reactions", "an-spread": "spread", "an-society": "society"};
  const color = cat => (O.colors || {})[SECOF[cat]] || "#2f6db3";
  const icon = n => (O.icon ? O.icon(n) : "");
  const cat = id => D.categories.find(c => c.id === id);
  const arts = id => D.articles.filter(a => a.cat === id);
  const art = slug => D.articles.find(a => a.slug === slug);
  const chip = st => st === "ready" ? "" : `<span class="hc-st hc-${st}">${esc(D.status_labels[st] || st)}</span>`;
  const crumbs = parts => `<nav class="crumbs" aria-label="You are here">${parts.length > 1 ? `<button class="backbtn" data-hgo="${parts[parts.length - 2][1]}">‹ Back to ${esc(parts[parts.length - 2][0])}</button>` : ""}${parts.map(([l, k], i) => i === parts.length - 1 ? `<span class="here" aria-current="page">${esc(l)}</span>` : `<button class="lnk" data-hgo="${k}">${esc(l)}</button><span class="sep" aria-hidden="true">›</span>`).join("")}</nav>`;
  const searchBox = (q = "") => `<div class="hc-search"><input type="search" id="hcq" placeholder="${tx("Search the help center","ابحث في مركز المساعدة")}" aria-label="${tx("Search the help center","ابحث في مركز المساعدة")}" value="${esc(q)}"></div>`;

  function home() {
    const groups = D.groups.map(g => {
      const cs = D.categories.filter(c => c.group === g.id);
      return `<h2 class="hc-group">${esc(g.title)}</h2><div class="hc-grid">${cs.map(c => {
        const list = arts(c.id), show = list.slice(0, 6);
        return `<section class="hc-card" style="--sec:${color(c.id)}"><button class="hc-card-head" data-hgo="cat:${c.id}"><span class="hc-ico">${icon(c.icon)}</span><span class="hc-ct">${esc(c.title)}</span><span class="hc-n" aria-label="${c.count} pages">${c.count}</span></button>
          <ul>${show.map(a => `<li><button class="hc-link" data-hgo="art:${a.slug}">${esc(a.title)}</button>${chip(a.status)}</li>`).join("")}</ul>
          ${list.length > show.length ? `<button class="hc-more" data-hgo="cat:${c.id}">${tx("See all", "عرض الكل")} ${list.length}</button>` : ""}</section>`;
      }).join("")}</div>`;
    }).join("");
    const fg = [...new Set(D.faq.map(f => f.group))];
    const faq = `<h2 class="hc-group" id="hc-faq">${tx("Frequently asked questions", "الأسئلة الشائعة")}</h2><div class="hc-faq">${fg.map(g => `<div><h3>${esc(g)}</h3>${D.faq.filter(f => f.group === g).map(f => `<details><summary>${esc(f.q)}</summary><p>${f.a}</p></details>`).join("")}</div>`).join("")}</div>`;
    return `<h1 class="page-title">${tx("Help center", "مركز المساعدة")}</h1>${searchBox()}${groups}${faq}<p class="hc-foot">${tx(`MARSAD Analytics v${esc(D.version)} documentation`, `دليل MARSAD Analytics الإصدار ${esc(D.version)}`)}</p>`;
  }

  function category(id) {
    const c = cat(id); if (!c) return home();
    return `${crumbs([[tx("Help center", "مركز المساعدة"), "home"], [c.title, "cat:" + id]])}
      <div class="sec-band" style="--sec:${color(id)}"><span class="sec-ico">${icon(c.icon)}</span><div><h1 class="page-title">${esc(c.title)}</h1>${c.intro ? `<div class="sec-q">${esc(c.intro)}</div>` : ""}</div></div>
      <div class="hc-list">${arts(id).map(a => `<button class="hc-row" data-hgo="art:${a.slug}"><span class="hc-rt">${esc(a.title)} ${chip(a.status)}</span><span class="hc-rs">${esc(a.summary || "")}</span></button>`).join("")}</div>`;
  }

  function article(slug) {
    const a = art(slug); if (!a) return home();
    const c = cat(a.cat), list = arts(a.cat), i = list.findIndex(x => x.slug === slug), prev = list[i - 1], next = list[i + 1];
    return `${crumbs([[tx("Help center", "مركز المساعدة"), "home"], [c.title, "cat:" + c.id], [a.title, "art:" + slug]])}
      <div class="sec-tag" style="--sec:${color(c.id)}">${icon(c.icon)}${esc(c.title)}</div>
      <div class="title-row"><h1 class="page-title">${esc(a.title)}</h1><div class="head-actions">${a.card && a.status !== "planned" ? `<button class="btn" data-app="${esc(a.card)}">${tx("Open in the dashboard","فتح في لوحة التحليلات")}</button>` : ""}</div></div>
      ${a.status !== "ready" ? `<div class="hc-banner hc-${a.status}">${esc(D.status_labels[a.status])}${a.status === "placeholder" ? ": this part of MARSAD is not built yet." : a.status === "server" ? ": runs in the Colab notebook or on the MARSAD server, or on files that already have the labels." : a.status === "service" ? ": runs when the MARSAD service is connected, or on files that already have the labels." : ": shown in the dashboard as a placeholder."}</div>` : ""}
      <article class="hc-body">${a.html}</article>
      <nav class="pager" aria-label="Other pages in ${esc(c.title)}">${prev ? `<button class="btn" data-hgo="art:${prev.slug}">‹ ${esc(prev.title)}</button>` : `<button class="btn" data-hgo="cat:${c.id}">‹ ${esc(c.title)}</button>`}<span class="pos">${i + 1} of ${list.length} in ${esc(c.title)}</span>${next ? `<button class="btn" data-hgo="art:${next.slug}">${esc(next.title)} ›</button>` : `<button class="btn" data-hgo="home">${tx("Help center", "مركز المساعدة")} ›</button>`}</nav>`;
  }

  function search(q) {
    const t = q.trim().toLowerCase();
    if (!t) return home();
    const words = t.split(/\s+/);
    const hits = D.articles.map(a => {
      const title = a.title.toLowerCase(), body = TEXT[a.slug];
      let score = 0;
      for (const w of words) { if (title.includes(w)) score += 5; if ((a.summary || "").toLowerCase().includes(w)) score += 2; if (body.includes(w)) score += 1; else if (!title.includes(w)) return null; }
      return {a, score};
    }).filter(Boolean).sort((x, y) => y.score - x.score).slice(0, 40);
    const fq = D.faq.filter(f => words.every(w => (f.q + " " + f.a).toLowerCase().includes(w)));
    return `${crumbs([[tx("Help center", "مركز المساعدة"), "home"], [tx("Search", "بحث"), "home"]])}<h1 class="page-title">${tx("Search", "بحث")}</h1>${searchBox(q)}
      <p class="hc-count">${hits.length} page${hits.length === 1 ? "" : "s"}${fq.length ? ` and ${fq.length} question${fq.length === 1 ? "" : "s"}` : ""}</p>
      <div class="hc-list">${hits.map(({a}) => `<button class="hc-row" data-hgo="art:${a.slug}"><span class="hc-rt">${esc(a.title)} ${chip(a.status)}</span><span class="hc-rs">${esc(cat(a.cat).title)} · ${esc(a.summary || "")}</span></button>`).join("")}</div>
      ${fq.length ? `<div class="hc-faq"><div>${fq.map(f => `<details open><summary>${esc(f.q)}</summary><p>${f.a}</p></details>`).join("")}</div></div>` : ""}`;
  }

  function render(route) {
    if (!SOURCE) return `<div class="msg grey">${tx("Loading the help center…","جارٍ تحميل مركز المساعدة…")}</div>`;
    useLocale();
    if (route.view === "cat") return category(route.id);
    if (route.view === "art") return article(route.slug);
    if (route.view === "search") return search(route.q || "");
    return home();
  }

  function bind(root) {
    root.querySelectorAll("[data-hgo]").forEach(b => b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      const k = b.dataset.hgo;
      O.nav(k === "home" ? {view: "home"} : k.startsWith("cat:") ? {view: "cat", id: k.slice(4)} : {view: "art", slug: k.slice(4)});
    }));
    root.querySelectorAll("[data-doc]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); O.nav({view: "art", slug: b.dataset.doc}); }));
    root.querySelectorAll("[data-app]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); O.app(b.dataset.app); }));
    const q = root.querySelector("#hcq");
    if (q) {
      let t = null;
      q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => O.nav({view: "search", q: q.value}, true), 250); });
      if (q.value) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
  }

  function routeFromHash(h) {          // "help", "help/c/<id>", "help/a/<slug>", "help/s/<query>"
    const p = h.replace(/^#?/, "").split("/");
    if (p[1] === "c") return {view: "cat", id: p[2]};
    if (p[1] === "a") return {view: "art", slug: p[2]};
    if (p[1] === "s") return {view: "search", q: decodeURIComponent(p.slice(2).join("/"))};
    return {view: "home"};
  }
  function hashFor(r) {
    return "help" + (r.view === "cat" ? "/c/" + r.id : r.view === "art" ? "/a/" + r.slug : r.view === "search" ? "/s/" + encodeURIComponent(r.q || "") : "");
  }

  window.MarsadHelp = {
    init(data, opts) { SOURCE = data; O = opts || {}; useLocale(); },
    ready: () => !!D, render, bind, routeFromHash, hashFor,
    slugForCard: id => D && D.articles.some(a => a.card === id) ? id.toLowerCase() : null,
  };
})();
</script>
<script>
"use strict";
const DATA = {"version": "1.5", "groups": [{"id": "start", "title": "Start here"}, {"id": "data", "title": "Your data"}, {"id": "analyses", "title": "Analyses"}, {"id": "tools", "title": "Results and tools"}, {"id": "account", "title": "Account and platform"}], "categories": [{"id": "getting-started", "group": "start", "title": "Getting started", "icon": "home", "intro": "What the tool does and how to run your first analysis.", "count": 17, "ready": 17}, {"id": "data-management", "group": "data", "title": "Data management", "icon": "file", "intro": "Loading, cleaning, combining and comparing files.", "count": 15, "ready": 13}, {"id": "an-data", "group": "analyses", "title": "Check my data", "icon": "check", "intro": "Is my file complete and clean?", "count": 8, "ready": 8}, {"id": "an-time", "group": "analyses", "title": "When", "icon": "clock", "intro": "When did people post?", "count": 8, "ready": 8}, {"id": "an-words", "group": "analyses", "title": "Words", "icon": "text", "intro": "What words did people use?", "count": 13, "ready": 12}, {"id": "an-topics", "group": "analyses", "title": "Topics", "icon": "topics", "intro": "What were people talking about?", "count": 5, "ready": 2}, {"id": "an-feelings", "group": "analyses", "title": "Feelings and tone", "icon": "heart", "intro": "How did people feel, and how did they talk?", "count": 8, "ready": 7}, {"id": "an-framing", "group": "analyses", "title": "Ways of speaking", "icon": "quote", "intro": "How was the message framed?", "count": 10, "ready": 10}, {"id": "an-people", "group": "analyses", "title": "People", "icon": "people", "intro": "Who was posting, and who talks to whom?", "count": 8, "ready": 8}, {"id": "an-reactions", "group": "analyses", "title": "Reactions", "icon": "react", "intro": "How did people respond?", "count": 10, "ready": 10}, {"id": "an-spread", "group": "analyses", "title": "Spread and facts", "icon": "spread", "intro": "How did messages spread, and are they true?", "count": 11, "ready": 10}, {"id": "an-society", "group": "analyses", "title": "Society", "icon": "society", "intro": "What does it say about society?", "count": 17, "ready": 17}, {"id": "results", "group": "tools", "title": "Results, downloads and reports", "icon": "report", "intro": "Reading results, seeing the posts behind them, downloads and reports.", "count": 9, "ready": 9}, {"id": "word-lists", "group": "tools", "title": "Word lists", "icon": "text", "intro": "How word-list analyses work, and how to check or add a list.", "count": 8, "ready": 8}, {"id": "models", "group": "tools", "title": "Models and MARSAD services", "icon": "spread", "intro": "Analyses that use language models or MARSAD services.", "count": 1, "ready": 0}, {"id": "account", "group": "account", "title": "Account management", "icon": "people", "intro": "Signing in, teams, API keys and plans.", "count": 5, "ready": 0}, {"id": "about", "group": "account", "title": "About MARSAD", "icon": "home", "intro": "Citing MARSAD, contact, terms and what changed.", "count": 5, "ready": 2}], "articles": [{"cat": "getting-started", "slug": "what-is-marsad-analytics", "title": "What is MARSAD Analytics?", "status": "ready", "summary": "What the tool does, what it reads, and where it runs.", "html": "<p>MARSAD Analytics turns a file of social media posts into charts, tables and short findings. It is part of the MARSAD Observatory for Arabic social media analysis and works with Arabic, English and many other languages.<\/p>\n<p>You load an export (CrowdTangle, Meltwater, Meta Content Library, X, Reddit through Communalytic, or any table with a text column). The tool checks what the file contains and shows which analyses can run on it. There are 82 analyses in ten sections: Check my data, When, Words, Topics, Feelings and tone, Ways of speaking, People, Reactions, Spread and facts, and Society.<\/p>\n<p>Three ways to use it:<\/p>\n<div class='tw'><table><thead><tr><th>Where<\/th><th>For<\/th><th>Limits<\/th><\/tr><\/thead><tbody><tr><td>Web dashboard<\/td><td>Most users. Nothing to install.<\/td><td>About 50,000 posts per session; language models do not run in the browser<\/td><\/tr><tr><td>Colab notebook<\/td><td>Larger files and the language models (sentiment, emotion, toxicity, dialect)<\/td><td>Needs a Google account<\/td><\/tr><tr><td>MARSAD server<\/td><td>Searching the MARSAD corpus<\/td><td>In the MARSAD platform, not here: see <a href=\"#\" data-doc=\"where-posts-come-from\">Where the posts come from<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p>All three run the same code, so the same file gives the same numbers everywhere.<\/p>"}, {"cat": "getting-started", "slug": "quick-start", "title": "Quick start: your first analysis", "status": "ready", "summary": "Load a file and read your first result in seven steps.", "html": "<ol><li>Open the dashboard and wait until the status at the top right shows <b>Ready<\/b>. The first visit takes up to a minute.<\/li><li>Drop your file on the box, or click it to choose a file. To try the tool first, click one of the <b>Practice files<\/b>: CrowdTangle, Meltwater, Reddit and Meta are mostly Arabic with some English, and <b>English (X)<\/b> is English only, for trying the tool without Arabic.<\/li><li>Click <b>Analyse<\/b>.<\/li><li>The <b>Overview<\/b> shows the number of posts and accounts, the main language, the dates, posts over time, the most used words and how concentrated the voices are.<\/li><li>Pick a section from the menu on the left, for example <b>Society<\/b>. Each tile is one analysis. <b>Ready<\/b> means it can run on your file.<\/li><li>Click a tile. The result shows key numbers, a chart and a table. Click any bar or point to read the posts behind it.<\/li><li>Click <b>+ Report<\/b> to keep a result, then open <b>My report<\/b> to download all kept results as one page.<\/li><\/ol>\n<p>Hover the small <b>i<\/b> next to any title, number or column for an explanation in plain words.<\/p>"}, {"cat": "getting-started", "slug": "finding-your-way", "title": "Finding your way around", "status": "ready", "summary": "Menu, colours, the You are here trail, Previous and Next, appearance.", "html": "<ul><li><b>Menu.<\/b> The left menu lists the ten sections. The number beside each (for example 6/8) is how many of its<\/li><\/ul>\n<p>analyses can run on your file. On a phone the menu becomes a row of buttons at the top.<\/p>\n<ul><li><b>Colours.<\/b> Each section has its own colour. The same colour marks its menu icon, its tiles, its page header and<\/li><\/ul>\n<p>the label above each analysis title, so you always know which section you are in.<\/p>\n<ul><li><b>You are here.<\/b> At the top of every page a trail such as Overview › Society › Moral values shows where you are.<\/li><\/ul>\n<p>Click any part of the trail, or the <b>Back<\/b> button, to go up.<\/p>\n<ul><li><b>Previous and Next.<\/b> At the bottom of each analysis, buttons take you to the previous or next analysis in the<\/li><\/ul>\n<p>same section, with your position (for example 9 of 17).<\/p>\n<ul><li><b>All analyses.<\/b> Lists every analysis with a search box.<\/li><li><b>Help.<\/b> The i marks open short help. This Help center has the full guide for every analysis.<\/li><li><b>Appearance.<\/b> The <b>Appearance<\/b> button in the top bar holds how much is on show, text size and contrast.<\/li><\/ul>\n<p>The page remembers all three.<\/p>\n<ul><li><b>Your file.<\/b> The amber button at the top shows the file you are working on. Click it to add or change files.<\/li><\/ul>"}, {"cat": "getting-started", "slug": "how-much-to-show", "title": "How much to show: Simple, Easy read, Expert", "status": "ready", "summary": "Three ways to show the tool, what Simple leaves out, and why no number changes when you switch.", "html": "<p>The <b>Appearance<\/b> button in the top bar sets how much of MARSAD is on screen. It changes what you see and nothing else. No count, percentage, denominator, confidence interval or caveat differs between the three. An analysis you have already run is not run again when you switch.<\/p>\n<div class='tw'><table><thead><tr><th>Mode<\/th><th>What you get<\/th><\/tr><\/thead><tbody><tr><td>Simple<\/td><td>A starting selection of analyses, the ones most files need first. Each with its plain explanation.<\/td><\/tr><tr><td>Easy read<\/td><td>The same selection, with larger text, more space between things, and controls big enough to hit.<\/td><\/tr><tr><td>Expert<\/td><td>Every analysis your file supports.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Simple shows a selection, and says so.<\/b> Under each section it tells you how many analyses it is showing and how many more run on your file, with <b>More analyses<\/b> to show the rest. Choosing a few analyses to put first is an editorial judgement, not a statistical one, so the tool states it rather than leaving you to notice. The selection is the same set the drafted report falls back to when your report is empty, so the dashboard and the report tell one story.<\/p>\n<p>If a section has none of the selected analyses, Simple shows that section in full instead of showing you an empty page.<\/p>\n<p><b>Easy read is a presentation choice, not a label about you.<\/b> It is there for anyone who wants bigger text and more room, for any reason.<\/p>\n<p><b>Text size and contrast are separate.<\/b> Both work in every mode and are remembered on their own, so you can have Expert with large text and high contrast. <b>Reset appearance<\/b> puts all three back.<\/p>\n<p><b>This is not the same as the Show all switch.<\/b> That one answers a different question: whether to list the analyses that cannot run on your file. The two work independently.<\/p>"}, {"cat": "getting-started", "slug": "reading-a-result", "title": "Reading a result page", "status": "ready", "summary": "Key numbers, chart and table, notes, options, downloads.", "html": "<p>Every analysis page has the same parts, from top to bottom:<\/p>\n<div class='tw'><table><thead><tr><th>Part<\/th><th>What it is<\/th><\/tr><\/thead><tbody><tr><td>Section label and title<\/td><td>The section colour and name, then the analysis name. The i beside the title opens its full explanation<\/td><\/tr><tr><td>Key numbers<\/td><td>Up to six numbers. Hover the i on each for what it means<\/td><\/tr><tr><td>Chart / Table<\/td><td>Switch between the chart and the tables. Some analyses have extra charts, shown as more buttons<\/td><\/tr><tr><td>Notes<\/td><td>Limits of this result for this file, for example a small sample or a word list that is not validated<\/td><\/tr><tr><td>Options<\/td><td>Change the settings of the analysis, for example split the results by time or by account<\/td><\/tr><tr><td>Download<\/td><td>Excel, CSV, the chart as PNG or SVG, and for networks a file for Gephi<\/td><\/tr><tr><td>+ Report<\/td><td>Keeps the result for <a href=\"#\" data-doc=\"my-report\">My report<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Click a bar, point, word or table row to see <a href=\"#\" data-doc=\"posts-behind-results\">the posts behind it<\/a>.<\/p>"}, {"cat": "getting-started", "slug": "privacy", "title": "Privacy: where your data goes", "status": "ready", "summary": "Files stay in your browser; check provider terms and ethics approval.", "html": "<p>In the web dashboard your file is read and analysed <b>inside your browser<\/b>. It is not uploaded to MARSAD or to any other server. When you close the page, the data is gone.<\/p>\n<ul><li>Downloads and reports are saved to your own computer.<\/li><li>The page loads nothing from the internet: no fonts, no analytics, no trackers. Everything it needs is served with it,<\/li><\/ul>\n<p>so it also works with the network switched off, and no outside company learns that you opened it.<\/p>\n<ul><li>Two things reach the internet only if you ask for them: the Ask MARSAD chat, which sends your question and the<\/li><\/ul>\n<p>numbers of the results you have run (never the posts) to Claude when the page runs inside claude.ai, and a model or API that you connect yourself for the analyses that need one.<\/p>\n<ul><li>The Colab notebook runs in your Google account, under Google's terms.<\/li><li>Before analysing data from Meta Content Library, Meltwater or other providers, check their terms of use and your<\/li><\/ul>\n<p>institution's ethics approval.<\/p>\n<ul><li>Results about stress, wellbeing or health talk are for groups and periods, never judgments about one person.<\/li><\/ul>"}, {"cat": "data-management", "slug": "where-posts-come-from", "title": "Where the posts come from", "status": "ready", "summary": "Collection happens in the MARSAD platform; Analytics reads the files it produces.", "html": "<p>MARSAD Analytics reads files. This page never connects to a platform itself and holds none of your keys or logins: collection happens elsewhere and Analytics reads what it produces. The MARSAD platform's own data collection section gathers public posts into the MARSAD corpus; for the platforms that give researchers no usable export, a browser extension can record what you see as you browse.<\/p>\n<div class='tw'><table><thead><tr><th>You have<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>A MARSAD collection<\/td><td>Download the finished collection and load the file<\/td><\/tr><tr><td>A research tool (Meltwater, CrowdTangle archive, Meta Content Library, Communalytic, a platform export)<\/td><td>Export a CSV or Excel file and load it: see <a href=\"#\" data-doc=\"supported-exports\">Supported exports<\/a><\/td><\/tr><tr><td>Nothing yet, and the source has an API<\/td><td>Collect it in the MARSAD platform and load the dataset: see <a href=\"#\" data-doc=\"platform-collectors\">Collecting with the MARSAD platform<\/a><\/td><\/tr><tr><td>Nothing yet, and the platform has no usable API (TikTok and others)<\/td><td>Record what you browse with Zeeschuimer, then load its file: see <a href=\"#\" data-doc=\"collecting-with-zeeschuimer\">Collecting TikTok posts with Zeeschuimer<\/a><\/td><\/tr><tr><td>Your own table<\/td><td>Any CSV, Excel or JSON with a text column works: see <a href=\"#\" data-doc=\"importing-files\">Importing your files<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Keeping collection outside this page keeps your keys and logins out of it: anything typed into a web page can be read by scripts running on it. This is why MARSAD does not offer an API-key form here.<\/p>"}, {"cat": "getting-started", "slug": "languages", "title": "Which languages each analysis works in", "status": "ready", "summary": "Counts, time, accounts and networks work in any language; word lists are Arabic and English; each analysis carries a label.", "html": "<p>Most of MARSAD Analytics does not care what language your posts are in. Counts, dates, accounts, engagement, replies, links, hashtags, duplicate text and coordination all work on any language, because they count structure rather than meaning. The analyses that read meaning are the ones with a language limit, and those limits are real: an Arabic word list finds nothing in English, and a model trained on Arabic should not be pointed at English text.<\/p>\n<p>Every analysis carries a label on its tile, and the full statement sits under <b>Method<\/b> on its own page. The five labels mean:<\/p>\n<div class='tw'><table><thead><tr><th>Label<\/th><th>Analyses<\/th><th>Which ones<\/th><\/tr><\/thead><tbody><tr><td>Any language<\/td><td>44<\/td><td>DATA-1, DATA-3, DATA-6, DATA-7, DATA-8, PAPER-1, PAPER-2, PAPER-3, REACT-1, REACT-2, REACT-4, REACT-5, REACT-6, REACT-7, REACT-8, REACT-9, REACT-10, SOCIETY-2, SPREAD-2, SPREAD-3, SPREAD-4, SPREAD-5, SPREAD-6, SPREAD-10, SPREAD-11, SPREAD-12, SPREAD-13, TIME-1, TIME-2, TIME-3, TIME-4, TIME-6, TIME-7, TIME-8, WHO-1, WHO-2, WHO-3, WHO-4, WHO-5, WHO-6, WHO-7, WHO-8, WHO-10, WORDS-9<\/td><\/tr><tr><td>Any language written with spaces between words (not Chinese, Japanese or Thai)<\/td><td>16<\/td><td>DATA-2, DATA-4, DATA-5, FRAME-6, SPREAD-1, TIME-5, TOPIC-1, TOPIC-2, WORDS-1, WORDS-2, WORDS-3, WORDS-4, WORDS-5, WORDS-6, WORDS-7, WORDS-8<\/td><\/tr><tr><td>Arabic and English (MARSAD lexicons); other languages need your own word list (FRAME-6)<\/td><td>26<\/td><td>FRAME-1, FRAME-2, FRAME-3, FRAME-4, FRAME-5, FRAME-19, FRAME-20, REACT-3, SOCIETY-1, SOCIETY-3, SOCIETY-4, SOCIETY-5, SOCIETY-6, SOCIETY-7, SOCIETY-8, SOCIETY-9, SOCIETY-10, SOCIETY-11, SOCIETY-12, SOCIETY-13, SOCIETY-14, SOCIETY-15, SOCIETY-16, SOCIETY-17, WHO-9, WORDS-12<\/td><\/tr><tr><td>Languages of the model (listed on the card)<\/td><td>15<\/td><td>FRAME-7, FRAME-8, FRAME-9, FRAME-10, FRAME-11, FRAME-12, FRAME-13, FRAME-14, SPREAD-7, SPREAD-8, SPREAD-9, SPREAD-14, TOPIC-3, TOPIC-4, TOPIC-5<\/td><\/tr><tr><td>Arabic only<\/td><td>12<\/td><td>DIALECT-1, DIALECT-2, DIALECT-3, FRAME-15, FRAME-16, FRAME-17, FRAME-18, FRAME-21, FRAME-22, WORDS-10, WORDS-11, WORDS-13<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>What the labels mean<\/h2>\n<p><b>Any language.<\/b> Nothing in the analysis depends on the words themselves. Safe on any file.<\/p>\n<p><b>Any language written with spaces between words.<\/b> Words are split on spaces and punctuation. Fine for English, Arabic, French, Indonesian and most others. Not meaningful for Chinese, Japanese or Thai, which are written without spaces; MARSAD says so on the result when it sees much of that text in your file.<\/p>\n<p><b>Arabic and English word lists.<\/b> The MARSAD word lists were built for Arabic, with a thinner English list beside them. On an English-only file these analyses still run, but only the English list is doing anything, and MARSAD says so on the result. For another language, build your own list with <b>Your own word list (FRAME-6)<\/b>, which works in any language.<\/p>\n<p><b>Languages of the model.<\/b> The analysis sends your posts to a classifier. Which languages it handles is the model's property, not MARSAD's, and the card names the model. Connect an English or multilingual model and these analyses work in that language.<\/p>\n<p><b>Arabic only.<\/b> The word list or model behind the analysis is Arabic and has no equivalent for other languages. Run one of these on a file that is mostly not Arabic and it will produce a near-empty chart. MARSAD puts a notice at the top of the result saying what share of your posts is actually Arabic.<\/p>\n<h2>Two word lists you can use but not download<\/h2>\n<p>The MADAR regional lists and the NileULex sentiment lists come from other research groups. MARSAD has the right to use them, and the analyses built on them work normally. What the browser build carries is a sealed copy: a keyed hash of each term and none of the terms themselves. Matching is a membership test, so every number is the same as it would be with the lists in the clear; there is simply no word list in the download. If you need the lists themselves for your own work, get them from their own distributors under their own terms.<\/p>\n<h2>Trying it without Arabic<\/h2>\n<p>The start page offers an <b>English (X)<\/b> practice file: around 1,500 invented English posts about an invented city transport debate, in X (Twitter) export shape. It has the things the analyses look for, including a burst of identical campaign wording and some reply threads, so you can see what each one produces before you load your own data.<\/p>\n<h2>The interface itself<\/h2>\n<p>The interface is in English and Arabic. The language of the interface is separate from the language of your posts: you can read the interface in Arabic while analysing English posts, or the other way round.<\/p>"}, {"cat": "getting-started", "slug": "what-was-audited", "title": "What an outside audit found, and what changed", "status": "ready", "summary": "The 7 November 2026 audit's sixteen findings, the five defects fixed, and what is labelled exploratory instead.", "html": "<p>An independent audit of version 1.5 on 7 November 2026 reported sixteen findings. Five were reproducible calculation or crash defects; the rest were limits on what the figures support, a licensing question about two word lists, and checks that can only be done on a deployed site. Every reproducible defect is fixed and each has a test that fails on the old code. This article says what they were, because a reader who used the tool before these fixes may have numbers that need checking.<\/p>\n<div class='tw'><table><thead><tr><th>What was wrong<\/th><th>What it affected<\/th><th>Now<\/th><\/tr><\/thead><tbody><tr><td><b>Check on my data<\/b> pooled the judged posts without weighting<\/td><td>The sample takes about the same number of posts from every predicted label, so rare labels are over-represented. The overall accuracy was the average of the label rates, not the rate across your posts. In one test a model right on 90% of posts was reported at 50%.<\/td><td>The overall rate is weighted by how common each label is, and the figure says so. The unweighted number is still shown beside it.<\/td><\/tr><tr><td>A comparison of two shares had a zero-width range at the extremes<\/td><td>Comparing 0 of 20 against 20 of 20 gave a 95% range of exactly 100 to 100 points, which claimed certainty no sample of that size can support.<\/td><td>The range is now Newcombe's score interval, checked against an independent implementation. The same comparison gives 77 to 100 points.<\/td><\/tr><tr><td>A confidence filter changed the chart but not the stated basis<\/td><td>With a filter set, a chart drawn from one post said it was based on three. Percentages used the wrong denominator.<\/td><td>The basis, the chart title and the percentage toggle all use the number above the filter, and the title names the filter.<\/td><\/tr><tr><td><b>Social cohesion<\/b> failed when every reviewed post was toxic<\/td><td>The analysis returned an error instead of a civil-tone score of 0%.<\/td><td>It returns the score.<\/td><\/tr><tr><td>An annotation sheet with a value other than 0 or 1 crashed<\/td><td>The error came from inside the statistics and said nothing about the sheet.<\/td><td>The sheet is checked first, and the message names the column, the bad values and what to do. Duplicate post ids and mixed word lists are refused too.<\/td><\/tr><tr><td>The percentage toggle divided every chart by the number of posts<\/td><td>A chart counting word matches or reactions can exceed the number of posts, so the percentages were of nothing.<\/td><td>A chart states its own denominator where it knows one; otherwise the toggle checks that the numbers fit and leaves the chart in counts if they do not.<\/td><\/tr><tr><td>The offensive-language model used three group words as features<\/td><td>The model card said group words are not used as features. Three inflected forms had slipped through, each raising the score, so naming a group pushed a post toward offensive.<\/td><td>The model was retrained with those forms excluded. Accuracy is unchanged (macro F1 0.752 against 0.754). A test now asserts that removing a group word from a sentence does not move the score.<\/td><\/tr><tr><td>Two research word lists were downloadable from the public bundle<\/td><td>Anything in the bundle lands on the reader's disk, so MADAR and NileULex could be taken out of MARSAD as datasets.<\/td><td>Both still work, but the browser build carries them <b>sealed<\/b>: keyed hashes of the terms and none of the words. Results are identical, checked term by term over all 7,499 entries, and there is no list in the bundle to take.<\/td><\/tr><tr><td>Documented card counts had drifted<\/td><td>The README said 94 entries while the registry held 97.<\/td><td>The counts are checked against the registry by a test.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>What is still exploratory, and says so<\/h2>\n<p>Three things the audit asked to be labelled rather than fixed, because they are limits rather than errors:<\/p>\n<ul><li><b>Word-list analyses.<\/b> No word list has been checked against posts. Any result built on one now opens with an<\/li><\/ul>\n<p>exploratory notice naming the lists and saying the figures count listed words rather than measuring the thing the list is named after. See <a href=\"#\" data-doc=\"checking-word-lists\">Checking a word list<\/a>.<\/p>\n<ul><li><b>adjusted_%_other_dataset.<\/b> This rescales a share by how the model scored on a different set of posts. It<\/li><\/ul>\n<p>only holds if the model errs the same way on yours, and where it does not the adjusted figure can be further from the truth than the plain share. It is dropped entirely once you have judged a sample of your own posts.<\/p>\n<ul><li><b>Social cohesion.<\/b> An average of whichever components your file supports, with no outside measure behind it.<\/li><\/ul>\n<p>The components are now named on the chart and in the notes, and the index should not be compared across files unless both used the same components.<\/p>\n<h2>Tested on a corpus the models never saw<\/h2>\n<p>A follow-up audit on the same day confirmed every fix and asked for model quality on data outside the training collection. The sentiment model was scored on TSAC, a Tunisian Arabic corpus of television comments from 2017 that played no part in training, validation or feature selection:<\/p>\n<div class='tw'><table><thead><tr><th>TSAC test set<\/th><th>Figure<\/th><\/tr><\/thead><tbody><tr><td>Items in the corpus<\/td><td>3,400, of which 1,551 are Arabic script<\/td><\/tr><tr><td>Items the model called positive or negative<\/td><td>1,118<\/td><\/tr><tr><td>Macro F1 on those<\/td><td>0.81<\/td><\/tr><tr><td>Always answering the commoner label<\/td><td>0.53<\/td><\/tr><tr><td>Answered neutral, which TSAC has no label for<\/td><td>28%<\/td><\/tr><tr><td>Accuracy if those neutral answers are counted as wrong<\/td><td>0.59<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The model generalises better here than its own headline figure suggests, because TSAC asks a simpler question: two clear classes rather than three with a hard neutral. The 28% neutral rate is the honest caveat. On TUNIZI, Tunisian written in Latin letters, the language router sends every one of the 3,000 items away from the Arabic model instead of labelling it, which is the behaviour you want.<\/p>\n<p>Full figures: <code>docs/external_validation_v1.5.csv<\/code>, rebuilt by <code>research_tools/external_validation.py<\/code>.<\/p>\n<h2>What has not been tested<\/h2>\n<p>A load test and a penetration test of the hosted site have not been run. The Arabic interface was checked at 390, 768 and 1440 pixels wide, with right-to-left layout, mirrored panels and right-to-left tables confirmed; chart interiors are drawn by the chart library and do not mirror, and no screen-reader user has tested the tool. No word list has been checked against annotated posts, and the emotion and toxicity models have not been scored on an outside corpus the way sentiment now has.<\/p>\n<h2>Checked on every change<\/h2>\n<p><code>tests/acceptance_pack.json<\/code> holds reference values for one file from each export format, worked out from the cleaned table without any analysis code: row counts, the Gini and Herfindahl concentration measures, the ten and one per cent account shares, the busiest hour, engagement totals, text statistics and the sentiment label mix, each tied to the file's SHA-256 and to the model's vocabulary size. <code>tests/test_acceptance_pack.py<\/code> puts the same questions to the analyses and fails if any answer moves. A GitHub Actions workflow runs that, the regression tests for every audited defect, and the full suite on three Python versions for every change.<\/p>"}, {"cat": "data-management", "slug": "importing-files", "title": "Importing your files", "status": "ready", "summary": "File types, the one column you need, and size.", "html": "<p>Drop one or more files on the box on the start page, or click it to choose them.<\/p>\n<div class='tw'><table><thead><tr><th>File type<\/th><th>Extensions<\/th><\/tr><\/thead><tbody><tr><td>Comma or tab separated<\/td><td>.csv, .tsv, .txt<\/td><\/tr><tr><td>Excel<\/td><td>.xlsx, .xls<\/td><\/tr><tr><td>JSON<\/td><td>.json, .jsonl, .ndjson<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>The only column the tool needs is the <b>text<\/b> of each post. Dates, accounts, likes and other columns switch on<\/li><\/ul>\n<p>more analyses: see <a href=\"#\" data-doc=\"columns-guide\">Which columns unlock which analyses<\/a>.<\/p>\n<ul><li>The tool recognises the export format by its columns: see <a href=\"#\" data-doc=\"supported-exports\">Supported exports<\/a>.<\/li><li>Up to about 50,000 posts in total work well in the browser. For more, see <a href=\"#\" data-doc=\"large-datasets\">Large datasets<\/a>.<\/li><li>To add a file later, click the amber <b>Change or add files<\/b> button at the top.<\/li><\/ul>"}, {"cat": "data-management", "slug": "platform-collectors", "title": "Collecting with the MARSAD platform", "status": "ready", "summary": "The platform's 25 news and social routes, what each needs, and why their text is metadata.", "html": "<p>The MARSAD platform collects from news and social APIs on its own servers and saves the result as a dataset you download and load here. Twenty-five sources are wired up. Your administrator decides which of them run, and turns a source on only once its licence and its live API have been checked, so the list you see in the platform is usually shorter than the list below.<\/p>\n<p>Nothing about this happens in Analytics. No key, token or login is typed into this page, which is deliberate: anything typed into a web page can be read by scripts running on it.<\/p>\n<h2>News, fourteen routes<\/h2>\n<div class='tw'><table><thead><tr><th>Source<\/th><th>What it needs<\/th><\/tr><\/thead><tbody><tr><td>GDELT<\/td><td>Nothing. The one route that works with no credential at all<\/td><\/tr><tr><td>Publisher RSS<\/td><td>Feeds your administrator has added by hand. You cannot point it at an arbitrary address<\/td><\/tr><tr><td>Media Cloud<\/td><td>A key, and the collection ids your administrator has approved<\/td><\/tr><tr><td>Event Registry<\/td><td>A key<\/td><\/tr><tr><td>GNews<\/td><td>A key<\/td><\/tr><tr><td>NewsData.io<\/td><td>A key<\/td><\/tr><tr><td>NewsAPI.org<\/td><td>A key. The free developer tier is not a production licence<\/td><\/tr><tr><td>The Guardian<\/td><td>A key. Check what the licence allows you to republish<\/td><\/tr><tr><td>New York Times<\/td><td>A key. Check what the licence allows you to republish<\/td><\/tr><tr><td>Currents<\/td><td>A key<\/td><\/tr><tr><td>APITube<\/td><td>A key<\/td><\/tr><tr><td>Perigon<\/td><td>A key<\/td><\/tr><tr><td>Webz.io<\/td><td>A key<\/td><\/tr><tr><td>Mediastack<\/td><td>A key<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Social, eleven routes<\/h2>\n<div class='tw'><table><thead><tr><th>Source<\/th><th>What it needs<\/th><\/tr><\/thead><tbody><tr><td>Mastodon<\/td><td>A hashtag, on an instance your administrator has allowed<\/td><\/tr><tr><td>Tumblr<\/td><td>A key<\/td><\/tr><tr><td>X<\/td><td>A paid API tier<\/td><\/tr><tr><td>Threads<\/td><td>A token with keyword-search permission, which Meta grants case by case<\/td><\/tr><tr><td>Facebook<\/td><td>A token for the Pages you have connected. Only those Pages, never Facebook at large<\/td><\/tr><tr><td>Instagram<\/td><td>A token for the professional accounts you have connected. Only those accounts<\/td><\/tr><tr><td>TikTok<\/td><td>A Research API token. TikTok approves these per project, and it lists the United States and Europe as the regions a researcher can apply from, so check eligibility before counting on it<\/td><\/tr><tr><td>Bluesky, Reddit, Telegram, YouTube<\/td><td>Already running in the platform<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Two routes to TikTok, and they are not the same<\/h3>\n<p>The Research API answers a keyword query against TikTok's own index, which supports a sampling claim that browsing cannot. The terms also require you to refresh the data at least every fifteen days and delete anything the API no longer returns, so a TikTok set collected this way is not a fixed archive you can re-analyse a year later. <a href=\"#\" data-doc=\"collecting-with-zeeschuimer\">Zeeschuimer<\/a> needs no approval and no key, and returns the posts you scrolled past. Use the API where you have access and want the query, and Zeeschuimer where you do not, or where what a viewer in a particular place is actually shown is the thing you are studying. Say which one you used; a reader cannot tell from the data.<\/p>\n<p>Meta Content Library is not one of these routes. It needs its own approval and its own access, and a general-purpose collector would misrepresent what it allows.<\/p>\n<h2>The one thing to know before you analyse the result<\/h2>\n<p><b>These routes collect metadata, not content.<\/b> A row holds the headline, the provider's own summary, the link, the outlet, the language and the time. It does not hold the article. For the social routes the post text is there, because on those platforms the post is the whole item.<\/p>\n<p>That matters for what you can claim. Word frequencies, topics, sentiment and tone computed on a news file describe how an item was billed, not what it said, and they are computed over a few dozen words per row rather than a few hundred. MARSAD puts a notice above the numbers whenever it reads such a file, so a reader of your report sees it too. Counts, dates, outlets and languages are unaffected: those are what the routes are good for.<\/p>\n<p>The rights column on every row says <code>metadata_only_check_provider_terms<\/code>. That is a reminder, not a permission. Each provider's own terms decide what you may republish, and they differ.<\/p>\n<h2>What MARSAD reads from the file<\/h2>\n<div class='tw'><table><thead><tr><th>MARSAD column<\/th><th>From the collector<\/th><\/tr><\/thead><tbody><tr><td>text<\/td><td>headline and summary joined, or the post text for a social route<\/td><\/tr><tr><td>created_at<\/td><td>when the item was published<\/td><\/tr><tr><td>collected_at<\/td><td>when the collection ran, kept separate and never used as the post date<\/td><\/tr><tr><td>platform<\/td><td>worked out from the route: all fourteen news routes become <code>news<\/code>, the social ones name themselves<\/td><\/tr><tr><td>source<\/td><td>the outlet, the Mastodon instance or the connected account<\/td><\/tr><tr><td>author<\/td><td>the account, for the routes where the account is what was collected<\/td><\/tr><tr><td>url, language, post_id<\/td><td>as collected<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Known gaps<\/h2>\n<p>The collectors do not yet page through long result sets, back off when a provider rate-limits them, remove the same story arriving under two URLs, or run on a schedule. Treat a collection as one query at one moment, and say so in your method section.<\/p>"}, {"cat": "data-management", "slug": "collecting-with-zeeschuimer", "title": "Collecting TikTok posts with Zeeschuimer", "status": "ready", "summary": "Record TikTok and other platforms in your own browser, then load the capture here.", "html": "<p>TikTok, Instagram and several other platforms give researchers no usable export and block ordinary scraping. Zeeschuimer is a free browser extension from the Digital Methods Initiative at the University of Amsterdam that solves this from the other side: it watches the data the platform sends to your own browser while you scroll, and keeps a copy of every post you saw. You then export that copy and load it here.<\/p>\n<h2>What you need<\/h2>\n<div class='tw'><table><tbody><tr><td>Browser<\/td><td>Firefox, or another Firefox-based browser. Zeeschuimer is a Firefox extension and does not run in Chrome, Edge or Safari<\/td><\/tr><tr><td>Extension<\/td><td>The signed <code>.xpi<\/code> from the <a href=\"https://github.com/digitalmethodsinitiative/zeeschuimer/releases\" target=\"_blank\" rel=\"noopener\">releases page<\/a><\/td><\/tr><tr><td>Account<\/td><td>Your own account on the platform, used normally. Zeeschuimer adds no requests of its own<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The four steps<\/h2>\n<ol><li>Install the extension. A Zeeschuimer button appears in the toolbar. In Firefox you may have to pin it from the extensions menu before you can see it.<\/li><li>Click the button, switch recording on for the platform you want, and browse. Scroll through the feed, a hashtag, a search or an account's page. Everything that appears on screen is recorded locally.<\/li><li>Click the button again when you are done. It lists what was captured, per platform. Export <b>.ndjson (original)<\/b>. That is the full record, for every platform the extension supports. The <b>.csv<\/b> option is the extension's own simplified table and MARSAD reads it too, but the <code>.ndjson<\/code> keeps every field.<\/li><li>Load the file here with <b>Upload your data<\/b>. MARSAD recognises both shapes, reads the platform out of the file, and maps the columns for you.<\/li><\/ol>\n<h2>What MARSAD reads from it<\/h2>\n<div class='tw'><table><thead><tr><th>MARSAD column<\/th><th>From a TikTok capture<\/th><\/tr><\/thead><tbody><tr><td>text<\/td><td>the post caption, hashtags included<\/td><\/tr><tr><td>created_at<\/td><td>the post's own creation time, in UTC<\/td><\/tr><tr><td>collected_at<\/td><td>when you saw it, kept separate and never used as the post date<\/td><\/tr><tr><td>author<\/td><td>the account handle<\/td><\/tr><tr><td>post_id, url<\/td><td>the post id, and a tiktok.com link rebuilt from handle and id<\/td><\/tr><tr><td>likes, comments, shares<\/td><td>the post's counters at the moment you saw it<\/td><\/tr><tr><td>views_post<\/td><td>plays<\/td><\/tr><tr><td>followers<\/td><td>the author's follower count at the moment you saw it<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Engagement counts are a snapshot of the moment of capture, not a final figure. Two captures of the same post days apart will disagree, and that is the platform changing, not an error. If you capture the same posts twice, load both files and MARSAD keeps one row per post: see <a href=\"#\" data-doc=\"combining-files\">Combining files<\/a>.<\/p>\n<h2>The one limit to state in your write-up<\/h2>\n<p>A Zeeschuimer file holds the posts you happened to see, in the order you saw them, through an account the platform's recommender knows. It is a record of one browsing session. It is not a random sample, not a complete set of anything, and it is not reproducible by someone else browsing the same hashtag. This is a legitimate way to study platforms that refuse access, and it is used in published research, but the sampling has to be described rather than left implied. Say what you browsed, from which kind of account, when, and for how long.<\/p>\n<p>Zeeschuimer is maintained by its own team, and platform changes can break a capture module until it is updated. If a file comes out empty or short, check the extension's issues page before suspecting MARSAD.<\/p>\n<p>Zeeschuimer is published under the Mozilla Public License 2.0 and has a DOI, so cite it alongside MARSAD when you use it: 10.5281/zenodo.6826877.<\/p>\n<h2>The other route to TikTok<\/h2>\n<p>MARSAD also has a TikTok Research API collector, in the platform rather than in your browser. It answers a keyword query rather than recording a browsing session, which is a stronger sampling claim, but TikTok approves access per project and lists the United States and Europe as the regions a researcher can apply from. See <a href=\"#\" data-doc=\"platform-collectors\">Collecting with the MARSAD platform<\/a> for which to use when.<\/p>"}, {"cat": "data-management", "slug": "documents-not-posts", "title": "When your data is documents, not posts", "status": "ready", "summary": "Splitting long documents into parts, the four cards for page histories, language versions, readership and papers, and why a citation count is not a like.", "html": "<p>Most of MARSAD assumes a file of many short texts, each written once by an account, with likes and shares attached. Encyclopedia articles, papers, page histories and readership series are none of those things, and the collectors added in v1.5 bring all four. This page covers what changes, what to switch on, and the four cards that read these shapes directly.<\/p>\n<h2>One row per document hides what is in it<\/h2>\n<p>A Wikipedia article collected whole arrives as a single row of tens of thousands of characters. Everything that counts rows then has almost nothing to count: three articles cannot be topic-modelled into anything meaningful, \"how long are the posts\" is one enormous number, and a single sentiment score stands for an entire article.<\/p>\n<p><b>Prepare posts<\/b> now offers <b>Split long documents into parts<\/b>, with two choices:<\/p>\n<div class='tw'><table><thead><tr><th>Choice<\/th><th>What a row becomes<\/th><\/tr><\/thead><tbody><tr><td>By section heading<\/td><td>One row per section, keeping the heading as the part's label. Documents with no headings fall back to paragraphs<\/td><\/tr><tr><td>By paragraph<\/td><td>One row per paragraph, with short paragraphs joined until each is worth analysing<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Rows under 1,200 characters pass through untouched, so a file mixing articles and posts is not disturbed. Every part keeps a link to the document it came from, so a result can always be rolled back up. A part longer than 4,000 characters is cut again at a sentence end, never mid-sentence.<\/p>\n<p>One thing cannot be split. A pageview count or a citation count belongs to the document, not to its third paragraph, so it stays on the first part and the rest are left blank. Totals are therefore unchanged, and an average per part is visibly missing rather than quietly invented. The split is an option like any other on that panel: clear it and the file returns to one row per document.<\/p>\n<h2>Four cards for these shapes<\/h2>\n<p><b>How a page changed (TIME-7).<\/b> From a Wikipedia revision history: the size of the page after every edit, bytes added and removed per period, who did the editing, and which edits were undone. Reverts are read from the edit summary, in English, Arabic, French, Spanish or German wordings, so an unannounced revert is not counted and a summary that merely mentions the word is. This is one page being rewritten, not many people posting, so nothing here is reach or audience.<\/p>\n<p><b>Attention against coverage (TIME-8).<\/b> Load a Wikipedia pageview series together with a file of posts or news articles from the same period. The card lays both on one calendar, then slides coverage up to a week in each direction to see which shift matches readership best. A negative shift means the coverage moved first. Two counts rising together is not one causing the other: usually an event caused both.<\/p>\n<p><b>Same subject, different language (DATA-7).<\/b> From the Wikipedia compare-languages mode: how long each version is, how many sections and links it has, when it was last edited, and which years it names. It compares the shape of the versions, not what they say. Comparing content across languages needs translation or a multilingual model, and neither is run here, so read this as a coverage measure and go to the text itself for the rest. A shorter version is not a worse one: length follows how many editors a language edition has.<\/p>\n<p><b>Venues, authors and citations (WHO-10).<\/b> From OpenAlex or Crossref: papers per year, per venue and per author, and how unevenly citations are spread. Citation counts are the index's figure on the day you collected, and a recent paper has had less time to gather them.<\/p>\n<h2>Numbers that are not engagement<\/h2>\n<p>These sources put a different quantity in the same column. A citation count held in <code>likes<\/code> would otherwise be charted and reported as popularity, so MARSAD renames it wherever it is shown:<\/p>\n<div class='tw'><table><thead><tr><th>Source<\/th><th>Reads as<\/th><\/tr><\/thead><tbody><tr><td>OpenAlex, Crossref<\/td><td>Citations<\/td><\/tr><tr><td>Wikipedia<\/td><td>Pageviews<\/td><\/tr><tr><td>Hacker News<\/td><td>Points<\/td><\/tr><tr><td>Stack Exchange<\/td><td>Score, and Answers for comments<\/td><\/tr><tr><td>Reddit<\/td><td>Score<\/td><\/tr><tr><td>Hugging Face<\/td><td>Downloads<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Cards that use these also carry a line saying what the column really holds, so it reaches your method section rather than stopping at the screen.<\/p>\n<h2>Threads<\/h2>\n<p>YouTube comments and Hacker News comments are collected with a link to the comment they answer, so <b>Conversations and replies<\/b> and <b>Who talks to whom<\/b> work on them as they do on any reply tree. Wikipedia talk pages are collected one discussion section per row, which is the unit editors argue in, rather than as a tree.<\/p>\n<h2>Cards that are not offered here<\/h2>\n<p>The Arabic word lists and the Arabic word models (sentiment, emotions, offensive language, the MADAR and NileULex dialect cards) are now shown only where a file actually contains Arabic. Run on English Wikipedia or on French abstracts they would return confident numbers from a handful of accidental matches, which is worse than returning nothing. If your file is mixed, they run on the Arabic part as before.<\/p>"}, {"cat": "data-management", "slug": "supported-exports", "title": "Supported exports", "status": "ready", "summary": "Meta Content Library, CrowdTangle, Meltwater, Communalytic and any table; tested against full real headers.", "html": "<div class='tw'><table><thead><tr><th>Source<\/th><th>How it is recognised<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Meta Content Library<\/td><td>Its column names (at least three)<\/td><td>Facebook and Instagram; reactions, views, owner type, country of the page admin<\/td><\/tr><tr><td>CrowdTangle (archives)<\/td><td>Its column names<\/td><td>Facebook reactions, page category, followers, overperforming score, video data<\/td><\/tr><tr><td>Meltwater<\/td><td>Its column names<\/td><td>Many platforms in one file (X, Facebook, Instagram, Reddit, YouTube, TikTok, news); reach; Meltwater's own sentiment<\/td><\/tr><tr><td>Reddit through Communalytic<\/td><td>Generic table<\/td><td>Title and body are joined into one text; reply ids give threads and networks<\/td><\/tr><tr><td>MARSAD platform collectors<\/td><td>Its provider and rights columns<\/td><td>News and social routes in one shape; the provider becomes the platform, and the file is flagged as metadata: see <a href=\"#\" data-doc=\"platform-collectors\">Collecting with the MARSAD platform<\/a><\/td><\/tr><tr><td>Zeeschuimer (.ndjson or .csv)<\/td><td>Its envelope columns, or its mapper's columns<\/td><td>TikTok, Instagram, X, Threads and the other platforms it supports; the platform is read from the file: see <a href=\"#\" data-doc=\"collecting-with-zeeschuimer\">Collecting TikTok posts with Zeeschuimer<\/a><\/td><\/tr><tr><td>X and any other table<\/td><td>Generic table<\/td><td>Columns are matched by name: text, message, content, body, tweet, caption...; created_at, date, timestamp...<\/td><\/tr><\/tbody><\/table><\/div>\n<p>If a generic file is not read as expected, rename the text column to <b>text<\/b> and the date column to <b>created_at<\/b>.<\/p>\n<h2>What has been tested<\/h2>\n<p>Each format is tested against the full header set of a real export from that source, not only the columns MARSAD reads. A real export carries columns MARSAD ignores, placeholder cells such as <code>-<\/code>, and numbers written with thousands separators such as <code>1,350<\/code>; all of those are handled. The formats checked this way:<\/p>\n<div class='tw'><table><thead><tr><th>Format<\/th><th>Columns in a full export<\/th><th>Checked<\/th><\/tr><\/thead><tbody><tr><td>CrowdTangle historical CSV<\/td><td>40<\/td><td>Yes<\/td><\/tr><tr><td>Meta Content Library (flattened)<\/td><td>28<\/td><td>Yes<\/td><\/tr><tr><td>Meltwater Explore CSV (UTF-16, tab separated)<\/td><td>37<\/td><td>Yes<\/td><\/tr><tr><td>X (Twitter) API v2<\/td><td>17<\/td><td>Yes<\/td><\/tr><tr><td>Reddit comment dump (PRAW or Pushshift fields)<\/td><td>20<\/td><td>Yes<\/td><\/tr><tr><td>YouTube comments<\/td><td>10<\/td><td>Yes<\/td><\/tr><tr><td>TikTok Research API<\/td><td>12<\/td><td>Yes<\/td><\/tr><tr><td>Zeeschuimer TikTok .ndjson (envelope plus nested post)<\/td><td>9 top level, flattened<\/td><td>Yes<\/td><\/tr><tr><td>Zeeschuimer TikTok .csv (the extension's own mapper)<\/td><td>37<\/td><td>Yes<\/td><\/tr><tr><td>Instagram Graph API<\/td><td>9<\/td><td>Yes<\/td><\/tr><tr><td>Telegram export<\/td><td>9<\/td><td>Yes<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Meltwater spells its columns differently between products: the older downloads use <code>Source Name<\/code> and <code>Author Handle<\/code>, the Explore CSV uses <code>Source<\/code> and <code>Influencer<\/code>. Both are read.<\/p>\n<p>The practice files on the start page carry the same full headers, so what you practise on has the shape of what you will load.<\/p>\n<div class='note'>Tested means the columns are read and mapped correctly. It does not mean every export of every vintage is<\/div>\n<div class='note'>identical: platforms change their exports. If a column you need is not picked up, say which format and which<\/div>\n<div class='note'>column, and it will be added.<\/div>"}, {"cat": "data-management", "slug": "cleaning", "title": "What happens to your file when it loads", "status": "ready", "summary": "What is removed, what is never changed, and how dates are handled.", "html": "<p>Before any analysis, each file is cleaned. Nothing in your original file changes.<\/p>\n<ul><li><b>Removed:<\/b> rows with no text, posts marked deleted or withheld, and exact duplicate rows.<\/li><li><b>Kept as is:<\/b> engagement numbers are never changed or filled in. A column the file does not have is left out,<\/li><\/ul>\n<p>so the tool can say Not for this file instead of showing zeros.<\/p>\n<ul><li><b>Dates<\/b> are read and shown in UTC. See <a href=\"#\" data-doc=\"time-zone-weekend\">Time zone and weekend<\/a>.<\/li><li><b>Arabic text<\/b> is normalised for matching only (alef forms, ta marbuta, diacritics, stretched letters). Posts are<\/li><\/ul>\n<p>always shown as written.<\/p>\n<ul><li><b>File details<\/b> (button on the Overview) lists what was found and what was removed.<\/li><\/ul>"}, {"cat": "data-management", "slug": "combining-files", "title": "Combining several files", "status": "ready", "summary": "One dataset from many files, with repeated posts counted once.", "html": "<p>Load several files at once, or add a file to the ones already loaded with <b>Change or add files<\/b>. With two or more files, choose <b>Combine into one dataset<\/b>.<\/p>\n<ul><li>All posts are analysed together.<\/li><li>A post found in more than one file (same post id, or same text, account and time) is <b>counted once<\/b>. The<\/li><\/ul>\n<p>Overview says how many repeated posts were removed.<\/p>\n<ul><li>Every post keeps the name of its file, so any analysis can still be split by file with **Options › Split the<\/li><\/ul>\n<p>results by › dataset**.<\/p>\n<ul><li>Each file has a <b>Name in charts<\/b> box. Files with the same name form one group, for example three monthly<\/li><\/ul>\n<p>exports all named 2025.<\/p>\n<p>Typical use: several exports of the same search (one per month or per keyword) that you want as one dataset.<\/p>"}, {"cat": "data-management", "slug": "comparing-files", "title": "Comparing files", "status": "ready", "summary": "Results side by side, file by file.", "html": "<p>With two or more files, choose <b>Compare the files<\/b>. Each file keeps all its posts, even posts that are also in another file, because each file is its own sample.<\/p>\n<ul><li><b>39 analyses split by file automatically<\/b>: the chart shows one line or bar per file. The button **Show all files<\/li><\/ul>\n<p>together** switches the split off.<\/p>\n<ul><li><b>The other analyses<\/b> (for example top accounts, networks, copied posts) look at one set of posts at a time.<\/li><\/ul>\n<p>Buttons let you choose All files or one file, and a table gives the <b>key numbers for each file<\/b> side by side.<\/p>\n<ul><li>Clicking a chart shows posts from the file on screen only.<\/li><li><a href=\"#\" data-app=\"DATA-6\">Compare files<\/a> gives a detailed comparison: size, accounts, dates, engagement and word lists.<\/li><\/ul>\n<p><b>Good practice<\/b><\/p>\n<ul><li>Compare 2 to 6 groups. Charts with more are hard to read; give files the same name to group them.<\/li><li>Files from different platforms count likes, shares and reach differently. Compare shares (%) rather than<\/li><\/ul>\n<p>engagement numbers. The page warns you when platforms differ.<\/p>\n<ul><li>Different date ranges or search terms make files differ for reasons that have nothing to do with the topic. Note<\/li><\/ul>\n<p>how each file was collected.<\/p>"}, {"cat": "data-management", "slug": "time-zone-weekend", "title": "Time zone and weekend", "status": "ready", "summary": "UTC and a Saturday-Sunday weekend, and when that matters.", "html": "<p>Two settings decide how every date in your results is read. There is no control for them in the page: the dashboard uses one setting for each, so that two people analysing the same file get the same answer.<\/p>\n<ul><li><b>Time zone: UTC.<\/b> All dates and hours are shown in UTC. A timestamp that carries its own zone, such as one<\/li><\/ul>\n<p>ending in Z or with an offset, is read as written and converted; a timestamp with no zone is taken to be UTC already. Busiest hours and day-by-day counts depend on this, so a file recorded in local time will show hours shifted from the local clock.<\/p>\n<ul><li><b>Weekend: Saturday and Sunday.<\/b> Used wherever a result compares weekdays with the weekend.<\/li><\/ul>\n<p>Both matter for data from countries whose working week is Sunday to Thursday, where Friday and Saturday are the weekend: there the weekday and weekend split will not match local life, and the hour of day will be offset. If your work turns on either, say in your write-up which convention you used, or run the Colab notebook, where the time zone and the weekend are both arguments you set.<\/p>"}, {"cat": "data-management", "slug": "columns-guide", "title": "Which columns unlock which analyses", "status": "ready", "summary": "Each column and the analyses it switches on.", "html": "<div class='tw'><table><thead><tr><th>Column in your file<\/th><th>Switches on<\/th><\/tr><\/thead><tbody><tr><td>Text<\/td><td>Words, topics, ways of speaking, Society, emoji<\/td><\/tr><tr><td>Date and time<\/td><td>The When section, before and after an event, results over time<\/td><\/tr><tr><td>Account name, post id<\/td><td>The People section, copied posts, repeated posts across files<\/td><\/tr><tr><td>Likes, comments, shares or a total; reach; views<\/td><td>The Reactions section and attention in other analyses<\/td><\/tr><tr><td>Facebook reactions (Love, Haha, Angry...)<\/td><td>Mix of reactions, audience agreement<\/td><\/tr><tr><td>Reply or quote ids (mentions come from the text)<\/td><td>Who talks to whom, parts of Social cohesion<\/td><\/tr><tr><td>Platform, country, language, source, page category<\/td><td>Splitting results by these groups<\/td><\/tr><tr><td>Model labels (label_sentiment, label_toxicity, dialect...)<\/td><td>The model-based analyses, without running a model. See <a href=\"#\" data-doc=\"labels-in-your-file\">Labels already in your file<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p>An analysis that cannot run says <b>Not for this file<\/b> and names what is missing.<\/p>"}, {"cat": "data-management", "slug": "large-datasets", "title": "Large datasets", "status": "ready", "summary": "What size works where.", "html": "<ul><li><b>Web dashboard:<\/b> about 50,000 posts in total. Above that the page gets slow, and some analyses (copied posts,<\/li><\/ul>\n<p>topics, networks) take minutes.<\/p>\n<ul><li><b>Colab notebook:<\/b> hundreds of thousands of posts, depending on the Colab machine. See<\/li><\/ul>\n<p><a href=\"#\" data-doc=\"colab-notebook\">Using the Colab notebook<\/a>.<\/p>\n<ul><li><b>MARSAD server:<\/b> corpus searches with sampling, in the MARSAD platform: see <a href=\"#\" data-doc=\"where-posts-come-from\">Where the posts come from<\/a>.<\/li><\/ul>\n<p>A file larger than 40 MB is not opened. The page says so, and offers to read it in slices instead: see <a href=\"#\" data-doc=\"sampling-large-files\">Sampling and splitting a large file<\/a>.<\/p>"}, {"cat": "data-management", "slug": "sampling-large-files", "title": "Sampling and splitting a large file", "status": "ready", "summary": "Reading a file too big for the browser: scanning, sampling, splitting, and a pack ready for annotators.", "html": "<p>The analyses run inside the browser, so the whole file has to fit in its memory. A gigabyte of CSV does not: reading it into a table takes several times its own size, and the tab stops before any analysis starts.<\/p>\n<p>A file over 40 MB is therefore not read. Instead the page offers to <b>scan<\/b> it, which walks the file in slices without holding it, and reports how many rows it has, which columns it carries and what dates it covers. Nothing is uploaded at any point; the slices are read from the file on your own computer.<\/p>\n<h2>Keeping a sample<\/h2>\n<div class='tw'><table><thead><tr><th>How<\/th><th>What it gives you<\/th><th>When it appears<\/th><\/tr><\/thead><tbody><tr><td>At random<\/td><td>Every row has the same chance<\/td><td>Always<\/td><\/tr><tr><td>The most engaged<\/td><td>The top N by a column you pick: interactions, likes, comments, shares, views<\/td><td>Only when the file has such a column<\/td><\/tr><tr><td>Keeping the share of a column<\/td><td>Each value of a column keeps its share of the sample, or takes an equal share<\/td><td>Only for columns with 2 to 60 distinct values<\/td><\/tr><tr><td>Spread evenly over time<\/td><td>The same number from each week, month or year<\/td><td>Only when the file has a date column<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A news export with a headline and a date gets the date options and no engagement option. A CrowdTangle export gets both. Nothing here assumes social media posts.<\/p>\n<p><b>The most engaged is not a sample of the conversation.<\/b> Those are the posts that travelled. Percentages from such a sample describe popular posts, not what was said in general. Say so in anything you publish from it.<\/p>\n<h2>Leaving rows out<\/h2>\n<p>Before the sample is drawn you can set a minimum and a maximum word count, a date range, and whether posts whose text repeats are dropped. These are applied <b>first<\/b>, so asking for 1,000 posts of 10 words or more gives 1,000 of them, not 1,000 minus the ones cut. The page reports how many rows each filter removed.<\/p>\n<h2>Doing it again<\/h2>\n<p>Every sample is drawn with a random seed, shown in the panel and saved with the download. The same file, the same settings and the same seed return the same rows. Reviewers ask about this.<\/p>\n<h2>Splitting instead<\/h2>\n<p>Splitting keeps every row, in file order, and cuts the file into parts of a size you choose. Each part is a CSV with the header, which you analyse one at a time and compare. The browser saves them one after another.<\/p>\n<h2>A sample ready to annotate<\/h2>\n<p><b>Download it ready to annotate<\/b> gives a zip holding:<\/p>\n<ul><li><code>annotator_a.csv<\/code> and <code>annotator_b.csv<\/code>: the same posts in a different order, one per annotator, each with<\/li><\/ul>\n<p>the label columns you named, empty.<\/p>\n<ul><li><code>calibration.csv<\/code>: a small set that both annotators label first, to settle the guidelines before the main<\/li><\/ul>\n<p>round. The same rows are marked <code>calibration=yes<\/code> in both files.<\/p>\n<ul><li><code>sample.csv<\/code>: the sample as drawn, in file order.<\/li><li><code>
