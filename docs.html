ny language written with spaces between words (not Chinese, Japanese or Thai). Repeated text is compared on word sequences.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>How alike two posts must be to count as copies (0 to 1)<\/td><td>0.8<\/td><\/tr><tr><td>Ignore posts with fewer words than this<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts checked<\/td><td>Posts long enough (5 or more words) to compare.<\/td><\/tr><tr><td>Exact copies<\/td><td>Posts whose text is exactly the same as another post.<\/td><\/tr><tr><td>Copies and near copies<\/td><td>Posts that are the same or almost the same as another post.<\/td><\/tr><tr><td>Copied (%)<\/td><td>Share of posts that are copies or near copies. Example: 30 % means about one post in three repeats another.<\/td><\/tr><tr><td>Groups of copies<\/td><td>Number of different texts that were copied.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>How many duplicate clusters have each size (number of near-identical posts).<\/p>\n<h2>Method in detail<\/h2>\n<p>Posts with at least five tokens are compared on sets of 3-token shingles. Exact duplicates share a cluster. Near-duplicates are found with MinHash (64 permutations) and locality-sensitive hashing (16 bands), and a candidate pair is accepted when the true Jaccard similarity is at least the threshold. Clusters are the connected components of accepted pairs.<\/p>\n<p><a href=\"#\" data-app=\"DATA-4\">Open this analysis in the dashboard<\/a><\/p>", "card": "DATA-4"}, {"cat": "an-data", "slug": "data-5", "title": "Are the posts on topic?", "status": "ready", "summary": "Share of posts that really match your search words", "html": "<p>How many posts actually contain the keywords you used to collect the data, so you know how much off-topic material is in the file.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked for each search word as a whole word (not inside another word). If you add a sample that people marked as relevant or not, the card also gives the share of relevant posts with a margin of error.<\/p>\n<h2>Example<\/h2>\n<p>You searched for غزة and Gaza; 85 % of posts contain one of them.<\/p>\n<h2>Good to know<\/h2>\n<p>A post can be on topic without the exact keyword, so the keyword share is a lower estimate.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Words are split on spaces and punctuation; Arabic gets extra normalization and clitic handling.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>query terms<\/td><td>you choose<\/td><\/tr><tr><td>annotated file<\/td><td>you choose<\/td><\/tr><tr><td>topic<\/td><td>you choose<\/td><\/tr><tr><td>zero shot n<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Keyword in the text (%)<\/td><td>Share of posts whose own text contains a search keyword.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts whose own text contains each collection keyword.<\/p>\n<h2>Method in detail<\/h2>\n<p>Three separate estimates: the share of posts whose own text contains a collection keyword (whole-word matching), the share marked relevant in an annotated sample (Wilson 95% interval), and optionally a zero-shot NLI estimate on a sample. Only the annotated estimate measures relevance.<\/p>\n<p><a href=\"#\" data-app=\"DATA-5\">Open this analysis in the dashboard<\/a><\/p>", "card": "DATA-5"}, {"cat": "an-data", "slug": "data-6", "title": "Compare files", "status": "ready", "summary": "How two or more files differ", "html": "<p>Puts two or more files side by side: size, accounts, dates, attention, kinds of language, and how many accounts and hashtags they share.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each file is summarised the same way. Overlap is the number of accounts (or hashtags) found in both files divided by the number found in either file (0 = nothing in common, 1 = the same).<\/p>\n<h2>Example<\/h2>\n<p>File A and file B share 30 % of their accounts and 55 % of their hashtags.<\/p>\n<h2>Good to know<\/h2>\n<p>Load two or more files together to use this.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>two or more files loaded together<\/td><\/tr><tr><td>Languages<\/td><td>Any language. The lexicon comparison inside it uses the Arabic and English lexicons.<\/td><\/tr><tr><td>Works with<\/td><td>Two or more files<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Word lists<\/td><td>hope, despair<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Lexicon prevalence by dataset; click a bar for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Per dataset: size, authors, dates, engagement, lexicon prevalence; author and hashtag overlap (Jaccard).<\/p>\n<p><a href=\"#\" data-app=\"DATA-6\">Open this analysis in the dashboard<\/a><\/p>", "card": "DATA-6"}, {"cat": "an-data", "slug": "data-7", "title": "Same subject, different language", "status": "ready", "summary": "How long, how recent and how detailed each language version is", "html": "<p>For one subject written up in several languages, compares the versions: how long each is, how many sections it has, when it was last edited, and which years it mentions.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The versions are grouped by subject and language. Each is measured in characters, words, section headings and links, and by the distinct four-digit years it names, counting both Latin and Arabic-Indic digits. Share of longest compares each version's word count with the longest version of that subject.<\/p>\n<h2>Example<\/h2>\n<p>The Arabic version is 38% the length of the English one and was last edited eight months earlier.<\/p>\n<h2>Good to know<\/h2>\n<p>This compares the shape of the versions, not what they say. Comparing the content across languages needs translation or a multilingual model and neither is used here. A shorter version is not a worse one: length follows how many editors a language edition has as much as how much there is to say.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, has_versions<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Length, sections and years, so any language, including the ones written without spaces between words. What the versions say is not compared.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Subjects<\/td><td>Subjects compared.<\/td><\/tr><tr><td>Languages<\/td><td>Language editions involved.<\/td><\/tr><tr><td>Longest version<\/td><td>The longest version, and how long it is.<\/td><\/tr><tr><td>Median share of longest (%)<\/td><td>The middle version against the longest.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Words in each language version, grouped by subject.<\/p>\n<h2>Method in detail<\/h2>\n<p>Rows that name the same subject are grouped by language. Each version is measured by characters, words, section headings, links and the distinct four-digit years it names, in Latin or Arabic-Indic digits, and by when it was last edited. Share of longest is that version's word count against the longest version of the same subject. The card compares the shape of the versions, not what they say: comparing content across languages needs translation or a multilingual model, and neither is run.<\/p>\n<p><a href=\"#\" data-app=\"DATA-7\">Open this analysis in the dashboard<\/a><\/p>", "card": "DATA-7"}, {"cat": "an-data", "slug": "data-8", "title": "How the text is cleaned", "status": "ready", "summary": "What happens to the text before words are counted", "html": "<p>Shows what MARSAD does to the text before it counts words: which spellings are treated as the same word, how many posts each rule changes, and a few posts as written next to the words that are counted.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each rule (for example ة written as ه, or أ and إ written as ا) is tried on every post, and the posts it changes are counted. A second table lists each counted word with the spellings it stands for, such as الحكومه for الحكومة and الحكومه.<\/p>\n<h2>Example<\/h2>\n<p>الحكومة، الحكومه and الحكومـــة are counted as one word: الحكومه.<\/p>\n<h2>Good to know<\/h2>\n<p>Your posts are never changed: the rules only decide which spellings count as one word. They are the same for every analysis, because the word lists and word models were built with them.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language. The letter rules are for Arabic; links, mentions, hashtags and lowercase apply to every language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Method in detail<\/h2>\n<p>Each cleaning rule that MARSAD applies before matching words (links, mentions, hashtags, alef forms, ta marbuta, alef maqsura, hamza carriers, diacritics, tatweel, letter elongation, lowercase) is applied alone to every post, and the posts it changes are counted. The spellings table lists, for each word as counted, the spellings in the file it stands for, with their frequencies. The examples show random posts as written, as matched and as the list of words that are counted (after Arabic prefixes and stopwords are taken off). The original text is not changed.<\/p>\n<p><a href=\"#\" data-app=\"DATA-8\">Open this analysis in the dashboard<\/a><\/p>", "card": "DATA-8"}, {"cat": "an-time", "slug": "time-1", "title": "Posts over time", "status": "ready", "summary": "How many posts each hour, day, week or month", "html": "<p>A line of how many posts were made in each period, with the total and typical attention they got. Click a point to read those posts.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post's date is converted to the time zone you chose. Posts are counted per period; the period (hour, day, week or month) is chosen from how long your data covers. 'Typical attention' is the median: half the posts got more, half got less.<\/p>\n<h2>Example<\/h2>\n<p>Posts jump from 200 a day to 3,000 on the day of an election.<\/p>\n<h2>Good to know<\/h2>\n<p>Collection limits (for example a daily download cap) can create dips that are not real.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the date and time of each post<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the line by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Bucket<\/td><td>Length of each period (h = hour, D = day, W = week, M = month).<\/td><\/tr><tr><td>Periods<\/td><td>Number of hours, days, weeks or months on the chart.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts per period (and per group when split); click a point for that period's posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Posts, total and median engagement per period. The period is a day, week or month, chosen from the span of the data unless set. Timestamps are converted to the analysis time zone first.<\/p>\n<p><a href=\"#\" data-app=\"TIME-1\">Open this analysis in the dashboard<\/a><\/p>", "card": "TIME-1"}, {"cat": "an-time", "slug": "time-2", "title": "Busiest hours and days", "status": "ready", "summary": "At what times people post most", "html": "<p>A grid of days and hours showing when most posts appear, and whether posts at some times get more attention. Weekdays and weekends are compared.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is placed in its weekday and hour (in your time zone). The cells count posts. The weekend follows the setting (Friday-Saturday or Saturday-Sunday); with 'auto' it is chosen from the countries in the data.<\/p>\n<h2>Example<\/h2>\n<p>Most posts appear at 9 pm on Thursdays.<\/p>\n<h2>Good to know<\/h2>\n<p>Times are only as good as the timestamps in the file; posts with no time zone are assumed to be UTC unless you say otherwise.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the date and time of each post<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Measure<\/td><td>posts, median engagement<\/td><\/tr><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Busiest hour<\/td><td>Hour of the day with the most posts, in your time zone. Example: 21 means 9 pm to 10 pm.<\/td><\/tr><tr><td>Weekend test<\/td><td>Statistical test used for weekend versus weekday engagement.<\/td><\/tr><tr><td>Weekend difference: chance<\/td><td>How likely the weekend-weekday difference is just chance (0 to 1). Below 0.05 means the difference is probably real. Example: 0.40 means no clear difference.<\/td><\/tr><tr><td>Weekend difference: size<\/td><td>How big the weekend-weekday difference is, from -1 to 1. Close to 0 = no difference; 0.3 or more = a clear difference.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts (or engagement) by weekday and hour; click a cell for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Day-of-week by hour matrix of post counts or median engagement, in the analysis time zone. Weekday and weekend are compared with the group comparison engine (median, log mean, within-author z-score, Mann-Whitney test). The weekend follows the dataset setting: Friday-Saturday or Saturday-Sunday, chosen from the posts' countries when available.<\/p>\n<p><a href=\"#\" data-app=\"TIME-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "TIME-2"}, {"cat": "an-time", "slug": "time-3", "title": "Sudden jumps in posting", "status": "ready", "summary": "Days or hours with far more posts than usual", "html": "<p>Finds the days (or hours) when posting suddenly jumped, which often matches news events.<\/p>\n<h2>How it is calculated<\/h2>\n<p>For each day, the number of posts is compared with the usual level around it (the median of the week centred on that day). A day counts as a jump when it is much higher than usual: more than three times the normal day-to-day variation above it.<\/p>\n<h2>Example<\/h2>\n<p>A normal day has about 100 posts; a day with 900 posts is marked as a jump.<\/p>\n<h2>Good to know<\/h2>\n<p>With very few days of data, there is not enough history to call anything a jump.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the date and time of each post<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>z threshold<\/td><td>3.0<\/td><\/tr><tr><td>require dominant<\/td><td>True<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Days with a jump<\/td><td>Days with far more posts than usual.<\/td><\/tr><tr><td>Hours with a jump<\/td><td>Hours with far more posts than usual.<\/td><\/tr><tr><td>Days<\/td><td>Number of days covered.<\/td><\/tr><tr><td>Hours<\/td><td>Number of hours covered.<\/td><\/tr><tr><td>Reaction rule<\/td><td>Rule used to flag one-sided reaction patterns.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts per day (or hour); red bars are bursts; click a bar for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>A burst day has a post count more than three robust z-scores (median absolute deviation) above its 7-day centred rolling median. When the deviation is 0 (a flat baseline, most days equal), the scale is the mean absolute deviation x 1.2533, and never less than the square root of the median (Poisson spread), so 30 posts against a baseline of 1 is a burst and 2 against 1 is not. With Facebook reactions, the card also reports the daily share of posts whose reactions are above the dataset median and dominated (over 50%) by one reaction type.<\/p>\n<p><a href=\"#\" data-app=\"TIME-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "TIME-3"}, {"cat": "an-time", "slug": "time-4", "title": "Before and after an event", "status": "ready", "summary": "Did things change after a date you choose?", "html": "<p>Compares the days before and after an event you name (for example an election or an attack): number of posts, attention, or the use of a kind of language.<\/p>\n<h2>How it is calculated<\/h2>\n<p>You give the event a name and a date. Each day's value is calculated, then the days before and the days after are compared, with a test of whether the difference is bigger than chance.<\/p>\n<h2>Example<\/h2>\n<p>Posts per day: 120 in the week before a ceasefire, 340 in the week after.<\/p>\n<h2>Good to know<\/h2>\n<p>Other things also happen around big events, so a change is not proof that the event caused it.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the date and time of each post<\/td><\/tr><tr><td>Languages<\/td><td>Any language. With a lexicon as the measure: Arabic and English.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Events (name, date)<\/td><td>you choose<\/td><\/tr><tr><td>window days<\/td><td>7<\/td><\/tr><tr><td>Measure<\/td><td>posts<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Daily values with each event marked; click a day for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>For each event, a daily metric (posts, median engagement, share of posts matching a lexicon, or mean reaction sentiment) is compared between the days before and after the event date, either within a window or over the whole dataset. Recurring dates (anniversaries) compare that calendar day each year with all other days. For posts per day, every calendar day in the window counts and a day without posts counts as 0; window days outside the file's dates are counted as 0 and reported as days_outside_data. For medians, shares and sentiment, days without posts have no value and are left out. Daily values are compared with a Mann-Whitney test.<\/p>\n<p><a href=\"#\" data-app=\"TIME-4\">Open this analysis in the dashboard<\/a><\/p>", "card": "TIME-4"}, {"cat": "an-time", "slug": "time-5", "title": "What drove a spike", "status": "ready", "summary": "Words, hashtags, accounts and links that rose on a busy day", "html": "<p>On the busiest day (or a day you choose), which words, hashtags, links and accounts were much more common than in the week before, and which posts got the most engagement.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each item's share of posts on the day is compared with its share in the 7 days before; items at least twice as common are listed.<\/p>\n<h2>Example<\/h2>\n<p>On 15 February, posts were 1.9 times the usual; a hashtag used in 2 % of posts before was in 30 % that day.<\/p>\n<h2>Good to know<\/h2>\n<p>It shows what changed, not why. A rising word can be one account posting many times: look at the accounts table.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the date and time of each post, the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Words: languages with spaces between words. Hashtags, accounts and links: any language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>date<\/td><td>you choose<\/td><\/tr><tr><td>baseline days<\/td><td>7<\/td><\/tr><tr><td>How many to show<\/td><td>20<\/td><\/tr><tr><td>min count<\/td><td>3<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Day<\/td><td>The day analysed.<\/td><\/tr><tr><td>Posts on day<\/td><td>Posts on that day.<\/td><\/tr><tr><td>Daily average before<\/td><td>Average posts per day in the 7 days before.<\/td><\/tr><tr><td>Times usual<\/td><td>Posts on the day divided by that average.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Words that rose most on the chosen day against the 7 days before; the labels give the share of posts on the day and before; click a bar for the day's posts with that word.<\/p>\n<h2>Method in detail<\/h2>\n<p>For a chosen day (by default the day furthest above its 7-day median), each word, hashtag and linked domain is compared between the posts of that day and the posts of the 7 days before: the rise is log2 of the ratio of the shares of posts using it (with 0.5 added to counts), and items rising more than twofold and used in three or more posts that day are listed. The card also lists the day's most active accounts and most engaged posts.<\/p>\n<p><a href=\"#\" data-app=\"TIME-5\">Open this analysis in the dashboard<\/a><\/p>", "card": "TIME-5"}, {"cat": "an-time", "slug": "time-6", "title": "Where the series changed", "status": "ready", "summary": "The points where the level shifted, found rather than given", "html": "<p>Looks for the moments when posting, engagement or post length stepped up or down and stayed there, without you having to say which dates to check.<\/p>\n<h2>How it is calculated<\/h2>\n<p>MARSAD splits the series where its running total of deviations from the mean is furthest from zero, keeps the split only if the averages either side are far enough apart to be more than noise, then repeats inside each part.<\/p>\n<h2>Example<\/h2>\n<p>Posting stepped up 240% on 14 March and stayed there for the next three weeks.<\/p>\n<h2>Good to know<\/h2>\n<p>This finds steps, not slopes: a slow drift has no change point, and one very busy day can create one. Where a few accounts post most of the file, a step may be one account starting or stopping rather than a change in the conversation.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the date and time of each post<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Counts over time, so any language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>measure<\/td><td>posts, interactions, length<\/td><\/tr><tr><td>min periods<\/td><td>12<\/td><\/tr><tr><td>z<\/td><td>3.0<\/td><\/tr><tr><td>period<\/td><td>auto, hour, day, week, month<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Periods<\/td><td>Number of hours, days, weeks or months on the chart.<\/td><\/tr><tr><td>Changes found<\/td><td>Shifts that passed the test.<\/td><\/tr><tr><td>Measure<\/td><td>What is being balanced.<\/td><\/tr><tr><td>Period<\/td><td>The length of time each point covers: a day, a week or a month.<\/td><\/tr><tr><td>Largest change (%)<\/td><td>Biggest change between two stretches.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>The series with a dotted line at each shift and a dashed line at each stretch's average.<\/p>\n<h2>Method in detail<\/h2>\n<p>Change points are found by recursively splitting the series at the maximum of its cumulative sum of deviations from the mean, keeping a split only where the means either side differ by more than z standard errors and both segments hold at least four periods, to a maximum of six splits. The table reports each segment's mean and the percentage change from the one before. The test finds shifts in level, not trends.<\/p>\n<p><a href=\"#\" data-app=\"TIME-6\">Open this analysis in the dashboard<\/a><\/p>", "card": "TIME-6"}, {"cat": "an-time", "slug": "time-7", "title": "How a page changed", "status": "ready", "summary": "A page's whole edit history: when it grew, when it shrank, and when it was fought over", "html": "<p>Takes the revision history of one page and shows how its size moved over time, who did the editing, and which edits were undone by somebody else.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Revisions are put in order by date. The page size is the size it had after each edit, and the change is the difference between one edit and the one before it, split into bytes added and bytes removed. An edit counts as a revert when its own summary says so, in English, Arabic, French, Spanish or German.<\/p>\n<h2>Example<\/h2>\n<p>The article grew from 18 KB to 46 KB over two years, and 9% of its edits were reverted.<\/p>\n<h2>Good to know<\/h2>\n<p>This is one page being rewritten, not many people posting, so none of it is reach or audience. Reverts are counted from what editors wrote in the summary line: someone who undoes an edit without saying so is not counted, and someone who only mentions the word is. Wikipedia hands over at most 500 revisions at a time, so an old page may start part-way through its life.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the date and time of each post, has_revisions<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Sizes and dates, so any language. Reverts are read from the edit summary in English, Arabic, French, Spanish and German wordings.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>period<\/td><td>auto, day, week, month<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Revisions<\/td><td>Edits to the page that have both a size and a date.<\/td><\/tr><tr><td>Editors<\/td><td>Distinct accounts or addresses that edited.<\/td><\/tr><tr><td>Net bytes<\/td><td>How much longer or shorter the page became, in bytes.<\/td><\/tr><tr><td>Reverts (%)<\/td><td>Share of revisions whose summary says they undid an edit.<\/td><\/tr><tr><td>Edits per day<\/td><td>Revisions per day over the span of the history.<\/td><\/tr><tr><td>Period<\/td><td>The length of time each point covers: a day, a week or a month.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>The size of the page in bytes after each revision, in order of time.<\/p>\n<h2>Method in detail<\/h2>\n<p>Revisions are ordered by time. Page size is the size the page had after each revision; bytes added and removed are the positive and negative parts of the change each revision made. A revision counts as a revert when its edit summary matches a revert wording in English, Arabic, French, Spanish or German, so an unannounced revert is not counted and a summary that merely mentions the word is. The period is chosen from the span of the history unless set.<\/p>\n<p><a href=\"#\" data-app=\"TIME-7\">Open this analysis in the dashboard<\/a><\/p>", "card": "TIME-7"}, {"cat": "an-time", "slug": "time-8", "title": "Attention against coverage", "status": "ready", "summary": "Daily readership beside daily coverage, and which one moved first", "html": "<p>Puts a Wikipedia readership series next to posts or news articles from the same days, so you can see whether people went to read about something before or after the coverage appeared.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Readership is the sum of views per day. Coverage is how many of the other rows fall on each day. Both are laid on a full calendar with empty days as zero. Coverage is then slid backwards and forwards up to a week and matched against readership each time; the shift that matches best is reported, and a negative one means coverage moved first.<\/p>\n<h2>Example<\/h2>\n<p>Readership matched coverage best when coverage was moved two days earlier, so the articles came first.<\/p>\n<h2>Good to know<\/h2>\n<p>Two counts rising together is not one causing the other: usually an event caused both. Coverage means whatever you collected, so if it came from a keyword search this compares readership against that keyword, not against the subject. Wikipedia counts days in UTC.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the date and time of each post, has_views_series<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Two counts per day, so any language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>max lag<\/td><td>7<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Days<\/td><td>Number of days covered.<\/td><\/tr><tr><td>Total views<\/td><td>Views over the whole period.<\/td><\/tr><tr><td>Coverage rows<\/td><td>Rows of coverage over the whole period.<\/td><\/tr><tr><td>Best shift (days)<\/td><td>The shift at which the two series matched most strongly.<\/td><\/tr><tr><td>Correlation at best shift<\/td><td>How strongly the two matched at that shift.<\/td><\/tr><tr><td>Reading<\/td><td>Which of the two moved first, in words.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Readership as a line and coverage as bars, on one calendar, each with its own scale.<\/p>\n<h2>Method in detail<\/h2>\n<p>Daily readership is the sum of the view counts on rows of the readership series; daily coverage is the count of every other dated row. Both are laid on a complete calendar, with missing days as zero. Coverage is shifted between minus and plus the maximum lag and each shift is correlated with readership using Spearman's rank correlation; the reported lag is the one with the largest absolute correlation. A negative lag means coverage moved first. Correlation is not causation: both series usually follow the same event.<\/p>\n<p><a href=\"#\" data-app=\"TIME-8\">Open this analysis in the dashboard<\/a><\/p>", "card": "TIME-8"}, {"cat": "an-people", "slug": "who-1", "title": "Most active accounts", "status": "ready", "summary": "Who posted most, and who got most attention", "html": "<p>A ranked list of accounts by number of posts and by attention received (likes, comments, shares), with their first and last post.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Posts and attention are added up for each account. 'Share' is the account's part of all posts or all attention.<\/p>\n<h2>Example<\/h2>\n<p>The most active page posted 340 times, 4 % of all posts.<\/p>\n<h2>Good to know<\/h2>\n<p>Large pages naturally get more attention; see 'What gets more attention?' for fair comparisons.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the name of the account that posted<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><tr><td>How many to show<\/td><td>25<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Accounts<\/td><td>Number of different accounts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Accounts ranked by posts or engagement; click a bar for the account's posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Per author: posts, total and median engagement, shares of the dataset, first and last post.<\/p>\n<p><a href=\"#\" data-app=\"WHO-1\">Open this analysis in the dashboard<\/a><\/p>", "card": "WHO-1"}, {"cat": "an-people", "slug": "who-2", "title": "Few voices or many?", "status": "ready", "summary": "Is the conversation led by a few accounts?", "html": "<p>Whether a few accounts make most of the posts (or get most of the attention), or whether many accounts share the conversation.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The share of posts made by the 10 most active accounts and by the top 1 % of accounts is calculated. The Gini score sums this up from 0 (everyone posts the same amount) to 1 (one account posts everything). A curve shows the whole picture.<\/p>\n<h2>Example<\/h2>\n<p>The 10 most active accounts made 46 % of all posts: a few voices lead.<\/p>\n<h2>Good to know<\/h2>\n<p>Collections built from a list of pages are concentrated by design.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Group by<\/td><td>account, country, Facebook page category, source<\/td><\/tr><tr><td>Measure<\/td><td>posts, interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Accounts<\/td><td>Number of accounts (or groups) compared.<\/td><\/tr><tr><td>Inequality (Gini)<\/td><td>How unequal posting is, from 0 (everyone posts the same amount) to 1 (one account posts everything). Example: 0.6 means a few accounts post most.<\/td><\/tr><tr><td>Concentration (HHI)<\/td><td>Sum of each account's squared share of posts. Below 0.01 = spread out; above 0.25 = dominated by a few.<\/td><\/tr><tr><td>Top 10 accounts (%)<\/td><td>Share of all posts made by the 10 most active accounts.<\/td><\/tr><tr><td>Top 1 % of accounts (%)<\/td><td>Share of all posts made by the most active 1 % of accounts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Lorenz curve: share of posts (or engagement) held by the smallest x% of accounts; the further below the diagonal, the more concentrated.<\/p>\n<h2>Method in detail<\/h2>\n<p>Gini coefficient, Herfindahl-Hirschman index (sum of squared shares), share held by the top 10 groups and by the top 1% of groups, and the Lorenz curve.<\/p>\n<p><a href=\"#\" data-app=\"WHO-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "WHO-2"}, {"cat": "an-people", "slug": "who-3", "title": "Who posts regularly?", "status": "ready", "summary": "Steady posters and bursts", "html": "<p>How regularly each account posts (every day or in bursts) and whether posting more on a day brings more or less attention per post.<\/p>\n<h2>How it is calculated<\/h2>\n<p>For each account: number of days with posts, posts per active day, and how much its daily attention goes up and down.<\/p>\n<h2>Example<\/h2>\n<p>One page posts every day; another posts 50 times on one day and then stops.<\/p>\n<h2>Good to know<\/h2>\n<p>Needs account names and dates.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the name of the account that posted, the date and time of each post<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Measure of attention<\/td><td>interactions, likes, comments, shares, views, reach, overperforming, engagement rate<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Typical posts per account<\/td><td>Half the accounts posted more than this, half less.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Accounts by active days and posts per active day (size = posts); click a point for the account's posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Per author: posts, active days, posts per active day, standard deviation of daily total engagement and of the overperforming score. Posting frequency is related to engagement by grouping author-days by posts that day.<\/p>\n<p><a href=\"#\" data-app=\"WHO-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "WHO-3"}, {"cat": "an-people", "slug": "who-4", "title": "Who talks to whom?", "status": "ready", "summary": "A map of replies, mentions, shared links or hashtags", "html": "<p>A network map: circles are accounts (or hashtags or websites), lines show who replies to, mentions or quotes whom. Colours show communities: groups of accounts that interact more with each other. Click a circle to read what it sent and received.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Every reply, mention, quote or shared link becomes a line between two circles; more posts make a stronger line. A community method (Louvain) finds groups with many lines inside and few lines between them. A circle's size shows how many replies or mentions it receives. You can search, filter by dates or keep only toxic connections.<\/p>\n<h2>Example<\/h2>\n<p>Accounts A and B reply to each other often, so they sit close together in the same colour group.<\/p>\n<h2>Good to know<\/h2>\n<p>Some exports do not include replies (for example Meltwater for X), so the map shows only what is in the file.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>What the item is<\/td><td>auto, reply, quote, mention, link, hashtag<\/td><\/tr><tr><td>min edge<\/td><td>1<\/td><\/tr><tr><td>Size of each circle shows<\/td><td>in degree, out degree, pagerank, degree<\/td><\/tr><tr><td>Hide accounts with only one connection<\/td><td>False<\/td><\/tr><tr><td>Find an account or word<\/td><td>you choose<\/td><\/tr><tr><td>Smallest number of connections<\/td><td>0<\/td><\/tr><tr><td>From date (YYYY-MM-DD)<\/td><td>you choose<\/td><\/tr><tr><td>To date (YYYY-MM-DD)<\/td><td>you choose<\/td><\/tr><tr><td>Only toxic connections<\/td><td>False<\/td><\/tr><tr><td>Toxicity score for 'toxic'<\/td><td>0.7<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Accounts in the map<\/td><td>Accounts (or hashtags or websites) in the network.<\/td><\/tr><tr><td>Links<\/td><td>Pairs that reply to, mention or quote each other.<\/td><\/tr><tr><td>Density<\/td><td>Share of all possible links that exist, from 0 to 1. Example: 0.05 means 5 % of accounts that could be linked are.<\/td><\/tr><tr><td>Groups<\/td><td>Groups of accounts that interact more with each other than with others.<\/td><\/tr><tr><td>Largest group (%)<\/td><td>Share of accounts in the biggest group.<\/td><\/tr><tr><td>How separate the groups are<\/td><td>From 0 to 1. Above 0.3 means clearly separate groups (possible echo chambers).<\/td><\/tr><tr><td>Accounts with one link<\/td><td>Accounts linked to only one other account.<\/td><\/tr><tr><td>Shown on the map<\/td><td>Accounts drawn on the map after the filters.<\/td><\/tr><tr><td>Directed<\/td><td>Whether links have a direction (who replies to or mentions whom).<\/td><\/tr><tr><td>Available kinds<\/td><td>Network types this dataset supports.<\/td><\/tr><tr><td>Kind<\/td><td>Network type: reply, quote, mention, link or hashtag co-occurrence.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Network of the most connected accounts, domains or hashtags (size = in-degree or the chosen measure, colour = Louvain community); click a node for the posts it sent and received.<\/p>\n<h2>Method in detail<\/h2>\n<p>Network analyzer in the style of Communalytic: reply, quote, mention, link-sharing (author to web domain) or hashtag co-occurrence network, built from the posts so date-range and toxicity filters apply to edges. Louvain communities, weighted in- and out-degree, PageRank, sampled betweenness, modularity and density; ForceAtlas2 layout. Clicking a node opens the posts it sent and received. The full graph downloads as GraphML (Gephi) or as a standalone interactive explorer with search, degree, community, date and toxicity filters.<\/p>\n<p><a href=\"#\" data-app=\"WHO-4\">Open this analysis in the dashboard<\/a><\/p>", "card": "WHO-4"}, {"cat": "an-people", "slug": "who-5", "title": "Account checks", "status": "ready", "summary": "Signals investigators look at: bots, trolls, sock puppets, fake accounts", "html": "<p>Nine checks on every account: posts very often, near-constant gaps between posts, posts around the clock, posts in bursts, repeats its own text, posts text other accounts also post, almost only links, a name ending in digits, and active only in a short window. Accounts that trip several checks are the ones to read first.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each check has a fixed threshold, listed in the checks table. MARSAD counts an account's posts, the gaps between them, the hours of day it posts in, how much of its text repeats, and how much of its text other accounts also post.<\/p>\n<h2>Example<\/h2>\n<p>An account posts 40 times a day, always 10 minutes apart, and 70% of its posts repeat the same text.<\/p>\n<h2>Good to know<\/h2>\n<p>These are signals, not labels. MARSAD cannot see when an account was created, its followers or its profile, so it cannot tell an automated account from a busy person, a newsroom feed or a fan account. Never call an account a bot on these numbers alone: open it and read it.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the name of the account that posted<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Accounts<\/td><td>Number of different accounts.<\/td><\/tr><tr><td>Top 1 % of accounts (%)<\/td><td>Share of posts made by the most active 1 % of accounts.<\/td><\/tr><tr><td>Accounts with one post (%)<\/td><td>Share of accounts that posted only once.<\/td><\/tr><tr><td>Accounts with 50+ posts in a day<\/td><td>Accounts that posted more than 50 times in one day.<\/td><\/tr><tr><td>Accounts tripping a check<\/td><td>Accounts tripping at least one check.<\/td><\/tr><tr><td>Accounts tripping 3 or more<\/td><td>Accounts tripping three or more checks: the shortlist to read first.<\/td><\/tr><tr><td>Very regular accounts<\/td><td>Accounts with 20+ posts at almost fixed intervals, like a timer.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Accounts tripping each check; click a bar for the posts of those accounts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Per account: posts, active days, maximum posts in one day, entropy of posting hours, median gap between posts and its coefficient of variation, share of posts with links and of duplicated text. Reported as data-quality context, not as bot detection.<\/p>\n<p><a href=\"#\" data-app=\"WHO-5\">Open this analysis in the dashboard<\/a><\/p>", "card": "WHO-5"}, {"cat": "an-people", "slug": "who-6", "title": "Countries", "status": "ready", "summary": "Where posts come from", "html": "<p>Posts, accounts and attention per country.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Posts are counted per country as given in the file. The card says whether the country is the page's or the author's.<\/p>\n<h2>Example<\/h2>\n<p>45 % of posts come from pages in Egypt, 20 % from Saudi Arabia.<\/p>\n<h2>Good to know<\/h2>\n<p>Many exports give the page administrator's country, not where the writer lives.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the country of each post or page<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>Needs a country column<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Measure of attention<\/td><td>interactions<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Countries<\/td><td>Number of countries.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts by country; click a bar for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Posts, engagement and authors per country. The card states whether country is the page admins' or the author's.<\/p>\n<p><a href=\"#\" data-app=\"WHO-6\">Open this analysis in the dashboard<\/a><\/p>", "card": "WHO-6"}, {"cat": "an-people", "slug": "who-7", "title": "Types of pages", "status": "ready", "summary": "News pages, politicians, communities ... (CrowdTangle)", "html": "<p>Which kinds of Facebook pages (media, public figures, community groups ...) lead the conversation and which get more attention.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Facebook's detailed page categories are grouped into main types, then compared on posts and attention.<\/p>\n<h2>Example<\/h2>\n<p>News pages make 30 % of posts but get 55 % of shares.<\/p>\n<h2>Good to know<\/h2>\n<p>Only CrowdTangle files have page categories.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>Facebook page categories (CrowdTangle files)<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>CrowdTangle only<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Measure of attention<\/td><td>interactions<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with a page type (%)<\/td><td>Share of posts whose page category is known.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of interactions by Facebook page category group; click a bar for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Facebook page categories are rolled up to Facebook's parent groups with the embedded category taxonomy. Media, public figure and community organization pages are compared with other pages using the group comparison engine.<\/p>\n<p><a href=\"#\" data-app=\"WHO-7\">Open this analysis in the dashboard<\/a><\/p>", "card": "WHO-7"}, {"cat": "an-people", "slug": "who-8", "title": "Older pages vs newer pages", "status": "ready", "summary": "Do older pages get more attention? (CrowdTangle)", "html": "<p>Whether pages that have existed longer get more attention than new pages.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each page's age when it posted is compared with its typical attention, using a rank correlation from -1 to 1 (0 = no link).<\/p>\n<h2>Example<\/h2>\n<p>Pages older than 10 years get no more attention than new pages (score close to 0).<\/p>\n<h2>Good to know<\/h2>\n<p>Only CrowdTangle files have the page creation date.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the date each page was created (CrowdTangle files), the name of the account that posted, likes, comments or shares<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>CrowdTangle only<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Link strength<\/td><td>From -1 to 1. Close to 0 = no link; 0.5 = a clear link (when one goes up, the other tends to go up).<\/td><\/tr><tr><td>Chance<\/td><td>How likely the result is just chance (0 to 1). Below 0.05 means probably real.<\/td><\/tr><tr><td>Number used<\/td><td>Number of items used in the calculation.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Page age against median engagement per page (size = posts); click a point for the page's posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Page age at each post's date, then the per-page median age against median engagement (Spearman correlation).<\/p>\n<p><a href=\"#\" data-app=\"WHO-8\">Open this analysis in the dashboard<\/a><\/p>", "card": "WHO-8"}, {"cat": "results", "slug": "who-9", "title": "Where posts say they are from", "status": "ready", "summary": "Coordinates, place names in the text, and the country field, kept apart", "html": "<p>Shows whatever location your file carries, with each kind of location kept separate, because they mean very different things.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Coordinates, where the export has them, are rounded to about a kilometre and shown only where several posts share a cell. Place names are matched in the text by a place word list. The country field is read as it comes.<\/p>\n<h2>Example<\/h2>\n<p>412 posts carry coordinates, 1,100 mention a place name, and 1,500 have a country field.<\/p>\n<h2>Good to know<\/h2>\n<p>None of it is a census. A place name in a post is a mention, not a location: people write about places they are not in. The country field is usually the account's declared country, not where the post was written. And whoever shares a location is not a random sample of whoever posts.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list). Coordinates and the country field work in any language; place names need a place word list, and MARSAD's are Arabic and English.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>How many to show<\/td><td>25<\/td><\/tr><tr><td>Only domains in at least this many posts<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with coordinates<\/td><td>Posts carrying usable coordinates.<\/td><\/tr><tr><td>Posts mentioning a place<\/td><td>Posts mentioning a place name.<\/td><\/tr><tr><td>Posts with a country field<\/td><td>Posts with something in the country field.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Whichever location this file carries: the map where there are coordinates, otherwise place names.<\/p>\n<h2>Method in detail<\/h2>\n<p>Three sources of location are reported separately and never merged: coordinates where the export carries latitude and longitude, rounded to two decimal places and shown only for cells with min_posts or more posts; place names matched in the text by whichever place word list is in use, which record what a post mentions and not where it was written; and the country field, which on most platforms is the account's declared or administrative country. None of the three is a census.<\/p>\n<p><a href=\"#\" data-app=\"WHO-9\">Open this analysis in the dashboard<\/a><\/p>", "card": "WHO-9"}, {"cat": "results", "slug": "who-10", "title": "Venues, authors and citations", "status": "ready", "summary": "Papers per year and per venue, who wrote them, and how unevenly citations are spread", "html": "<p>Summarises a set of papers: how many came out each year, which venues they appeared in, who wrote them, and how concentrated the citations are.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Papers are counted by year of publication and by venue exactly as the index recorded it. Author lists are split on semicolons. The citation spread sorts papers from most to least cited and shows what share of all citations the top papers hold.<\/p>\n<h2>Example<\/h2>\n<p>Of 180 papers, the top 10 hold 54% of all citations, and 31% have never been cited.<\/p>\n<h2>Good to know<\/h2>\n<p>Citation counts are what the index said on the day you collected, and a recent paper has had less time to gather them, so comparing across years needs that said out loud. One person spelled two ways counts as two people, and one conference recorded under two names counts as two venues.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>has_citations<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Counts, names and venues, so any language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>top n<\/td><td>25<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Papers<\/td><td>Papers counted.<\/td><\/tr><tr><td>Venues<\/td><td>Distinct venues.<\/td><\/tr><tr><td>Median citations<\/td><td>The middle paper's citation count.<\/td><\/tr><tr><td>Never cited (%)<\/td><td>Share of papers with no citations at all.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Papers published in each year.<\/p>\n<h2>Method in detail<\/h2>\n<p>Papers are counted per year of publication and per venue as the index recorded it. Author lists are split on semicolons, so one person under two spellings counts twice. The citation spread ranks papers by citations and reports the cumulative share held by the most cited. Citation counts are the index's figure on the day of collection, and recent papers have had less time to accumulate them.<\/p>\n<p><a href=\"#\" data-app=\"WHO-10\">Open this analysis in the dashboard<\/a><\/p>", "card": "WHO-10"}, {"cat": "an-words", "slug": "words-1", "title": "Most used words", "status": "ready", "summary": "The words, hashtags and mentions used most often", "html": "<p>A ranked list of the most frequent words, with how many posts and accounts use each one. Hashtags and @mentions have their own lists.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is split into words and Arabic spelling is made uniform. Very common small words (and, the, في, من ...) are removed. Then every word is counted. 'Spread' shows whether a word is used by many accounts or only by a few.<\/p>\n<h2>Example<\/h2>\n<p>'غزة' is used 1,250 times in 900 posts by 300 accounts.<\/p>\n<h2>Good to know<\/h2>\n<p>If the same text was posted many times, it can push its words up the list; the card can count repeated posts once.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Stopwords are removed for Arabic, English and French only; light stems are Arabic only.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Count<\/td><td>word, stem, bigram, trigram, hashtag, mention<\/td><\/tr><tr><td>How many to show<\/td><td>40<\/td><\/tr><tr><td>stop<\/td><td>True<\/td><\/tr><tr><td>with engagement<\/td><td>True<\/td><\/tr><tr><td>Count repeated posts once<\/td><td>auto, yes, no<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Words<\/td><td>Total number of words in all posts.<\/td><\/tr><tr><td>Different words<\/td><td>Number of different words.<\/td><\/tr><tr><td>Words used once<\/td><td>Words that appear only once.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Most frequent words (or stems, n-grams, hashtags, mentions); click a bar for posts that use it.<\/p>\n<h2>Method in detail<\/h2>\n<p>Frequencies of normalized tokens (or light stems, n-grams, hashtags, mentions) after stopword removal, as in AntConc's Word List. Range is the number of posts and accounts using a word; dispersion is Gries' DP across accounts (0 = used by accounts in proportion to how much they write, 1 = used by one account). Optional median engagement of posts with and without each word. When repeated posts are 5% or more of the data, each repeated text is counted once (dedup = auto), as on the keyword, collocate, cluster and word cloud cards.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-1\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-1"}, {"cat": "an-words", "slug": "words-2", "title": "Word cloud", "status": "ready", "summary": "The most used words, the bigger the more often", "html": "<p>A picture of the most used words: the bigger the word, the more often it appears. Click a word to read the posts that use it.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Words are counted as in 'Most used words'. Each word's size grows with how often it is used. The position of a word in the cloud has no meaning.<\/p>\n<h2>Example<\/h2>\n<p>'الانتخابات' is drawn largest because it is the most used word.<\/p>\n<h2>Good to know<\/h2>\n<p>Use 'Most used words' for exact numbers. The language filter keeps the words that are in the languages you choose, not the posts: when you choose Arabic, the Arabic words of a post that also has English words stay and its English words go. A word's language is guessed from its letters and from common words, so a rare Latin-letter word in an Arabic post counts as English.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Stopwords are removed for Arabic, English and French only.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>weight<\/td><td>freq, keyness<\/td><\/tr><tr><td>Count<\/td><td>word, stem, bigram, trigram, hashtag, mention<\/td><\/tr><tr><td>max words<\/td><td>80<\/td><\/tr><tr><td>Languages<\/td><td>all, or the languages to keep. Only the words in those languages are shown.<\/td><\/tr><tr><td>Posts to study<\/td><td>all, top engagement, group:&lt;value&gt;, lexicon:&lt;name&gt;, term:&lt;word&gt;, time:&lt;start&gt;/&lt;end&gt;, dataset:&lt;id&gt;<\/td><\/tr><tr><td>Count repeated posts once<\/td><td>auto, yes, no<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Weight<\/td><td>Weighting used.<\/td><\/tr><tr><td>Words shown<\/td><td>Number of words in the cloud.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Word cloud sized by frequency or keyness; click a word for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Words sized by the square root of frequency, or of keyness against general language. Positions come from a spiral layout and carry no meaning. Each word links to its posts. The table feeds the portal's Word Cloud tab.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-2"}, {"cat": "an-words", "slug": "words-3", "title": "Words that stand out", "status": "ready", "summary": "Words used much more here than in normal language", "html": "<p>The words that are unusually common in your posts (or in one group of posts) compared with everyday language or with the rest of your data. These 'key words' show what is special about the conversation.<\/p>\n<h2>How it is calculated<\/h2>\n<p>For each word, its share in your posts is compared with its share in a reference: everyday language (word frequencies from Wikipedia, subtitles, news and social media), or another part of your data. A statistical score (log-likelihood) says if the difference is real, and the 'how much more' number (log ratio) says how big it is.<\/p>\n<h2>Example<\/h2>\n<p>'ceasefire' is 40 times more common in your posts than in everyday English, so it stands out.<\/p>\n<h2>Good to know<\/h2>\n<p>Names and very rare words can stand out just because they are rare; the card needs a word to appear in several posts.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Against general language: Arabic, English and French. Between two parts of your data: any spaced language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Posts to study<\/td><td>all, each group, top engagement, group:&lt;value&gt;, lexicon:&lt;name&gt;, term:&lt;word&gt;, time:&lt;start&gt;/&lt;end&gt;, dataset:&lt;id&gt;<\/td><\/tr><tr><td>Compare with<\/td><td>general, rest, dataset:&lt;id&gt;<\/td><\/tr><tr><td>Group by<\/td><td>auto, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><tr><td>Count<\/td><td>word, stem, bigram, trigram, hashtag, mention<\/td><\/tr><tr><td>How many to show<\/td><td>25<\/td><\/tr><tr><td>min freq<\/td><td>5<\/td><\/tr><tr><td>Only domains in at least this many posts<\/td><td>3<\/td><\/tr><tr><td>min authors<\/td><td>2<\/td><\/tr><tr><td>Count repeated posts once<\/td><td>auto, yes, no<\/td><\/tr><tr><td>script<\/td><td>auto, arabic, latin, all<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Target<\/td><td>Posts being described.<\/td><\/tr><tr><td>Reference<\/td><td>What the target is compared with.<\/td><\/tr><tr><td>Words compared<\/td><td>Words frequent enough to compare.<\/td><\/tr><tr><td>Significant words<\/td><td>Words significant after Bonferroni correction.<\/td><\/tr><tr><td>Group by<\/td><td>Variable the groups come from.<\/td><\/tr><tr><td>Accounts<\/td><td>Number of accounts (or groups) compared.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Keywords ranked by Log Ratio; green are more frequent in the target, red in the reference; click a word for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Keyness as in AntConc's Keyword List. Against another part of the data (a group, a period, posts using a lexicon, the most engaged posts, another dataset): log-likelihood G2 (Rayson and Garside 2000) with Log Ratio (Hardie 2014) as effect size, %DIFF (Gabrielatos and Marchi 2012) and Bonferroni-corrected p-values; negative keywords are listed too. Against general language: Kilgarriff's simple maths ratio of frequencies per million with smoothing 1, using wordfreq frequencies (Speer 2022) re-normalized like the posts. Words must occur in a minimum number of posts and accounts.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-3"}, {"cat": "an-words", "slug": "words-4", "title": "Find a word in the posts", "status": "ready", "summary": "Read every sentence where a word appears", "html": "<p>Type a word or phrase and see every place it appears, with the words just before and after it, lined up so you can compare how it is used.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The word is searched as a whole word. For Arabic, common attached letters such as و and ال are allowed, so searching غزة also finds وغزة and بغزة. Each line shows a few words on each side.<\/p>\n<h2>Example<\/h2>\n<p>Searching 'الأمل' shows every sentence with it, for example '... ما زال الأمل موجودا ...'.<\/p>\n<h2>Good to know<\/h2>\n<p>Use * as a wildcard, for example فلسطين* .<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Arabic searches also match clitic forms (و، ال، ب...).<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Word or phrase to find<\/td><td>you choose<\/td><\/tr><tr><td>Words on each side<\/td><td>8<\/td><\/tr><tr><td>Sort the lines by<\/td><td>after1, before1, date, engagement, account<\/td><\/tr><tr><td>max lines<\/td><td>300<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Query<\/td><td>Search word, phrase, wildcard or lexicon.<\/td><\/tr><tr><td>Times found<\/td><td>Number of times the word was found.<\/td><\/tr><tr><td>Posts<\/td><td>Number of posts.<\/td><\/tr><tr><td>Accounts<\/td><td>Number of different accounts.<\/td><\/tr><tr><td>Sorted by<\/td><td>Sort order of the lines.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Words found just before and just after the search term; click a word for those concordance lines.<\/p>\n<h2>Method in detail<\/h2>\n<p>Key word in context lines for a word, phrase, wildcard (*) or lexicon (lexicon:name), using the same whole-word matching with Arabic clitics as the lexicon cards. Context is shown from the original post (links and mentions excluded, split words rejoined). Lines sort by the first word after or before the match, date, engagement or account. The chart counts the words immediately before and after the match.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-4\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-4"}, {"cat": "an-words", "slug": "words-5", "title": "Words that go together", "status": "ready", "summary": "Which words often appear next to a word", "html": "<p>For a word you choose, the words that often appear close to it. This shows what people connect it with.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Around each use of your word, the five words on each side are collected. Each nearby word is counted, and a score says if it appears near your word more often than chance would give.<\/p>\n<h2>Example<\/h2>\n<p>Next to 'حرب' the most common partners are 'إبادة', 'غزة' and 'وقف'.<\/p>\n<h2>Good to know<\/h2>\n<p>Words that are common everywhere get lower scores, so the list favours real partners.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Words are split on spaces and punctuation; Arabic gets extra normalization and clitic handling.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Word to study<\/td><td>you choose<\/td><\/tr><tr><td>span left<\/td><td>5<\/td><\/tr><tr><td>span right<\/td><td>5<\/td><\/tr><tr><td>min freq<\/td><td>3<\/td><\/tr><tr><td>measure<\/td><td>logdice, mi, t score, ll<\/td><\/tr><tr><td>How many to show<\/td><td>25<\/td><\/tr><tr><td>Count repeated posts once<\/td><td>auto, yes, no<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Node<\/td><td>Word whose collocates are listed.<\/td><\/tr><tr><td>Times found<\/td><td>Times the word appears.<\/td><\/tr><tr><td>Words in total<\/td><td>Number of words in all posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Strongest collocates of the node word; colour shows whether they come before, after or on both sides; click for the posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Words within a window around each occurrence of the node (default five words each side, within a post). A collocate counts once per node occurrence and each word token is counted for one node only, so co-occurrence never exceeds either word's frequency. Repeated posts are counted once (dedup = auto). For each collocate: co-occurrence frequency, left and right counts, mutual information, t-score, logDice (Rychly 2008) and log-likelihood from the 2x2 window contingency table (Evert 2008).<\/p>\n<p><a href=\"#\" data-app=\"WORDS-5\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-5"}, {"cat": "an-words", "slug": "words-6", "title": "Phrases around a word", "status": "ready", "summary": "Common phrases that start or end with a word", "html": "<p>The fixed phrases people build around a word (for example 'the people of ...'), with how often each phrase is used.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Every sequence of two to four words that starts or ends with your word is counted, with the number of posts and accounts using it.<\/p>\n<h2>Example<\/h2>\n<p>Around 'people' the most common phrase is 'the people of Gaza'.<\/p>\n<h2>Good to know<\/h2>\n<p>Choose the phrase length and whether the word comes first or last in the settings.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Words are split on spaces and punctuation; Arabic gets extra normalization and clitic handling.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Word or phrase to find<\/td><td>you choose<\/td><\/tr><tr><td>size<\/td><td>3<\/td><\/tr><tr><td>side<\/td><td>any, left, right<\/td><\/tr><tr><td>min freq<\/td><td>2<\/td><\/tr><tr><td>How many to show<\/td><td>30<\/td><\/tr><tr><td>Count repeated posts once<\/td><td>auto, yes, no<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Query<\/td><td>Search word.<\/td><\/tr><tr><td>Phrase length<\/td><td>Words per phrase.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Most frequent fixed phrases that start or end with the search word; click a phrase for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Word sequences of a given length that begin or end with the search word (AntConc Clusters), with frequency, number of posts and number of accounts.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-6\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-6"}, {"cat": "an-words", "slug": "words-7", "title": "A word over time", "status": "ready", "summary": "When a word was used, and by how many accounts", "html": "<p>How often one or more words were used in each period, so you can see when a word became popular.<\/p>\n<h2>How it is calculated<\/h2>\n<p>For each period, the uses of the word are counted per 1,000 words of all posts in that period (so busy days do not look bigger just because there are more posts). A strip shows one mark for each post that uses the word.<\/p>\n<h2>Example<\/h2>\n<p>'ceasefire' goes from 2 to 15 uses per 1,000 words in the week of the talks.<\/p>\n<h2>Good to know<\/h2>\n<p>Type several words separated by commas to compare them.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, the date and time of each post<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Words are split on spaces and punctuation; Arabic gets extra normalization and clitic handling.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Words (separate with commas)<\/td><td>you choose<\/td><\/tr><tr><td>measure<\/td><td>per 1k, posts %<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Terms<\/td><td>Terms tracked.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Top: uses per 1,000 words per period; bottom: one mark per post that uses each term; click to open posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Uses per 1,000 words (or share of posts) per period for each term, a dispersion plot with one mark per post (AntConc Plot, with time as the axis), and Gries' DP across periods and across accounts.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-7\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-7"}, {"cat": "an-words", "slug": "words-8", "title": "How rich is the vocabulary?", "status": "ready", "summary": "Do some groups use more varied words?", "html": "<p>Compares groups (for example accounts, countries or files) on how varied their words are, how long their posts are and how many of their words are Arabic.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Vocabulary variety is the number of different words in each window of 50 words, averaged over all posts. This makes groups with long and short texts comparable. A range shows how certain the result is.<\/p>\n<h2>Example<\/h2>\n<p>News pages use 40 different words per 50 words; personal accounts use 32.<\/p>\n<h2>Good to know<\/h2>\n<p>Small groups give unstable numbers; compare groups with many posts.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Words are split on spaces and punctuation; Arabic gets extra normalization and clitic handling.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Group by<\/td><td>auto, nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><tr><td>Words on each side<\/td><td>50<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Group by<\/td><td>Variable the groups come from.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Vocabulary variety (MATTR) per group with 95% intervals; click a point for the group's posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Per group: tokens, types, type-token ratio, moving-average type-token ratio (MATTR, 50-word window, posts in time order) with a bootstrap 95% interval over posts, hapax share, mean word length, post length, content-word share and share of Arabic-script tokens.<\/p>\n<p><a href=\"#\" data-app=\"WORDS-8\">Open this analysis in the dashboard<\/a><\/p>", "card": "WORDS-8"}, {"cat": "an-words", "slug": "words-9", "title": "Emoji cloud", "status": "ready", "summary": "Which emoji people used", "html": "<p>The emoji used in the posts, the bigger the more often, and how many posts contain emoji. Click an emoji for its posts.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Every emoji in every post is counted. Emoji made of several parts, such as flags, skin tones and families, are kept together as one emoji.<\/p>\n<h2>Example<\/h2>\n<p>The crying face is the most used emoji, in 8 % of posts.<\/p>\n<h2>Good to know<\/h2>\n<p>Emoji can be used ironically, so read some posts before drawing conclusions.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>emoji in the posts<\/td
