 reactions (Likes excluded), high-arousal share, and the negative to surprise/humor ratio.<\/p>\n<p><a href=\"#\" data-app=\"REACT-5\">Open this analysis in the dashboard<\/a><\/p>", "card": "REACT-5"}, {"cat": "an-reactions", "slug": "react-6", "title": "Did the audience react positively?", "status": "ready", "summary": "A reaction score from negative to positive", "html": "<p>A score from -1 (very negative audience reaction) to +1 (very positive) for each post, and whether the audience was divided.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Love counts as positive, Angry and Sad as negative, using this formula: (2 Love - 2 Angry - Sad) divided by all reactions. Only posts with at least 10 reactions are used. 'Divided' means many positive and many negative reactions on the same post.<\/p>\n<h2>Example<\/h2>\n<p>A post with 200 Love and 10 Angry scores close to +1 (positive).<\/p>\n<h2>Good to know<\/h2>\n<p>This is the audience's reaction, not the tone of the post itself.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>Facebook reactions (Love, Haha, Wow, Sad, Angry)<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>Facebook reactions (CrowdTangle, Meta)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><tr><td>include likes in cohesion<\/td><td>True<\/td><\/tr><tr><td>sensitivity<\/td><td>True<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts scored<\/td><td>Posts with at least 10 reactions.<\/td><\/tr><tr><td>Too few reactions<\/td><td>Posts left out (under 10 reactions).<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Distribution of the reaction sentiment score of scored posts; dotted lines at -0.3 and 0.3; click a bar for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Score = (2 Love - 2 Angry - Sad) / (2 Love + 2 Angry + Sad + Haha + Wow + Care), for posts with at least 10 reactions published after reactions launched (2016-02-24); Positive at 0.3 or more, Negative at -0.3 or less. Polarization = 2 min(p, n) / (p + n) with p = 2 Love and n = 2 Angry + Sad. Cohesion = 1 minus normalized Shannon entropy of the reaction mix. The sensitivity table recomputes the labels under other weights, thresholds and minimums.<\/p>\n<p><a href=\"#\" data-app=\"REACT-6\">Open this analysis in the dashboard<\/a><\/p>", "card": "REACT-6"}, {"cat": "an-reactions", "slug": "react-7", "title": "Attention compared with audience size", "status": "ready", "summary": "Engagement per 100 followers", "html": "<p>How much attention a post gets compared with the number of followers of the page, so small and large pages can be compared.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Likes, comments and shares are added and divided by the number of followers at posting time, then multiplied by 100.<\/p>\n<h2>Example<\/h2>\n<p>A small page with 1,000 followers and 100 interactions scores 10 per 100 followers.<\/p>\n<h2>Good to know<\/h2>\n<p>Needs the follower count in the file.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>likes, comments or shares, the number of followers<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>Needs followers (CrowdTangle, some Meltwater)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Distribution of engagement rate (interactions / followers x 100); click a bar for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Interactions divided by followers (or page likes) at posting, times 100.<\/p>\n<p><a href=\"#\" data-app=\"REACT-7\">Open this analysis in the dashboard<\/a><\/p>", "card": "REACT-7"}, {"cat": "an-reactions", "slug": "react-8", "title": "Views", "status": "ready", "summary": "How many views, and attention per view", "html": "<p>Views per post, likes and comments per view, and views per follower.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Views are taken from the file; attention is divided by views.<\/p>\n<h2>Example<\/h2>\n<p>A video with 10,000 views and 500 interactions has 5 interactions per 100 views.<\/p>\n<h2>Good to know<\/h2>\n<p>Only files with a views column.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the number of views<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>Needs views (CrowdTangle, Meta, X)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Interactions per view<\/td><td>Interactions divided by views, both summed over the posts that have views. Example: 0.02 = 2 per 100 views.<\/td><\/tr><tr><td>Posts with views<\/td><td>Posts with views above 0. Only these posts count in interactions per view.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Distribution of post views (log10 scale); click a bar for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Interactions per view and views per follower.<\/p>\n<p><a href=\"#\" data-app=\"REACT-8\">Open this analysis in the dashboard<\/a><\/p>", "card": "REACT-8"}, {"cat": "an-reactions", "slug": "react-9", "title": "Posts that did better than usual", "status": "ready", "summary": "Posts above their page's normal level (CrowdTangle)", "html": "<p>Which posts did much better (or worse) than their page usually does.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Uses CrowdTangle's score, which compares each post with the page's recent posts of the same type.<\/p>\n<h2>Example<\/h2>\n<p>A post with score 3.0 did three times better than the page usually does.<\/p>\n<h2>Good to know<\/h2>\n<p>Only CrowdTangle files.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the CrowdTangle 'overperforming' score<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>CrowdTangle only<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>post type, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Did better than usual (%)<\/td><td>Share of posts above their page's normal level.<\/td><\/tr><tr><td>Test<\/td><td>Statistical test across groups.<\/td><\/tr><tr><td>Chance<\/td><td>How likely the result is just chance (0 to 1). Below 0.05 means probably real.<\/td><\/tr><tr><td>Epsilon squared<\/td><td>Effect size from 0 to 1.<\/td><\/tr><tr><td>Video length spearman rho<\/td><td>Rank correlation of video length with the score.<\/td><\/tr><tr><td>Video length p value<\/td><td>p-value of that correlation.<\/td><\/tr><tr><td>Video length n<\/td><td>Videos in that correlation.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts per CrowdTangle overperforming score band; click a bar for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Distribution of the CrowdTangle overperforming score and group comparisons on it.<\/p>\n<p><a href=\"#\" data-app=\"REACT-9\">Open this analysis in the dashboard<\/a><\/p>", "card": "REACT-9"}, {"cat": "an-reactions", "slug": "react-10", "title": "Videos", "status": "ready", "summary": "Video length, ownership and attention (CrowdTangle)", "html": "<p>Whether longer or shorter videos, own videos or shared videos get more attention.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Videos are put into length groups and compared on attention; attention per minute of video is also shown.<\/p>\n<h2>Example<\/h2>\n<p>Videos under one minute get more interactions per minute than long videos.<\/p>\n<h2>Good to know<\/h2>\n<p>Only CrowdTangle files with video information.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>video length (CrowdTangle files), likes, comments or shares<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>Facebook video (CrowdTangle)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Videos<\/td><td>Posts with a video.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Median engagement by video length; click a bar for those videos.<\/p>\n<h2>Method in detail<\/h2>\n<p>Group comparisons by video length band, ownership and share status, and interactions per video minute.<\/p>\n<p><a href=\"#\" data-app=\"REACT-10\">Open this analysis in the dashboard<\/a><\/p>", "card": "REACT-10"}, {"cat": "an-spread", "slug": "spread-1", "title": "Messages copied across accounts", "status": "ready", "summary": "Which texts spread, how fast and through how many accounts", "html": "<p>Messages that were posted again and again (the same or almost the same words), with how many accounts posted them, when they first and last appeared, and how fast they spread.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Near copies are found as in 'Copied and repeated posts'. For each group of copies: posts, accounts, platforms, first and last date, and the number of posts in the first 24 hours.<\/p>\n<h2>Example<\/h2>\n<p>The same slogan was posted by 120 accounts within 6 hours.<\/p>\n<h2>Good to know<\/h2>\n<p>To find messages with the same meaning but different words, use 'Claims people made'.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language written with spaces between words (not Chinese, Japanese or Thai). Repeated wording is compared on word sequences.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>How alike two posts must be to count as copies (0 to 1)<\/td><td>0.8<\/td><\/tr><tr><td>Also join posts that say the same thing in other words<\/td><td>False<\/td><\/tr><tr><td>How close in meaning reworded posts must be (0 to 1)<\/td><td>0.85<\/td><\/tr><tr><td>Smallest group of copies (posts)<\/td><td>3<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Groups of copies<\/td><td>Number of different texts that were copied.<\/td><\/tr><tr><td>Copied posts<\/td><td>Posts that belong to a group of copies.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Daily posts in the largest clusters of repeated wording; click a point for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Clusters of near-identical texts (Copied and repeated posts), optionally joined with paraphrases (embedding cosine similarity above a threshold). Per cluster: posts, accounts, platforms, first and last seen, posts in the first 24 hours.<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-1\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-1"}, {"cat": "an-spread", "slug": "spread-2", "title": "Websites people linked to", "status": "ready", "summary": "Which news sites and sources were shared", "html": "<p>The websites linked most often, and how many links were hidden behind link shorteners (like bit.ly).<\/p>\n<h2>How it is calculated<\/h2>\n<p>Links are taken from the text and link columns, and reduced to the website name (www and mobile versions are merged).<\/p>\n<h2>Example<\/h2>\n<p>youtube.com is linked in 300 posts; 15 % of links use bit.ly or similar shorteners.<\/p>\n<h2>Good to know<\/h2>\n<p>You can add your own list of trusted or untrusted sites. Upload it as a CSV file with two columns, domain and rating (for example bbc.com,high). A Google Drive link cannot be read here: download the file from Drive first, then upload it.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>links in the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Credibility list (CSV file)<\/td><td>a CSV file you upload, with the columns domain and rating<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Websites<\/td><td>Number of different websites linked.<\/td><\/tr><tr><td>Posts with a link (%)<\/td><td>Share of posts with at least one link.<\/td><\/tr><tr><td>Hidden links (%)<\/td><td>Share of links using shorteners such as bit.ly.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Most linked domains; click a bar for posts linking there.<\/p>\n<h2>Method in detail<\/h2>\n<p>Domains from links in the text and the export's link fields, with common aliases merged; share of links via URL shorteners; optional credibility ratings from a user-supplied list.<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-2"}, {"cat": "an-spread", "slug": "spread-3", "title": "Accounts posting together", "status": "ready", "summary": "Groups that post the same thing at the same moment", "html": "<p>Groups of accounts that posted the same text or link within seconds of each other, more than once. This can be a sign of a coordinated campaign.<\/p>\n<h2>How it is calculated<\/h2>\n<p>An event is the same text or link posted by at least 3 accounts within 60 seconds. Accounts that share at least 2 events are linked, and linked accounts form a group.<\/p>\n<h2>Example<\/h2>\n<p>Five accounts posted the same link within 20 seconds, on four different days.<\/p>\n<h2>Good to know<\/h2>\n<p>Coordination can be harmless (for example a news agency and its partners).<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the name of the account that posted, the date and time of each post, the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Seconds between posts<\/td><td>60<\/td><\/tr><tr><td>Smallest number of accounts<\/td><td>3<\/td><\/tr><tr><td>min repeats<\/td><td>2<\/td><\/tr><tr><td>use<\/td><td>text, url, both<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Moments of joint posting<\/td><td>Times when 3 or more accounts posted the same thing within 60 seconds.<\/td><\/tr><tr><td>Accounts posting together<\/td><td>Accounts that posted together at least twice.<\/td><\/tr><tr><td>Groups of copies<\/td><td>Number of different texts that were copied.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Accounts linked by repeatedly posting the same content within seconds of each other; click an account for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>An event is one text (or near-duplicate cluster from Copied and repeated posts) or one link posted by at least three distinct accounts within 60 seconds. Accounts that share at least two events are linked, and clusters are connected components, following the logic of coordinated link sharing detection (Giglietto et al.).<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-3"}, {"cat": "an-spread", "slug": "spread-4", "title": "Conversations and replies", "status": "ready", "summary": "How long and how deep reply threads are", "html": "<p>How many replies posts get, how deep conversations go (replies to replies) and, with labels, how tone changes deeper in a thread.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Reply trees are built from the 'reply to' information in the file. Depth is the number of steps from the first post.<\/p>\n<h2>Example<\/h2>\n<p>A Reddit post with 80 replies, going 6 replies deep.<\/p>\n<h2>Good to know<\/h2>\n<p>Needs reply information (for example Reddit or Communalytic files).<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>which post each reply answers<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>Reply data (Reddit, Communalytic)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Conversations<\/td><td>Number of conversations (reply trees).<\/td><\/tr><tr><td>Typical conversation size<\/td><td>Posts in the typical conversation.<\/td><\/tr><tr><td>Deepest reply<\/td><td>Longest chain of replies to replies.<\/td><\/tr><tr><td>Replies (%)<\/td><td>Share of posts that reply to another post.<\/td><\/tr><tr><td>Replies with their post (%)<\/td><td>Share of replies whose original post is in the file.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Number of threads by size (replies per root post); click a bar for those threads.<\/p>\n<h2>Method in detail<\/h2>\n<p>Reply trees built from parent ids found in the data (or thread ids): replies per root, depth, direct replies, and labels by depth when classifier labels exist.<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-4\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-4"}, {"cat": "an-spread", "slug": "spread-5", "title": "How far views travelled", "status": "ready", "summary": "Views beyond the original post (CrowdTangle)", "html": "<p>How many more views a post got through copies and shares compared with its own views.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Total views divided by the original post's views.<\/p>\n<h2>Example<\/h2>\n<p>A video with 10,000 views on the page and 50,000 in total travelled 5 times further.<\/p>\n<h2>Good to know<\/h2>\n<p>Only CrowdTangle files with both view counts.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>views of the post and its copies (CrowdTangle files)<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>CrowdTangle only<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Typical spread<\/td><td>Total views divided by the post's own views, for the typical post.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Median crosspost amplification (total views / post views) per period; click a point for its posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Total views (or views across crossposts) divided by the original post's views.<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-5\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-5"}, {"cat": "an-spread", "slug": "spread-6", "title": "Reach and sources (Meltwater)", "status": "ready", "summary": "Meltwater reach, sources and sentiment", "html": "<p>Meltwater's own numbers: estimated reach, advertising value, sources, languages and Meltwater's sentiment labels over time.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The numbers come from Meltwater and are added up or counted.<\/p>\n<h2>Example<\/h2>\n<p>Meltwater reports a reach of 2 million for the week; 60 % from X.<\/p>\n<h2>Good to know<\/h2>\n<p>Reach is the possible audience, not the people who actually saw a post.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>Meltwater reach or source columns (Meltwater files)<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Works with<\/td><td>Meltwater only<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Total reach<\/td><td>Sum of Meltwater reach (potential audience, not people reached).<\/td><\/tr><tr><td>Total ave<\/td><td>Sum of Meltwater advertising value equivalent.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Meltwater's own sentiment labels over time, or posts by source; click for those posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Reach and AVE/EMV totals, source, language and platform mix, and Meltwater's sentiment labels over time.<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-6\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-6"}, {"cat": "an-spread", "slug": "spread-10", "title": "Who spread it first", "status": "ready", "summary": "Who posted a word, hashtag or link first, and how it travelled", "html": "<p>For one hashtag, word, linked website or repeated wording: when it first appears in your file, which accounts posted it first, how fast it spread, who posted it most, and on which platform it showed up first. The usual first step when you suspect an organised campaign, trolls or seeded fake news.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The posts using the item are put in time order. MARSAD counts the posts and the accounts as time passes, measures the hours to the 5th, 10th, 50th and 100th post, and lists accounts by their first post.<\/p>\n<h2>Example<\/h2>\n<p>A hashtag starts with one account at 09:05; 10 accounts use it within 40 minutes, 300 posts in a day.<\/p>\n<h2>Good to know<\/h2>\n<p>First means first in your file. If your collection starts later than the conversation, or misses accounts, the real first poster may be missing. Being early is not proof of anything.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the date and time of each post, the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Hashtags, links and wordings: any language. A word: languages with spaces between words.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>What the item is<\/td><td>auto, term, hashtag, domain, cluster<\/td><\/tr><tr><td>Word, hashtag, domain or repeated-wording number to follow<\/td><td>you choose<\/td><\/tr><tr><td>How many to show<\/td><td>20<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts<\/td><td>Number of posts.<\/td><\/tr><tr><td>Accounts<\/td><td>Number of different accounts.<\/td><\/tr><tr><td>First seen<\/td><td>First post of it in this file.<\/td><\/tr><tr><td>Posts first hour<\/td><td>Posts in the first hour.<\/td><\/tr><tr><td>Posts first day<\/td><td>Posts in the first 24 hours.<\/td><\/tr><tr><td>Share first day pct<\/td><td>Share of all its posts that fall in the first 24 hours.<\/td><\/tr><tr><td>Share from top account (%)<\/td><td>Share of its posts from the single most active account.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Posts and accounts using the item as time passes; click the line for the posts of that moment.<\/p>\n<h2>Method in detail<\/h2>\n<p>For one item (a word, a hashtag, a linked domain or a near-duplicate wording cluster from Copied and repeated posts): the posts using it in time order, the cumulative number of posts and of distinct accounts, the hours from the first post to the 5th, 10th, 50th and 100th, posts in the first hour and the first day, the accounts in order of their first post, the accounts with the most posts of it, and, with several platforms, where it appeared first. When Copied and repeated posts has run, the accounts that are first in the most near-duplicate clusters are listed as well. First means first in this file.<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-10\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-10"}, {"cat": "an-spread", "slug": "spread-11", "title": "Link and source checks", "status": "ready", "summary": "Websites pushed by few accounts, copied links, lookalike addresses", "html": "<p>Checks every linked website for patterns investigators look for: links pushed many times by very few accounts, links that appear almost only in copied posts, link shorteners that hide the destination, web addresses that look like a better known one, and links that all appear within one hour.<\/p>\n<h2>How it is calculated<\/h2>\n<p>For each domain MARSAD counts posts, accounts, how many of its posts are copies, how many fall in its busiest hour, and whether its name is within two letters of a more linked domain in the same file.<\/p>\n<h2>Example<\/h2>\n<p>One domain is linked in 240 posts by 3 accounts, and 92% of those posts are copies of each other.<\/p>\n<h2>Good to know<\/h2>\n<p>A check is a reason to look, not a verdict: a news site shared by one busy account trips the same check as a planted one. MARSAD never opens a link, so it cannot follow a shortener or judge whether a site is reliable.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Links only, so any language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Only domains in at least this many posts<\/td><td>2<\/td><\/tr><tr><td>How many to show<\/td><td>30<\/td><\/tr><tr><td>Compare names only with domains in at least this many posts<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Domains<\/td><td>Domains linked in enough posts to check.<\/td><\/tr><tr><td>Domains with a check<\/td><td>Domains tripping at least one check.<\/td><\/tr><tr><td>Posts with a link (%)<\/td><td>Share of posts carrying a link.<\/td><\/tr><tr><td>Hidden links (%)<\/td><td>Share of links using shorteners such as bit.ly.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Domains that tripped a check, by posts; click a bar for the posts linking to it.<\/p>\n<h2>Method in detail<\/h2>\n<p>Per linked domain: posts, distinct accounts, posts per account, share of its posts that are in a near-duplicate cluster (Copied and repeated posts), share of its posts in its busiest hour, span from first to last link, whether it is a known URL shortener, and whether its name is within two character edits of a more linked domain in the same file. Five checks are flagged from these: few accounts and many posts (5+ posts per account over 5+ posts), 80% or more of its posts copied, a lookalike name, a shortener, and 90% or more of its posts in one hour over 5+ posts. Links are never opened or resolved.<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-11\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-11"}, {"cat": "an-spread", "slug": "spread-12", "title": "Timing and similarity between accounts", "status": "ready", "summary": "Which accounts post the same thing at the same moment, and whose posts read alike", "html": "<p>Finds pairs of accounts that posted the same item more than once, and reports how close together in time they did it. A pair that posts the same thing within a minute, again and again, is worth reading.<\/p>\n<h2>How it is calculated<\/h2>\n<p>For each pair, MARSAD measures the gap between their two posts of every item they share, and reports the typical gap, the fastest, and what share fell inside the window you set. It also compares how each account writes, using the overlap in the words they use.<\/p>\n<h2>Example<\/h2>\n<p>Two accounts posted the same item 14 times, and 12 of those were within a minute of each other.<\/p>\n<h2>Good to know<\/h2>\n<p>Posting at the same time is not proof of anything. Scheduling tools, a news story breaking and two people reading the same source all look like this. Read the posts of any pair before drawing a conclusion, and remember that accounts covering one topic use the same words whether or not they are connected.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the name of the account that posted, the date and time of each post, the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Timing and word overlap, so any language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Seconds between posts<\/td><td>60<\/td><\/tr><tr><td>min shared<\/td><td>2<\/td><\/tr><tr><td>How many to show<\/td><td>30<\/td><\/tr><tr><td>use<\/td><td>auto, cluster, domain, text<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Account pairs<\/td><td>Pairs that shared enough items to time.<\/td><\/tr><tr><td>Pairs mostly within window<\/td><td>Pairs whose shared items were mostly inside the window.<\/td><\/tr><tr><td>Median gap seconds overall<\/td><td>Typical gap across every pair.<\/td><\/tr><tr><td>Shared item basis<\/td><td>What counted as the same item.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Account pairs by the share of their shared items posted inside the window.<\/p>\n<h2>Method in detail<\/h2>\n<p>For every pair of accounts that posted the same item at least min_shared times, the gaps between their two posts of each item: the median gap, the fastest gap, and the share of shared items posted within window_seconds of each other. how_unusual_z is how far that pair's median gap sits below the mean of all pairs' median gaps, in standard deviations of that spread, so it is relative to this file. The same item means a near-duplicate cluster from Copied and repeated posts where that has run, otherwise the first linked domain, otherwise identical text. Word overlap is cosine similarity on word counts per account, computed only for the accounts in the table. Pair counting stops at 400,000 pairs and says so.<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-12\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-12"}, {"cat": "an-spread", "slug": "spread-13", "title": "How far a message travelled", "status": "ready", "summary": "How many posts and accounts followed one first post, and how deep the chain went", "html": "<p>Follows the replies and quotes back to the post that started them, then counts how many posts and accounts joined and how long the longest chain of replies became.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Posts are linked into trees using the reply, quote or thread column, counting a link only when the post being answered is also in your file. Size is how many posts joined; depth is the longest chain.<\/p>\n<h2>Example<\/h2>\n<p>One post drew 318 replies from 190 accounts, with the longest chain running 7 deep.<\/p>\n<h2>Good to know<\/h2>\n<p>A cascade is only as complete as your file. If collection filtered by keyword or date, branches are missing, so these are smallest-possible sizes rather than measures of reach. Shares and retweets usually carry no link back to the original, so they are not counted at all.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Reply and quote links only, so any language.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>What the item is<\/td><td>auto<\/td><\/tr><tr><td>How many to show<\/td><td>25<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Cascades<\/td><td>Cascades with more than one post.<\/td><\/tr><tr><td>Largest cascade posts<\/td><td>Posts in the largest.<\/td><\/tr><tr><td>Deepest cascade<\/td><td>Longest reply chain found.<\/td><\/tr><tr><td>Median cascade posts<\/td><td>Typical cascade size.<\/td><\/tr><tr><td>Link used<\/td><td>The column the links were read from.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>The largest cascades by posts; click a bar for the posts in that cascade.<\/p>\n<h2>Method in detail<\/h2>\n<p>Posts are linked into trees through the first available of parent_id, thread_id or quoted_post_id, counting a link only where the answered post is also in the file. For each tree: posts, distinct accounts, depth as the longest reply chain, hours from first to last, and direct replies to the first post. Shares and retweets are not counted, because exports rarely carry a link from a share back to the original.<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-13\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-13"}, {"cat": "an-spread", "slug": "spread-14", "title": "Same message, different words", "status": "server", "summary": "Posts that say the same thing in their own words", "html": "<p>Groups of posts that carry nearly the same message even when the words differ, as when a talking point is passed around and each account rewrites it.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The language model gives each post a list of numbers for its meaning, and posts whose meanings are very close are put in one group. For each group the card shows how many posts and accounts it has, when it started and ended, and how much of it is reworded rather than copied.<\/p>\n<h2>Example<\/h2>\n<p>A group of 25 posts from 18 accounts in two hours, each wording the same demand differently.<\/p>\n<h2>Good to know<\/h2>\n<p>The same meaning is not proof of a campaign: many people repeat a slogan or a prayer in their own words. Look at the accounts and the timing before drawing a conclusion.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Languages of the model (listed on the card). Arabic files: ATM-V2 (Arabic only). Other files: paraphrase-multilingual-MiniLM-L12-v2, about 50 languages.<\/td><\/tr><tr><td>Works with<\/td><td>Language model (downloads once)<\/td><\/tr><tr><td>Where it runs<\/td><td>Colab notebook or MARSAD server (or files that already have the labels)<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>How close in meaning posts must be to join a group (0 to 1)<\/td><td>0.9<\/td><\/tr><tr><td>Smallest group to show<\/td><td>3<\/td><\/tr><tr><td>How many to show<\/td><td>30<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Method in detail<\/h2>\n<p>Sentence embeddings of the posts the language model read (same models as Posts about an idea; at most 10,000 posts, a random sample above that) are compared pair by pair. Two posts are joined when their cosine similarity is at least meaning_similarity, and joined posts form groups (connected components); groups smaller than smallest_group are dropped. For each group: posts, accounts, first and last post, and the share of posts sharing under half of their words (Jaccard on word sets) with the group's first post, which separates rewording from copying. Groups with most rewording are listed first.<\/p>\n<p><a href=\"#\" data-app=\"SPREAD-14\">Open this analysis in the dashboard<\/a><\/p>", "card": "SPREAD-14"}, {"cat": "an-society", "slug": "society-1", "title": "Social cohesion", "status": "ready", "summary": "How connected and united is the conversation?", "html": "<p>A score from 0 (divided) to 100 (cohesive), built from up to seven parts: are accounts connected, do groups talk to each other, do they share topics, do people say 'we' more than 'them', do they humanize others, is the tone civil, and do audiences react the same way.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each part is scored from 0 to 100 using what the file has. Connected: share of accounts in the biggest group linked by replies or mentions. Bridging: share of replies or mentions between different groups. Shared agenda: how many of their top hashtags the most active accounts have in common. Us, not them: 'we' words out of 'we' plus 'them' words. Humanizing: humanizing words out of humanizing plus dehumanizing words. Civil tone: share of posts not toxic. Audience agreement: how much people reacting to a post chose the same reaction. The index is the average of the parts found (or MARSAD's own formula, once added).<\/p>\n<h2>Example<\/h2>\n<p>Bridging 20 means one reply in five goes to another group; Us, not them 70 means 'we' words outnumber 'them' words.<\/p>\n<h2>Good to know<\/h2>\n<p>Only compare scores between files that use the same parts. The language parts use word lists that are not yet validated.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list). Network, tone and reaction parts work in any language; the language parts use the Arabic and English word lists.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><tr><td>Time<\/td><td>Can take minutes on large files<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>What the item is<\/td><td>auto, reply, quote, mention<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Cohesion<\/td><td>Social cohesion from 0 (divided) to 100 (cohesive): the average of the parts shown on the chart.<\/td><\/tr><tr><td>Parts used<\/td><td>Number of cohesion parts this file supports (up to 7).<\/td><\/tr><tr><td>Formula<\/td><td>How the index is computed.<\/td><\/tr><tr><td>Network<\/td><td>Network used for the connection parts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Each bar is one part of social cohesion, from 0 (divided) to 100 (cohesive), with the index as a dashed line; click a bar for the posts behind it.<\/p>\n<h2>Method in detail<\/h2>\n<p>Components scored 0 (divided) to 100 (cohesive), each computed only when the data supports it: Connected (share of accounts in the largest connected component of the reply, quote or mention network), Bridging (share of links between different Louvain communities), Shared agenda (mean Jaccard overlap of the top 30 hashtags or words of the eight most active accounts), Us, not them (ingroup hits over ingroup plus outgroup hits), Humanizing (humanizing over humanizing plus dehumanizing hits), Civil tone (share of posts not labelled toxic, or not hate) and Audience agreement (mean of 1 minus normalized reaction entropy, posts with 10 or more reactions). The index is the mean of the available components, or MARSAD's formula when cards.society.COHESION_FORMULA is set.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-1\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-1"}, {"cat": "an-society", "slug": "society-2", "title": "Emotional intensity", "status": "ready", "summary": "How heated is the writing?", "html": "<p>How heated the posts look: exclamation marks, stretched letters, words in capitals, emoji, intensifiers (very, so) and emotion words, over time or by group, and whether intense posts get more attention.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each sign is counted in every post. Intensity = number of signs per 10 words. The card also shows the share of posts with each sign and the most intense posts.<\/p>\n<h2>Example<\/h2>\n<p>'هذا ظلللم!!! 😡😡' has 4 signs of intensity in 2 words: a score of 20 per 10 words.<\/p>\n<h2>Good to know<\/h2>\n<p>It measures how the writing looks, not what the writer feels.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language. Stretched letters, capitals, emoji and exclamation marks work in any language; intensifier and emotion words are Arabic and English.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><tr><td>How many to show<\/td><td>10<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Intensity<\/td><td>Average signs of intensity per 10 words. Example: 1.0 = one exclamation, emoji or stretched word every 10 words.<\/td><\/tr><tr><td>Posts with a sign (%)<\/td><td>Share of posts with at least one sign of intensity.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Emotional intensity (signs per 10 words) over time or by group; click for the most intense posts of that period or group.<\/p>\n<h2>Method in detail<\/h2>\n<p>Signs of intensity per post: exclamation marks, letters repeated three or more times, Latin words of three or more capital letters, emoji, intensifier and emotion-lexicon matches. Intensity is the number of signs per 10 words; it is shown over time or by group, by sign type, against engagement (median by quarter of intensity), with the most intense posts.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-2"}, {"cat": "an-society", "slug": "society-3", "title": "Distress and resilience", "status": "ready", "summary": "Trauma, exhaustion and grief, or steadfastness and hope?", "html": "<p>How often posts use words of trauma and fear, exhaustion, shared grief, and how often they use words of steadfastness and hope, over time or by group.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against five MARSAD word lists. The card shows the share of posts with at least one match and the number of matches per 1,000 words, for each list.<\/p>\n<h2>Example<\/h2>\n<p>Grief words rise from 3 % to 15 % of posts after a disaster, while resilience words stay at 5 %.<\/p>\n<h2>Good to know<\/h2>\n<p>Word lists catch words, not states of mind. It is a signal of public mood, not a diagnosis of anyone.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: trauma, burnout, collective grief, resilience, hope and resilience. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-3"}, {"cat": "an-society", "slug": "society-4", "title": "Economic concern", "status": "ready", "summary": "Prices, jobs, poverty, inequality and corruption", "html": "<p>How much the conversation is about the economy: prices, unemployment, poverty, inequality and corruption, and when this rises.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against three MARSAD word lists (economic conditions, economic justice, corruption). The card shows the share of posts with at least one match and the matches per 1,000 words.<\/p>\n<h2>Example<\/h2>\n<p>Words like 'prices', 'rent' and 'غلاء' appear in 18 % of posts in the month prices rose.<\/p>\n<h2>Good to know<\/h2>\n<p>Useful next to price or unemployment data for the same period.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: economic conditions, economic justice, corruption. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-4\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-4"}, {"cat": "an-society", "slug": "society-5", "title": "Calls to action", "status": "ready", "summary": "Do posts call people to act or propose solutions?", "html": "<p>How often posts say 'together we can', propose solutions, ask people to share or join, or use protest words.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against four MARSAD word lists. The card shows the share of posts with at least one match and the matches per 1,000 words, over time or by group.<\/p>\n<h2>Example<\/h2>\n<p>'Share this and join us on Friday' matches the call to share and protest lists.<\/p>\n<h2>Good to know<\/h2>\n<p>A call to share is not the same as a call to protest; look at each list separately.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: collective efficacy, solutions, connective action, protest language. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-5\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-5"}, {"cat": "an-society", "slug": "society-6", "title": "Blame and accountability", "status": "ready", "summary": "Who is blamed, and do people ask for accountability?", "html": "<p>How often posts blame someone, speak of injustice, or ask for accountability (trials, sanctions, investigations).<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against three MARSAD word lists. The card shows the share of posts with at least one match and the matches per 1,000 words. Use 'Find a word in the posts' to see who is blamed.<\/p>\n<h2>Example<\/h2>\n<p>'The government is responsible, we demand an investigation' matches blame and accountability.<\/p>\n<h2>Good to know<\/h2>\n<p>The word lists find blame words, not the person blamed.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: blame, injustice, legal accountability. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-6\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-6"}, {"cat": "an-society", "slug": "society-7", "title": "Identity and belonging", "status": "ready", "summary": "Nation, 'we' and gender in the conversation", "html": "<p>How often posts talk about the nation and homeland, use 'we' and 'our people', and mention gender.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against four MARSAD word lists. The card shows the share of posts with at least one match and the matches per 1,000 words.<\/p>\n<h2>Example<\/h2>\n<p>'Our homeland', 'our people' and 'Qatar' match the national identity and 'we' lists.<\/p>\n<h2>Good to know<\/h2>\n<p>Compare groups (for example countries) with the 'Split the results by' option.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: national identity, ingroup, first person plural, gender. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-7\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-7"}, {"cat": "an-society", "slug": "society-8", "title": "Trust in institutions", "status": "ready", "summary": "Trust or distrust in government, media, courts, health, science", "html": "<p>How often posts express trust (credible, we trust, well done) or distrust (they lied, cover-up, empty promises), and how often they name an institution, over time or by group.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against MARSAD word lists in Arabic (standard Arabic and common Gulf, Egyptian, Levantine and Maghrebi forms) and English. The card shows, for each list, the share of posts with at least one match and the matches per 1,000 words. The balance is the share of posts on the first side among posts with words from either side (a post with both counts on both sides). 'Not' before a word cancels it (مش مبسوط is not counted as happy). The trust share is also given for posts that name an institution.<\/p>\n<h2>Example<\/h2>\n<p>'They lied to us again' counts as distrust; 'thank you to the ministry, well done' as trust. Trust share 30 % = 3 trust posts for every 7 distrust posts.<\/p>\n<h2>Good to know<\/h2>\n<p>Distrust words are more common than trust words in most public talk, so watch the change over time more than the level. The word lists do not tell which institution is trusted: read the posts.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><tr><td>Trust share (%)<\/td><td>Of posts with trust or distrust words, the share with trust words. Below 50 = more distrust.<\/td><\/tr><tr><td>Trust share, posts naming an institution (%)<\/td><td>The same, only for posts that name an institution (government, police, media...).<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: trust, distrust, institutions named. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory. Balance: share of side A among posts with side A or side B words (posts with both count on both sides). A word right after a negation is not counted for lists marked negatable, and a word inside a phrase of the opposing list counts only for that list. The trust share is also given for posts that name an institution.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-8\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-8"}, {"cat": "an-society", "slug": "society-9", "title": "Moral values", "status": "ready", "summary": "Care, fairness, loyalty, authority, sanctity", "html": "<p>Which moral values posts appeal to, following Moral Foundations Theory: care or harm, fairness or cheating, loyalty or betrayal, respect for authority or chaos, sanctity or disgust.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against MARSAD word lists in Arabic (standard Arabic and common Gulf, Egyptian, Levantine and Maghrebi forms) and English. The card shows, for each list, the share of posts with at least one match and the matches per 1,000 words. Each value has two lists, the virtue and the vice. The balance is the share of posts on the first side among posts with words from either side (a post with both counts on both sides). 'Not' before a word cancels it (مش مبسوط is not counted as happy).<\/p>\n<h2>Example<\/h2>\n<p>'Protect the children' is care; 'نقف معكم يد واحدة' is loyalty; 'غير عادل' is cheating. Fairness share 40 % = more posts about injustice than about justice.<\/p>\n<h2>Good to know<\/h2>\n<p>Common words like law, rights and kill are in the lists, so news posts score too. Compare groups or periods of the same kind of posts. Our own lists, not a translation of the English Moral Foundations Dictionary.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><tr><td>Care share (%)<\/td><td>Of posts with care or harm words, the share with care words.<\/td><\/tr><tr><td>Fairness share (%)<\/td><td>Of posts with fairness or cheating words, the share with fairness words.<\/td><\/tr><tr><td>Loyalty share (%)<\/td><td>Of posts with loyalty or betrayal words, the share with loyalty words.<\/td><\/tr><tr><td>Authority share (%)<\/td><td>Of posts with respect-for-authority or chaos words, the share with respect words.<\/td><\/tr><tr><td>Sanctity share (%)<\/td><td>Of posts with sanctity or disgust words, the share with sanctity words.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: virtue and vice lists for the five foundations of Moral Foundations Theory (care/harm, fairness/cheating, loyalty/betrayal, authority/subversion, sanctity/degradation), written for MARSAD in Arabic and English. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory. Balance: share of side A among posts with side A or side B words (posts with both count on both sides). A word right after a negation is not counted for lists marked negatable, and a word inside a phrase of the opposing list counts only for that list.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-9\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-9"}, {"cat": "an-society", "slug": "society-10", "title": "Wellbeing", "status": "ready", "summary": "Positive feelings, engagement, relationships, meaning, accomplishment", "html": "<p>Public signs of wellbeing using the five PERMA parts: positive feelings (happy, grateful), engagement (passion, learning), relationships (friends, family, support), meaning (purpose, volunteering) and accomplishment (success, graduated, proud).<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against MARSAD word lists in Arabic (standard Arabic and common Gulf, Egyptian, Levantine and Maghrebi forms) and English. The card shows, for each list, the share of posts with at least one match and the matches per 1,000 words.<\/p>\n<h2>Example<\/h2>\n<p>During a holiday, 'فرحانين' and 'لمة العيلة' posts rise: positive feelings and relationships go up.<\/p>\n<h2>Good to know<\/h2>\n<p>For groups and periods only, never a judgment about one person. Public posts show what people choose to share, not how they feel. Needs ethics review before use in a study.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: the five PERMA parts of wellbeing (positive emotion, engagement, relationships, meaning, accomplishment). Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory. Group-level signals only; never a judgment about one person.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-10\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-10"}, {"cat": "an-society", "slug": "society-11", "title": "Stress and coping", "status": "ready", "summary": "How much stress people express, and how they cope", "html": "<p>How often posts express stress (pressure, can't sleep, fed up, مخنوق, زهقت) and coping (taking a break, talking it out, prayer, adapting), with exhaustion words, over time or by group.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against MARSAD word lists in Arabic (standard Arabic and common Gulf, Egyptian, Levantine and Maghrebi forms) and English. The card shows, for each list, the share of posts with at least one match and the matches per 1,000 words. The balance is the share of posts on the first side among posts with words from either side (a post with both counts on both sides). 'Not' before a word cancels it (مش مبسوط is not counted as happy). The coping share compares coping with stress and exhaustion.<\/p>\n<h2>Example<\/h2>\n<p>During exam weeks 'ضغط الامتحانات' and 'ما نمت' rise from 2 % to 6 % of student posts; coping share drops from 45 % to 30 %.<\/p>\n<h2>Good to know<\/h2>\n<p>A rise in stress words during a crisis is a public signal, not a diagnosis. Religious coping (الدعاء, الاستغفار) is counted as coping.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><tr><td>Coping share (%)<\/td><td>Of posts with coping, stress or exhaustion words, the share with coping words.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: stress, coping (including religious coping), exhaustion. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory. Balance: share of side A among posts with side A or side B words (posts with both count on both sides). A word right after a negation is not counted for lists marked negatable, and a word inside a phrase of the opposing list counts only for that list.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-11\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-11"}, {"cat": "an-society", "slug": "society-12", "title": "Certainty and self-focus", "status": "ready", "summary": "Certain or doubtful? 'I' or 'we'?", "html": "<p>How often posts use words of certainty (definitely, no doubt, اكيد) or doubt (maybe, I think, مدري), and 'I' words or 'we' words, over time or by group.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against MARSAD word lists in Arabic (standard Arabic and common Gulf, Egyptian, Levantine and Maghrebi forms) and English. The card shows, for each list, the share of posts with at least one match and the matches per 1,000 words. The balance is the share of posts on the first side among posts with words from either side (a post with both counts on both sides). 'Not' before a word cancels it (مش مبسوط is not counted as happy). 'I rather than we' compares posts with 'I' words to posts with 'we' words.<\/p>\n<h2>Example<\/h2>\n<p>'Definitely, no doubt' is certainty; 'maybe, I think' is doubt. Certainty share 70 % = 7 certain posts for every 3 doubtful ones.<\/p>\n<h2>Good to know<\/h2>\n<p>Arabic often marks 'I' inside the verb (قلت) or with an ending (كتابي), which word lists cannot see, so Arabic 'I' counts are low. Compare Arabic with Arabic and English with English.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, ueues, power cuts, fuel crisis) or good economic news (prices fell, new jobs, pay rise).<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against MARSAD word lists in Arabic (standard Arabic and common Gulf, Egyptian, Levantine and Maghrebi forms) and English. The card shows, for each list, the share of posts with at least one match and the matches per 1,000 words. The balance is the share of posts on the first side among posts with words from either side (a post with both counts on both sides). 'Not' before a word cancels it (مش مبسوط is not counted as happy). Good news share = posts with good news among posts with good news, worries or shortages.<\/p>\n<h2>Example<\/h2>\n<p>In a fuel crisis, shortage posts ('طوابير', 'ما في بنزين') jump and the good news share falls from 25 % to 5 %.<\/p>\n<h2>Good to know<\/h2>\n<p>Can be compared with official numbers (inflation, unemployment) for the same months.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><tr><td>Good news share
