ists in Arabic (standard Arabic and common Gulf, Egyptian, Levantine and Maghrebi forms) and English. The card shows, for each list, the share of posts with at least one match and the matches per 1,000 words. The balance is the share of posts on the first side among posts with words from either side (a post with both counts on both sides). 'Not' before a word cancels it (مش مبسوط is not counted as happy).<\/p>\n<h2>Example<\/h2>\n<p>'ساعدوني، محتاج دكتور نفسي' counts as asking for help. Pro-vaccine share 60 % = 6 pro posts for every 4 anti posts.<\/p>\n<h2>Good to know<\/h2>\n<p>Help seeking is shown for groups only. Most vaccine posts are neutral news: compare the pro and anti lists, not the topic list.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><tr><td>Pro-vaccine share (%)<\/td><td>Of posts with pro- or anti-vaccine phrases, the share with pro-vaccine phrases.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: help seeking, vaccine mentions, pro-vaccine and anti-vaccine phrases. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory. Balance: share of side A among posts with side A or side B words (posts with both count on both sides). A word right after a negation is not counted for lists marked negatable, and a word inside a phrase of the opposing list counts only for that list.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-15\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-15"}, {"cat": "an-society", "slug": "society-16", "title": "Misinformation signals", "status": "ready", "summary": "Conspiracy talk and miracle cures", "html": "<p>How often posts use conspiracy talk (wake up, hidden truth, الماسونية, they don't want you to know), miracle-cure claims, accusations of propaganda, and debunking words.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against MARSAD word lists in Arabic (standard Arabic and common Gulf, Egyptian, Levantine and Maghrebi forms) and English. The card shows, for each list, the share of posts with at least one match and the matches per 1,000 words.<\/p>\n<h2>Example<\/h2>\n<p>'اصحوا يا ناس، الحقيقة المخفية' is conspiracy talk; 'خلطة طبيعية تشفي من السكري' is a miracle-cure claim.<\/p>\n<h2>Good to know<\/h2>\n<p>These are signals to read, not a fact check. Debunking posts use the same words: read the posts before reporting.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: conspiracy talk, unproven health claims, accusations of propaganda, debunking. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory. These are signals to read, not a fact check.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-16\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-16"}, {"cat": "an-society", "slug": "society-17", "title": "Issue attention", "status": "ready", "summary": "Which public issues get the most attention?", "html": "<p>Which of 13 public issues posts talk about: economy, health, education, security and war, environment, migration, housing, energy, rights, foreign affairs, technology, food and water, transport.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against MARSAD word lists in Arabic (standard Arabic and common Gulf, Egyptian, Levantine and Maghrebi forms) and English. The card shows, for each list, the share of posts with at least one match and the matches per 1,000 words. Split by time to see issues rise and fall.<\/p>\n<h2>Example<\/h2>\n<p>Economy is named in 22 % of posts, security and war in 15 %, education in 4 %.<\/p>\n<h2>Good to know<\/h2>\n<p>A post can be about several issues. The issue lists follow the major topics of the Comparative Agendas Project.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Arabic and English (MARSAD lexicons); other languages need your own word list (My own word list)<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Split the results by<\/td><td>nothing, time, account, source, country, Facebook page category, page type (Meta), language, file, script (Arabic or Latin letters), post type, dialect, topic<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Posts with any match (%)<\/td><td>Share of posts that match at least one of this card's word lists.<\/td><\/tr><tr><td>Most common<\/td><td>The word list matched by the most posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts matching each lexicon, over time or by group; click a point for the matching posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Lexicons: 13 issue lists (economy, health, education, security and war, environment, migration, housing, energy, rights, foreign affairs, technology, food and water, transport), loosely following the Comparative Agendas Project major topics. Share of posts with at least one match, and matches per 1,000 words, for each word list, over time or by group. Whole-word matching after Arabic normalization, with clitic prefixes and suffixes allowed. The lists are MARSAD Arabic and English lists (not yet validated), so results are exploratory.<\/p>\n<p><a href=\"#\" data-app=\"SOCIETY-17\">Open this analysis in the dashboard<\/a><\/p>", "card": "SOCIETY-17"}, {"cat": "an-framing", "slug": "dialect-1", "title": "Regional dialect words", "status": "ready", "summary": "Words that MADAR lists for one Arabic region", "html": "<p>How many posts use a word that the MADAR dialect lexicon gives for only one region: Gulf, Egyptian, Levantine, Maghrebi, Iraqi, Sudanese or Yemeni.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against seven regional word lists taken from MADAR (25 city dialects). Words that are also standard Arabic, or that mostly appeared in other regions on labelled NADI tweets, were removed.<\/p>\n<h2>Example<\/h2>\n<p>'شلونك يا الحبيب' uses an Iraqi word; 'برشا' a Maghrebi one. 12 % of posts use a Maghrebi word.<\/p>\n<h2>Good to know<\/h2>\n<p>A word is evidence, not proof: a Gulf word in a post does not make the writer Gulf. A post can count for several regions. The Yemeni list is weak (on labelled tweets, fewer than 1 in 5 matches came from Yemen).<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, has_arabic<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. MADAR regional word lists: Arabic only.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>All posts<\/td><td>All posts in the file.<\/td><\/tr><tr><td>Posts with any region marker<\/td><td>Posts with a word from at least one regional list.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts with a word from each regional MADAR list; the number on each bar is the posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>Seven lists of single-word forms that the MADAR Lexicon (25 Arabic city dialects; Bouamor et al., 2018) gives for one region only (Gulf, Egyptian, Levantine, Maghrebi, Iraqi, Sudanese, Yemeni), from READY entries. Forms that MADAR also gives as standard Arabic were removed, and so were forms that, on labelled NADI tweets, mostly came from another region (precision below 0.5 over 10+ tweets) or sat in mostly standard-Arabic sentences (mean ALDi below 0.35). The card counts posts with at least one form from each list. Word matches only, not dialect identification.<\/p>\n<p><a href=\"#\" data-app=\"DIALECT-1\">Open this analysis in the dashboard<\/a><\/p>", "card": "DIALECT-1"}, {"cat": "an-feelings", "slug": "dialect-2", "title": "Positive and negative words (NileULex)", "status": "ready", "summary": "Egyptian and standard Arabic sentiment words", "html": "<p>How many posts use a word or phrase that NileULex marks as positive or negative, in Egyptian or standard Arabic.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Each post is checked against the four NileULex lists. Single words count only as whole words.<\/p>\n<h2>Example<\/h2>\n<p>'حاجة تفرح' uses an Egyptian positive phrase. 8 % of posts use an Egyptian negative word.<\/p>\n<h2>Good to know<\/h2>\n<p>This counts words, not the feeling of the post: 'not good' still contains 'good', and news wording such as تراجع (decline) counts as negative.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, has_arabic<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. NileULex: Egyptian and standard Arabic.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>All posts<\/td><td>All posts in the file.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>Share of posts with a word from each NileULex list; the number on each bar is the posts.<\/p>\n<h2>Method in detail<\/h2>\n<p>NileULex v0.27 (El-Beltagy, 2016): Egyptian and standard Arabic words and phrases marked positive or negative. Single words are matched as whole words, because the lexicon lists inflected forms itself. The card counts posts with at least one word from each of the four lists; it does not score the sentiment of a post.<\/p>\n<p><a href=\"#\" data-app=\"DIALECT-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "DIALECT-2"}, {"cat": "an-framing", "slug": "dialect-3", "title": "Word lists by dialect", "status": "ready", "summary": "NileULex matches in each dialect group", "html": "<p>For each dialect group in your file, the share of posts with a NileULex positive or negative word.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Needs a dialect label for each post (from dialect detection or a column in the file). Groups with fewer than 20 posts are left out.<\/p>\n<h2>Example<\/h2>\n<p>Egyptian-labelled posts match the Egyptian positive list in 10 % of posts, Gulf-labelled posts in 3 %.<\/p>\n<h2>Good to know<\/h2>\n<p>NileULex covers Egyptian and standard Arabic best, so other dialects match less for that reason alone. This compares coverage, not how positive each group is.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts, has_arabic, dialect labels<\/td><\/tr><tr><td>Languages<\/td><td>Arabic only. NileULex lists, compared across dialect labels.<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>dialect column<\/td><td>dialect_region<\/td><\/tr><tr><td>Only domains in at least this many posts<\/td><td>20<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Group count<\/td><td>Dialect groups with enough posts.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The chart<\/h2>\n<p>For each dialect group, the share of posts with a word from each NileULex list.<\/p>\n<h2>Method in detail<\/h2>\n<p>For each dialect label already in the data (from dialect detection or the file), the share of posts with a word from each NileULex list. Groups with fewer than 20 posts are left out. This compares word-list coverage, not how positive or negative the groups are.<\/p>\n<p><a href=\"#\" data-app=\"DIALECT-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "DIALECT-3"}, {"cat": "results", "slug": "paper-2", "title": "Pick posts to label by hand", "status": "ready", "summary": "A fair sample of posts for people to check", "html": "<p>Draws a fair random sample of posts (for example the same number from each month or each group) into a spreadsheet for people to label, and checks how much two people agree.<\/p>\n<h2>How it is calculated<\/h2>\n<p>Posts are drawn at random within each group you choose. Agreement between two people is measured with Cohen's kappa (1 = full agreement, 0 = no better than chance).<\/p>\n<h2>Example<\/h2>\n<p>Draw 50 posts per month for two people to label as relevant or not.<\/p>\n<h2>Good to know<\/h2>\n<p>Use it to check a model or a word list on your own data.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>Number of posts<\/td><td>500<\/td><\/tr><tr><td>strata<\/td><td>you choose<\/td><\/tr><tr><td>labels<\/td><td>you choose<\/td><\/tr><tr><td>annotators<\/td><td>2<\/td><\/tr><tr><td>prelabel task<\/td><td>you choose<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Number used<\/td><td>Number of items used in the calculation.<\/td><\/tr><tr><td>Strata<\/td><td>Variables used to stratify the sample.<\/td><\/tr><tr><td>Files<\/td><td>Annotation files written.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Method in detail<\/h2>\n<p>Stratified random sample (up to two strata from dialect, topic, source, platform and month, proportional allocation), one sheet per annotator. Agreement after annotation: Cohen's kappa (two annotators), Fleiss' kappa and Krippendorff's alpha (nominal).<\/p>\n<p><a href=\"#\" data-app=\"PAPER-2\">Open this analysis in the dashboard<\/a><\/p>", "card": "PAPER-2"}, {"cat": "results", "slug": "paper-3", "title": "Dataset description sheet", "status": "ready", "summary": "A ready-made description of your data for a paper", "html": "<p>Writes a standard description of your dataset (a 'datasheet'): where it comes from, what it covers, how it was cleaned and its limits.<\/p>\n<h2>How it is calculated<\/h2>\n<p>The sheet is filled in from the file and the settings; you add what only you know (purpose, ethics approval, collection method).<\/p>\n<h2>Example<\/h2>\n<p>A one-page description of the dataset for the data section of a paper.<\/p>\n<h2>At a glance<\/h2>\n<div class='tw'><table><tbody><tr><td>Your file needs<\/td><td>the text of the posts<\/td><\/tr><tr><td>Languages<\/td><td>Any language<\/td><\/tr><tr><td>Where it runs<\/td><td>Web dashboard, Colab notebook, MARSAD server<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Options<\/h2>\n<div class='tw'><table><thead><tr><th>Option<\/th><th>Choices or default<\/th><\/tr><\/thead><tbody><tr><td>title<\/td><td>you choose<\/td><\/tr><tr><td>creators<\/td><td>you choose<\/td><\/tr><tr><td>funding<\/td><td>you choose<\/td><\/tr><tr><td>collection query<\/td><td>you choose<\/td><\/tr><tr><td>collection tool<\/td><td>you choose<\/td><\/tr><tr><td>platform terms<\/td><td>you choose<\/td><\/tr><tr><td>license<\/td><td>you choose<\/td><\/tr><tr><td>ethics approval<\/td><td>you choose<\/td><\/tr><tr><td>intended uses<\/td><td>you choose<\/td><\/tr><tr><td>out of scope uses<\/td><td>you choose<\/td><\/tr><tr><td>maintenance<\/td><td>you choose<\/td><\/tr><tr><td>contact<\/td><td>you choose<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Numbers on the page<\/h2>\n<div class='tw'><table><thead><tr><th>Number<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Files<\/td><td>Files written.<\/td><\/tr><tr><td>Markdown<\/td><td>Datasheet draft text.<\/td><\/tr><tr><td>Missing fields<\/td><td>Fields not yet provided.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Method in detail<\/h2>\n<p>A draft datasheet following Datasheets for Datasets (Gebru et al., 2021): composition, time span, platforms, script and dialect mix, duplicates and preprocessing are computed; motivation, collection, licence and maintenance come from the authors.<\/p>\n<p><a href=\"#\" data-app=\"PAPER-3\">Open this analysis in the dashboard<\/a><\/p>", "card": "PAPER-3"}], "faq": [{"group": "Overview", "q": "What is MARSAD Analytics?", "a": "A tool that turns a file of social media posts into charts, tables and short findings, in Arabic, English and other languages. <a href=\"#\" data-doc=\"what-is-marsad-analytics\">Read more<\/a>."}, {"group": "Overview", "q": "Do I need to install anything?", "a": "No. The web dashboard runs in your browser. The Colab notebook needs only a Google account."}, {"group": "Overview", "q": "Which languages does it work with?", "a": "Counts, time, accounts, reactions and networks work in any language. Word-list analyses use Arabic and English lists, and nine analyses are Arabic only. Every analysis carries a language label on its tile: see <a href=\"#\" data-doc=\"languages\">Which languages each analysis works in<\/a>."}, {"group": "Overview", "q": "Can I use MARSAD if I do not read Arabic?", "a": "Yes. 36 analyses work in any language and most of the rest work on any language written with spaces between words. The start page has an English practice file. See <a href=\"#\" data-doc=\"languages\">Which languages each analysis works in<\/a>."}, {"group": "Overview", "q": "How do I cite MARSAD?", "a": "Coming soon: see <a href=\"#\" data-doc=\"how-to-cite\">How to cite MARSAD<\/a>."}, {"group": "Data", "q": "Is my file uploaded to MARSAD?", "a": "No. In the web dashboard the file is read inside your browser and never leaves your computer. <a href=\"#\" data-doc=\"privacy\">Privacy<\/a>."}, {"group": "Data", "q": "Which files can I load?", "a": "CSV, Excel and JSON exports from Meta Content Library, CrowdTangle, Meltwater, Communalytic, X and any table with a text column. <a href=\"#\" data-doc=\"supported-exports\">Supported exports<\/a>."}, {"group": "Data", "q": "How many posts can I analyse?", "a": "About 50,000 in the web dashboard; more in the Colab notebook. <a href=\"#\" data-doc=\"large-datasets\">Large datasets<\/a>."}, {"group": "Data", "q": "Can I load several files?", "a": "Yes. Combine them into one dataset or compare them. <a href=\"#\" data-doc=\"combining-files\">Combining<\/a>, <a href=\"#\" data-doc=\"comparing-files\">Comparing<\/a>."}, {"group": "Data", "q": "Can MARSAD collect data for me?", "a": "Not from this page. Collection is the MARSAD platform's own section, and Analytics reads the files it produces. For TikTok and other platforms with no usable export, record what you browse with Zeeschuimer and load its file here: see <a href=\"#\" data-doc=\"collecting-with-zeeschuimer\">Collecting TikTok posts with Zeeschuimer<\/a>."}, {"group": "Data", "q": "How do I get TikTok posts?", "a": "TikTok has no general export. Browse TikTok with the Zeeschuimer extension recording, export .ndjson, and load that file here. See <a href=\"#\" data-doc=\"collecting-with-zeeschuimer\">Collecting TikTok posts with Zeeschuimer<\/a>."}, {"group": "Analysis", "q": "Why does an analysis say Not for this file?", "a": "Your file lacks a column it needs, for example dates or likes. The message names what is missing. <a href=\"#\" data-doc=\"columns-guide\">Columns guide<\/a>."}, {"group": "Analysis", "q": "Why does an analysis say Needs MARSAD server?", "a": "It uses a language model that cannot run in a browser. Use the Colab notebook, or load a file that already has the labels. <a href=\"#\" data-doc=\"model-analyses\">Models<\/a>."}, {"group": "Analysis", "q": "How accurate are the word-list analyses?", "a": "They find words, not meaning, and the new Society lists are not validated yet. Read the posts behind each result and check precision. <a href=\"#\" data-doc=\"checking-word-lists\">Checking a word list<\/a>."}, {"group": "Analysis", "q": "Can I compare two files?", "a": "Yes: choose Compare the files when loading them. <a href=\"#\" data-doc=\"comparing-files\">Comparing files<\/a>."}, {"group": "Analysis", "q": "How do I see the posts behind a number?", "a": "Click any bar, point, word or table row. <a href=\"#\" data-doc=\"posts-behind-results\">Posts behind results<\/a>."}, {"group": "Results", "q": "How do I download results?", "a": "Use Download on the analysis page: Excel, CSV, PNG, SVG or network files. <a href=\"#\" data-doc=\"downloads\">Downloads<\/a>."}, {"group": "Results", "q": "How do I make a report?", "a": "Click + Report on each result you want, then Download report in My report. <a href=\"#\" data-doc=\"my-report\">My report<\/a>."}], "status_labels": {"ready": "Ready", "server": "Needs MARSAD server", "service": "Needs MARSAD service", "planned": "Planned", "placeholder": "Coming soon"}, "ar": {"groups": {"start": "ابدأ هنا", "data": "بياناتك", "analyses": "التحليلات", "tools": "النتائج والأدوات", "account": "الحساب والمنصة"}, "categories": {"get  وحداثتها وعدد أقسامها"], "WHO-10": ["أماكن النشر والمؤلفون والاقتباسات", "الأوراق بحسب السنة ومكان النشر، ومن كتبها، ومدى تركّز الاقتباسات"], "DIALECT-1": ["كلمات لهجية إقليمية", "كلمات يدرجها معجم MADAR لمنطقة عربية واحدة"], "DIALECT-2": ["المفردات الإيجابية والسلبية (NileULex)", "مفردات إيجابية وسلبية في العامية المصرية والفصحى"], "DIALECT-3": ["قوائم الكلمات حسب اللهجة", "مطابقات NileULex في كل مجموعة لهجية"]}, "details": {"DATA-1": {"what": "عدد المنشورات والحسابات والتواريخ في الملف", "how": "يُقرأ الملف وتُستبعد السجلات الفارغة أو المحذوفة والصفوف المكررة، ثم تُحسب المنشورات والحسابات والتواريخ والحقول المتاحة.", "note": "قد لا يحتوي الملف على جميع المنشورات المنشورة على المنصة، وبعض الحقول قد تكون مفقودة."}, "DATA-2": {"what": "عدد الكلمات في كل منشور، والروابط والوسوم والرموز التعبيرية", "how": "يُوحّد رسم الحروف العربية وتُجزّأ النصوص إلى كلمات، مع استبعاد الروابط والإشارات عند حساب أطوال المنشورات.", "note": "تختلف دقة تقسيم الكلمات بين اللغات واللهجات، وخاصة في النصوص القصيرة."}, "DATA-3": {"what": "العربية والإنجليزية واللغات الأخرى واللهجات العربية", "how": "يُحدَّد نظام الكتابة من الحروف، وفي المتصفح يُصنَّف كل منشور عربي إلى منطقة لهجية بنموذج خفيف مدرّب على تغريدات ArSarcasm-v2 وQADI، ويُعدّ المنشور غير مؤكد إذا قلّ احتمال التصنيف الأرجح عن 0.4.", "note": "يبقى نحو سبعة منشورات من كل عشرة غير مؤكدة، ودقة الباقي نحو 0.61 (macro F1)، والعراق واليمن أضعف المناطق. والتعرف على اللهجة تقديري، خاصة في المنشورات القصيرة أو المختلطة."}, "DATA-4": {"what": "كم من الملف هو النص نفسه منشورًا مرة أخرى", "how": "تُقسّم النصوص إلى مقاطع متداخلة من ثلاث كلمات، ويُستعمل تشابه هذه المقاطع لاكتشاف النسخ المتطابقة والمتقاربة.", "note": "التكرار قد يعكس إعادة نشر طبيعية، وليس بالضرورة تنسيقًا أو تلاعبًا."}, "DATA-5": {"what": "نسبة المنشورات التي تطابق كلمات بحثك فعلًا", "how": "يُبحث عن كلمات الاستعلام بوصفها كلمات كاملة، ويمكن الاستعانة بعينة موسومة يدويًا لتقدير نسبة الصلة بالموضوع.", "note": "عدم ظهور كلمة البحث لا يعني دائمًا أن المنشور خارج الموضوع."}, "DATA-6": {"what": "كيف يختلف ملفان أو أكثر", "how": "تُحسب المؤشرات بالطريقة نفسها لكل ملف، ثم تُقارن النتائج ومدى تداخل الحسابات والوسوم بين الملفات.", "note": "لا تفسر فروق الملفات على أنها فروق بين المجتمعات قبل التحقق من أساليب جمع البيانات."}, "TIME-1": {"what": "عدد المنشورات في كل ساعة أو يوم أو أسبوع أو شهر", "how": "تُحوَّل أوقات النشر إلى المنطقة الزمنية المختارة، ثم تُجمع المنشورات حسب الساعة أو اليوم أو الأسبوع أو الشهر.", "note": "قد تعكس الفجوات أوقات جمع البيانات، وليس غياب النشاط فعليًا."}, "TIME-2": {"what": "في أي الأوقات ينشر الناس أكثر", "how": "يُصنَّف كل منشور حسب اليوم والساعة في المنطقة الزمنية المختارة، ثم تُحسب كثافة النشر لكل فترة.", "note": "تؤثر المنطقة الزمنية المختارة في توزيع المنشورات حسب اليوم والساعة."}, "TIME-3": {"what": "أيام أو ساعات فيها منشورات أكثر بكثير من المعتاد", "how": "يُقارَن عدد المنشورات في كل فترة بالمستوى المعتاد في الفترات القريبة لتحديد الارتفاعات غير العادية.", "note": "الارتفاع غير المعتاد لا يثبت سببه، بل يتطلب فحص المنشورات والأحداث المحيطة."}, "TIME-4": {"what": "هل تغيّرت الأمور بعد تاريخ تختاره؟", "how": "تُقارَن المؤشرات قبل تاريخ الحدث وبعده، مع تقدير حجم الفرق واختباره إحصائيًا حيثما تسمح البيانات.", "note": "الفروق الزمنية لا تثبت أن الحدث سبب التغير."}, "TIME-5": {"what": "الكلمات والوسوم والحسابات والروابط التي ارتفعت في يوم مزدحم", "how": "تُقارَن حصة كل كلمة أو وسم أو حساب يوم الذروة بحصته في الأيام السبعة السابقة، ثم تُعرض أكبر الزيادات.", "note": "الاقتران بذروة النشر لا يثبت أن عنصرًا معينًا تسبب فيها."}, "WORDS-1": {"what": "الكلمات والوسوم والإشارات الأكثر تكرارًا", "how": "تُوحّد صيغ الكتابة وتُزال الكلمات الشائعة جدًا، ثم تُحسب مرات ظهور الكلمات والوسوم والإشارات.", "note": "أكثر الكلمات تكرارًا ليست بالضرورة أهم الموضوعات."}, "WORDS-2": {"what": "الكلمات الأكثر استخدامًا، وكلما كبر حجم الكلمة زاد تكرارها", "how": "تُحسب تكرارات الكلمات كما في تحليل الكلمات الشائعة. يدل حجم الكلمة على تكرارها، ولا يحمل موضعها معنى إحصائيًا.", "note": "حجم الكلمة يعكس التكرار فقط، أما موقعها ولونها فلا يعكسان دلالة تحليلية. يُبقي إعداد اللغة على الكلمات المكتوبة باللغات التي تحددها، من كل المنشورات: إذا اخترت العربية تبقى الكلمات العربية في منشور فيه كلمات إنجليزية أيضًا، وتُحذف كلماته الإنجليزية."}, "WORDS-9": {"what": "الرموز التعبيرية التي استخدمها الناس", "how": "تُحصى الرموز التعبيرية داخل المنشورات، مع إبقاء الرموز المركبة مثل الأعلام والعائلات كوحدة واحدة.", "note": "قد يكون الرمز التعبيري ساخرًا أو يحمل معنى يختلف حسب السياق."}, "WORDS-3": {"what": "كلمات تُستخدم هنا أكثر بكثير مما في اللغة العادية", "how": "تُقارَن نسبة تكرار كل كلمة في الملف بنسبة ظهورها في مجموعة نصوص مرجعية لاكتشاف الكلمات المميزة.", "note": "تعتمد الكلمات البارزة على اختيار المجموعة المرجعية ومدى ملاءمتها للبيانات."}, "WORDS-4": {"what": "اقرأ كل جملة ترد فيها كلمة", "how": "يُبحث عن الكلمة الكاملة داخل المنشورات، مع مراعاة بعض اللواصق العربية، ثم تُعرض سياقات الاستخدام.", "note": "تأكد من سياق الكلمة، فقد تحمل معاني مختلفة بحسب اللهجة أو الجملة."}, "WORDS-5": {"what": "الكلمات التي تظهر كثيرًا بجوار كلمة", "how": "تُجمع الكلمات الواقعة قرب الكلمة المختارة وتُقاس درجة اقترانها بها، وليس مجرد عدد مرات ظهورها.", "note": "الاقتران الإحصائي لا يعني وجود علاقة سببية بين الكلمات."}, "WORDS-6": {"what": "عبارات شائعة تبدأ بكلمة أو تنتهي بها", "how": "تُحسب العبارات المتتابعة التي تبدأ بالكلمة المحددة أو تنتهي بها، بطول تختاره أنت (ثلاث كلمات افتراضيًا).", "note": "العبارات المتكررة قد تكون نسخًا أو إعادة نشر للنص نفسه."}, "WORDS-7": {"what": "متى استُخدمت كلمة، وكم حسابًا استخدمها", "how": "يُحسب ظهور الكلمة في كل فترة لكل ألف كلمة، بحيث لا يُفسَّر ارتفاع حجم النشر وحده بأنه ارتفاع في الاستخدام.", "note": "تكون المعدلات أقل استقرارًا في الفترات ذات عدد الكلمات القليل."}, "WORDS-8": {"what": "هل تستخدم بعض المجموعات كلمات أكثر تنوعًا؟", "how": "يُحسب متوسط عدد الكلمات المختلفة داخل نوافذ ثابتة من 50 كلمة للمقارنة بين نصوص متفاوتة الطول.", "note": "تؤثر طبيعة المحتوى واللغة في تنوع المفردات، فلا تقارن مجموعات غير متجانسة مباشرة."}, "WORDS-10": {"what": "الأشخاص والمنظمات والأماكن التي ورد ذكرها", "how": "تُطابَق أسماء الأشخاص والمؤسسات والأماكن مع قائمة كيانات مسماة مشتقة من موارد عربية منشورة.", "note": "مطابقة الأسماء معجمية وقد تخطئ في الأسماء الملتبسة أو غير الموجودة بالقائمة."}, "WORDS-11": {"what": "تصنيف مشاعر المنشورات التي تذكر أشخاصًا أو أماكن", "how": "تُربَط الأسماء المكتشفة بنتائج تحليل المشاعر العربي السريع في المنشورات التي تذكر تلك الأسماء.", "note": "ارتباط منشور باسم لا يعني أن مشاعره موجهة إلى ذلك الاسم تحديدًا."}, "TOPIC-1": {"what": "مجموعات من المنشورات تتحدث عن الشيء نفسه", "how": "تُمثّل المنشورات بمتجهات عددية للمعنى، ثم تُجمع المنشورات المتشابهة دلاليًا في مجموعات موضوعية.", "note": "الموضوعات المجمعة تقديرية وتحتاج إلى مراجعة عينات من المنشورات."}, "TOPIC-2": {"what": "خريطة لكلمات تظهر في جمل متشابهة", "how": "يتعلم نموذج كلمات من سياقات استخدامها في المنشورات، ويُقرّب الكلمات التي تظهر في سياقات متشابهة.", "note": "تقارب الكلمات في النموذج يعكس تشابه السياقات وليس تطابق المعنى."}, "TOPIC-3": {"what": "منشورات قريبة في معناها من فكرة تصفها", "how": "يُقارَن التمثيل الدلالي للفكرة التي تكتبها بتمثيل المنشورات، ثم تُرتَّب النتائج حسب التشابه.", "note": "التشابه الدلالي لا يثبت أن المنشور مؤيد للفكرة أو معارض لها."}, "FRAME-7": {"what": "هل كل منشور إيجابي أم سلبي أم محايد؟", "how": "في المتصفح يصنّف نموذج CAMeLBERT Mix العربي كل منشور عربي إلى إيجابي أو سلبي أو محايد مع درجة ثقة، وعلى خادم مرصد يُستخدم نموذج متعدد اللغات.", "note": "الدقة الإجمالية (macro F1) 0.61 على 3000 تغريدة اختبار من ArSarcasm-v2، وقد يكون بعضها من بيانات تدريب النموذج، فالرقم الحقيقي على منشورات جديدة قد يكون أقل. وتخطئ نماذج المشاعر في السخرية واللهجات، فافحص عينة قبل نشر أي رقم."}, "FRAME-10": {"what": "الغضب والخوف والفرح والحزن", "how": "يستخدم نموذج متعدد اللغات لتقدير العاطفة الأرجح في كل منشور وإظهار درجة ثقته.", "note": "العاطفة المستنتجة من النص ليست قياسًا مباشرًا لحالة الكاتب النفسية."}, "FRAME-9": {"what": "قياس اللغة التي قد تتضمن إهانة أو تهديدًا أو إساءة", "how": "تُستعمل نماذج للكشف عن اللغة المسيئة أو السامة، وتختلف النماذج والتصنيفات المتاحة باختلاف اللغة.", "note": "الفئات تختلف باختلاف النموذج واللغة، وقد تقع أخطاء تصنيف."}, "FRAME-11": {"what": "منشورات تهاجم الناس بسبب هويتهم", "how": "يستخدم نموذج مصنف لخطاب الكراهية لإسناد فئة لكل منشور، مع إظهار حدود التغطية اللغوية.", "note": "يتطلب رصد خطاب الكراهية التحقق من السياق والدقة عبر اللغات."}, "FRAME-8": {"what": "هل تؤيد المنشورات شخصًا أو مجموعة أو فكرة أم تعارضها؟", "how": "يقارن نموذج لغوي المنشور بعبارات دعم أو معارضة لهدف محدد لتقدير الموقف منه.", "note": "الموقف مرتبط بالهدف المحدد، ولا يجوز تفسيره خارج هذا السياق."}, "FRAME-14": {"what": "إلى أي جانب سياسي يميل المنشور", "how": "يُحلَّل النص بنموذج متخصص لتقدير الميل السياسي كما تعرّفه فئات ذلك النموذج.", "note": "نتائج الميل السياسي مشروطة بفئات النموذج وبيانات تدريبه."}, "FRAME-1": {"what": "كم مرة تظهر كلمات الأمل والخوف والغضب وغيرها", "how": "تُطابَق كلمات المنشورات مع قوائم لغوية محددة، ثم يُتابَع معدل ظهور كل فئة عبر الزمن.", "note": "تُظهر القوائم كلمات مرتبطة بفئات لغوية، ولا تقيس نية الكاتب أو موقفه مباشرة."}, "FRAME-2": {"what": "أي الإطارين يغلب، ومتى؟", "how": "تُطبَّق قائمتان لغويتان على البيانات بالطريقة نفسها لتحديد الفئة الأكثر ظهورًا وتغيرها زمنيًا.", "note": "تتأثر المقارنة بحجم القوائم وملاءمتها للهجات الموجودة في البيانات."}, "FRAME-3": {"what": "أنواع اللغة التي تظهر في المنشورات نفسها", "how": "تُحسب مرات اجتماع فئتين من القوائم اللغوية في المنشور نفسه، لا في منشورات منفصلة.", "note": "اجتماع كلمتين في منشور واحد لا يثبت العلاقة بين المعنيين."}, "FRAME-4": {"what": "عمّن تتحدث المنشورات، وما مدى ثقتها فيما تقول", "how": "تُحسب مؤشرات الضمائر واليقين باستخدام قوائم كلمات، مع مراعاة أن كثيرًا من الضمائر العربية تتصل بالأفعال.", "note": "كثير من الضمائر العربية تأتي داخل الكلمة، لذا قد تقل التقديرات المعجمية عن الاستخدام الفعلي."}, "FRAME-5": {"what": "قارن لغة الحسابات أو الدول أو الملفات", "how": "تُحسب نسب ظهور فئات لغوية محددة لكل مجموعة، ثم تُقارَن المجموعات وفق معيار موحد.", "note": "تختلف أساليب الكتابة بين المجتمعات والمنصات، لذلك ينبغي توخي الحذر عند المقارنة."}, "FRAME-6": {"what": "احسب أي كلمات تكتبها", "how": "تُطابَق الكلمات أو العبارات التي يحددها المستخدم مع نصوص المنشورات، ثم تُحسب التكرارات والنسب.", "note": "تُحسب المطابقات النصية ولا تُفسَّر الكلمات تلقائيًا بحسب السياق."}, "FRAME-15": {"what": "إيجابي أو سلبي أو محايد، دون نموذج كبير", "how": "يُقيَّم المنشور باستخدام قوائم مفردات عربية إيجابية وسلبية ونموذج خفيف، مع معالجة بعض أدوات النفي.", "note": "الدقة الإجمالية (macro F1) بين 0.54 و0.63 على تغريدات اختبار لم يرها النموذج، ويخطئ غالبًا عند السخرية والنفي المركّب واللهجات. استعمله للاتجاهات والمقارنات، لا للحكم على منشور واحد."}, "FRAME-16": {"what": "الغضب والفرح والحزن والخوف وست عواطف أخرى", "how": "يستخدم نموذج عربي خفيف مدرّب على تغريدات موسومة لتقدير احتمالات العواطف المختلفة.", "note": "الدقة الإجمالية (macro F1) 0.45 على تغريدات لم يرها النموذج، والعاطفة المعروضة من بين عواطف التغريدة الفعلية في نحو نصف الحالات (51٪). أفضل ما يتعرّف عليه القبول والحياد والخوف (F1 من 0.55 إلى 0.57)، وأضعفه الغضب والفرح (0.27 و0.30). افحص الدقة على بياناتك قبل نشر أي رقم."}, "FRAME-17": {"what": "الشتائم والإساءة والكراهية في المنشورات العربية", "how": "يستخدم نموذج عربي خفيف مدرّب على بيانات إساءة لفظية من عدة مجموعات بحثية.", "note": "الدقة الإجمالية (macro F1) 0.75 على بيانات شبيهة بالتدريب و0.70 وسطيًا على مجموعة جديدة. والكلمة المسيئة قد ترد اقتباسًا أو استخدامًا غير هجومي، فاقرأ المنشورات المعلَّمة."}, "WORDS-13": {"what": "أشخاص وأماكن ومؤسسات، ومنها أسماء ليست في أي قائمة", "how": "يقرأ نموذج CAMeLBERT Mix العربي كل منشور داخل المتصفح ويعلّم الكلمات التي تشكّل اسم شخص أو مكان أو مؤسسة، ثم يُحسب كل اسم مرة واحدة في المنشور ويُقارن بقائمة الأسماء.", "note": "تعلّم النموذج من أخبار بالفصحى، فيجد أسماء أقل في منشورات اللهجات، وقد يعلّم كلمة عادية على أنها اسم، فاقرأ منشورات أي اسم جديد قبل نشره."}, "DATA-8": {"what": "ما يحدث للنص قبل عدّ الكلمات", "how": "تُطبَّق كل قاعدة من قواعد التنظيف وحدها على كل منشور ويُحسب عدد المنشورات التي تغيّرها، وتُعرض لكل كلمة معدودة الكتابات التي تجمعها في الملف.", "note": "لا يتغير نص المنشورات أبدًا، فالقواعد تحدد فقط الكتابات التي تُعدّ كلمة واحدة، وهي ثابتة لأن قوائم الكلمات والنماذج بُنيت عليها."}, "WORDS-12": {"what": "أشخاص وأماكن وجماعات تُذكر في المنشورات نفسها", "how": "تُطابَق المنشورات مع قائمة الأسماء وكلمات الجماعات، ويُربط اسمان إذا وردا في المنشور نفسه، ويُقاس الرفع بمقارنة عدد مرات ورودهما معًا بما تعطيه الصدفة.", "note": "ورود اسمين في منشور واحد لا يعني أنهما حليفان أو خصمان أو مرتبطان أصلًا، فاقرأ المنشورات قبل وصف أي صلة."}, "SPREAD-14": {"what": "منشورات تقول الشيء نفسه بصياغات مختلفة", "how": "يحوّل النموذج اللغوي كل منشور إلى متجه للمعنى، وتُضم المنشورات التي يبلغ تشابهها الحد المختار إلى مجموعة واحدة، ثم يُقاس كم منها أُعيدت صياغته وكم نُسخ.", "note": "تشابه المعنى ليس دليلًا على حملة منسقة، فكثيرون يكررون شعارًا أو دعاءً بكلماتهم، فانظر في الحسابات والتوقيت قبل الحكم."}, "TOPIC-4": {"what": "أقرب المنشورات معنى إلى منشور تختاره", "how": "يُرتَّب كل منشور قرأه النموذج اللغوي بحسب تشابه متجه معناه مع المنشور الذي تختاره، وتُعرض أقرب المنشورات.", "note": "القرب في المعنى لا يعني الاتفاق، فالرد الذي يرفض منشورًا قد يكون قريبًا جدًا منه."}, "TOPIC-5": {"what": "هل ينتقل النقاش إلى موضوعات أخرى؟", "how": "يُحسب متوسط متجهات المعنى لمنشورات كل فترة، ثم يُقاس تشابه كل فترة مع الفترة الأولى ومع الفترة السابقة.", "note": "يتحرك المتوسط أيضًا حين يتغير مزيج الموضوعات أو حين ينشر عدد قليل من الحسابات كثيرًا في فترة واحدة، فافتح الفترة واقرأ منشوراتها."}, "FRAME-21": {"what": "منشورات تقول عكس ما تقصد", "how": "يستخدم نموذج عربي خفيف كلمات المنشور ومقاطع الحروف داخلها، وقد دُرِّب على تغريدات ArSarcasm-v2 الموسومة بالسخرية.", "note": "الدقة الإجمالية (macro F1) 0.64 على 3000 تغريدة اختبار، ونحو نصف ما يصنّفه ساخرًا ساخرٌ فعلًا (الدقة 0.52). اقرأ المنشورات المعلَّمة قبل نشر أي رقم."}, "FRAME-22": {"what": "إساءة موجهة إلى الناس بسبب هويتهم", "how": "يستخدم نموذج عربي خفيف مدرّب على ثلاث مجموعات بيانات لخطاب الكراهية (L-HSAB وT-HSAB وMLMA)، دون استعمال الأسماء والأماكن وكلمات الانتماء الديني والعرقي والوطني.", "note": "الدقة الإجمالية (macro F1) 0.68 على بيانات شبيهة بالتدريب، وبين 0.56 و0.62 على مجموعة لم يرها النموذج. وأقل من نصف المنشورات المعلَّمة كراهية فعلًا (الدقة 0.41)، وأغلب الباقي إساءة دون كراهية. افحص عينة من بياناتك قبل نشر أي رقم."}, "FRAME-18": {"what": "الأشخاص والأماكن والمجموعات في المنشورات المسيئة", "how": "تُحدَّد المنشورات المسيئة ثم تُربَط بالأسماء والفئات المذكورة فيها لمقارنة نسب ظهور الإساءة.", "note": "ورود اسم داخل منشور مسيء لا يثبت أن الإساءة موجهة إليه."}, "FRAME-19": {"what": "الصراع والمسؤولية والاهتمام الإنساني والأخلاق والاقتصاد", "how": "تُطابَق كلمات المنشورات مع قوائم محددة لأطر التغطية الإخبارية، ثم يُحسب حضور كل إطار.", "note": "مطابقة كلمات الإطار لا تثبت أن المنشور يتبنى ذلك الإطار أو يؤيده."}, "FRAME-12": {"what": "منشورات تستخدم الدعاية", "how": "يستخدم نموذج مخصص لتقدير احتمال احتواء المنشور على لغة دعائية.", "note": "قد يخطئ نموذج الدعاية في التمييز بين النقد والاقتباس واللغة الدعائية."}, "FRAME-13": {"what": "التنابز بالألقاب والمبالغة والشعارات والتخويف وحيل أخرى", "how": "يستخدم نموذج مخصص لرصد أساليب الدعاية، وقد يحمل المنشور الواحد أكثر من أسلوب.", "note": "قد يستخدم المنشور أكثر من أسلوب، وقد تخطئ النماذج في تصنيف الأساليب."}, "WHO-1": {"what": "من نشر أكثر، ومن نال أكبر قدر من الاهتمام", "how": "تُجمع أعداد المنشورات والتفاعلات لكل حساب، ثم تُرتَّب الحسابات بحسب النشاط أو التفاعل.", "note": "الحسابات الأكثر نشرًا ليست بالضرورة الأكثر تأثيرًا في الجمهور."}, "WHO-2": {"what": "هل يقود النقاشَ عددٌ قليل من الحسابات؟", "how": "تُحسب حصة الحسابات الأكثر نشاطًا من مجموع المنشورات، إلى جانب مؤشرات تركز النشاط مثل جيني.", "note": "تركز النشر لا يثبت وجود تنسيق أو تلاعب."}, "WHO-3": {"what": "الناشرون المنتظمون والدفعات المفاجئة", "how": "يُحسب عدد أيام النشاط ومتوسط المنشورات لكل يوم نشط وانتظام النشاط لكل حساب.", "note": "الانتظام في النشر لا يعني استخدام الأتمتة."}, "WHO-4": {"what": "خريطة للردود والإشارات والروابط أو الوسوم المشتركة", "how": "تُمثَّل الحسابات بعُقد والردود والإشارات والاقتباسات والروابط المشتركة بوصلات بينها، ثم تُكشف المجموعات المتصلة.", "note": "تعكس الشبكة فقط علاقات التفاعل الموجودة في البيانات المحمّلة."}, "WHO-5": {"what": "إشارات يبحث عنها المحققون: البوتات والمتصيدون والحسابات المزيفة", "how": "تسعة فحوصات لكل حساب بحدود ثابتة معلنة في جدول الفحوصات: وتيرة النشر، وانتظام الفواصل بين المنشورات، والنشر على مدار الساعة، والدفعات داخل دقيقة واحدة، وتكرار نصه، ومشاركة نصه مع حسابات أخرى، والروابط فقط، واسم ينتهي بأرقام، ونشاط محصور في مدة قصيرة.", "note": "هذه إشارات لقراءة الحساب، لا تصنيفًا له. لا يرى مرصد تاريخ إنشاء الحساب ولا متابعيه ولا ملفه الشخصي، فلا يمكنه التمييز بين حساب آلي وحساب إخباري أو شخص كثير النشر. لا تصف حسابًا بأنه بوت اعتمادًا على هذه الأرقام."}, "WHO-6": {"what": "من أين تأتي المنشورات", "how": "تُحسب المنشورات بحسب البلد المسجل في البيانات، مع تمييز بلد الحساب أو الصفحة من بلد المنشور عند توفره.", "note": "بلد الصفحة أو الحساب قد لا يمثل موقع صاحب المنشور أو الجمهور."}, "WHO-7": {"what": "صفحات إخبارية وسياسيون ومجتمعات ... (CrowdTangle)", "how": "تُجمع فئات صفحات فيسبوك التفصيلية ضمن فئات رئيسية وتُقارَن في حجم النشر والتفاعل.", "note": "تعتمد الدقة على تصنيفات الصفحات التي توفرها المنصة."}, "WHO-8": {"what": "هل تنال الصفحات الأقدم اهتمامًا أكبر؟ (CrowdTangle)", "how": "يُقارَن عمر الصفحة عند النشر بمستوى التفاعل المعتاد معها باستخدام ارتباط الرتب.", "note": "الارتباط بين عمر الصفحة والتفاعل لا يثبت علاقة سببية."}, "REACT-1": {"what": "مقدار الاهتمام الذي نالته المنشورات", "how": "تُرتَّب أعداد الإعجابات والتعليقات والمشاركات وتُعرض الوسيط والقيم المئينية للكشف عن التفاوت.", "note": "قد تؤدي منشورات قليلة شديدة الانتشار إلى رفع المتوسط كثيرًا."}, "REACT-2": {"what": "منشورات فيها وسوم أو روابط أو أسئلة أو فيديوهات ...", "how": "تُقارَن المجموعات في التفاعل، ويمكن قياس أداء كل منشور نسبةً إلى المستوى المعتاد لحسابه.", "note": "الارتباط بالتفاعل لا يعني أن الخاصية تسببت فيه."}, "REACT-3": {"what": "الاهتمام بالمنشورات التي تستخدم نوعًا من اللغة", "how": "تُقسَّم المنشورات بحسب احتوائها على كلمات القائمة المختارة، ثم تُقارَن مستويات التفاعل.", "note": "اختلاف التفاعل لا يثبت أن وجود الكلمات هو سبب الاختلاف."}, "REACT-4": {"what": "المشاركات مقارنة بالإعجابات والتعليقات", "how": "تُحسب نسب التعليقات والمشاركات والإعجابات لبعضها، سواء على مجموع المنشورات أو المنشور النموذجي.", "note": "النسب تختلف عند احتسابها من الإجماليات أو من المنشور النموذجي."}, "REACT-5": {"what": "تفاعلات فيسبوك عبر الزمن", "how": "تُجمَع تفاعلات فيسبوك من نوع أحببته وأضحكني وأغضبني وغيرها، ثم تُحسب الحصص عبر الفترات.", "note": "تفاعلات فيسبوك ليست قياسًا مباشرًا للموقف أو المشاعر."}, "REACT-6": {"what": "مؤشر للتفاعل من السلبي إلى الإيجابي", "how": "تُحسب درجة مبسطة من تفاعلات فيسبوك الإيجابية والسلبية للمنشورات ذات عدد كافٍ من التفاعلات.", "note": "التفاعل لا يمثّل بالضرورة اتجاه الرأي تجاه المنشور."}, "REACT-7": {"what": "التفاعل لكل 100 متابع", "how": "يُقسَم مجموع تفاعلات المنشور على عدد المتابعين المتاح وقت النشر ويُحوَّل إلى نسبة مئوية.", "note": "قد لا يتطابق عدد المتابعين في الملف مع عددهم وقت النشر."}, "REACT-8": {"what": "عدد المشاهدات والاهتمام لكل مشاهدة", "how": "تؤخذ المشاهدات من الملف ويُقارَن بها عدد التفاعلات عندما تتوافر مشاهدات صالحة.", "note": "تختلف تعريفات المشاهدة بحسب المنصة وطريقة جمع البيانات."}, "REACT-9": {"what": "منشورات فوق المستوى المعتاد لصفحتها (CrowdTangle)", "how": "تُستعمل درجة الأداء النسبي من CrowdTangle لمقارنة المنشور بمستوى أداء الصفحة المعتاد.", "note": "درجة الأداء النسبي معيار من CrowdTangle، ولا تُقارَن مباشرة بمؤشرات منصات أخرى."}, "REACT-10": {"what": "مدة الفيديو وملكيته والاهتمام به (CrowdTangle)", "how": "تُقسَّم مقاطع الفيديو حسب المدة ثم تُقارَن في التفاعل، ويُحسب التفاعل لكل دقيقة عند الإمكان.", "note": "قد تفتقر بعض الملفات إلى مدة الفيديو أو بيانات التفاعل."}, "SPREAD-1": {"what": "النصوص التي انتشرت، وبأي سرعة، وعبر كم حسابًا", "how": "تُكتشَف النصوص المتطابقة والمتقاربة، ثم تُحسب الحسابات والمنصات وأوقات النشر لكل مجموعة نسخ.", "note": "تشابه المنشورات لا يثبت وجود حملة منسقة."}, "SPREAD-2": {"what": "المواقع الإخبارية والمصادر التي تمت مشاركتها", "how": "تُستخرج الروابط من النصوص والحقول المخصصة ثم تُوحَّد أسماء المواقع وتُحصى مرات ظهورها.", "note": "نشر رابط لا يعني تأييد محتواه. يمكنك إضافة قائمتك الخاصة بالمواقع الموثوقة وغير الموثوقة: ملف CSV أو Excel فيه عمودان، domain وrating (مثل bbc.com, high)، ترفعه من جهازك. لا يمكن قراءة رابط Google Drive، فنزّل الملف أولًا."}, "SPREAD-3": {"what": "مجموعات تنشر الشيء نفسه في اللحظة نفسها", "how": "يُرصد نشر النص أو الرابط نفسه من ثلاثة حسابات على الأقل خلال 60 ثانية، ثم تُدرس الحسابات التي تتكرر مشاركتها في هذه الأحداث.", "note": "التزامن مؤشر يحتاج إلى تحقيق إضافي، وليس إثباتًا على التنسيق أو الأتمتة."}, "SPREAD-4": {"what": "طول سلاسل الردود وعمقها", "how": "تُبنى شجرة الردود من روابط الرد على منشور سابق، ثم يُحسب حجم المحادثة وعمقها.", "note": "إذا غابت ردود أو معرفات أصلية من الملف، فقد تظهر المحادثات ناقصة."}, "SPREAD-5": {"what": "المشاهدات خارج المنشور الأصلي (CrowdTangle)", "how": "تُقارَن مشاهدات النسخ والمشاركات بمشاهدات المنشور الأصلي عندما توفر البيانات هذه الحقول.", "note": "تتطلب المقارنة حقول مشاهدات متوافقة ومتاحة في المصدر."}, "SPREAD-6": {"what": "الوصول والمصادر والمشاعر في Meltwater", "how": "تُؤخذ أرقام الوصول والمصادر من أعمدة تصدير Meltwater ثم تُجمَع أو تُحصى.", "note": "تتوقف دقة نتائج الوصول على تعريفات الحقول وجودة تصدير Meltwater."}, "SPREAD-7": {"what": "منشورات فيها ادعاء ينبغي التحقق منه", "how": "يستخدم نموذج مخصص لتقدير ما إذا كان المنشور يتضمن ادعاءً يستحق التحقق.", "note": "قابلية التحقق من الادعاء تختلف عن صحته أو خطئه."}, "SPREAD-8": {"what": "الادعاءات الواردة في المنشورات، وأكثرها تكرارًا", "how": "تستخرج خدمة مخصصة الادعاءات من المنشورات وتجمع الصياغات المتقاربة للادعاء نفسه.", "note": "قد تفوّت خدمة استخراج الادعاءات ادعاءات مهمة أو تجمع ادعاءات غير متطابقة."}, "SPREAD-9": {"what": "مدى دعم الأدلة للادعاءات التي جرى التحقق منها", "how": "تبحث خدمة التحقق عن أدلة مرتبطة بالادعاء، ثم تقارنها به لتقدير النتيجة ودرجة الثقة.", "note": "نتائج التحقق الآلي تحتاج إلى مراجعة المصادر والأدلة."}, "PAPER-1": {"what": "احفظ الرسوم التي جمعتها", "how": "تُصدَّر التحليلات المحفوظة مع رسومها وجداولها وإعداداتها وملاحظاتها في تقرير واحد.", "note": "راجع الأرقام والمصادر قبل نشر التقرير أو الاستشهاد به."}, "PAPER-2": {"what": "عينة عادلة من المنشورات ليراجعها أشخاص", "how": "تُسحَب عينة عشوائية داخل المجموعات المختارة، ويمكن حساب اتفاق المصنّفين عند وجود أكثر من مقيّم.", "note": "يلزم تعريف معايير التصنيف ومراجعة اتفاق المصنّفين عند استخدام النتائج في بحث."}, "PAPER-3": {"what": "وصف جاهز لبياناتك لورقة بحثية", "how": "تُملأ ورقة وصف البيانات من خصائص الملف والإعدادات، ثم يضيف الباحث المعلومات التي لا يمكن استخراجها آليًا.", "note": "يتطلب وصف البيانات إضافة تفاصيل جمع البيانات والاعتبارات الأخلاقية من الباحث."}, "SOCIETY-1": {"what": "ما مدى ترابط النقاش ووحدته؟", "how": "يُحسب مؤشر مركب من عناصر التماسك الاجتماعي التي تسمح بها حقول البيانات، ويُعرض إسهام كل عنصر.", "note": "المؤشر يستند إلى النصوص والحقول المتاحة، وليس مقياسًا مباشرًا للتماسك الاجتماعي في المجتمع كله."}, "SOCIETY-2": {"what": "ما مدى احتدام الكتابة؟", "how": "تُحسب علامات التعبير المكثف مثل التعجب وتكرار الحروف والرموز التعبيرية لكل عشر كلمات.", "note": "علامات التعبير القوي ليست قياسًا مباشرًا للشعور الحقيقي."}, "SOCIETY-3": {"what": "صدمة وإرهاق وحزن، أم صمود وأمل؟", "how": "تُطابَق المنشورات مع قوائم لغوية للضيق والصمود وتُحسب نسب المنشورات المطابقة ومعدلات الكلمات.", "note": "مطابقة مفردات الضيق لا تعني تشخيصًا نفسيًا لأي فرد."}, "SOCIETY-4": {"what": "الأسعار والوظائف والفقر وعدم المساواة والفساد", "how": "تُطبَّق قوائم لغوية تتعلق بالظروف الاقتصادية والعدالة الاقتصادية والفساد، ثم تُحسب المؤشرات عبر الزمن.", "note": "ذكر الأسعار أو الفساد لا يعني بالضرورة تبني موقف معين منها."}, "SOCIETY-5": {"what": "هل تدعو المنشورات الناس إلى الفعل أو تقترح حلولًا؟", "how": "تُطابَق النصوص مع قوائم الدعوات إلى الفعل والحلول وتُحسب نسبة المنشورات المطابقة.", "note": "ذكر دعوة أو حل لا يعني بالضرورة تأييد الكاتب له."}, "SOCIETY-6": {"what": "من يُلام، وهل يطالب الناس بالمساءلة؟", "how": "تُحسب إشارات اللوم والمساءلة من قوائم لغوية مخصصة لهذه المفاهيم.", "note": "قد يكون ذكر اللوم أو المساءلة اقتباسًا أو نقدًا مضادًا."}, "SOCIETY-7": {"what": "الوطن و«نحن» والنوع الاجتماعي في النقاش", "how": "تُحسب إشارات الهوية والانتماء باستخدام قوائم لغوية محددة.", "note": "مفردات الهوية والانتماء لا تحدد الهوية الشخصية لصاحب المنشور."}, "SOCIETY-8": {"what": "الثقة أو عدمها في الحكومة والإعلام والقضاء والصحة والعلم", "how": "تُحسب كلمات الثقة وعدم الثقة في المؤسسات من قوائم عربية وإنجليزية مخصصة.", "note": "ذكر مؤسسة لا يعني بالضرورة التعبير عن الثقة فيها."}, "SOCIETY-9": {"what": "الرعاية والإنصاف والولاء والسلطة والقداسة", "how": "تُحسب المؤشرات اللغوية لقيم أخلاقية مثل الرعاية والإنصاف والولاء والسلطة والقداسة.", "note": "مطابقة الكلمات لا تقيس القيم الشخصية للكاتب مباشرة."}, "SOCIETY-10": {"what": "المشاعر الإيجابية والعلاقات والمعنى والإنجاز في النصوص", "how": "تُستخدم قوائم لغوية لمؤشرات الرفاه مثل العلاقات والمعنى والإنجاز والمشاعر الإيجابية.", "note": "العبارات المرتبطة بالرفاه ليست قياسًا سريريًا أو نفسيًا مباشرًا."}, "SOCIETY-11": {"what": "مقدار الضغط الذي يعبّر عنه الناس، وكيف يتكيفون", "how": "تُحسب مؤشرات الضغط وأساليب التكيف من قوائم لغوية عربية وإنجليزية.", "note": "هذه مؤشرات نصية ولا تكشف تشخيصات فردية."}, "SOCIETY-12": {"what": "يقين أم شك؟ «أنا» أم «نحن»؟", "how": "تُحسب إشارات اليقين والشك والتركيز على الذات اعتمادًا على قوائم كلمات.", "note": "الضمائر الملتصقة في العربية قد لا تُلتقط بالقوائم البسيطة."}, "SOCIETY-13": {"what": "مخاوف ونقص، أم أخبار اقتصادية جيدة؟", "how": "تُحسب إشارات القلق الاقتصادي والأخبار الاقتصادية الإيجابية من قوائم لغوية.", "note": "اللغة الاقتصادية لا تمثل تقييمًا مباشرًا للاقتصاد الفعلي."}, "SOCIETY-14": {"what": "دعوات إلى المقاطعة أو إلى شراء المنتج المحلي", "how": "تُرصد الدعوات إلى المقاطعة وإلى شراء المنتجات المحلية باستخدام قوائم عبارات.", "note": "ذكر اسم منتج أو حملة لا يثبت دعم المقاطعة أو رفضها."}, "SOCIETY-15": {"what": "طلب المساعدة والحديث عن اللقاحات", "how": "تُرصد إشارات الحديث عن الصحة وطلب المساعدة واللقاحات باستخدام قوائم لغوية.", "note": "هذه مؤشرات نصية وليست نصائح طبية أو تشخيصات."}, "SOCIETY-16": {"what": "حديث المؤامرة والعلاجات المعجزة", "how": "تُحسب مؤشرات لغوية مثل عبارات المؤامرة والعلاجات المزعومة، وليس حقيقة صحة المنشورات.", "note": "مؤشرات المعلومات المضللة ليست أحكامًا للتحقق من صحة الادعاءات."}, "SOCIETY-17": {"what": "أي القضايا العامة تنال أكبر قدر من الاهتمام؟", "how": "تُحسب نسبة ظهور الكلمات المرتبطة بكل قضية عامة داخل مجموعة المنشورات.", "note": "تأثر النتائج بمفردات القوائم يجعلها تقديرًا للاهتمام الظاهر في النص فقط."}, "FRAME-20": {"what": "التنابز بالألقاب والتخويف والشعارات والمقارنات المضللة وغيرها", "how": "تُطابَق نصوص المنشورات مع قوائم كلمات لأحد عشر أسلوبًا دعائيًا، مع قاعدتين تعتمدان على شكل المنشور للشعارات والتكرار.", "note": "مؤشرات معجمية لا كشفًا للأسلوب: القوائم جديدة ولم تُقارَن بمنشورات موسومة بشريًا، والمنشور الذي ينتقد الدعاية يستخدم الكلمات نفسها."}, "SPREAD-10": {"what": "من نشر كلمة أو وسمًا أو رابطًا أولًا، وكيف انتشر", "how": "تُرتَّب المنشورات التي تحوي العنصر المختار زمنيًا، ثم يُحسب تراكم المنشورات والحسابات والزمن اللازم لبلوغ عتبات محددة.", "note": "«الأول» يعني الأول في ملفك أنت. السبق في النشر ليس دليل تأليف، وكثرة النشر ليست دليل تنسيق."}, "SPREAD-11": {"what": "مواقع يدفعها عدد قليل من الحسابات، وروابط منسوخة، وعناوين مشابهة", "how": "يُحسب لكل نطاق عدد المنشورات والحسابات ونسبة المنشورات المنسوخة والتركز في ساعة واحدة، ويُقارَن اسمه بأسماء نطاقات أكثر انتشارًا في الملف نفسه.", "note": "الفحوصات أسباب للمراجعة لا أحكام. ولا يفتح مرصد الروابط، فلا يستطيع تتبع المختصِرات ولا الحكم على موثوقية موقع."}, "SPREAD-12": {"what": "حسابات تنشر الشيء نفسه في اللحظة نفسها، وحسابات تتشابه كلماتها", "how": "لكل زوج من الحسابات نشر العنصر نفسه أكثر من مرة، يُقاس الفارق الزمني بين منشوريهما في كل عنصر: الفارق الوسيط وأسرع فارق ونسبة العناصر التي وقعت داخل النافذة المحددة. ويُقاس تشابه الكلمات بين الحسابين بجيب التمام على تكرارات الكلمات.", "note": "النشر في اللحظة نفسها ليس دليلاً على التنسيق: أدوات الجدولة وانتشار خبر وقراءة المصدر نفسه كلها تُنتج هذا الشكل. اقرأ منشورات أي زوج قبل أي استنتاج، وتذكّر أن الحسابات التي تتناول موضوعاً واحداً تتشابه كلماتها بطبيعتها."}, "SPREAD-13": {"what": "عدد المنشورات والحسابات التي تبعت منشوراً واحداً، وطول أطول سلسلة ردود", "how": "تُربط المنشورات في أشجار عبر عمود الرد أو الاقتباس أو الخيط، ولا يُحسب الرابط إلا إذا كان المنشور المُجاب عليه موجوداً في الملف. الحجم عدد المنشورات التي انضمت، والعمق أطول سلسلة ردود.", "note": "السلسلة كاملة بقدر كمال الملف: إن رشّح الجمع بكلمة أو بتاريخ فستغيب فروع، فهذه أحجام دنيا لا قياس للانتشار. والمشاركات وإعادات النشر لا تحمل عادة رابطاً إلى الأصل فلا تُحسب هنا."}, "TIME-6": {"what": "اللحظات التي ارتفع فيها المستوى أو انخفض وبقي كذلك", "how": "يُقسَّم المسار عند أبعد نقطة في المجموع التراكمي للانحرافات عن المتوسط، ويُقبل التقسيم فقط إذا تباعد متوسط الجانبين بما يفوق الضوضاء، ثم تتكرر العملية داخل كل جزء.", "note": "الاختبار يجد الدرجات لا الميول: الانحدار البطيء لا نقطة تغيّر له، ويوم واحد مزدحم قد يصنع واحدة. وحين تنشر حسابات قليلة معظم الملف قد تكون الدرجة بدء حساب أو توقفه لا تغيّراً في النقاش."}, "WHO-9": {"what": "الإحداثيات، وأسماء الأماكن في النص، وحقل البلد، كل منها على حدة", "how": "تُعرض ثلاثة مصادر للموقع منفصلة ولا تُدمج: الإحداثيات إن وُجدت في الملف مقرّبة إلى نحو كيلومتر، وأسماء الأماكن المطابقة في النص عبر قائمة كلمات، وحقل البلد كما ورد.", "note": "لا شيء هنا إحصاء سكاني. اسم المكان في المنشور ذِكر لا موقع، والناس يكتبون عن أماكن ليسوا فيها. وحقل البلد عادة بلد الحساب المُعلن لا مكان كتابة المنشور."}, "TIME-7": {"what": "سجل تحرير صفحة كاملاً: متى كبرت، ومتى تقلّصت، ومتى جرى التنازع عليها", "how": "تُرتَّب المراجعات زمنياً. حجم الصفحة هو حجمها بعد كل تعديل، والتغيّر هو الفرق بينه وبين التعديل السابق، موزّعاً على بايتات مضافة وبايتات محذوفة. ويُعدّ التعديل استرجاعاً حين يقول ملخصه ذلك بالإنجليزية أو العربية أو الفرنسية أو الإسبانية أو الألمانية.", "note": "هذه صفحة واحدة يُعاد كتابتها، لا أشخاص كثيرون ينشرون، فلا شيء هنا يقيس الوصول أو الجمهور. وتُحتسب الاسترجاعات مما كتبه المحررون في سطر الملخص: من يسترجع دون أن يقول ذلك لا يُحتسب، ومن يذكر الكلمة فحسب يُحتسب. وويكيبيديا تسلّم خمسمئة مراجعة على الأكثر في الطلب الواحد، فقد يبدأ سجل صفحة قديمة من منتصف عمرها."}, "TIME-8": {"what": "عدد القراءات اليومي إلى جانب التغطية اليومية، وأيهما تحرّك أولاً", "how": "عدد القراءات اليومي هو مجموع المشاهدات في صفوف سلسلة القراءة، والتغطية اليومية هي عدد كل صف مؤرَّخ آخر. يوضع الاثنان على تقويم كامل تُحسب أيامه الفارغة أصفاراً، ثم تُزحزح التغطية إلى الأمام والخلف حتى أسبوع وتُقارن بالقراءة في كل زحزحة بمعامل ارتباط الرتب لسبيرمان. الزحزحة ذات الارتباط الأقوى هي المُبلَّغ عنها، والقيمة السالبة تعني أن التغطية سبقت.", "note": "ارتفاع عددين معاً ليس دليلاً على أن أحدهما سبب الآخر: الحدث نفسه هو ما يحرّكهما عادة. والتغطية هنا هي ما جمعته أنت، فإن جاءت من بحث بكلمة مفتاحية كانت المقارنة مع تلك الكلمة لا مع الموضوع. وويكيبيديا تحسب اليوم بتوقيت غرينتش."}, "DATA-7": {"what": "طول كل نسخة لغوية وحداثتها وعدد أقسامها", "how": "تُجمَّع الصفوف التي تذكر الموضوع نفسه بحسب اللغة. وتُقاس كل نسخة بعدد الأحرف والكلمات وعناوين الأقسام والروابط، وبالسنوات الرباعية المميزة التي تذكرها بالأرقام اللاتينية أو العربية الهندية، وبتاريخ آخر تعديل. ونسبة الأطول هي عدد كلمات النسخة إلى عدد كلمات أطول نسخة للموضوع نفسه.", "note": "تقارن هذه البطاقة شكل النسخ لا ما تقوله. فمقارنة المضمون بين اللغات تحتاج ترجمة أو نموذجاً متعدد اللغات ولا يُستخدم أي منهما هنا. والنسخة الأقصر ليست أسوأ: الطول يتبع عدد محرري النسخة اللغوية بقدر ما يتبع كثرة ما يُقال."}, "WHO-10": {"what": "الأوراق بحسب السنة ومكان النشر، ومن كتبها، ومدى تركّز الاقتباسات", "how": "تُعدّ الأوراق بحسب سنة النشر وبحسب مكان النشر كما سجّله الفهرس. وتُقسَّم قوائم المؤلفين عند الفاصلة المنقوطة. ويرتّب توزّع الاقتباسات الأوراق من الأكثر اقتباساً إلى الأقل ويبيّن النسبة التراكمية التي تحوزها الأوراق الأعلى.", "note": "عدد الاقتباسات هو ما قاله الفهرس يوم الجمع، والورقة الحديثة أتيح لها وقت أقل لجمعها، فمقارنة السنوات تحتاج أن يُقال ذلك صراحة. والاسم الواحد بهجاءين يُحتسب شخصين، والمؤتمر الواحد باسمين يُحتسب مكانين."}, "DIALECT-1": {"what": "كلمات يدرجها معجم MADAR لمنطقة عربية واحدة", "how": "تُطابَق النصوص مع قوائم مفردات لهجية مشتقة من مورد MADAR بعد استبعاد الكلمات المشتركة كثيرًا مع الفصحى.", "note": "الكلمات المشتركة بين اللهجات تقلل دقة إسناد المفردة إلى منطقة معينة."}, "DIALECT-2": {"what": "مفردات إيجابية وسلبية في العامية المصرية والفصحى", "how": "تُطابَق النصوص مع قوائم NileULex الإيجابية والسلبية للمصرية والفصحى بوصفها كلمات كاملة.", "note": "يغطّي هذا المعجم المصرية والفصحى أفضل من اللهجات الأخرى."}, "DIALECT-3": {"what": "مطابقات NileULex في كل مجموعة لهجية", "how": "تُقسَّم المنشورات حسب الوسم اللهجي المتاح، ثم تُقارَن قوائم الكلمات مع استبعاد المجموعات الصغيرة جدًا.", "note": "تتأثر المقارنات بدقة الوسوم اللهجية وأحجام المجموعات."}, "PLAN-offensive": {"what": "منشورات تتضمن إهانات أو ألفاظًا نابية", "how": "سيتطلب نموذجًا مخصصًا لتصنيف كل منشور مع تقدير درجة الثقة.", "note": "لم تُوصَل الخدمة الخاصة بهذا التحليل بعد."}, "PLAN-hope": {"what": "منشورات تعبر عن الأمل والتشجيع والمساندة", "how": "سيتطلب نموذجًا مخصصًا لتمييز خطاب الأمل في النصوص.", "note": "لم تُوصَل الخدمة الخاصة بهذا التحليل بعد."}}}};
